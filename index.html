        highScores: { ...zeros },
        freeStars: { ...zeros },
        freeHighScores: { ...zeros },
        seenGuides: {}
      };
    };

    const FullscreenToggleCard = () => {
      const [isFs, setIsFs] = useState(() => Boolean(document.fullscreenElement || document.webkitFullscreenElement));
      const isStandalone = typeof window !== 'undefined' && Boolean(window.matchMedia?.('(display-mode: standalone)')?.matches || window.navigator?.standalone);
      const supportsFs = typeof document !== 'undefined' && Boolean(document.documentElement?.requestFullscreen || document.documentElement?.webkitRequestFullscreen);

      useEffect(() => {
        const onFsChange = () => setIsFs(Boolean(document.fullscreenElement || document.webkitFullscreenElement));
        document.addEventListener('fullscreenchange', onFsChange);
        document.addEventListener('webkitfullscreenchange', onFsChange);
        return () => {
          document.removeEventListener('fullscreenchange', onFsChange);
          document.removeEventListener('webkitfullscreenchange', onFsChange);
        };
      }, []);

      const toggleFs = () => {
        audio.sfxClick();
        if (isFs) {
          (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
        } else {
          const el = document.documentElement;
          (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el);
        }
      };

      if (isStandalone) {
        return (
          <div className="bg-emerald-50 border border-emerald-200 rounded-2xl p-2.5 text-center text-[11px] font-black text-emerald-800">
            📱 已於獨立全螢幕視窗執行中
          </div>
        );
      }
      if (supportsFs) {
        return (
          <button
            onClick={toggleFs}
            className={`w-full py-2.5 rounded-2xl border-2 font-black text-xs flex items-center justify-center gap-1.5 active:scale-95 transition-all ${
              isFs
                ? 'bg-emerald-100 border-emerald-400 text-emerald-900'
                : 'bg-sky-50 hover:bg-sky-100 border-sky-300 text-sky-900'
            }`}
          >
            <span>{isFs ? '🗗 退出全螢幕' : '⛶ 切換全螢幕顯示'}</span>
          </button>
        );
      }
      return (
        <div className="bg-sky-50 border border-sky-200 rounded-2xl p-2.5 text-[11px] font-bold text-sky-900 leading-snug text-center">
          📱 iPhone 全螢幕：點 Safari 下方「分享 ⎙ → 加入主畫面」即可全螢幕遊玩
        </div>
      );
    };

    const normalizeProgress = (raw, fallbackName = '冒險者 1') => {
      const base = createEmptyProgress();
      if (!raw || typeof raw !== 'object') {
        return { ...base, mode: 'adventure', name: fallbackName, updatedAt: Date.now() };
      }
      const mode = raw.mode === 'free' ? 'free' : 'adventure';
      return {
        ...base,
        ...raw,
        mode,
        name: (typeof raw.name === 'string' && raw.name.trim()) ? raw.name.trim() : fallbackName,
        updatedAt: raw.updatedAt || Date.now(),
        stars: { ...base.stars, ...(raw.stars || {}) },
        highScores: { ...base.highScores, ...(raw.highScores || {}) },
        freeStars: { ...base.freeStars, ...(raw.freeStars || {}) },
        freeHighScores: { ...base.freeHighScores, ...(raw.freeHighScores || {}) },
        seenGuides: { ...(raw.seenGuides || {}) }
      };
    };

    const loadSaveStore = () => {
      const emptyStore = { activeSlot: 1, slots: { 1: null, 2: null, 3: null } };
      try {
        const rawSlots = window.localStorage.getItem(SAVE_SLOTS_KEY);
        if (rawSlots) {
          const parsed = JSON.parse(rawSlots);
          return {
            activeSlot: [1, 2, 3].includes(parsed?.activeSlot) ? parsed.activeSlot : 1,
            slots: {
              1: parsed?.slots?.[1] ? normalizeProgress(parsed.slots[1], '冒險者 1') : null,
              2: parsed?.slots?.[2] ? normalizeProgress(parsed.slots[2], '冒險者 2') : null,
              3: parsed?.slots?.[3] ? normalizeProgress(parsed.slots[3], '冒險者 3') : null
            }
          };
        }
        const legacy = window.localStorage.getItem('trig_grandline_v1') || window.localStorage.getItem('trig_adventure_v8');
        if (legacy) {
          const parsedLegacy = JSON.parse(legacy);
          return {
            activeSlot: 1,
            slots: { 1: normalizeProgress(parsedLegacy, '冒險者 1'), 2: null, 3: null }
          };
        }
      } catch (e) {}
      return emptyStore;
    };

    const App = () => {
      const [saveStore, setSaveStore] = useState(() => loadSaveStore());
      const activeSlot = saveStore.activeSlot || 1;
      const userProgress = useMemo(
        () => saveStore.slots[activeSlot] || createEmptyProgress(),
        [saveStore, activeSlot]
      );

      const setUserProgress = useCallback((updater) => {
        setSaveStore(prev => {
          const slotId = prev.activeSlot || 1;
          const current = prev.slots[slotId] || normalizeProgress(null, `冒險者 ${slotId}`);
          const nextProg = typeof updater === 'function' ? updater(current) : updater;
          return {
            ...prev,
            slots: {
              ...prev.slots,
              [slotId]: { ...nextProg, updatedAt: Date.now() }
            }
          };
        });
      }, []);

      const gameMode = userProgress.mode === 'free' ? 'free' : 'adventure';
      const [statusSlot, setStatusSlot] = useState(1);
      const [lockedNotice, setLockedNotice] = useState(null);
      const [currentStage, setCurrentStage] = useState('title');
      const [selectedLevel, setSelectedLevel] = useState(1);
      const [showWinModal, setShowWinModal] = useState(false);
      const [earnedStars, setEarnedStars] = useState(0);
      const [pendingCelebration, setPendingCelebration] = useState(null);
      const [pendingNextWalk, setPendingNextWalk] = useState(null);
      const [showUnifiedShrine, setShowUnifiedShrine] = useState(false);
      const [showAngleDialModal, setShowAngleDialModal] = useState(false);
      const [dialModalTab, setDialModalTab] = useState('rotate');
      const [showStatusModal, setShowStatusModal] = useState(false);
      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const isDebugMode = useMemo(() => (
        typeof window !== 'undefined' &&
        (new URLSearchParams(window.location.search).get('debug') === '1' || window.location.hash.includes('debug=1'))
      ), []);
      const [showDebugPanel, setShowDebugPanel] = useState(false);
      const [debugPhase, setDebugPhase] = useState(null); // null (自動) | 0 | 1 | 2
      const [debugJumpSeq, setDebugJumpSeq] = useState(0);
      const [audioPrefs, setAudioPrefs] = useState(() => audio.getPrefs());
      const [editingSlotId, setEditingSlotId] = useState(null);
      const [editingSlotName, setEditingSlotName] = useState('');
      const [confirmDeleteSlot, setConfirmDeleteSlot] = useState(null);
      const [newCardModalSlot, setNewCardModalSlot] = useState(null);
      const [newCardName, setNewCardName] = useState('');
      const [storyWhisper, setStoryWhisper] = useState(null);
      const [curtainState, setCurtainState] = useState({
        phase: 'hidden', // 'hidden' | 'in' | 'out'
        mode: 'fade', // 'mist-in' | 'mist-out' | 'fade'
        icon: '',
        title: '',
        sub: '',
        durationMs: 780,
        holdMs: 0
      });
      const [shrineTab, setShrineTab] = useState(1);
      const mapCtrlRef = useRef(null);
      const mapViewSnapshotRef = useRef(null);
      const deleteTimerRef = useRef(null);
      const whisperTimerRef = useRef(null);
      const curtainTimerRef = useRef(null);

      const transitionToStage = useCallback((nextStage, beforeSwitch, opts = {}) => {
        clearTimeout(curtainTimerRef.current);
        const mode = opts.mode || (opts.isMist ? 'mist-in' : 'fade');
        const inMs = opts.inMs || 180;
        const durationMs = opts.durationMs || 280;
        const holdMs = opts.holdMs || 0;
        const settleMs = mode === 'mist-in' ? 180 : 30;
        const startPhase = mode === 'fade' ? 'prep' : 'in';
        setCurtainState({
          phase: startPhase,
          mode,
          icon: opts.icon || '',
          title: opts.title || '',
          sub: opts.sub || '',
          inMs,
          durationMs,
          holdMs
        });
        const runSwitch = () => {
          curtainTimerRef.current = setTimeout(() => {
            if (beforeSwitch) beforeSwitch();
            setCurrentStage(nextStage);
            curtainTimerRef.current = setTimeout(() => {
              setCurtainState(prev => ({ ...prev, phase: 'out' }));
              curtainTimerRef.current = setTimeout(() => {
                setCurtainState(prev => ({ ...prev, phase: 'hidden' }));
              }, durationMs + 60);
            }, settleMs);
          }, inMs);
        };
        if (startPhase === 'prep') {
          curtainTimerRef.current = setTimeout(() => {
            setCurtainState(prev => ({ ...prev, phase: 'in' }));
            runSwitch();
          }, 20);
        } else {
          runSwitch();
        }
      }, []);

      const returnToMapFromLevel = useCallback(() => {
        setShowWinModal(false);
        transitionToStage('map', null, { mode: 'fade', inMs: 160, durationMs: 260 });
      }, [transitionToStage]);

      const advanceToNextLevelFromWin = useCallback((fromId, toId) => {
        setShowWinModal(false);
        if (mapViewSnapshotRef.current) {
          mapViewSnapshotRef.current = { ...mapViewSnapshotRef.current, focusedNodeId: null };
        }
        setPendingNextWalk({ fromId, toId, id: Date.now() });
        transitionToStage('map', null, { mode: 'fade', inMs: 160, durationMs: 260 });
      }, [transitionToStage]);

      const triggerReturnToTitle = useCallback(() => {
        clearTimeout(curtainTimerRef.current);
        if (currentStage === 'map' && mapCtrlRef.current?.flyOutToClouds) {
          mapCtrlRef.current.flyOutToClouds();
        }
        setCurtainState({
          phase: 'prep',
          mode: 'mist-out',
          icon: '',
          title: '',
          sub: '',
          durationMs: 340
        });
        curtainTimerRef.current = setTimeout(() => {
          setCurtainState(prev => ({ ...prev, phase: 'in' }));
          curtainTimerRef.current = setTimeout(() => {
            mapViewSnapshotRef.current = null;
            setCurrentStage('title');
            setTimeout(() => {
              setCurtainState(prev => ({ ...prev, phase: 'out' }));
              curtainTimerRef.current = setTimeout(() => {
                setCurtainState(prev => ({ ...prev, phase: 'hidden' }));
              }, 380);
            }, 40);
          }, 720);
        }, 24);
      }, [currentStage]);

      const triggerStoryWhisper = useCallback((text, icon = '🕯️', targetNodeId = null) => {
        clearTimeout(whisperTimerRef.current);
        const id = Date.now();
        setStoryWhisper({ text, icon, targetNodeId, id });
        whisperTimerRef.current = setTimeout(() => {
          setStoryWhisper(prev => prev?.id === id ? null : prev);
        }, 4200);
      }, []);

      const updateAudioPrefs = useCallback((patch) => {
        audio.init();
        audio.setAudioPrefs(patch);
        setAudioPrefs(audio.getPrefs());
      }, []);

      useEffect(() => {
        const unlockAudio = () => {
          audio.init();
          window.removeEventListener('pointerdown', unlockAudio);
          window.removeEventListener('keydown', unlockAudio);
        };
        window.addEventListener('pointerdown', unlockAudio, { passive: true });
        window.addEventListener('keydown', unlockAudio, { passive: true });
        return () => {
          window.removeEventListener('pointerdown', unlockAudio);
          window.removeEventListener('keydown', unlockAudio);
        };
      }, []);

      useEffect(() => {
        audio.setBgmScene(currentStage === 'playing' ? 'playing' : 'map');
        if (currentStage !== 'map') {
          setStoryWhisper(null);
        }
      }, [currentStage]);

      useEffect(() => {
        if (currentStage !== 'map') return;
        const flags = userProgress.seenStoryFlags || {};
        if (gameMode === 'adventure' && adventureTotalStars >= 17 && !flags.sea3) {
          triggerStoryWhisper('幻夜星軌共鳴——攀向雲端之上，喚醒最終的聖域王座', '👑');
          setUserProgress(prev => ({
            ...prev,
            seenStoryFlags: { ...(prev.seenStoryFlags || {}), sea3: true }
          }));
        } else if (gameMode === 'adventure' && adventureTotalStars >= 8 && !flags.sea2) {
          triggerStoryWhisper('星門開啟——從靜止直角，踏入旋轉不息的星象迴廊', '💠', 'shrine_2');
          setUserProgress(prev => ({
            ...prev,
            seenStoryFlags: { ...(prev.seenStoryFlags || {}), sea2: true }
          }));
        } else if ((userProgress.stars?.[1] || 0) >= 1 && !flags.shrine1Hint) {
          triggerStoryWhisper('隨時可點擊地圖上的「銳角聖典」神殿，溫習幾何圖解秘笈', '🏛️', 'shrine_1');
          setUserProgress(prev => ({
            ...prev,
            seenStoryFlags: { ...(prev.seenStoryFlags || {}), shrine1Hint: true }
          }));
        }
      }, [currentStage, gameMode, adventureTotalStars, userProgress.seenStoryFlags, userProgress.stars, setUserProgress, triggerStoryWhisper]);

      useEffect(() => {
        audio.setModalDucking(
          newCardModalSlot !== null || showSettingsModal || showUnifiedShrine || showAngleDialModal || showStatusModal
        );
      }, [newCardModalSlot, showSettingsModal, showUnifiedShrine, showAngleDialModal, showStatusModal]);

      const enterLevelFromMap = useCallback((lvlId) => {
        if (mapCtrlRef.current) {
          mapViewSnapshotRef.current = mapCtrlRef.current.getSnapshot();
        }
        audio.init();
        transitionToStage('playing', () => setSelectedLevel(lvlId), { mode: 'fade', inMs: 180, durationMs: 280 });
      }, [transitionToStage]);

      const adventureTotalStars = useMemo(() => Object.values(userProgress.stars || {}).reduce((acc, cur) => acc + (cur || 0), 0), [userProgress.stars]);
      const freeTotalStars = useMemo(() => Object.values(userProgress.freeStars || {}).reduce((acc, cur) => acc + (cur || 0), 0), [userProgress.freeStars]);
      const totalStars = gameMode === 'adventure' ? adventureTotalStars : freeTotalStars;
      const playableLevels = useMemo(() => LEVELS.filter(l => !l.isPlaceholder), []);
      const totalPossibleStars = useMemo(() => playableLevels.length * 3, [playableLevels]);

      const getAdventureRank = (starsCount) => {
        if (starsCount >= 35) return { title: '聖域大宗師', icon: '👑' };
        if (starsCount >= 24) return { title: '星軌大魔導', icon: '🔮' };
        if (starsCount >= 15) return { title: '幾何領航員', icon: '⚔️' };
        if (starsCount >= 6) return { title: '聖殿守護者', icon: '🧭' };
        return { title: '聖域見習生', icon: '🌱' };
      };
      const currentRank = useMemo(() => getAdventureRank(adventureTotalStars), [adventureTotalStars]);

      const getLevelLockStatus = useCallback((levelId) => {
        const targetLvl = LEVELS.find(l => l.id === levelId);
        if (targetLvl?.isPlaceholder) return { unlocked: false, reason: '此試煉尚未開放，敬請期待' };
        if (gameMode === 'free' || levelId <= 1) return { unlocked: true, reason: '' };
        const reqStars = LEVEL_STAR_REQUIREMENTS[levelId] ?? 0;
        if (adventureTotalStars < reqStars) {
          return {
            unlocked: false,
            reason: `需 ${reqStars}⭐ 解鎖（尚差 ${reqStars - adventureTotalStars}⭐）`
          };
        }
        return { unlocked: true, reason: '' };
      }, [gameMode, adventureTotalStars]);

      const [dialAngle, setDialAngle] = useState(60);
      const dialExactAngleRef = useRef(60);
      const dialLastAtanRef = useRef(0);
      const dialLastTickAngleRef = useRef(60);
      const [isDialDragging, setIsDialDragging] = useState(false);
      const isDialDraggingRef = useRef(false);

      useEffect(() => { isDialDraggingRef.current = isDialDragging; }, [isDialDragging]);
      useEffect(() => {
        const preventDialTouchScroll = (e) => { if (isDialDraggingRef.current) e.preventDefault(); };
        document.addEventListener('touchmove', preventDialTouchScroll, { passive: false });
        return () => document.removeEventListener('touchmove', preventDialTouchScroll);
      }, []);

      useEffect(() => {
        try {
          window.localStorage.setItem(SAVE_SLOTS_KEY, JSON.stringify(saveStore));
        } catch (e) {}
      }, [saveStore]);

      const handleSelectSlot = useCallback((slotId) => {
        audio.init();
        const slotData = saveStore.slots[slotId];
        if (!slotData) {
          audio.sfxClick();
          setConfirmDeleteSlot(null);
          setEditingSlotId(null);
          setNewCardName(`冒險者 ${slotId}`);
          setNewCardModalSlot(slotId);
          return;
        }
        audio.sfxBonus();
        setEditingSlotId(null);
        setConfirmDeleteSlot(null);

        const isFirstIntro = !(slotData.seenStoryFlags && slotData.seenStoryFlags.intro);
        const cardMode = slotData.mode === 'free' ? 'free' : 'adventure';
        const advStars = Object.values(slotData.stars || {}).reduce((a, b) => a + (b || 0), 0);
        const mistOpts = isFirstIntro
          ? {
              isMist: true,
              durationMs: 2500,
              holdMs: 900,
              icon: '🕯️',
              title: '序章 • 光之階梯',
              sub: '星芒沉睡於黑夜，提燈旅人阿爾法踏上光之階梯…'
            }
          : cardMode === 'free'
          ? {
              isMist: true,
              durationMs: 1500,
              holdMs: 350,
              icon: '🌱',
              title: '休閒練習 • 全聖域開放',
              sub: slotData.name || `冒險者 ${slotId}`
            }
          : advStars >= 20
          ? {
              isMist: true,
              durationMs: 1500,
              holdMs: 350,
              icon: '👑',
              title: '第三聖域 • 幻夜尖塔',
              sub: slotData.name || `冒險者 ${slotId}`
            }
          : advStars >= 10
          ? {
              isMist: true,
              durationMs: 1500,
              holdMs: 350,
              icon: '💠',
              title: '第二聖域 • 星象迴廊',
              sub: slotData.name || `冒險者 ${slotId}`
            }
          : {
              isMist: true,
              durationMs: 1500,
              holdMs: 350,
              icon: '🏛️',
              title: '第一聖域 • 月光花園',
              sub: slotData.name || `冒險者 ${slotId}`
            };

        transitionToStage('map', () => {
          setSaveStore(prev => {
            const cur = prev.slots[slotId];
            return {
              ...prev,
              activeSlot: slotId,
              slots: cur && isFirstIntro
                ? {
                    ...prev.slots,
                    [slotId]: {
                      ...cur,
                      seenStoryFlags: { ...(cur.seenStoryFlags || {}), intro: true }
                    }
                  }
                : prev.slots
            };
          });
          mapViewSnapshotRef.current = null;
        }, mistOpts);
      }, [saveStore.slots, transitionToStage]);

      const handleCreateNewCard = useCallback((chosenMode) => {
        if (!newCardModalSlot) return;
        const slotId = newCardModalSlot;
        const finalName = newCardName.trim().slice(0, 12) || `冒險者 ${slotId}`;
        audio.init();
        audio.sfxBonus();
        setNewCardModalSlot(null);
        transitionToStage('map', () => {
          setSaveStore(prev => ({
            ...prev,
            activeSlot: slotId,
            slots: {
              ...prev.slots,
              [slotId]: {
                ...createEmptyProgress(),
                mode: chosenMode === 'free' ? 'free' : 'adventure',
                name: finalName,
                seenStoryFlags: { intro: true },
                updatedAt: Date.now()
              }
            }
          }));
          mapViewSnapshotRef.current = null;
        }, {
          isMist: true,
          durationMs: 2500,
          holdMs: 900,
          icon: '🕯️',
          sub: '星芒沉睡於黑夜，提燈旅人阿爾法踏上光之階梯…'
        });
      }, [newCardModalSlot, newCardName, transitionToStage]);

      const handleClearSlot = useCallback((slotId) => {
        if (confirmDeleteSlot !== slotId) {
          audio.sfxClick();
          setConfirmDeleteSlot(slotId);
          clearTimeout(deleteTimerRef.current);
          deleteTimerRef.current = setTimeout(() => setConfirmDeleteSlot(null), 3000);
          return;
        }
        clearTimeout(deleteTimerRef.current);
        audio.sfxError();
        setConfirmDeleteSlot(null);
        if (editingSlotId === slotId) setEditingSlotId(null);
        setSaveStore(prev => ({
          ...prev,
          slots: { ...prev.slots, [slotId]: null }
        }));
      }, [confirmDeleteSlot, editingSlotId]);

      const handleCommitRename = useCallback((slotId) => {
        const trimmed = editingSlotName.trim();
        if (trimmed) {
          audio.sfxSelect();
          setSaveStore(prev => {
            const cur = prev.slots[slotId];
            if (!cur) return prev;
            return {
              ...prev,
              slots: { ...prev.slots, [slotId]: { ...cur, name: trimmed.slice(0, 12) } }
            };
          });
        }
        setEditingSlotId(null);
      }, [editingSlotName]);

      const handleUpdateStars = (levelId, count, latestScore = 0) => {
        setUserProgress(prev => {
          if (gameMode === 'free') {
            return {
              ...prev,
              freeStars: { ...(prev.freeStars || {}), [levelId]: Math.max((prev.freeStars?.[levelId]) || 0, count) },
              freeHighScores: { ...(prev.freeHighScores || {}), [levelId]: Math.max((prev.freeHighScores?.[levelId]) || 0, latestScore) }
            };
          }
          return {
            ...prev,
            stars: { ...prev.stars, [levelId]: Math.max(prev.stars[levelId] || 0, count) },
            highScores: { ...(prev.highScores || {}), [levelId]: Math.max((prev.highScores?.[levelId]) || 0, latestScore) }
          };
        });
      };

      const getNextLevelForResult = useCallback((justEarnedStars = 0) => {
        const nextLvl = LEVELS.find(l => l.id === selectedLevel + 1);
        if (!nextLvl || nextLvl.isPlaceholder) return null;
        if (gameMode === 'free') return nextLvl;
        const curStarsForLvl = userProgress.stars?.[selectedLevel] || 0;
        const projectedTotal = adventureTotalStars + Math.max(0, justEarnedStars - curStarsForLvl);
        const reqStars = LEVEL_STAR_REQUIREMENTS[nextLvl.id] ?? 0;
        return projectedTotal >= reqStars ? nextLvl : null;
      }, [selectedLevel, gameMode, userProgress.stars, adventureTotalStars]);

      const handleCompleteLevel = (count, finalScore = 0, goNext = false) => {
        handleUpdateStars(selectedLevel, count, finalScore);
        setEarnedStars(count);
        if (count === 3) {
          setPendingCelebration({ levelId: selectedLevel, id: Date.now() });
        }
        const nextLvl = goNext ? getNextLevelForResult(count) : null;
        if (nextLvl) {
          advanceToNextLevelFromWin(selectedLevel, nextLvl.id);
        } else {
          returnToMapFromLevel();
        }
      };

      const handleDialPointerDown = (e) => {
        setIsDialDragging(true);
        e.target.setPointerCapture(e.pointerId);
        const ctm = e.currentTarget.getScreenCTM();
        if (!ctm) return;
        const inv = ctm.inverse();
        const svgX = inv.a * e.clientX + inv.c * e.clientY + inv.e;
        const svgY = inv.b * e.clientX + inv.d * e.clientY + inv.f;
        dialLastAtanRef.current = Math.atan2(270 - svgY, svgX - 270) * (180 / Math.PI);
        dialExactAngleRef.current = dialAngle;
      };
      const handleDialPointerMove = (e) => {
        if (!isDialDragging) return;
        const ctm = e.currentTarget.getScreenCTM();
        if (!ctm) return;
        const inv = ctm.inverse();
        const svgX = inv.a * e.clientX + inv.c * e.clientY + inv.e;
        const svgY = inv.b * e.clientX + inv.d * e.clientY + inv.f;
        const currentAtan = Math.atan2(270 - svgY, svgX - 270) * (180 / Math.PI);
        let diff = currentAtan - dialLastAtanRef.current;
        if (diff > 180) diff -= 360;
        if (diff < -180) diff += 360;
        dialExactAngleRef.current += diff;
        dialLastAtanRef.current = currentAtan;

                      </button>
                      <button
                        onClick={() => setUserProgress(prev => ({ ...prev, stars: { 1: 3, 2: 3, 3: 3, 4: 3, 5: 3, 6: 2 }, freeStars: { 1: 3, 2: 3, 3: 3, 4: 3, 5: 3, 6: 2 } }))}
                        className="py-1 px-2 rounded-lg bg-purple-700/80 hover:bg-purple-600 font-black"
                      >
                        17★ 三聖域
                      </button>
                      <button
                        onClick={() => {
                          const allStars = {};
                          LEVELS.filter(l => !l.isPlaceholder).forEach(l => { allStars[l.id] = 3; });
                          setUserProgress(prev => ({ ...prev, stars: allStars, freeStars: allStars }));
                        }}
                        className="col-span-2 py-1 px-2 rounded-lg bg-amber-600/85 hover:bg-amber-500 text-slate-950 font-black"
                      >
                        ⭐ 全關 3★ 解鎖（全部可玩關卡）
                      </button>
                    </div>
                  </div>
                  <div className="space-y-1">
                    <div className="text-[10px] font-bold text-slate-400">測試階段（Phase 覆寫）</div>
                    <div className="grid grid-cols-4 gap-1">
                      {[
                        { label: '自動', val: null },
                        { label: 'P0', val: 0 },
                        { label: 'P1', val: 1 },
                        { label: 'P2', val: 2 }
                      ].map(opt => (
                        <button
                          key={String(opt.val)}
                          onClick={() => {
                            setDebugPhase(opt.val);
                            if (selectedLevel) {
                              setShowDebugPanel(false);
                              setDebugJumpSeq(s => s + 1);
                            }
                          }}
                          className={`py-1 rounded-lg font-black text-[11px] transition-all ${
                            debugPhase === opt.val
                              ? 'bg-cyan-400 text-slate-950 ring-2 ring-white'
                              : 'bg-slate-800 hover:bg-slate-700 text-slate-200'
                          }`}
                        >
                          {opt.label}
                        </button>
                      ))}
                    </div>
                  </div>
                  <div className="space-y-1">
                    <div className="text-[10px] font-bold text-slate-400">快捷跳轉（模擬首次 0★ 進關）</div>
                    <div className="grid grid-cols-4 gap-1">
                      {LEVELS.filter(l => !l.isPlaceholder).map(lv => (
                        <button
                          key={lv.id}
                          onClick={() => {
                            setShowDebugPanel(false);
                            setUserProgress(prev => {
                              const nextGuides = { ...(prev.seenGuides || {}) };
                              delete nextGuides[lv.id];
                              const nextStars = { ...(prev.stars || {}) };
                              delete nextStars[lv.id];
                              const nextFreeStars = { ...(prev.freeStars || {}) };
                              delete nextFreeStars[lv.id];
                              return { ...prev, seenGuides: nextGuides, stars: nextStars, freeStars: nextFreeStars };
                            });
                            setSelectedLevel(null);
                            enterLevelFromMap(lv.id);
                          }}
                          title={`${lv.title}（重置為首次 0★ 進關）`}
                          className="py-1 rounded-lg bg-amber-500/85 hover:bg-amber-400 text-slate-950 font-black"
                        >
                          Lv.{lv.id}
                        </button>
                      ))}
                    </div>
                  </div>
                </div>
              )}
              <button
                onClick={() => setShowDebugPanel(s => !s)}
                className="px-2.5 py-1.5 rounded-full bg-slate-900/90 hover:bg-slate-800 text-amber-300 border border-amber-400/70 text-[11px] font-black shadow-lg"
              >
                🛠️ Debug
              </button>
            </div>
          )}

          {/* 主畫面 ↔ 地圖 景深對焦切換（聖域由模糊漸清、故事文字由清晰轉模糊消失）/ 關卡輕轉場 */}
          {curtainState.phase !== 'hidden' && (() => {
            const { phase, mode, inMs, durationMs, holdMs } = curtainState;
            const isOut = phase === 'out';
            const isPrep = phase === 'prep';
            const isMistIn = mode === 'mist-in';
            const isMistOut = mode === 'mist-out';

            const bgDurStyle = isMistOut
              ? { transitionDuration: isOut ? '320ms' : '600ms' }
              : isMistIn
              ? { transitionDuration: isOut ? '900ms' : '160ms' }
              : { transitionDuration: isOut ? `${durationMs}ms` : `${inMs || 180}ms` };

            const textFadeMs = Math.max(450, durationMs - (holdMs || 0));
            const textStyle = {
              transitionDuration: isOut ? `${textFadeMs}ms` : '200ms',
              transitionDelay: isOut && holdMs ? `${holdMs}ms` : '0ms',
              filter: isOut ? 'blur(8px)' : 'blur(0px)',
              opacity: isOut ? 0 : 1,
              transform: isOut ? 'scale(1.04)' : 'scale(1)'
            };

            const bgOpacityClass = isPrep || isOut ? 'opacity-0' : 'opacity-100';

            return (
              <div
                className={`fixed inset-0 z-[100] overflow-hidden flex items-center justify-center ${
                  isOut ? 'pointer-events-none' : 'pointer-events-auto'
                }`}
              >
                {/* 底層極簡夜空帷幕（mist-in 柔和淡出，透出由模糊漸清晰的 3D 聖域） */}
                <div
                  style={bgDurStyle}
                  className={`absolute inset-0 bg-gradient-to-b from-slate-950 via-indigo-950 to-slate-950 transition-opacity ease-out ${bgOpacityClass}`}
                />

                {/* 進地圖時的故事字幕（清晰停留後，隨轉場由清晰轉模糊淡出） */}
                {!isMistOut && (curtainState.title || curtainState.sub) && (
                  <div
                    style={textStyle}
                    className="relative z-10 flex flex-col items-center text-center px-6 max-w-xs transition-all ease-out"
                  >
                    {curtainState.title && (
                      <div className="flex items-center gap-1.5 text-xs font-black tracking-widest text-amber-300 bg-slate-950/75 px-3.5 py-1 rounded-full border border-amber-400/45 mb-2.5 shadow-lg">
                        <span>{curtainState.icon}</span>
                        <span>{curtainState.title}</span>
                      </div>
                    )}
                    {curtainState.sub && (
                      <div className="text-sm sm:text-base font-bold text-white leading-relaxed drop-shadow-[0_2px_10px_rgba(0,0,0,0.95)]">
                        {curtainState.sub}
                      </div>
                    )}
                  </div>
                )}
              </div>
            );
          })()}

        </div>
        </GameModeContext.Provider>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
