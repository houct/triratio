            const goldRim = new THREE.Mesh(new THREE.CylinderGeometry(1.16, 1.28, 0.16, 8), goldMat);
            goldRim.position.set(0, 0.58, -0.04);
            goldRim.castShadow = true;
            propsGroup.add(goldRim);

            const upperBase = new THREE.Mesh(new THREE.CylinderGeometry(0.92, 1.12, 0.65, 8), whiteMat);
            upperBase.position.set(0, 0.94, -0.04);
            upperBase.castShadow = true;
            propsGroup.add(upperBase);

            for (let k = 0; k < 8; k++) {
              const ang = (k * Math.PI) / 4;
              const isDiag = k % 2 === 1;
              const turret = new THREE.Mesh(
                new THREE.ConeGeometry(isDiag ? 0.17 : 0.22, isDiag ? 1.15 : 1.42, 4),
                isDiag ? darkStoneMat : goldMat
              );
              turret.position.set(Math.cos(ang) * 1.18, isDiag ? 1.15 : 1.28, Math.sin(ang) * 1.18 - 0.04);
              turret.rotation.y = Math.PI / 4;
              turret.castShadow = true;
              propsGroup.add(turret);
            }

            const mainSpire = new THREE.Mesh(new THREE.ConeGeometry(0.68, 2.55, 8), accentMat);
            mainSpire.position.set(0, 2.48, -0.04);
            mainSpire.castShadow = true;
            propsGroup.add(mainSpire);

            const outerStarRing = new THREE.Mesh(new THREE.TorusGeometry(1.06, 0.055, 6, 24), goldMat);
            outerStarRing.position.set(0, 3.05, -0.04);
            outerStarRing.rotation.x = Math.PI / 2.6;
            propsGroup.add(outerStarRing);
            animatedObjects.push({ mesh: outerStarRing, type: 'spinY', speed: 1.1 });

            const innerArcRing = new THREE.Mesh(new THREE.TorusGeometry(0.76, 0.045, 6, 20), royalVioletMat);
            innerArcRing.position.set(0, 3.05, -0.04);
            innerArcRing.rotation.x = -Math.PI / 2.8;
            innerArcRing.rotation.z = Math.PI / 5;
            propsGroup.add(innerArcRing);
            animatedObjects.push({ mesh: innerArcRing, type: 'spinY', speed: -1.45 });

            const crownPivot = new THREE.Group();
            crownPivot.position.set(0, 4.18, -0.04);
            const crown = new THREE.Mesh(new THREE.OctahedronGeometry(0.42, 0), goldMat);
            crownPivot.add(crown);
            [0, 1, 2, 3].forEach(k => {
              const ang = (k * Math.PI) / 2;
              const sat = new THREE.Mesh(new THREE.OctahedronGeometry(0.13, 0), royalVioletMat);
              sat.position.set(Math.cos(ang) * 0.66, 0, Math.sin(ang) * 0.66);
              crownPivot.add(sat);
            });
            propsGroup.add(crownPivot);
            animatedObjects.push({ mesh: crownPivot, type: 'floatObj', baseY: 4.18 });
            animatedObjects.push({ mesh: crownPivot, type: 'spinY', speed: 0.9 });
          }
          return mats;
        };

        const islandMeshes = [];
        const nodeObjects = {};

        const createEngravedTexture = (mainText, colorHex = '#f8fafc', isSubtle = false, fontSize = 92, fontFamily = '"Fredoka", "Noto Sans TC", sans-serif') => {
          const canvas = document.createElement('canvas');
          canvas.width = 256;
          canvas.height = 128;
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, 256, 128);

          ctx.font = `900 ${fontSize}px ${fontFamily}`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = 'rgba(4, 7, 20, 0.65)';
          ctx.fillText(mainText, 128, 63);

          ctx.fillStyle = colorHex;
          ctx.globalAlpha = isSubtle ? 0.55 : 0.96;
          ctx.fillText(mainText, 128, 58);

          ctx.fillRect(82, 112, 92, 5);

          const tex = new THREE.CanvasTexture(canvas);
          tex.needsUpdate = true;
          return tex;
        };

        HEX_NODES_3D.forEach((node, idx) => {
          const group = new THREE.Group();
          const rad = BASE_RADIUS * node.radScale;
          const pillarH = node.pillarH;

          group.position.set(node.x, node.y, node.z);

          const bodyGeo = new THREE.CylinderGeometry(rad, rad * 0.96, pillarH, node.sides);
          const bodyMat = new THREE.MeshStandardMaterial({
            color: node.baseColor, roughness: 0.62, flatShading: true
          });
          const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
          bodyMesh.position.y = -pillarH / 2;
          bodyMesh.rotation.y = node.rot;
          bodyMesh.castShadow = true;
          bodyMesh.receiveShadow = true;
          group.add(bodyMesh);

          const isFinalBoss = node.id === 19;
          const engraveText = node.kind === 'shrine'
            ? (node.id === 'shrine_1' ? '❖ I' : node.id === 'shrine_2' ? '❖ II' : '❖ III')
            : isFinalBoss ? 'Ω' : String(node.id).padStart(2, '0');
          const plaqueTex = createEngravedTexture(
            engraveText,
            node.kind === 'shrine' ? '#fde68a' : isFinalBoss ? '#fde047' : '#f8fafc',
            Boolean(node.isPlaceholder) && !isFinalBoss,
            isFinalBoss ? 116 : 92,
            isFinalBoss ? '"Georgia", "Times New Roman", serif' : '"Fredoka", "Noto Sans TC", sans-serif'
          );
          const plaqueMat = new THREE.MeshBasicMaterial({
            map: plaqueTex, transparent: true, depthWrite: false, side: THREE.FrontSide
          });
          const plaqueMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(isFinalBoss ? 2.46 : 1.42, isFinalBoss ? 1.23 : 0.71),
            plaqueMat
          );
          const apothem = rad * Math.cos(Math.PI / node.sides);
          plaqueMesh.position.set(0, isFinalBoss ? -0.84 : -0.58, apothem + 0.03);
          group.add(plaqueMesh);

          const tipH = rad * 1.15;
          const tipGeo = new THREE.CylinderGeometry(rad * 0.96, 0, tipH, node.sides);
          const tipMat = new THREE.MeshStandardMaterial({
            color: 0x0f172a, roughness: 0.85, flatShading: true
          });
          const tipMesh = new THREE.Mesh(tipGeo, tipMat);
          tipMesh.rotation.y = node.rot;
          tipMesh.position.y = -pillarH - tipH / 2;
          group.add(tipMesh);

          const trimH = 0.18;
          const trimGeo = new THREE.CylinderGeometry(rad * 1.06, rad * 1.06, trimH, node.sides);
          const trimMat = new THREE.MeshStandardMaterial({
            color: node.trimColor, roughness: 0.4, flatShading: true
          });
          const trimMesh = new THREE.Mesh(trimGeo, trimMat);
          trimMesh.position.y = trimH / 2;
          trimMesh.rotation.y = node.rot;
          trimMesh.castShadow = true;
          trimMesh.receiveShadow = true;
          group.add(trimMesh);

          const topH = 0.18;
          const topGeo = new THREE.CylinderGeometry(rad * 0.99, rad * 1.03, topH, node.sides);
          const topMat = new THREE.MeshStandardMaterial({
            color: node.color, roughness: 0.48, flatShading: true
          });
          const topMesh = new THREE.Mesh(topGeo, topMat);
          topMesh.position.y = trimH + topH / 2;
          topMesh.rotation.y = node.rot;
          topMesh.castShadow = true;
          topMesh.receiveShadow = true;
          group.add(topMesh);

          const surfaceY = trimH + topH;
          const props = new THREE.Group();
          props.position.y = surfaceY;
          props.scale.setScalar(0.95);
          const propMats = decorateNode(props, node);
          group.add(props);

          group.updateMatrixWorld(true);
          const propBox = new THREE.Box3().setFromObject(props);
          const propTopY = (!propBox.isEmpty() && isFinite(propBox.max.y))
            ? Math.max(0, propBox.max.y - (node.y + surfaceY))
            : 0.8;

          const starLampMats = [];
          if (node.kind === 'level' && !node.isPlaceholder) {
            [-0.36, 0, 0.36].forEach((ang) => {
              const lampMat = new THREE.MeshStandardMaterial({
                color: 0x334155,
                emissive: 0x000000,
                emissiveIntensity: 0,
                roughness: 0.25,
                flatShading: true
              });
              const lampGem = new THREE.Mesh(new THREE.OctahedronGeometry(0.115, 0), lampMat);
              lampGem.scale.set(1.0, 1.35, 1.0);
              const rimR = rad * 0.88;
              lampGem.position.set(
                Math.sin(ang) * rimR,
                surfaceY + 0.11,
                Math.cos(ang) * rimR
              );
              group.add(lampGem);
              starLampMats.push(lampMat);
            });
          }

          group.traverse((child) => {
            if (child.isMesh) {
              child.userData.nodeId = node.id;
              islandMeshes.push(child);
            }
          });

          scene.add(group);
          nodeObjects[node.id] = {
            node, group, rad, bodyMat, trimMat, topMesh, propMats, plaqueMat, starLampMats,
            surfaceY, baseY: node.y, propTopY,
            focusPoint: new THREE.Vector3(node.x, node.y + 0.6, node.z),
            phaseOffset: idx * 0.65
          };
        });

        const levelNodes = HEX_NODES_3D.filter(n => n.kind === 'level');
        const routeCurves = [];
        const levelEdgeCurves = {};
        const gateObjects = {};

        const stepTopMat = new THREE.MeshStandardMaterial({
          color: 0xf8fafc, emissive: 0xfef08a, emissiveIntensity: 0.25, roughness: 0.35, flatShading: true
        });
        const stepRiserMat = new THREE.MeshStandardMaterial({
          color: 0x334155, roughness: 0.72, flatShading: true
        });
        const gateBridgeMat = new THREE.MeshStandardMaterial({
          color: 0x38bdf8, emissive: 0x0284c7, emissiveIntensity: 0.75, transparent: true, opacity: 0.88, depthWrite: false, roughness: 0.2, flatShading: true
        });

        for (let i = 0; i < levelNodes.length - 1; i++) {
          const nA = levelNodes[i];
          const nB = levelNodes[i + 1];
          const a = nodeObjects[nA.id];
          const b = nodeObjects[nB.id];
          if (!a || !b) continue;

          const p1 = new THREE.Vector3(nA.x, nA.y + a.surfaceY + 0.02, nA.z);
          const p2 = new THREE.Vector3(nB.x, nB.y + b.surfaceY + 0.02, nB.z);
          const isGateBridge = STAR_GATES_3D.some(g => g.fromId === nA.id && g.toId === nB.id);
          const mid = p1.clone().lerp(p2, 0.5);
          mid.y += isGateBridge ? 1.05 : 0.14;
          const curve = new THREE.QuadraticBezierCurve3(p1, mid, p2);
          routeCurves.push(curve);
          levelEdgeCurves[`${nA.id}_${nB.id}`] = { curve, isGate: isGateBridge };

          if (isGateBridge) {
            const tubeGeo = new THREE.TubeGeometry(curve, 24, 0.11, 6, false);
            scene.add(new THREE.Mesh(tubeGeo, gateBridgeMat));

            const gateCfg = STAR_GATES_3D.find(g => g.fromId === nA.id && g.toId === nB.id);
            if (gateCfg) {
              const gatePos = curve.getPoint(0.5);
              const tangent = curve.getTangent(0.5).normalize();
              const gateGroup = new THREE.Group();
              gateGroup.position.copy(gatePos);
              gateGroup.lookAt(gatePos.clone().add(tangent));

              const postMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, emissive: 0xe2e8f0, emissiveIntensity: 0.2, roughness: 0.4, flatShading: true });
              [-0.96, 0.96].forEach(px => {
                const pillar = new THREE.Mesh(new THREE.BoxGeometry(0.24, 1.85, 0.24), postMat);
                pillar.position.set(px, 0.15, 0);
                gateGroup.add(pillar);
              });

              const archMat = new THREE.MeshStandardMaterial({
                color: 0xf43f5e, emissive: 0xf43f5e, emissiveIntensity: 0.95, roughness: 0.25, flatShading: true
              });
              const archMesh = new THREE.Mesh(new THREE.TorusGeometry(0.92, 0.10, 6, 16), archMat);
              archMesh.position.y = 0.35;
              gateGroup.add(archMesh);

              const gateAuraMat = new THREE.MeshBasicMaterial({
                color: 0xfda4af, transparent: true, opacity: 0.22, side: THREE.DoubleSide, depthWrite: false
              });
              const gateAura = new THREE.Mesh(new THREE.CircleGeometry(0.84, 16), gateAuraMat);
              gateAura.position.y = 0.35;
              gateAura.renderOrder = 2;
              gateGroup.add(gateAura);

              const gateTex = createEngravedTexture(`${gateCfg.reqStars}★`, '#fef08a');
              const gateSignMat = new THREE.MeshBasicMaterial({
                map: gateTex, transparent: true, depthWrite: false, side: THREE.DoubleSide
              });
              const gateSign = new THREE.Mesh(new THREE.PlaneGeometry(1.45, 0.72), gateSignMat);
              gateSign.position.set(0, 1.68, 0);
              gateGroup.add(gateSign);

              scene.add(gateGroup);
              gateObjects[gateCfg.id] = {
                cfg: gateCfg,
                group: gateGroup,
                archMesh,
                archMat,
                auraMat: gateAuraMat,
                pulseTimer: 0
              };
            }
          } else {
            const dx = nB.x - nA.x;
            const dz = nB.z - nA.z;
            const horizDist = Math.hypot(dx, dz);
            const ux = dx / horizDist;
            const uz = dz / horizDist;
            const startDist = a.rad * 1.05;
            const endDist = horizDist - b.rad * 1.05;
            const span = Math.max(0.6, endDist - startDist);
            const numSteps = 6;
            const stepPitch = span / numSteps;
            const treadDepth = stepPitch * 0.72;
            const yaw = Math.atan2(dx, dz);
            const yStart = nA.y + a.surfaceY;
            const yEnd = nB.y + b.surfaceY;

            const stepPoints = [];
            for (let s = 0; s < numSteps; s++) {
              const frac = (s + 0.5) / numSteps;
              const dAlong = startDist + span * frac;
              const sx = nA.x + ux * dAlong;
              const sz = nA.z + uz * dAlong;
              const sy = yStart + (yEnd - yStart) * frac;

              const stepGroup = new THREE.Group();
              stepGroup.position.set(sx, sy, sz);
              stepGroup.rotation.y = yaw;

              const riserMesh = new THREE.Mesh(
                new THREE.BoxGeometry(0.76, 0.16, treadDepth * 0.92),
                stepRiserMat
              );
              riserMesh.position.y = -0.10;
              riserMesh.castShadow = true;
              riserMesh.receiveShadow = true;
              stepGroup.add(riserMesh);

              const treadMesh = new THREE.Mesh(
                new THREE.BoxGeometry(0.82, 0.08, treadDepth),
                stepTopMat
              );
              treadMesh.position.y = -0.02;
              treadMesh.castShadow = true;
              treadMesh.receiveShadow = true;
              stepGroup.add(treadMesh);

              scene.add(stepGroup);
              stepPoints.push(new THREE.Vector3(sx, sy + 0.02, sz));
            }
            levelEdgeCurves[`${nA.id}_${nB.id}`].stepPoints = stepPoints;
          }
        }

        const flowOrbs = [];
        const orbGeo = new THREE.OctahedronGeometry(0.11, 0);
        const orbMat = new THREE.MeshBasicMaterial({ color: 0xfef08a });
        for (let k = 0; k < 6; k++) {
          const orb = new THREE.Mesh(orbGeo, orbMat);
          scene.add(orb);
          flowOrbs.push({ mesh: orb, offset: k / 6 });
        }

        // 7. 打造《紀念碑谷》星夜領航員小人偶
        const idaGroup = new THREE.Group();
        idaGroup.renderOrder = 5;
        const idaInteractMeshes = [];
        const regIdaPart = (mesh) => {
          mesh.userData = { isIda: true };
          mesh.renderOrder = 5;
          idaInteractMeshes.push(mesh);
          return mesh;
        };

        const hatIvoryMat = new THREE.MeshStandardMaterial({
          color: 0xfefce8, emissive: 0xfef08a, emissiveIntensity: 0.16, roughness: 0.35, flatShading: true
        });
        const cloakIndigoMat = new THREE.MeshStandardMaterial({
          color: 0x312e81, emissive: 0x4338ca, emissiveIntensity: 0.28, roughness: 0.48, flatShading: true
        });
        const innerRobeMat = new THREE.MeshStandardMaterial({
          color: 0xf472b6, emissive: 0xdb2777, emissiveIntensity: 0.22, roughness: 0.45, flatShading: true
        });
        const goldTrimMat = new THREE.MeshStandardMaterial({
          color: 0xfbbf24, emissive: 0xd97706, emissiveIntensity: 0.55, roughness: 0.25, metalness: 0.35, flatShading: true
        });
        const darkLimbMat = new THREE.MeshStandardMaterial({
          color: 0x0f172a, roughness: 0.8, flatShading: true
        });
        const lanternGlowMat = new THREE.MeshStandardMaterial({
          color: 0xfef08a, emissive: 0xf59e0b, emissiveIntensity: 1.35, roughness: 0.2, flatShading: true
        });

        const leftLeg = regIdaPart(new THREE.Mesh(new THREE.CylinderGeometry(0.032, 0.032, 0.26, 6), darkLimbMat));
        leftLeg.position.set(-0.075, 0.13, 0);
        idaGroup.add(leftLeg);

        const rightLeg = regIdaPart(new THREE.Mesh(new THREE.CylinderGeometry(0.032, 0.032, 0.26, 6), darkLimbMat));
        rightLeg.position.set(0.075, 0.13, 0);
        idaGroup.add(rightLeg);

        const innerRobe = regIdaPart(new THREE.Mesh(new THREE.ConeGeometry(0.24, 0.54, 12), innerRobeMat));
        innerRobe.position.set(0, 0.47, 0);
        idaGroup.add(innerRobe);

        const cloakMesh = regIdaPart(new THREE.Mesh(new THREE.ConeGeometry(0.29, 0.60, 12), cloakIndigoMat));
        cloakMesh.position.set(0, 0.53, 0);
        cloakMesh.castShadow = true;
        idaGroup.add(cloakMesh);

        const hemRing = regIdaPart(new THREE.Mesh(new THREE.TorusGeometry(0.285, 0.018, 6, 16), goldTrimMat));
        hemRing.rotation.x = Math.PI / 2;
        hemRing.position.set(0, 0.24, 0);
        idaGroup.add(hemRing);

        const collarRing = regIdaPart(new THREE.Mesh(new THREE.TorusGeometry(0.145, 0.026, 6, 14), goldTrimMat));
        collarRing.rotation.x = Math.PI / 2;
        collarRing.position.set(0, 0.77, 0);
        idaGroup.add(collarRing);

        const headMesh = regIdaPart(new THREE.Mesh(new THREE.SphereGeometry(0.14, 12, 10), hatIvoryMat));
        headMesh.position.set(0, 0.87, 0);
        headMesh.castShadow = true;
        idaGroup.add(headMesh);

        const hatPivot = new THREE.Group();
        hatPivot.position.set(0, 0.95, 0);
        const hatBrim = regIdaPart(new THREE.Mesh(new THREE.TorusGeometry(0.172, 0.018, 6, 14), goldTrimMat));
        hatBrim.rotation.x = Math.PI / 2;
        hatBrim.position.set(0, 0.01, 0);
        hatPivot.add(hatBrim);

        const hatCone = regIdaPart(new THREE.Mesh(new THREE.ConeGeometry(0.175, 0.66, 12), hatIvoryMat));
        hatCone.position.set(0, 0.34, 0);
        hatCone.castShadow = true;
        hatPivot.add(hatCone);
        idaGroup.add(hatPivot);

        const lanternPivot = new THREE.Group();
        lanternPivot.position.set(0.25, 0.56, 0.14);
        const lanternOrb = regIdaPart(new THREE.Mesh(new THREE.OctahedronGeometry(0.088, 0), lanternGlowMat));
        lanternOrb.position.set(0, -0.06, 0);
        lanternPivot.add(lanternOrb);
        idaGroup.add(lanternPivot);

        const idaBaseRingMat = new THREE.MeshBasicMaterial({
          color: 0xfef08a, transparent: true, opacity: 0.72, side: THREE.DoubleSide, depthWrite: false
        });
        const idaBaseRing = new THREE.Mesh(new THREE.RingGeometry(0.24, 0.36, 16), idaBaseRingMat);
        idaBaseRing.rotation.x = -Math.PI / 2;
        idaBaseRing.position.y = 0.03;
        idaBaseRing.renderOrder = 3;
        idaGroup.add(idaBaseRing);

        scene.add(idaGroup);

        const photonGroup = new THREE.Group();
        const photonCoreMat = new THREE.MeshBasicMaterial({ color: 0xfef9c3 });
        const photonCore = new THREE.Mesh(new THREE.OctahedronGeometry(0.22, 1), photonCoreMat);
        photonGroup.add(photonCore);

        const photonHaloMat = new THREE.MeshBasicMaterial({
          color: 0x38bdf8, transparent: true, opacity: 0.48, depthWrite: false
        });
        const photonHalo = new THREE.Mesh(new THREE.SphereGeometry(0.36, 12, 10), photonHaloMat);
        photonGroup.add(photonHalo);

        const photonRingMat = new THREE.MeshBasicMaterial({
          color: 0xfde047, transparent: true, opacity: 0.85, depthWrite: false
        });
        const photonRing = new THREE.Mesh(new THREE.TorusGeometry(0.38, 0.032, 6, 18), photonRingMat);
        photonGroup.add(photonRing);

        photonGroup.visible = false;
        photonGroup.renderOrder = 6;
        scene.add(photonGroup);

        const photonTrail = [];
        const trailGeo = new THREE.SphereGeometry(0.14, 8, 8);
        for (let k = 0; k < 6; k++) {
          const tMat = new THREE.MeshBasicMaterial({
            color: k % 2 === 0 ? 0x7dd3fc : 0xfef08a,
            transparent: true,
            opacity: 0,
            depthWrite: false
          });
          const tMesh = new THREE.Mesh(trailGeo, tMat);
          tMesh.visible = false;
          tMesh.renderOrder = 5;
          scene.add(tMesh);
          photonTrail.push({ mesh: tMesh, mat: tMat });
        }
        const hidePhotonVisuals = () => {
          photonGroup.visible = false;
          photonTrail.forEach(tr => { tr.mesh.visible = false; });
        };

        const teleportBeamMat = new THREE.MeshBasicMaterial({
          color: 0xfef08a, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false
        });
        const teleportBeam = new THREE.Mesh(
          new THREE.CylinderGeometry(0.16, 0.42, 7.5, 12, 1, true),
          teleportBeamMat
        );
        teleportBeam.visible = false;
        teleportBeam.renderOrder = 4;
        scene.add(teleportBeam);

        const beaconGroup = new THREE.Group();
        const beaconPinMat = new THREE.MeshStandardMaterial({
          color: 0xfacc15, emissive: 0xf59e0b, emissiveIntensity: 0.95, roughness: 0.2, metalness: 0.25, flatShading: true, transparent: true, opacity: 1
        });
        const beaconCrystal = new THREE.Mesh(new THREE.OctahedronGeometry(0.22, 0), beaconPinMat);
        beaconCrystal.scale.set(0.82, 1.48, 0.82);
        beaconCrystal.position.y = 0.36;
        beaconGroup.add(beaconCrystal);

        const beaconOrbitMat = new THREE.MeshBasicMaterial({ color: 0xfef08a, transparent: true, opacity: 0.92 });
        const beaconOrbitRing = new THREE.Mesh(
          new THREE.TorusGeometry(0.36, 0.024, 6, 24),
          beaconOrbitMat
        );
        beaconOrbitRing.position.y = 0.36;
        beaconOrbitRing.rotation.x = Math.PI / 3;
        beaconOrbitRing.rotation.z = 0.25;
        beaconGroup.add(beaconOrbitRing);

        const beaconPulseMat = new THREE.MeshBasicMaterial({
          color: 0xfde047, transparent: true, opacity: 0.85, side: THREE.DoubleSide, depthWrite: false
        });
        const beaconPulseRing = new THREE.Mesh(new THREE.RingGeometry(0.22, 0.36, 20), beaconPulseMat);
        beaconPulseRing.rotation.x = -Math.PI / 2;
        beaconPulseRing.position.y = 0.04;
        beaconPulseRing.renderOrder = 3;
        beaconGroup.add(beaconPulseRing);

        scene.add(beaconGroup);

        const tapRippleMat = new THREE.MeshBasicMaterial({
          color: 0xfef08a, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false
        });
        const tapRippleRing = new THREE.Mesh(new THREE.RingGeometry(0.42, 0.62, 24), tapRippleMat);
        tapRippleRing.rotation.x = -Math.PI / 2;
        tapRippleRing.visible = false;
        tapRippleRing.renderOrder = 4;
        scene.add(tapRippleRing);
        let tapRippleTimer = 0;

        let markerState = {
          visScale: 1.0,
          settlePopTimer: 0,
          lastTargetNodeId: callbacksRef.current.currentTargetNodeId
        };

        const getPlatformStandPos = (nodeId) => {
          const entry = nodeObjects[nodeId] || nodeObjects[1];
          if (entry.node.id === 19) {
            return new THREE.Vector3(
              entry.node.x + 0.25,
              entry.node.y + entry.surfaceY + 0.02,
              entry.node.z + 1.78
            );
          }
          return new THREE.Vector3(
            entry.node.x + 0.44,
            entry.node.y + entry.surfaceY + 0.02,
            entry.node.z + 0.54
          );
        };

        const getPlatformCenterPos = (nodeId) => {
          const entry = nodeObjects[nodeId] || nodeObjects[1];
          return new THREE.Vector3(
            entry.node.x,
            entry.node.y + entry.surfaceY + 0.02,
            entry.node.z
          );
        };

        const buildHolyRailNodes = () => {
          const rail = [];
          levelNodes.forEach((ln, idx) => {
            const entry = nodeObjects[ln.id];
            const stand = getPlatformStandPos(ln.id);
            const centerPt = new THREE.Vector3(ln.x, ln.y + entry.surfaceY + 0.02, ln.z);
            rail.push({ pos: stand, levelId: ln.id, isStand: true, isStair: false });
            rail.push({ pos: centerPt, levelId: ln.id, isStand: false, isStair: false });

            if (idx < levelNodes.length - 1) {
              const nxt = levelNodes[idx + 1];
              const edgeInfo = levelEdgeCurves[`${ln.id}_${nxt.id}`];
              if (edgeInfo && !edgeInfo.isGate && edgeInfo.stepPoints) {
                edgeInfo.stepPoints.forEach((sp) => {
                  rail.push({ pos: sp.clone(), levelId: ln.id, isStand: false, isStair: true });
                });
              }
            }
          });
          return rail;
        };

        const holyRailNodes = buildHolyRailNodes();

        const findNearestRailIndex = (pos, preferStandLevelId = null) => {
          if (typeof preferStandLevelId === 'number') {
            const standIdx = holyRailNodes.findIndex(r => r.isStand && r.levelId === preferStandLevelId);
            if (standIdx >= 0) return standIdx;
          }
          let bestIdx = 0;
          let minD = Infinity;
          holyRailNodes.forEach((r, idx) => {
            const d = r.pos.distanceTo(pos);
            if (d < minD) {
              minD = d;
              bestIdx = idx;
            }
          });
          return bestIdx;
        };

        const buildRailSegment = (startPos, toId, preferStandLevelId = null, endAtStand = true) => {
          if (typeof toId !== 'number') return [{ pos: getPlatformStandPos(toId), isStair: false }];
          const startIdx = findNearestRailIndex(startPos, preferStandLevelId);
          const centerIdx = holyRailNodes.findIndex(r => !r.isStand && !r.isStair && r.levelId === toId);
          const endIdx = (!endAtStand && centerIdx >= 0)
            ? centerIdx
            : findNearestRailIndex(getPlatformStandPos(toId), toId);

          if (startIdx === endIdx) {
            return [{ pos: holyRailNodes[endIdx].pos.clone(), isStair: Boolean(holyRailNodes[endIdx].isStair) }];
          }

          const pts = [];
          const dir = startIdx < endIdx ? 1 : -1;
          for (let i = startIdx + dir; dir > 0 ? i <= endIdx : i >= endIdx; i += dir) {
            const node = holyRailNodes[i];
            if (node.isStand && (!endAtStand || node.levelId !== toId)) continue;
            pts.push({ pos: node.pos.clone(), isStair: Boolean(node.isStair) });
          }
          const fallbackPos = endAtStand ? getPlatformStandPos(toId) : getPlatformCenterPos(toId);
          return pts.length > 0 ? pts : [{ pos: fallbackPos, isStair: false }];
        };

        const buildTransitionQueue = (fromId, toId, currentPos, isCurrentlyIdle) => {
          if (typeof fromId === 'number' && typeof toId === 'number' && fromId === toId) {
            return [{
              type: 'walk',
              waypoints: [currentPos.clone(), getPlatformStandPos(toId)]
            }];
          }

          if (typeof fromId === 'number' && typeof toId === 'number' && Math.abs(toId - fromId) === 1) {
            const lo = Math.min(fromId, toId);
            const hi = Math.max(fromId, toId);
            const edge = levelEdgeCurves[`${lo}_${hi}`];

            if (edge?.isGate) {
              const gateCfg = STAR_GATES_3D.find(g => g.fromId === lo && g.toId === hi);
              return [{
                type: 'photon',
                curve: edge.curve,
                reverse: toId < fromId,
                gateId: gateCfg ? gateCfg.id : null,
                endStandPos: getPlatformStandPos(toId),
                isExpress: false
              }];
            }

            return [{
              type: 'walk',
              waypoints: buildRailSegment(currentPos, toId, isCurrentlyIdle ? fromId : null, true)
            }];
          }

          return [{
            type: 'teleport',
            targetPos: getPlatformStandPos(toId)
          }];
        };

        const startNodeId = pendingWalkRef.current?.fromId ?? callbacksRef.current.currentTargetNodeId;
        const initStand = getPlatformStandPos(startNodeId);
        idaGroup.position.copy(initStand);

        const initTargetEntry = nodeObjects[callbacksRef.current.currentTargetNodeId] || nodeObjects[1];
        beaconGroup.position.set(
          initTargetEntry.node.x,
          initTargetEntry.node.y + initTargetEntry.surfaceY + initTargetEntry.propTopY + 0.42,
          initTargetEntry.node.z
        );

        const getPortraitZoomFactor = () => {
          const cw = container.clientWidth || 380;
          const ch = container.clientHeight || 700;
          const aspect = cw / ch;
          return aspect < 0.78 ? Math.min(1.36, 0.78 / Math.max(0.54, aspect)) : 1.0;
        };

        const computeAxisOverviewPos = () => {
          const dist = 62.6;
          const pitchRad = (10.2 * Math.PI) / 180;
          const yawOffset = (-6.7 * Math.PI) / 180;
          const horiz = dist * Math.cos(pitchRad);
          return new THREE.Vector3(
            defaultTarget.x + horiz * Math.sin(yawOffset),
            defaultTarget.y + dist * Math.sin(pitchRad),
            defaultTarget.z + horiz * Math.cos(yawOffset)
          );
        };

        const computeSeaView = (seaId) => {
          const seaCenter = SEA_CAMERA_CENTERS_3D[seaId] || SEA_CAMERA_CENTERS_3D[1];
          const zFactor = getPortraitZoomFactor();
          return {
            target: new THREE.Vector3(seaCenter.x, seaCenter.y + 0.2, seaCenter.z),
            pos: new THREE.Vector3(
              seaCenter.x + 1.6 * zFactor,
              seaCenter.y + 12.8 * zFactor,
              seaCenter.z + 23.5 * zFactor
            )
          };
        };

        let fogDensityTarget = 0.0115;
        let cameraMode = 'idle';
        let flightAnim = null;

        if (initialViewSnapshot && initialViewSnapshot.camPos && initialViewSnapshot.targetPos) {
          camera.position.set(initialViewSnapshot.camPos.x, initialViewSnapshot.camPos.y, initialViewSnapshot.camPos.z);
          controls.target.set(initialViewSnapshot.targetPos.x, initialViewSnapshot.targetPos.y, initialViewSnapshot.targetPos.z);
          controls.update();
          cameraTargetPos.copy(camera.position);
          controlsTargetPos.copy(controls.target);
        } else {
          const overviewPos = computeAxisOverviewPos();
          const startPos = new THREE.Vector3(overviewPos.x + 18, overviewPos.y + 26, overviewPos.z + 38);
          const midPos = new THREE.Vector3(overviewPos.x + 6, overviewPos.y + 11, overviewPos.z + 16);

          const camCurve = new THREE.CatmullRomCurve3([startPos, midPos, overviewPos]);
          const targetCurve = new THREE.CatmullRomCurve3([
            new THREE.Vector3(defaultTarget.x, defaultTarget.y + 5.5, defaultTarget.z),
            defaultTarget.clone()
          ]);

          camera.position.copy(startPos);
          controls.target.copy(targetCurve.getPoint(0));
          controls.update();
          cameraTargetPos.copy(overviewPos);
          controlsTargetPos.copy(defaultTarget);
          scene.fog.density = 0.025;
          fogDensityTarget = 0.0115;
          renderer.domElement.style.transition = 'none';
          renderer.domElement.style.filter = 'blur(6px)';
          controls.enabled = false;
          flightAnim = { active: true, elapsed: 0, frameCount: 0, startDelay: 0.16, blurTriggered: false, duration: 2.65, camCurve, targetCurve, isExit: false };
        }

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let pointerDownPos = { x: 0, y: 0 };
        let celebrateSpinTimer = 0;

        const beginNextSegment = (walkStateObj) => {
          const seg = walkStateObj.segQueue.shift();
          if (!seg) {
            walkStateObj.mode = 'idle';
            walkStateObj.waypoints = [];
            walkStateObj.settledNodeId = walkStateObj.lastTargetId;
            hidePhotonVisuals();
            teleportBeam.visible = false;
            idaGroup.visible = true;
            idaGroup.scale.set(1, 1, 1);
            if (walkStateObj.openDrawerOnArriveId !== undefined && walkStateObj.openDrawerOnArriveId !== null && walkStateObj.openDrawerOnArriveId === walkStateObj.settledNodeId) {
              const arrivedId = walkStateObj.openDrawerOnArriveId;
              walkStateObj.openDrawerOnArriveId = null;
              audio.sfxSelect();
              setFocusedNodeId(arrivedId);
              if (typeof arrivedId === 'number') {
                lastMainLevelRef.current = arrivedId;
                setLastMainLevelId(arrivedId);
              }
            }
            return;
          }

          if (seg.type === 'walk') {
            walkStateObj.mode = 'walk';
            walkStateObj.waypoints = seg.waypoints;
            walkStateObj.curIdx = 0;
            walkStateObj.segProgress = 0;
            walkStateObj.segStart.copy(idaGroup.position);
            walkStateObj.totalSteps = seg.waypoints.length;
            walkStateObj.completedSteps = 0;
            walkStateObj.stairStepCount = 0;
            hidePhotonVisuals();
            teleportBeam.visible = false;
            idaGroup.visible = true;
            cameraMode = 'followWalker';
          } else if (seg.type === 'photon') {
            walkStateObj.mode = 'photonOut';
            walkStateObj.photonTimer = 0;
            walkStateObj.photonSeg = seg;
            walkStateObj.photonStartPos.copy(idaGroup.position);
            walkStateObj.gatePulsed = false;
            teleportBeam.visible = false;
            idaGroup.visible = true;
            cameraMode = 'followWalker';
            audio.sfxTeleportOut();
          } else if (seg.type === 'teleport') {
            walkStateObj.mode = 'teleportOut';
            walkStateObj.teleportTimer = 0;
            walkStateObj.teleportTargetPos = seg.targetPos.clone();
            hidePhotonVisuals();
            idaGroup.visible = true;
            teleportBeam.visible = true;
            teleportBeam.position.set(idaGroup.position.x, idaGroup.position.y + 3.4, idaGroup.position.z);
            teleportBeamMat.opacity = 0.85;
            cameraMode = 'focusTarget';
            audio.sfxTeleportOut();
          }
        };

        const startWalkerTransition = (fromLvl, toLvl, walkStateObj) => {
          if (walkStateObj.mode !== 'idle' && walkStateObj.lastTargetId === toLvl) {
            cameraMode = 'focusTarget';
            return;
          }
          walkStateObj.lastTargetId = toLvl;
          if (fromLvl === toLvl && walkStateObj.mode === 'idle') {
            walkStateObj.mode = 'idle';
            walkStateObj.settledNodeId = toLvl;
            cameraMode = 'focusTarget';
            return;
          }

          const currentVisualPos = walkStateObj.mode === 'photonFly'
            ? photonGroup.position.clone()
            : idaGroup.position.clone();

          let effectiveFrom = fromLvl;
          if (walkStateObj.mode !== 'idle' && typeof toLvl === 'number') {
            const nearRailIdx = findNearestRailIndex(currentVisualPos, null);
            effectiveFrom = holyRailNodes[nearRailIdx]?.levelId ?? fromLvl;
          }

          idaGroup.position.copy(currentVisualPos);
          idaGroup.visible = true;
          idaGroup.scale.set(1, 1, 1);
          hidePhotonVisuals();
          teleportBeam.visible = false;

          const isIdleNow = walkStateObj.mode === 'idle';
          walkStateObj.segQueue = buildTransitionQueue(effectiveFrom, toLvl, currentVisualPos, isIdleNow);
          beginNextSegment(walkStateObj);
        };

        let walkState = {
          mode: 'idle',
          segQueue: [],
          waypoints: [],
          curIdx: 0,
          segProgress: 0,
          segStart: initStand.clone(),
          totalSteps: 0,
          completedSteps: 0,
          stairStepCount: 0,
          photonTimer: 0,
          photonSeg: null,
          photonStartPos: initStand.clone(),
          gatePulsed: false,
          teleportTimer: 0,
          teleportTargetPos: initStand.clone(),
          settledNodeId: startNodeId,
          lastTargetId: startNodeId,
          openDrawerOnArriveId: null
        };

        const handleSelectNode = (nodeId) => {
          const cb = callbacksRef.current;
          const entry = nodeObjects[nodeId];
          if (!entry) return;

          if (entry.node.kind === 'shrine') {
            audio.sfxSelect();
          } else {
            const lockStatus = cb.getLevelLockStatus(nodeId);
            if (!lockStatus.unlocked) {
              audio.sfxError();
              cb.onLockedAttempt(lockStatus.reason);
            } else {
              audio.sfxSelect();
            }
          }

          setFocusedNodeId(nodeId);
          setActiveSea(entry.node.sea);
          if (typeof nodeId === 'number') {
            lastMainLevelRef.current = nodeId;
            setLastMainLevelId(nodeId);
          }
          userInteracting = false;

          tapRippleRing.position.set(entry.node.x, entry.node.y + entry.surfaceY + 0.04, entry.node.z);
          tapRippleRing.scale.set(0.6, 0.6, 1);
          tapRippleMat.opacity = 0.95;
          tapRippleRing.visible = true;
          tapRippleTimer = 0.45;

          const fromNode = walkState.settledNodeId || cb.currentTargetNodeId;
          startWalkerTransition(fromNode, nodeId, walkState);

          const zFactor = getPortraitZoomFactor();
          cameraTargetPos.set(
            entry.node.x + 2.8 * zFactor,
            entry.node.y + 7.6 * zFactor,
            entry.node.z + 10.6 * zFactor
          );
          controlsTargetPos.set(
            entry.node.x,
            entry.node.y + 0.8,
            entry.node.z + 1.0
          );
          isTransitioning = true;
        };

        const onPointerMove = (e) => {
          const rect = renderer.domElement.getBoundingClientRect();
          mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
          mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
          raycaster.setFromCamera(mouse, camera);
          const hits = raycaster.intersectObjects([...idaInteractMeshes, ...islandMeshes]);
          renderer.domElement.style.cursor = hits.length > 0 ? 'pointer' : 'grab';
        };

        const onPointerDown = (e) => {
          audio.init();
          pointerDownPos = { x: e.clientX, y: e.clientY };
        };

        const onPointerUp = (e) => {
          const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
          if (dist > 7) return;
          const rect = renderer.domElement.getBoundingClientRect();
          mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
          mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
          raycaster.setFromCamera(mouse, camera);
          const idaHits = raycaster.intersectObjects(idaInteractMeshes);
          if (idaHits.length > 0) {
            audio.sfxIdaChirp();
            celebrateSpinTimer = 0.75;
            return;
          }
          const hits = raycaster.intersectObjects(islandMeshes);
          if (hits.length > 0) handleSelectNode(hits[0].object.userData.nodeId, { allowDirectEnter: true });
        };

        renderer.domElement.addEventListener('pointermove', onPointerMove);
        renderer.domElement.addEventListener('pointerdown', onPointerDown);
        renderer.domElement.addEventListener('pointerup', onPointerUp);

        sceneCtrlRef.current = {
          selectNode: handleSelectNode,
          walkAndOpenNode: (fromId, toId) => {
            const destEntry = nodeObjects[toId];
            if (!destEntry) return;
            setFocusedNodeId(null);
            setActiveSea(destEntry.node.sea);
            lastMainLevelRef.current = toId;
            setLastMainLevelId(toId);
            userInteracting = false;
            const effectiveFrom = nodeObjects[fromId] ? fromId : (walkState.settledNodeId || callbacksRef.current.currentTargetNodeId);
            if (effectiveFrom === toId && walkState.mode === 'idle') {
              audio.sfxSelect();
              setFocusedNodeId(toId);
            } else {
              walkState.openDrawerOnArriveId = toId;
              startWalkerTransition(effectiveFrom, toId, walkState);
            }
            const zFactor = getPortraitZoomFactor();
            cameraTargetPos.set(
              destEntry.node.x + 2.8 * zFactor,
              destEntry.node.y + 7.6 * zFactor,
              destEntry.node.z + 10.6 * zFactor
            );
            controlsTargetPos.set(
              destEntry.node.x,
              destEntry.node.y + 0.8,
              destEntry.node.z + 1.0
            );
            isTransitioning = true;
          },
          focusSea: (seaId) => {
            setFocusedNodeId(null);
            setActiveSea(seaId);
            cameraMode = 'focusTarget';
            userInteracting = false;

            if (seaId === 'all') {
              controlsTargetPos.copy(defaultTarget);
              cameraTargetPos.copy(computeAxisOverviewPos());
            } else {
              const seaView = computeSeaView(seaId);
              controlsTargetPos.copy(seaView.target);
              cameraTargetPos.copy(seaView.pos);
            }
            isTransitioning = true;
          },
          flyOutToClouds: () => {
            userInteracting = false;
            controls.enabled = false;
            const curCam = camera.position.clone();
            const curTgt = controls.target.clone();
            const exitEnd = new THREE.Vector3(curCam.x + 16, curCam.y + 24, curCam.z + 34);
            const exitMid = new THREE.Vector3(curCam.x + 6, curCam.y + 10, curCam.z + 15);
            const camCurve = new THREE.CatmullRomCurve3([curCam, exitMid, exitEnd]);
            const targetCurve = new THREE.CatmullRomCurve3([
              curTgt,
              new THREE.Vector3(curTgt.x, curTgt.y + 5.5, curTgt.z)
            ]);
            fogDensityTarget = 0.032;
            renderer.domElement.style.transition = 'filter 0.75s ease-in';
            renderer.domElement.style.filter = 'blur(7px)';
            flightAnim = { active: true, elapsed: 0, frameCount: 0, duration: 0.85, camCurve, targetCurve, isExit: true };
          },
          triggerCelebration: (lvlId) => {
            celebrateSpinTimer = 1.85;
            const targetEntry = nodeObjects[lvlId] || nodeObjects[callbacksRef.current.currentTargetNodeId] || nodeObjects[1];
            if (!targetEntry) return;
            const groundY = targetEntry.node.y + targetEntry.surfaceY + 0.15;
            const apexBaseY = targetEntry.node.y + targetEntry.surfaceY + targetEntry.propTopY + 2.5;
            [
              { delay: 0, sx: -0.3, sz: 0.3, dx: 0.0, dy: 0.0, dz: 0.0 },
              { delay: 320, sx: 0.4, sz: 0.2, dx: -0.95, dy: 0.75, dz: 0.35 },
              { delay: 650, sx: -0.2, sz: -0.3, dx: 0.95, dy: 0.95, dz: -0.35 }
            ].forEach((b) => {
              const tid = setTimeout(() => {
                if (!isDisposed) {
                  const startPos = new THREE.Vector3(targetEntry.node.x + b.sx, groundY, targetEntry.node.z + b.sz);
                  const apexPos = new THREE.Vector3(targetEntry.node.x + b.dx, apexBaseY + b.dy, targetEntry.node.z + b.dz);
                  launchFireworkRocket(startPos, apexPos);
                }
              }, b.delay);
              fireworkTimeouts.push(tid);
            });
          },
          getSnapshot: () => ({
            camPos: { x: camera.position.x, y: camera.position.y, z: camera.position.z },
            targetPos: { x: controls.target.x, y: controls.target.y, z: controls.target.z },
            focusedNodeId: focusedNodeIdRef.current,
            activeSea: activeSeaRef.current,
            lastMainLevelId: lastMainLevelRef.current,
            shipNodeId: callbacksRef.current.currentTargetNodeId
          })
        };
        if (mapCtrlRef) mapCtrlRef.current = sceneCtrlRef.current;

        let isDisposed = false;
        const fireworkTimeouts = [];
        const fireworkRockets = [];
        const fireworkSparks = [];
        const rocketGeo = new THREE.SphereGeometry(0.11, 8, 8);
        const sparkGeo = new THREE.OctahedronGeometry(0.11, 0);
        const sparkPalette = [0xfde047, 0x38bdf8, 0x34d399, 0xf472b6, 0xfb923c];

        const launchFireworkRocket = (startPos, apexPos) => {
          const mat = new THREE.MeshBasicMaterial({ color: 0xfef08a });
          const mesh = new THREE.Mesh(rocketGeo, mat);
          mesh.position.copy(startPos);
          mesh.renderOrder = 7;
          scene.add(mesh);
          fireworkRockets.push({
            mesh,
            mat,
            startPos: startPos.clone(),
            apexPos: apexPos.clone(),
            life: 0,
            maxLife: 0.42,
            emberTimer: 0
          });
          audio.sfxFireworkLaunch();
        };

        const spawnFireworkBurst = (originPos) => {
          audio.sfxFireworkBurst();
          for (let i = 0; i < 28; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const speed = 2.8 + Math.random() * 2.5;
            const mat = new THREE.MeshBasicMaterial({
              color: sparkPalette[Math.floor(Math.random() * sparkPalette.length)],
              transparent: true,
              opacity: 1
            });
            const mesh = new THREE.Mesh(sparkGeo, mat);
            mesh.position.copy(originPos);
            mesh.renderOrder = 7;
            scene.add(mesh);
            fireworkSparks.push({
              mesh,
              mat,
              vx: Math.sin(phi) * Math.cos(theta) * speed,
              vy: Math.cos(phi) * speed * 0.85 + 1.4,
              vz: Math.sin(phi) * Math.sin(theta) * speed,
              life: 0,
              maxLife: 1.05 + Math.random() * 0.35
            });
          }
        };

        const handleResize = () => {
          if (!container) return;
          const nw = container.clientWidth, nh = container.clientHeight;
          if (nw === 0 || nh === 0) return;
          camera.aspect = nw / nh;
          camera.updateProjectionMatrix();
          renderer.setSize(nw, nh);
        };
        const resizeObs = new ResizeObserver(handleResize);
        resizeObs.observe(container);
        window.addEventListener('resize', handleResize);

        const clock = new THREE.Clock();
        let rafId = null;
        let prevTime = 0;

        const animate = () => {
          rafId = requestAnimationFrame(animate);
          const t = clock.getElapsedTime();
          const dt = Math.min(0.05, Math.max(0.001, t - prevTime));
          prevTime = t;

          for (let i = fireworkRockets.length - 1; i >= 0; i--) {
            const rk = fireworkRockets[i];
            rk.life += dt;
            const p = Math.min(1, rk.life / rk.maxLife);
            const easeOut = 1 - Math.pow(1 - p, 2);
            rk.mesh.position.lerpVectors(rk.startPos, rk.apexPos, easeOut);
            rk.emberTimer += dt;
            if (rk.emberTimer >= 0.032) {
              rk.emberTimer = 0;
              const eMat = new THREE.MeshBasicMaterial({ color: 0xfde047, transparent: true, opacity: 0.85 });
              const eMesh = new THREE.Mesh(sparkGeo, eMat);
              eMesh.position.copy(rk.mesh.position);
              eMesh.scale.setScalar(0.55);
              eMesh.renderOrder = 6;
              scene.add(eMesh);
              fireworkSparks.push({
                mesh: eMesh,
                mat: eMat,
                vx: (Math.random() - 0.5) * 0.4,
                vy: -0.6,
                vz: (Math.random() - 0.5) * 0.4,
                life: 0,
                maxLife: 0.28
              });
            }
            if (p >= 1) {
              const burstPos = rk.apexPos.clone();
              scene.remove(rk.mesh);
              rk.mat.dispose();
              fireworkRockets.splice(i, 1);
              spawnFireworkBurst(burstPos);
            }
          }

          for (let i = fireworkSparks.length - 1; i >= 0; i--) {
            const sp = fireworkSparks[i];
            sp.life += dt;
            if (sp.life >= sp.maxLife) {
              scene.remove(sp.mesh);
              sp.mat.dispose();
              fireworkSparks.splice(i, 1);
              continue;
            }
            sp.vy -= 4.2 * dt;
            sp.mesh.position.x += sp.vx * dt;
            sp.mesh.position.y += sp.vy * dt;
            sp.mesh.position.z += sp.vz * dt;
            sp.mesh.rotation.x += dt * 5;
            sp.mesh.rotation.y += dt * 6;
            const prog = sp.life / sp.maxLife;
            sp.mat.opacity = Math.max(0, 1 - Math.pow(prog, 1.6));
            sp.mesh.scale.setScalar(Math.max(0.05, 1 - prog * 0.65));
          }

          animatedObjects.forEach(item => {
            if (item.type === 'spinZ') item.mesh.rotation.z = t * item.speed;
            else if (item.type === 'spinY') item.mesh.rotation.y = t * item.speed;
            else if (item.type === 'floatObj') {
              item.mesh.position.y = item.baseY + Math.sin(t * 2.2) * 0.12;
              item.mesh.rotation.y = t * 0.9;
            }
          });

          Object.values(nodeObjects).forEach((entry) => {
            const hoverOffset = Math.sin(t * 1.4 + entry.phaseOffset) * 0.055;
            entry.group.position.y = entry.baseY + hoverOffset;
          });

          starMat.opacity = 0.65 + Math.sin(t * 1.8) * 0.25;
          sparklePoints.rotation.y = t * 0.025;
          cloudGroups.forEach(c => {
            c.group.position.x = c.baseX + Math.sin(t * c.speed + c.phase) * 1.4;
          });

          if (tapRippleTimer > 0) {
            tapRippleTimer = Math.max(0, tapRippleTimer - dt);
            const rp = 1 - tapRippleTimer / 0.45;
            const sc = 0.6 + rp * 2.4;
            tapRippleRing.scale.set(sc, sc, 1);
            tapRippleMat.opacity = (1 - rp) * 0.9;
            if (tapRippleTimer <= 0) tapRippleRing.visible = false;
          }

          if (routeCurves.length > 0) {
            const totalSegs = routeCurves.length;
            flowOrbs.forEach(item => {
              const globalProg = (t * 0.08 + item.offset) % 1;
              const scaled = globalProg * totalSegs;
              const segIdx = Math.min(totalSegs - 1, Math.floor(scaled));
              const localT = scaled - segIdx;
              item.mesh.position.copy(routeCurves[segIdx].getPoint(localT));
              item.mesh.rotation.y = t * 2.5;
            });
          }

          const cb = callbacksRef.current;
          if (!pendingWalkRef.current && cb.currentTargetNodeId !== walkState.lastTargetId) {
            const fromNode = walkState.settledNodeId || walkState.lastTargetId;
            const toNode = cb.currentTargetNodeId;
            userInteracting = false;
            startWalkerTransition(fromNode, toNode, walkState);
            const destEntry = nodeObjects[toNode];
            if (destEntry) {
              const zFactor = getPortraitZoomFactor();
              cameraTargetPos.set(
                destEntry.node.x + 2.8 * zFactor,
                destEntry.node.y + 7.6 * zFactor,
                destEntry.node.z + 10.6 * zFactor
              );
              controlsTargetPos.set(
                destEntry.node.x,
                destEntry.node.y + 0.8,
                destEntry.node.z + 1.0
              );
            }
            isTransitioning = true;
          }

          if (walkState.mode === 'teleportOut') {
            walkState.teleportTimer += dt;
            const p = Math.min(1, walkState.teleportTimer / 0.34);
            idaGroup.scale.set(1 - p * 0.78, 1 + p * 0.85, 1 - p * 0.78);
            idaGroup.position.y += dt * 2.4;
            idaGroup.rotation.y += dt * 10;
            teleportBeamMat.opacity = (1 - p) * 0.85;

            if (p >= 1) {
              walkState.mode = 'teleportIn';
              walkState.teleportTimer = 0;
              const dest = walkState.teleportTargetPos;
              idaGroup.position.set(dest.x, dest.y + 3.8, dest.z);
              idaGroup.scale.set(0.35, 1.5, 0.35);
              teleportBeam.position.set(dest.x, dest.y + 3.4, dest.z);
              teleportBeamMat.opacity = 0.9;
              audio.sfxTeleportIn();
            }
          } else if (walkState.mode === 'teleportIn') {
            walkState.teleportTimer += dt;
            const p = Math.min(1, walkState.teleportTimer / 0.56);
            const easeOut = 1 - Math.pow(1 - p, 3);
            const dest = walkState.teleportTargetPos;
            idaGroup.position.set(dest.x, dest.y + (1 - easeOut) * 3.8, dest.z);
            const sXZ = 0.35 + easeOut * 0.65;
            const sY = 1.5 - easeOut * 0.5;
            idaGroup.scale.set(sXZ, sY, sXZ);
            idaGroup.rotation.y = (1 - easeOut) * Math.PI * 2;
            teleportBeamMat.opacity = (1 - p) * 0.85;

            if (p >= 1) {
              idaGroup.position.copy(dest);
              idaGroup.scale.set(1, 1, 1);
              idaGroup.rotation.set(0, 0, 0);
              teleportBeam.visible = false;
              beginNextSegment(walkState);
            }
          } else if (walkState.mode === 'photonOut') {
            walkState.photonTimer += dt;
            const seg = walkState.photonSeg;
            const p = Math.min(1, walkState.photonTimer / 0.28);
            const easeIn = p * p;
            const startU = seg.reverse ? 1 : 0;
            const entryPt = seg.curve.getPoint(startU);

            idaGroup.position.lerpVectors(walkState.photonStartPos, entryPt, easeIn);
            idaGroup.position.y += Math.sin(p * Math.PI) * 0.10;
            idaGroup.scale.setScalar(Math.max(0.15, 1 - easeIn * 0.85));
            idaGroup.rotation.y += dt * 3.5;

            photonGroup.visible = true;
            photonCore.scale.setScalar(1);
            photonHaloMat.opacity = 0.48 * Math.min(1, p * 1.4);
            photonRingMat.opacity = 0.85 * Math.min(1, p * 1.4);
            photonGroup.position.copy(idaGroup.position);
            photonGroup.position.y += 0.35 * (1 - p);
            photonGroup.scale.setScalar(0.28 + p * 0.72);
            photonCore.rotation.y = t * 3.2;
            photonRing.rotation.x = t * 2.4;

            if (p >= 1) {
              idaGroup.visible = false;
              walkState.mode = 'photonFly';
              walkState.photonTimer = 0;
            }
          } else if (walkState.mode === 'photonFly') {
            walkState.photonTimer += dt;
            const seg = walkState.photonSeg;
            const flyDur = 1.1;
            const p = Math.min(1, walkState.photonTimer / flyDur);
            const easeP = 0.5 - 0.5 * Math.cos(Math.PI * p);
            const u = seg.reverse ? 1 - easeP : easeP;
            const pos = seg.curve.getPoint(u);

            photonGroup.visible = true;
            photonCore.scale.setScalar(1);
            photonHaloMat.opacity = 0.48;
            photonRingMat.opacity = 0.85;
            photonGroup.position.copy(pos);
            photonGroup.scale.setScalar(1.0 + Math.sin(t * 4.5) * 0.04);
            photonCore.rotation.y = t * 3.2;
            photonRing.rotation.x = t * 2.4;
            photonRing.rotation.y = t * 1.8;

            photonTrail.forEach((tr, k) => {
              const trailP = p - (k + 1) * 0.026;
              if (trailP > 0) {
                const tEase = 0.5 - 0.5 * Math.cos(Math.PI * trailP);
                const tU = seg.reverse ? 1 - tEase : tEase;
                tr.mesh.visible = true;
                tr.mesh.position.copy(seg.curve.getPoint(tU));
                tr.mesh.scale.setScalar(0.95 - k * 0.12);
                const tailFade = 1 - Math.max(0, (p - 0.86) / 0.14);
                tr.mat.opacity = (1 - k / 6) * 0.72 * tailFade;
              } else {
                tr.mesh.visible = false;
              }
            });

            if (seg.gateId && !walkState.gatePulsed && p >= 0.46 && gateObjects[seg.gateId]) {
              walkState.gatePulsed = true;
              gateObjects[seg.gateId].pulseTimer = 0.48;
              audio.sfxBonus();
            }

            if (p >= 1) {
              const endU = seg.reverse ? 0 : 1;
              const exitPt = seg.curve.getPoint(endU);
              walkState.photonStartPos.copy(exitPt);
              walkState.photonTargetPos = seg.endStandPos ? seg.endStandPos.clone() : exitPt.clone();
              idaGroup.position.copy(exitPt);
              idaGroup.scale.setScalar(0.2);
              idaGroup.visible = true;
              walkState.mode = 'photonIn';
              walkState.photonTimer = 0;
              audio.sfxTeleportIn();
            }
          } else if (walkState.mode === 'photonIn') {
            walkState.photonTimer += dt;
            const p = Math.min(1, walkState.photonTimer / 0.32);
            const easeOut = 1 - Math.pow(1 - p, 3);
            idaGroup.position.lerpVectors(walkState.photonStartPos, walkState.photonTargetPos, easeOut);
            idaGroup.scale.setScalar(0.2 + easeOut * 0.8);
            idaGroup.rotation.y = (1 - easeOut) * Math.PI * 0.6;

            photonGroup.position.copy(idaGroup.position);
            photonGroup.position.y += 0.25 * (1 - p);
            photonGroup.scale.setScalar(1 + p * 0.55);
            photonCore.scale.setScalar(Math.max(0.01, 1 - p));
            photonHaloMat.opacity = 0.48 * (1 - p);
            photonRingMat.opacity = 0.85 * (1 - p);
            photonTrail.forEach(tr => {
              tr.mat.opacity *= 0.80;
              if (tr.mat.opacity < 0.03) tr.mesh.visible = false;
            });

            if (p >= 1) {
              idaGroup.position.copy(walkState.photonTargetPos);
              idaGroup.scale.set(1, 1, 1);
              idaGroup.rotation.set(0, 0, 0);
              photonCore.scale.setScalar(1);
              photonHaloMat.opacity = 0.48;
              photonRingMat.opacity = 0.85;
              hidePhotonVisuals();
              beginNextSegment(walkState);
            }
          } else if (walkState.mode === 'walk' && walkState.waypoints.length > 0 && walkState.curIdx < walkState.waypoints.length) {
            const currentWp = walkState.waypoints[walkState.curIdx];
            const targetPt = currentWp.pos;
            const segDist = Math.max(0.22, walkState.segStart.distanceTo(targetPt));

            const overallFrac = (walkState.completedSteps + walkState.segProgress) / Math.max(1, walkState.totalSteps);
            const easeEnvelope = 0.62 + 0.38 * Math.sin(overallFrac * Math.PI);
            const baseSpeed = 2.25;
            walkState.segProgress += (baseSpeed * easeEnvelope * dt) / segDist;

            if (walkState.segProgress >= 1) {
              if (currentWp.isStair) {
                const isAscending = targetPt.y >= walkState.segStart.y;
                audio.sfxStep(walkState.stairStepCount, isAscending);
                walkState.stairStepCount += 1;
              }
              idaGroup.position.copy(targetPt);
              walkState.segStart.copy(targetPt);
              walkState.curIdx += 1;
              walkState.completedSteps += 1;
              walkState.segProgress = 0;
              if (walkState.curIdx >= walkState.waypoints.length) {
                walkState.waypoints = [];
                beginNextSegment(walkState);
              }
            } else {
              const smoothSeg = walkState.segProgress * walkState.segProgress * (3 - 2 * walkState.segProgress);
              idaGroup.position.lerpVectors(walkState.segStart, targetPt, smoothSeg);

              const moveDx = targetPt.x - walkState.segStart.x;
              const moveDz = targetPt.z - walkState.segStart.z;
              if (Math.hypot(moveDx, moveDz) > 0.01) {
                const faceYaw = Math.atan2(moveDx, moveDz);
                let diff = faceYaw - idaGroup.rotation.y;
                while (diff > Math.PI) diff -= Math.PI * 2;
                while (diff < -Math.PI) diff += Math.PI * 2;
                idaGroup.rotation.y += diff * 0.14;
              }

              const stepVisualPhase = currentWp.isStair
                ? (walkState.stairStepCount + walkState.segProgress) * Math.PI
                : t * 6.2;
              const gentleLift = Math.abs(Math.sin(stepVisualPhase)) * (currentWp.isStair ? 0.055 : 0.032);
              idaGroup.position.y += gentleLift;
              idaGroup.rotation.x = 0.065;
              idaGroup.rotation.z = Math.sin(stepVisualPhase) * 0.045;
              hatPivot.rotation.z = Math.sin(stepVisualPhase - 0.4) * 0.04;
              leftLeg.rotation.x = Math.sin(stepVisualPhase) * 0.25;
              rightLeg.rotation.x = -Math.sin(stepVisualPhase) * 0.25;
            }
          } else {
            const standPos = getPlatformStandPos(cb.currentTargetNodeId);
            idaGroup.scale.lerp(new THREE.Vector3(1, 1, 1), 0.2);
            idaGroup.position.lerp(standPos, 0.14);
            idaGroup.rotation.x *= 0.84;
            idaGroup.rotation.z *= 0.84;
            hatPivot.rotation.z *= 0.86;
            leftLeg.rotation.x *= 0.84;
            rightLeg.rotation.x *= 0.84;

            if (celebrateSpinTimer > 0) {
              celebrateSpinTimer -= dt;
              idaGroup.rotation.y += dt * 8.5;
              idaGroup.position.y += Math.abs(Math.sin(celebrateSpinTimer * 8)) * 0.16;
            } else {
              let diff = 0 - idaGroup.rotation.y;
              while (diff > Math.PI) diff -= Math.PI * 2;
              while (diff < -Math.PI) diff += Math.PI * 2;
              idaGroup.rotation.y += diff * 0.10;
            }
          }

          if (flightAnim && flightAnim.active) {
            flightAnim.frameCount += 1;
            const stepDt = flightAnim.frameCount > 1 ? Math.min(0.033, dt) : 0;
            if (flightAnim.startDelay > 0) {
              flightAnim.startDelay = Math.max(0, flightAnim.startDelay - stepDt);
            } else {
              if (!flightAnim.isExit && !flightAnim.blurTriggered) {
                flightAnim.blurTriggered = true;
                renderer.domElement.style.transition = 'filter 1.35s ease-out';
                renderer.domElement.style.filter = 'blur(0px)';
              }
              flightAnim.elapsed += stepDt;
            }
            const rawP = Math.min(1, flightAnim.elapsed / flightAnim.duration);
            const p = flightAnim.isExit ? rawP * rawP : 1 - Math.pow(1 - rawP, 3);
            camera.position.copy(flightAnim.camCurve.getPoint(p));
            controls.target.copy(flightAnim.targetCurve.getPoint(p));
            if (rawP >= 1) {
              flightAnim.active = false;
              if (!flightAnim.isExit) {
                renderer.domElement.style.transition = 'none';
                renderer.domElement.style.filter = 'none';
                controls.enabled = true;
              }
            }
          } else if (!userInteracting) {
            const zFactor = getPortraitZoomFactor();
            if (cameraMode === 'followWalker') {
              const isMovingNow = walkState.mode === 'walk' || walkState.mode === 'photonOut' || walkState.mode === 'photonFly' || walkState.mode === 'photonIn';
              if (isMovingNow) {
                const activePos = walkState.mode === 'photonFly' ? photonGroup.position : idaGroup.position;
                const destEntry = nodeObjects[cb.currentTargetNodeId] || nodeObjects[1];
                let blendToCenter = 0;
                if (walkState.segQueue.length === 0) {
                  if (walkState.mode === 'walk') {
                    const overallFrac = (walkState.completedSteps + walkState.segProgress) / Math.max(1, walkState.totalSteps);
                    blendToCenter = overallFrac > 0.75 ? (overallFrac - 0.75) / 0.25 : 0;
                  } else if (walkState.mode === 'photonIn') {
                    blendToCenter = Math.min(1, walkState.photonTimer / 0.26);
                  }
                }
                const focusX = activePos.x * (1 - blendToCenter) + destEntry.node.x * blendToCenter;
                const focusY = (activePos.y + 0.55) * (1 - blendToCenter) + (destEntry.node.y + 0.8) * blendToCenter;
                const focusZ = activePos.z * (1 - blendToCenter) + (destEntry.node.z + 1.0) * blendToCenter;

                controlsTargetPos.set(focusX, focusY, focusZ);
                cameraTargetPos.set(
                  focusX + 2.8 * zFactor,
                  focusY + 6.9 * zFactor,
                  focusZ + 9.6 * zFactor
                );
                camera.position.lerp(cameraTargetPos, 0.12);
                controls.target.lerp(controlsTargetPos, 0.16);
              } else {
                const destEntry = nodeObjects[cb.currentTargetNodeId] || nodeObjects[1];
                controlsTargetPos.set(destEntry.node.x, destEntry.node.y + 0.8, destEntry.node.z + 1.0);
                cameraTargetPos.set(
                  destEntry.node.x + 2.8 * zFactor,
                  destEntry.node.y + 7.6 * zFactor,
                  destEntry.node.z + 10.6 * zFactor
                );
                camera.position.lerp(cameraTargetPos, 0.09);
                controls.target.lerp(controlsTargetPos, 0.12);
                if (camera.position.distanceTo(cameraTargetPos) < 0.05 && controls.target.distanceTo(controlsTargetPos) < 0.04) {
                  cameraMode = 'idle';
                  isTransitioning = false;
                }
              }
            } else if (cameraMode === 'focusTarget' || isTransitioning) {
              camera.position.lerp(cameraTargetPos, 0.085);
              controls.target.lerp(controlsTargetPos, 0.11);
              if (camera.position.distanceTo(cameraTargetPos) < 0.05 && controls.target.distanceTo(controlsTargetPos) < 0.04) {
                cameraMode = 'idle';
                isTransitioning = false;
              }
            }
          }

          lanternGlowMat.emissiveIntensity = 1.2 + Math.sin(t * 3.4) * 0.35;
          lanternPivot.rotation.z = Math.sin(t * 2.2) * 0.08;

          const ringPulse = (t * 0.85) % 1;
          idaBaseRing.scale.setScalar(0.85 + ringPulse * 0.65);
          idaBaseRingMat.opacity = (1 - ringPulse) * 0.72;

          const camDist = camera.position.distanceTo(controls.target);
          scene.fog.density += (fogDensityTarget - scene.fog.density) * Math.min(1, dt * 2.8);

          const seaBlend = Math.min(2, Math.max(0, (controls.target.y - 1.8) / 4.1));
          const fogColors = [new THREE.Color(0x091926), new THREE.Color(0x0b1126), new THREE.Color(0x160d2b)];
          const skyColors = [new THREE.Color(0xbae6fd), new THREE.Color(0xc7d2fe), new THREE.Color(0xe9d5ff)];
          if (seaBlend <= 1) {
            scene.fog.color.lerpColors(fogColors[0], fogColors[1], seaBlend);
            hemiLight.color.lerpColors(skyColors[0], skyColors[1], seaBlend);
          } else {
            scene.fog.color.lerpColors(fogColors[1], fogColors[2], seaBlend - 1);
            hemiLight.color.lerpColors(skyColors[1], skyColors[2], seaBlend - 1);
          }

          const targetEntry = nodeObjects[cb.currentTargetNodeId] || nodeObjects[1];
          const isWalkerSettled = walkState.mode === 'idle';

          if (!isWalkerSettled) {
            markerState.wasMoving = true;
            markerState.settlePopTimer = 0;
          } else if (markerState.wasMoving || markerState.lastTargetNodeId !== cb.currentTargetNodeId) {
            markerState.wasMoving = false;
            markerState.settlePopTimer = 0.65;
            markerState.lastTargetNodeId = cb.currentTargetNodeId;
          }

          if (markerState.settlePopTimer > 0) {
            markerState.settlePopTimer = Math.max(0, markerState.settlePopTimer - dt);
          }

          if (!targetEntry || !isWalkerSettled) {
            beaconGroup.visible = false;
          } else {
            beaconGroup.visible = true;
            const beaconDistScale = Math.min(2.2, Math.max(0.95, camDist / 20));
            const popFrac = markerState.settlePopTimer > 0 ? 1 - markerState.settlePopTimer / 0.65 : 1;
            const easeOut = 1 - Math.pow(1 - popFrac, 3);
            const dropOffset = (1 - easeOut) * 1.35;
            const arriveScale = 0.55 + easeOut * 0.45;
            const clearanceY = 0.42 + (beaconDistScale - 1) * 0.22;
            const finalScale = beaconDistScale * arriveScale;

            beaconPinMat.opacity = Math.min(1, easeOut * 1.15);
            beaconOrbitMat.opacity = 0.92 * Math.min(1, easeOut * 1.15);

            beaconGroup.scale.setScalar(finalScale);
            beaconGroup.position.set(
              targetEntry.group.position.x,
              targetEntry.group.position.y + targetEntry.surfaceY + targetEntry.propTopY + clearanceY + dropOffset + Math.sin(t * 2.8) * 0.10 * easeOut,
              targetEntry.group.position.z
            );
            beaconCrystal.rotation.y = t * 1.4;
            beaconOrbitRing.rotation.y = -t * 1.8;
            beaconOrbitRing.rotation.z = 0.25 + Math.sin(t * 1.6) * 0.15;

            beaconPulseRing.position.y = 0.04 - dropOffset / Math.max(0.1, finalScale);
            if (markerState.settlePopTimer > 0) {
              const ringFrac = Math.max(0, (popFrac - 0.35) / 0.65);
              const ringSc = 0.5 + ringFrac * 2.2;
              beaconPulseRing.scale.set(ringSc, ringSc, 1);
              beaconPulseMat.opacity = ringFrac > 0 ? (1 - ringFrac) * 0.85 : 0;
            } else {
              const pulseCycle = (t * 0.9) % 1;
              const pulseScale = 0.75 + pulseCycle * 1.8;
              beaconPulseRing.scale.set(pulseScale, pulseScale, 1);
              beaconPulseMat.opacity = (1 - pulseCycle) * 0.55;
            }
          }

          Object.values(gateObjects).forEach(gEntry => {
            const isOpen = cb.gameMode === 'free' || cb.adventureTotalStars >= gEntry.cfg.reqStars;
            gEntry.archMat.color.setHex(isOpen ? 0x10b981 : 0xf43f5e);
            gEntry.archMat.emissive.setHex(isOpen ? 0x10b981 : 0xf43f5e);
            if (gEntry.auraMat) gEntry.auraMat.color.setHex(isOpen ? 0x6ee7b7 : 0xfda4af);

            if (gEntry.pulseTimer > 0) {
              gEntry.pulseTimer = Math.max(0, gEntry.pulseTimer - dt);
              const pulse = Math.sin((1 - gEntry.pulseTimer / 0.48) * Math.PI);
              if (gEntry.archMesh) gEntry.archMesh.scale.setScalar(1 + pulse * 0.16);
              gEntry.archMat.emissiveIntensity = 0.95 + pulse * 1.4;
              if (gEntry.auraMat) gEntry.auraMat.opacity = 0.22 + pulse * 0.55;
            } else {
              if (gEntry.archMesh) gEntry.archMesh.scale.setScalar(1);
              gEntry.archMat.emissiveIntensity = 0.95;
              if (gEntry.auraMat) gEntry.auraMat.opacity = 0.22;
            }
          });

          Object.values(nodeObjects).forEach(entry => {
            if (entry.node.kind === 'level') {
              const unlocked = cb.getLevelLockStatus(entry.node.id).unlocked;
              const earned = cb.gameMode === 'adventure'
                ? ((cb.userProgress.stars && cb.userProgress.stars[entry.node.id]) || 0)
                : ((cb.userProgress.freeStars && cb.userProgress.freeStars[entry.node.id]) || 0);

              if (entry.starLampMats && entry.starLampMats.length > 0) {
                entry.starLampMats.forEach((lMat, sIdx) => {
                  if (earned >= sIdx + 1) {
                    lMat.color.setHex(0xfde047);
                    lMat.emissive.setHex(0xf59e0b);
                    lMat.emissiveIntensity = 1.15;
                  } else if (unlocked) {
                    lMat.color.setHex(0x475569);
                    lMat.emissive.setHex(0x1e293b);
                    lMat.emissiveIntensity = 0.25;
                  } else {
                    lMat.color.setHex(0x1e293b);
                    lMat.emissive.setHex(0x000000);
                    lMat.emissiveIntensity = 0;
                  }
                });
              }

              if (unlocked) {
                entry.bodyMat.color.setHex(entry.node.baseColor);
                entry.trimMat.color.setHex(entry.node.trimColor);
                entry.topMesh.material.color.setHex(entry.node.color);
                if (entry.plaqueMat) entry.plaqueMat.opacity = 1.0;
                entry.propMats.forEach(m => {
                  if (m.userData.isGlow) {
                    if (m.color) m.color.setHex(m.userData.origColor);
                    if (m.emissive) {
                      m.emissive.setHex(m.userData.origEmissive);
                      m.emissiveIntensity = m.userData.origIntensity;
                    }
                  } else if (m.color && m.userData.origColor !== undefined) {
                    m.color.setHex(m.userData.origColor);
                  }
                });
              } else {
                entry.bodyMat.color.setHex(0x1e293b);
                entry.trimMat.color.setHex(0x475569);
                entry.topMesh.material.color.setHex(0x334155);
                if (entry.plaqueMat) entry.plaqueMat.opacity = 0.45;
                entry.propMats.forEach(m => {
                  if (m.userData.isGlow) {
                    if (m.color) m.color.setHex(0x475569);
                    if (m.emissive) {
                      m.emissive.setHex(0x000000);
                      m.emissiveIntensity = 0;
                    }
                  } else if (m.color) {
                    m.color.setHex(0x64748b);
                  }
                });
              }
            }
          });

          controls.update();
          if (guidePinRef.current && mountRef.current && nodeObjects[1]) {
            const n1 = nodeObjects[1];
            const n1Apothem = n1.rad * Math.cos(Math.PI / n1.node.sides);
            const proj = new THREE.Vector3(n1.node.x, n1.node.y - 1.02, n1.node.z + n1Apothem + 0.08).project(camera);
            if (proj.z >= -1 && proj.z <= 1) {
              const sx = (proj.x * 0.5 + 0.5) * mountRef.current.clientWidth;
              const sy = (-proj.y * 0.5 + 0.5) * mountRef.current.clientHeight;
              guidePinRef.current.style.transform = `translate3d(${sx.toFixed(1)}px, ${sy.toFixed(1)}px, 0)`;
              guidePinRef.current.style.opacity = '1';
            } else {
              guidePinRef.current.style.opacity = '0';
            }
          }
          if (shrinePinRef.current && mountRef.current && nodeObjects['shrine_1']) {
            const s1 = nodeObjects['shrine_1'];
            const proj = new THREE.Vector3(s1.node.x, s1.node.y + s1.surfaceY * 0.72, s1.node.z + 0.35).project(camera);
            if (proj.z >= -1 && proj.z <= 1) {

              const sy = (-proj.y * 0.5 + 0.5) * mountRef.current.clientHeight;
              shrinePinRef.current.style.transform = `translate3d(${sx.toFixed(1)}px, ${sy.toFixed(1)}px, 0)`;

            } else {
              shrinePinRef.current.style.opacity = '0';
            }
          }
          renderer.render(scene, camera);
