<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="勇闖三角比聖域">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f172a">
  <title>勇闖三角比聖域</title>
  
  <!-- 載入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 載入 Google 字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">

  <!-- 載入 React, ReactDOM 與 Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- 載入 Three.js 與 OrbitControls (3D 微縮幾何聖域引擎) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <style>
    html, body {
      height: 100dvh;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .pt-safe {
      padding-top: max(0.5rem, env(safe-area-inset-top));
    }
    .pb-safe {
      padding-bottom: max(0.5rem, env(safe-area-inset-bottom));
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* 手遊立體 3D 糖果按鈕 */
    .btn-3d-yellow {
      background: linear-gradient(to bottom, #fde047, #eab308);
      border-bottom: 5px solid #a16207;
      transition: all 0.08s ease-in-out;
    }
    .btn-3d-yellow:active {
      transform: translateY(4px);
      border-bottom-width: 1px;
    }

    .btn-3d-blue {
      background: linear-gradient(to bottom, #60a5fa, #2563eb);
      border-bottom: 5px solid #1e40af;
      transition: all 0.08s ease-in-out;
    }
    .btn-3d-blue:active {
      transform: translateY(4px);
      border-bottom-width: 1px;
    }

    .btn-3d-green {
      background: linear-gradient(to bottom, #4ade80, #16a34a);
      border-bottom: 5px solid #166534;
      transition: all 0.08s ease-in-out;
    }
    .btn-3d-green:active {
      transform: translateY(4px);
      border-bottom-width: 1px;
    }

    .btn-3d-purple {
      background: linear-gradient(to bottom, #c084fc, #9333ea);
      border-bottom: 5px solid #6b21a8;
      transition: all 0.08s ease-in-out;
    }
    .btn-3d-purple:active {
      transform: translateY(4px);
      border-bottom-width: 1px;
    }

    /* 答錯按鈕閃紅特效 (0.35秒) */
    @keyframes btnFlashRed {
      0%, 100% { filter: brightness(1); }
      25%, 75% {
        background: linear-gradient(to bottom, #f87171, #dc2626) !important;
        border-color: #7f1d1d !important;
        color: #ffffff !important;
        box-shadow: 0 0 18px rgba(239, 68, 68, 0.95) !important;
        transform: scale(0.96);
      }
    }
    .btn-wrong-flash {
      animation: btnFlashRed 0.35s ease-in-out;
    }

    /* 果凍彈跳特效 */
    @keyframes jellyPop {
      0% { transform: scale(0.85); opacity: 0; }
      50% { transform: scale(1.06); opacity: 1; }
      75% { transform: scale(0.97); }
      100% { transform: scale(1); }
    }
    .animate-jelly {
      animation: jellyPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes arcSweep {
      from { stroke-dashoffset: 600; }
      to { stroke-dashoffset: 0; }
    }
    .animate-arc-sweep {
      stroke-dasharray: 600;
      stroke-dashoffset: 600;
      animation: arcSweep 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* 答錯晃動 */
    @keyframes shakeWrong {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .animate-shake {
      animation: shakeWrong 0.35s ease-in-out;
    }

    /* 答對向上飄浮浮光 */
    @keyframes popCorrect {
      0% { transform: scale(0.9); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    .animate-correct {
      animation: popCorrect 0.25s ease-out;
    }

    @keyframes floatUpFade {
      0% { opacity: 0; transform: translateY(4px) scale(0.85); }
      20% { opacity: 1; transform: translateY(-2px) scale(1.06); }
      100% { opacity: 0; transform: translateY(-16px) scale(0.95); }
    }
    .animate-float-up {
      animation: floatUpFade 0.85s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    @keyframes timePenaltyFade {
      0% { opacity: 0; transform: scale(0.75) translateY(2px); }
      18% { opacity: 1; transform: scale(1.08) translateY(0); }
      65% { opacity: 1; transform: scale(1) translateY(0); }
      100% { opacity: 0; transform: scale(0.92) translateY(-5px); }
    }
    .animate-time-penalty {
      animation: timePenaltyFade 0.85s ease-out forwards;
    }

    /* 卡牌進出場動畫 */
    @keyframes flyIn {
      0% { transform: perspective(600px) translate3d(0, -40px, 100px) rotateX(25deg) scale(0.75); opacity: 0; }
      55% { transform: perspective(600px) translate3d(0, 6px, 0px) rotateX(-6deg) scale(1.03); opacity: 1; }
      100% { transform: perspective(600px) translate3d(0, 0, 0) rotateX(0deg) scale(1); opacity: 1; }
    }
    @keyframes popOut {
      0% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 rgba(250,204,21,0); }
      40% { transform: scale(1.12); opacity: 1; filter: brightness(1.15); box-shadow: 0 0 20px rgba(250,204,21,0.95); border-color: rgb(250,204,21); }
      100% { transform: scale(0.5); opacity: 0.25; }
    }
    .animate-fly-in { animation: flyIn 0.36s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
    .animate-pop-out { animation: popOut 0.28s cubic-bezier(0.4, 0, 0.2, 1) forwards; pointer-events: none; }

    /* 實機引導：蘋果風格觸控圓點（Touch Puck）輕點與拖曳動畫 */
    @keyframes coachTapBob {
      0%, 100% { transform: scale(1.08); opacity: 0.92; }
      42% { transform: scale(0.8); opacity: 1; }
      72% { transform: scale(1.02); opacity: 0.96; }
    }
    .animate-coach-tap {
      animation: coachTapBob 1.25s cubic-bezier(0.32, 0.72, 0, 1) infinite;
    }
    @keyframes coachDragGlide {
      0% { transform: translate(0px, 0px) scale(1.18); opacity: 0; }
      12% { transform: translate(0px, 0px) scale(1); opacity: 0.95; }
      22% { transform: translate(0px, 0px) scale(0.8); opacity: 1; }
      72% { transform: translate(var(--dx, 0px), var(--dy, 80px)) scale(0.8); opacity: 1; }
      84% { transform: translate(var(--dx, 0px), var(--dy, 80px)) scale(1.08); opacity: 0.92; }
      100% { transform: translate(var(--dx, 0px), var(--dy, 80px)) scale(1.18); opacity: 0; }
    }
    .animate-coach-drag {
      animation: coachDragGlide 2.8s cubic-bezier(0.37, 0, 0.63, 1) infinite;
    }
    @keyframes coachDragArcRotate {
      0%, 22% { transform: rotate(0deg); }
      72%, 100% { transform: rotate(var(--arc-deg, -42deg)); }
    }
    @keyframes coachDragPress {
      0% { transform: scale(1.18); opacity: 0; }
      12% { transform: scale(1); opacity: 0.95; }
      22%, 72% { transform: scale(0.8); opacity: 1; }
      84% { transform: scale(1.08); opacity: 0.92; }
      100% { transform: scale(1.18); opacity: 0; }
    }
    .animate-coach-arc-rotate {
      animation: coachDragArcRotate 2.8s cubic-bezier(0.37, 0, 0.63, 1) infinite;
    }
    .animate-coach-arc-press {
      animation: coachDragPress 2.8s cubic-bezier(0.37, 0, 0.63, 1) infinite;
    }
    @keyframes lightSlotBreath {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 2px rgba(217, 119, 6, 0.35));
      }
      50% {
        transform: scale(1.06);
        filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.85));
      }
    }
    .animate-light-breath {
      transform-box: fill-box;
      transform-origin: center;
      animation: lightSlotBreath 1.45s ease-in-out infinite;
    }
    @keyframes resultStarSlam {
      0% { transform: scale(0.2) rotate(-28deg) translateY(10px); opacity: 0; }
      62% { transform: scale(1.24) rotate(6deg) translateY(-3px); opacity: 1; }
      82% { transform: scale(0.94) rotate(-2deg) translateY(0); opacity: 1; }
      100% { transform: scale(1) rotate(0deg) translateY(0); opacity: 1; }
    }
    .animate-result-star {
      opacity: 0;
      animation: resultStarSlam 0.56s cubic-bezier(0.22, 1.25, 0.36, 1) forwards;
    }

    /* Lv.10 動徑平滑生長與三角形淡入動畫 */
    @keyframes lv10GrowRay {
      0% { stroke-dashoffset: 360; opacity: 0.4; }
      100% { stroke-dashoffset: 0; opacity: 1; }
    }
    @keyframes lv10SoftFade {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
    .animate-lv10-ray {
      stroke-dasharray: 360;
      animation: lv10GrowRay 0.34s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .animate-lv10-fade {
      animation: lv10SoftFade 0.28s ease-out both;
    }

    /* Lv.7 星光泡泡爆破與背景閃爍動畫 */
    @keyframes starBurstRing {
      0% { transform: translate(-50%, -50%) scale(0.35); opacity: 0.95; }
      100% { transform: translate(-50%, -50%) scale(1.9); opacity: 0; }
    }
    .animate-star-ring {
      animation: starBurstRing 0.48s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes starBurstSpark {
      0% { transform: translate(-50%, -50%) translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -50%) translate(var(--tx), var(--ty)) scale(0.2); opacity: 0; }
    }
    .animate-star-spark {
      animation: starBurstSpark 0.46s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes twinkleStar {
      0%, 100% { opacity: 0.25; transform: scale(0.85); }
      50% { opacity: 0.9; transform: scale(1.2); }
    }
    .animate-twinkle {
      animation: twinkleStar var(--tw-dur, 3s) ease-in-out var(--tw-delay, 0s) infinite;
    }

    @keyframes slowSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-slow-spin {
      animation: slowSpin 26s linear infinite;
    }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    .animate-float-slow {
      animation: floatSlow 3.4s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-gradient-to-b from-sky-400 via-indigo-700 to-slate-950 h-[100dvh] w-full overflow-hidden text-slate-800 flex justify-center selection:bg-amber-300">

  <div id="root" class="w-full sm:max-w-md h-[100dvh] flex flex-col relative overflow-hidden bg-sky-400/20 sm:shadow-2xl"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // ==================== 共用 SVG 圖示元件 ====================
    const StarBadge = ({ filled, className = "w-6 h-6" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill={filled ? "#fbbf24" : "#334155"} stroke={filled ? "#b45309" : "#1e293b"} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`${className} transition-all duration-300 ${filled ? 'drop-shadow-[0_0_8px_rgba(251,191,36,0.9)] scale-110' : 'opacity-40'}`}>
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
      </svg>
    );

    // ==================== 即時教學糾錯與答對印證提示浮層（不推擠畫布高度） ====================
    const HintBanner = ({ tip }) => {
      if (!tip) return null;
      const isSuccess = tip.tone === 'success';
      return (
        <div
          key={tip.id}
          className={`absolute bottom-2 left-2 right-2 z-20 backdrop-blur-sm border-2 rounded-xl px-3 py-1.5 text-xs font-black flex items-center justify-between gap-2 shadow-md animate-jelly pointer-events-none ${
            isSuccess
              ? 'bg-emerald-50/95 border-emerald-400 text-emerald-950'
              : 'bg-amber-50/95 border-amber-400 text-amber-950'
          }`}
        >
          <div className="flex items-center gap-1.5 min-w-0">
            <span className="shrink-0">{isSuccess ? '✓' : '💡'}</span>
            <span className="truncate flex items-center gap-1">{tip.node || tip.text}</span>
          </div>
          {isSuccess && tip.canSkip && (
            <span className="text-[10px] font-bold text-emerald-700/80 shrink-0 whitespace-nowrap">{tip.skipLabel || '輕點繼續 ▸'}</span>
          )}
        </div>
      );
    };

    // ==================== 統一 24px 頂部階段說明細條（呼應 HUD 綠/藍/金三階段） ====================
    const StagePhaseStrip = ({ phase = 0, labels = [] }) => {
      const safePhase = Math.min(Math.max(0, phase), Math.max(0, labels.length - 1));
      const dotCls = safePhase === 0 ? 'bg-emerald-400' : safePhase === 1 ? 'bg-sky-400' : 'bg-amber-400';
      return (
        <div className="bg-slate-900/90 border-b border-white/10 h-6 px-3.5 flex items-center gap-1.5 text-[11px] font-bold text-slate-200 shrink-0">
          <span className={`w-1.5 h-1.5 rounded-full shrink-0 ${dotCls}`} />
          <span className="truncate">{labels[safePhase] || ''}</span>
        </div>
      );
    };

    // ==================== 課本標準帶頂線根式渲染元件 ====================
    const RadicalBox = ({ children }) => (
      <span className="inline-flex items-stretch leading-none align-baseline mx-[0.04em]">
        <svg
          viewBox="0 0 11 20"
          preserveAspectRatio="none"
          className="w-[0.62em] shrink-0 overflow-visible self-stretch"
          aria-hidden="true"
        >
          <path
            d="M 0.8 11.8 L 3.1 10.3 L 5.8 18.2 L 10.6 0.9 L 11.5 0.9"
            fill="none"
            stroke="currentColor"
            strokeWidth="1.65"
            strokeLinecap="round"
            strokeLinejoin="round"
          />
        </svg>
        <span className="border-t-[1.5px] border-current pt-[0.08em] px-[0.1em] leading-[1.06] inline-flex items-center">
          {children}
        </span>
      </span>
    );

    const SqrtText = ({ text, className = '' }) => {
      const str = String(text ?? '');
      if (!str.includes('√')) {
        return className ? <span className={className}>{str}</span> : <>{str}</>;
      }
      const parts = [];
      const regex = /√\(([^)]+)\)|√([0-9a-zA-Zθ]+)/g;
      let lastIndex = 0;
      let match;
      let keyIdx = 0;
      while ((match = regex.exec(str)) !== null) {
        if (match.index > lastIndex) {
          parts.push(<React.Fragment key={`t-${keyIdx++}`}>{str.slice(lastIndex, match.index)}</React.Fragment>);
        }
        const radicand = match[1] !== undefined ? match[1] : match[2];
        parts.push(<RadicalBox key={`r-${keyIdx++}`}>{radicand}</RadicalBox>);
        lastIndex = regex.lastIndex;
      }
      if (lastIndex < str.length) {
        parts.push(<React.Fragment key={`t-${keyIdx++}`}>{str.slice(lastIndex)}</React.Fragment>);
      }
      return <span className={`inline-flex items-center flex-wrap gap-0 ${className}`}>{parts}</span>;
    };

    // ==================== 共用直式分數渲染元件 ====================
    const FracText = ({ value, size = 'md', barClass = 'bg-current', className = '' }) => {
      const str = String(value ?? '');
      if (!str.includes('/')) {
        return (
          <span className={`inline-flex items-center justify-center font-serif ${className}`}>
            <SqrtText text={str} />
          </span>
        );
      }
      const isNeg = str.startsWith('-');
      const clean = isNeg ? str.slice(1) : str;
      const [num, den] = clean.split('/');
      const textCls =
        size === 'lg' ? 'text-lg leading-[1.1]' :
        size === 'sm' ? 'text-[11px] sm:text-xs leading-[1.05]' :
        'text-xs sm:text-sm leading-[1.05]';
      const barCls =
        size === 'lg' ? 'h-[2px] my-[2px]' :
        size === 'sm' ? 'h-[1.5px] my-[1px]' :
        'h-[1.5px] my-[1.5px]';
      return (
        <span className={`inline-flex items-center justify-center gap-0.5 font-serif ${className}`}>
          {isNeg && <span className={size === 'lg' ? 'text-lg font-black' : 'text-xs font-black'}>−</span>}
          <span className={`inline-flex flex-col items-center justify-center ${textCls}`}>
            <span className="px-0.5"><SqrtText text={num} /></span>
            <span className={`w-full rounded-full ${barCls} ${barClass}`} />
            <span className="px-0.5"><SqrtText text={den} /></span>
          </span>
        </span>
      );
    };

    // ==================== 全域遊戲模式 Context（闖關 vs 休閒） ====================
    const GameModeContext = React.createContext({
      isRelaxMode: false,
      debugPhase: null,
      hasSeenHudLifeGuide: false,
      markHudLifeGuideSeen: () => {}
    });

    // ==================== 共用遊戲頂部 HUD（支援新版餘命制與舊版計時制） ====================
    const GameHUD = ({
      score, combo, timeLeft, maxTime, starsThreshold, isDojo = false, extraRight = null, timeStatusLabel = null, onManualEnd = null,
      lives, maxLives = 4, healStreak = 0, healTarget = 4, progress = 0, unitLabel = '題', onOpenGuide = null
    }) => {
      const { isRelaxMode, hasSeenHudLifeGuide, markHudLifeGuideSeen } = React.useContext(GameModeContext);
      const relaxActive = isRelaxMode && !isDojo;
      const isLivesMode = lives !== undefined;
      const [scorePop, setScorePop] = useState(null);
      const [timePop, setTimePop] = useState(null);
      const [barFlash, setBarFlash] = useState(false);
      const [comboBurstId, setComboBurstId] = useState(0);
      const [lifeDeltaAnim, setLifeDeltaAnim] = useState(''); // 'lose' | 'heal' | ''
      const [showHudLifeTip, setShowHudLifeTip] = useState(false);
      const [hudLifeRect, setHudLifeRect] = useState(null);
      const lifeGroupRef = useRef(null);
      const prevScoreRef = useRef(score);
      const prevTimeRef = useRef(timeLeft);
      const prevComboRef = useRef(combo);
      const prevLivesRef = useRef(lives);

      useEffect(() => {
        if (!isLivesMode) return;
        if (prevLivesRef.current !== undefined && lives !== prevLivesRef.current) {
          const anim = lives < prevLivesRef.current ? 'lose' : 'heal';
          setLifeDeltaAnim(anim);
          const t = setTimeout(() => setLifeDeltaAnim(''), 420);
          let tipTimer = null;
          if (anim === 'lose' && !relaxActive && !hasSeenHudLifeGuide) {
            tipTimer = setTimeout(() => {
              setShowHudLifeTip(true);
              if (markHudLifeGuideSeen) markHudLifeGuideSeen();
            }, 440);
          }
          prevLivesRef.current = lives;
          return () => {
            clearTimeout(t);
            if (tipTimer) clearTimeout(tipTimer);
          };
        }
        prevLivesRef.current = lives;
      }, [lives, isLivesMode, relaxActive, hasSeenHudLifeGuide, markHudLifeGuideSeen]);

      useEffect(() => {
        if (!showHudLifeTip) {
          setHudLifeRect(null);
          return;
        }
        const updateRect = () => {
          const el = lifeGroupRef.current;
          if (!el) return;
          const r = el.getBoundingClientRect();
          if (r.width === 0 || r.height === 0) return;
          setHudLifeRect({
            left: r.left,
            top: r.top,
            right: r.right,
            bottom: r.bottom,
            width: r.width,
            height: r.height,
            vw: window.innerWidth,
            vh: window.innerHeight
          });
        };
        const raf = requestAnimationFrame(updateRect);
        window.addEventListener('resize', updateRect);
        return () => {
          cancelAnimationFrame(raf);
          window.removeEventListener('resize', updateRect);
        };
      }, [showHudLifeTip]);

      useEffect(() => {
        if (isLivesMode) return;
        const diff = score - prevScoreRef.current;
        if (diff > 0) {
          const id = Date.now() + Math.random();
          setScorePop({ diff, id });
          const timer = setTimeout(() => setScorePop(prev => prev?.id === id ? null : prev), 850);
          prevScoreRef.current = score;
          return () => clearTimeout(timer);
        }
        prevScoreRef.current = score;
      }, [score, isLivesMode]);

      useEffect(() => {
        if (isLivesMode) return;
        const drop = +(prevTimeRef.current - timeLeft).toFixed(2);
        if (drop >= 0.4) {
          const id = Date.now() + Math.random();
          setTimePop({ sec: drop, id });
          setBarFlash(true);
          const flashTimer = setTimeout(() => setBarFlash(false), 350);
          const timer = setTimeout(() => setTimePop(prev => prev?.id === id ? null : prev), 880);
          prevTimeRef.current = timeLeft;
          return () => { clearTimeout(flashTimer); clearTimeout(timer); };
        }
        prevTimeRef.current = timeLeft;
      }, [timeLeft, isLivesMode]);

      useEffect(() => {
        if (isLivesMode) return;
        if ((prevComboRef.current < 3 && combo >= 3) || (prevComboRef.current < 6 && combo >= 6)) {
          setComboBurstId(c => c + 1);
        }
        prevComboRef.current = combo;
      }, [combo, isLivesMode]);

      if (isLivesMode) {
        const s1 = starsThreshold ? starsThreshold[0] : 3;

                {[1, 2, 3].map((starIdx) => {
                  const earned = curStarsCount >= starIdx;
                  return (
                    <div key={starIdx} className={`transition-transform duration-300 ${earned ? 'scale-110 animate-jelly' : 'scale-95 opacity-60'}`}>

              <div className="flex items-center gap-2">
                {extraRight}
                {relaxActive ? (

                      {Array.from({ length: count }).map((_, qIdx) => {

      const mult = combo >= 6 ? 1.5 : combo >= 3 ? 1.2 : 1.0;

                <div key={comboBurstId} className={`flex items-center gap-2 shrink-0 ${comboBurstId > 0 ? 'animate-jelly' : ''}`}>
                  <div className="flex items-center gap-2 px-0.5" aria-label={`連擊充能 ${combo}`}>
                    {[0, 1, 2].map((i) => (
                      <span
                        key={i}
                        className={`w-2.5 h-2.5 rotate-45 rounded-[2px] border transition-all duration-200 ${i < activePips ? activePipClass : 'bg-slate-200 border-slate-300'}`}
                      />

          {!relaxActive && (
            <>
              <div className={`w-full bg-slate-200 rounded-full h-2 overflow-hidden border relative shadow-inner transition-colors ${barFlash ? 'border-red-500 ring-2 ring-red-400/50' : 'border-slate-300'}`}>
                <div
                  className={`h-full rounded-full transition-all duration-100 ease-linear ${barFlash ? 'bg-red-500' : timeLeft < 10 ? 'bg-red-500 animate-pulse' : 'bg-sky-500'}`}
                  style={{ width: `${Math.min(100, Math.max(0, (timeLeft / maxTime) * 100))}%` }}
                ></div>
              </div>
              <div className="flex justify-between items-center text-[9px] font-black text-slate-500 uppercase -mt-0.5 px-0.5 leading-none">
                <span className="flex items-center gap-1.5">
                  <span>倒數 {Math.ceil(timeLeft)} 秒 {timeStatusLabel}</span>
                  {timePop && (
                    <span key={timePop.id} className="px-1.5 py-0.5 rounded-md bg-red-500 text-white text-[9px] font-mono font-black leading-none animate-time-penalty pointer-events-none">
                      -{timePop.sec}s
                    </span>
                  )}
                </span>
                <span>滿時 {maxTime} 秒</span>
              </div>
            </>
          )}

          {!isDojo && starsThreshold && (
            <div className="w-full relative h-2.5 bg-slate-200 rounded-full border border-slate-300 mt-0.5">
              <div
                className="absolute top-0 left-0 h-full bg-gradient-to-r from-amber-300 to-amber-500 rounded-full transition-all duration-300"
                style={{ width: `${Math.min(100, (score / starsThreshold[2]) * 100)}%` }}
              ></div>
              {[0, 1, 2].map((i) => {
                const perc = (starsThreshold[i] / starsThreshold[2]) * 100;
                return (
                  <div key={i} className="absolute top-1/2 -translate-y-1/2 -ml-2" style={{ left: `${perc}%` }}>
                    <StarBadge filled={score >= starsThreshold[i]} className="w-3.5 h-3.5" />
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    };

    // ==================== 共用進關：精簡星等列 & 餘命制 Session Hook ====================
    const CompactStarPills = ({ starsThreshold = [3, 7, 12], maxTime, livesMode = false, maxLives = 4, unitLabel = '題' }) => {
      const { isRelaxMode } = React.useContext(GameModeContext);
      return (
      <div className="w-full space-y-1.5">
        <div className="text-[11px] font-black text-slate-400 tracking-wider text-center">
          {isRelaxMode ? '🌱 休閒達標' : livesMode ? `❤️ ×${maxLives} 餘命 • 無限時` : `⏱️ ${maxTime} 秒挑戰`}
        </div>
        <div className="grid grid-cols-3 gap-1.5">
          {[
            { stars: '⭐', color: 'text-emerald-600 bg-emerald-50 border-emerald-200', val: starsThreshold[0] },
            { stars: '⭐⭐', color: 'text-blue-600 bg-blue-50 border-blue-200', val: starsThreshold[1] },
            { stars: '⭐⭐⭐', color: 'text-purple-600 bg-purple-50 border-purple-200', val: starsThreshold[2] }
          ].map((item, idx) => (
            <div key={idx} className={`rounded-xl border px-2 py-2 flex flex-col items-center justify-center ${item.color}`}>
              <span className="text-[11px] leading-none">{item.stars}</span>
              <span className="font-mono font-black text-xs mt-1">{livesMode ? `${item.val} ${unitLabel}` : item.val}</span>
            </div>
          ))}
        </div>
      </div>
      );
    };

    const useLivesLevelSession = ({
      starThresholds = [4, 8, 12],
      maxLives = 4,
      healTarget = 4,
      unitLabel = '題',
      currentStars = 0,
      onUpdateStars
    }) => {
      const { isRelaxMode, debugPhase } = React.useContext(GameModeContext);
      const [gameState, setGameState] = useState('idle');
      const [progress, setProgress] = useState(0);
      const [lives, setLives] = useState(maxLives);
      const [healStreak, setHealStreak] = useState(0);
      const [correctCount, setCorrectCount] = useState(0);
      const [wrongCount, setWrongCount] = useState(0);
      const [elapsedSec, setElapsedSec] = useState(0);
      const startTimeRef = useRef(Date.now());
      const endTimerRef = useRef(null);
      const questionMissedRef = useRef(false);

      useEffect(() => () => { if (endTimerRef.current) clearTimeout(endTimerRef.current); }, []);

      const earnedStars = useMemo(() => {
        if (progress >= starThresholds[2]) return 3;
        if (progress >= starThresholds[1]) return 2;
        if (progress >= starThresholds[0]) return 1;
        return 0;
      }, [progress, starThresholds]);

      const baseScore = progress * 100;
      const lifeBonus = (!isRelaxMode && earnedStars >= 1) ? lives * 100 : 0;
      const accuracyBonus = !isRelaxMode
        ? (earnedStars >= 3
            ? Math.max(0, 300 - wrongCount * 60)
            : earnedStars === 2
            ? Math.max(0, 150 - wrongCount * 30)
            : 0)
        : 0;
      const speedBonus = (!isRelaxMode && earnedStars >= 3 && progress > 0)
        ? (() => {
            const avgSec = elapsedSec / progress;
            const targetSec = unitLabel === '波' ? 20 : 8;
            const slope = unitLabel === '波' ? 20 : 50;
            return Math.min(300, Math.max(0, Math.round((targetSec - avgSec) * slope)));
          })()
        : 0;
      const finalScore = baseScore + lifeBonus + accuracyBonus + speedBonus;

      useEffect(() => {
        if (gameState === 'ended' && earnedStars > 0 && onUpdateStars) {
          onUpdateStars(earnedStars, finalScore);
        }
      }, [gameState, earnedStars, finalScore]);

      const finishNow = useCallback(() => {
        const sec = Math.max(0.1, +((Date.now() - startTimeRef.current) / 1000).toFixed(1));
        setElapsedSec(sec);
        setGameState('ended');
      }, []);

      const startSession = useCallback(() => {
        if (endTimerRef.current) clearTimeout(endTimerRef.current);
        const initProg = debugPhase === 2 ? starThresholds[1] : debugPhase === 1 ? starThresholds[0] : 0;
        setProgress(initProg);
        setLives(maxLives);
        setHealStreak(0);
        setCorrectCount(0);
        setWrongCount(0);
        setElapsedSec(0);
        startTimeRef.current = Date.now();
        questionMissedRef.current = false;
        setGameState('playing');
        return initProg;
      }, [maxLives, debugPhase, starThresholds]);

      const recordCorrect = useCallback(({ wasMissed = false, delayEndMs = 460 } = {}) => {
        questionMissedRef.current = false;
        const nextProg = progress + 1;
        setProgress(nextProg);
        setCorrectCount(c => c + 1);
        if (!wasMissed && !isRelaxMode) {
          const nextHeal = healStreak + 1;
          if (nextHeal >= healTarget) {
            if (lives < maxLives) {
              setLives(l => Math.min(maxLives, l + 1));
              audio.sfxHealLife();
            } else {
              audio.sfxHealCharge(healTarget - 1);
            }
            setHealStreak(0);
          } else {
            if (lives < maxLives) audio.sfxHealCharge(nextHeal - 1);
            setHealStreak(nextHeal);
          }
        }
        if (nextProg >= starThresholds[2]) {
          audio.sfxBonus();
          if (delayEndMs !== null && delayEndMs !== undefined) {
            endTimerRef.current = setTimeout(finishNow, delayEndMs);
          }
          return { completed: true, nextProgress: nextProg };
        }
        return { completed: false, nextProgress: nextProg };
      }, [progress, healStreak, healTarget, lives, maxLives, isRelaxMode, starThresholds, finishNow]);

      const recordWrong = useCallback(({ delayEndMs = 450, capPerQuestion = true } = {}) => {
        if (capPerQuestion && questionMissedRef.current) {
          return { gameOver: false, nextLives: lives, capped: true };
        }
        questionMissedRef.current = true;
        setWrongCount(w => w + 1);
        setHealStreak(0);
        if (isRelaxMode) return { gameOver: false, nextLives: maxLives };
        const nextLives = Math.max(0, lives - 1);
        setLives(nextLives);
        if (nextLives <= 0) {
          audio.sfxLoseLife();
          setTimeout(() => audio.sfxTimeUp(), 260);
          endTimerRef.current = setTimeout(finishNow, delayEndMs);
          return { gameOver: true, nextLives: 0 };
        }
        audio.sfxLoseLife();
        return { gameOver: false, nextLives };
      }, [isRelaxMode, lives, maxLives, finishNow]);

      return {
        gameState, setGameState, progress, lives, maxLives, healStreak, healTarget,
        correctCount, wrongCount, elapsedSec, earnedStars, baseScore, lifeBonus, accuracyBonus, speedBonus, finalScore,
        startSession, recordCorrect, recordWrong, finishNow
      };
    };

    const FractionOrderButtons = ({ onStartWithOrder }) => (
      <div className="w-full space-y-1.5">
        <div className="text-[11px] font-black text-slate-400 tracking-wider text-center">選擇順序直接開局</div>

          </button>

          <button

          >
            <div className="flex flex-col items-center">
              <div className="w-12 h-5 rounded-md border-2 border-dashed border-white/60 bg-white/10 text-white/80 text-[10px] font-bold flex items-center justify-center">② 分子</div>
              <div className="w-14 h-0.5 bg-white/80 my-1"></div>
              <div className="w-12 h-5 rounded-md bg-amber-300 border-2 border-white text-indigo-950 text-[10px] font-black flex items-center justify-center shadow-sm">① 分母</div>
            </div>
            <span className="text-sm tracking-wide">🚀 先選分母</span>
          </button>
        </div>
      </div>
    );

    // ==================== 答對完成 ✓ 徽章 & 共用挑戰結算統計卡 ====================
    const SuccessBadge = ({ show }) => {
      if (!show) return null;
      return (
        <span className="inline-flex items-center justify-center w-6 h-6 rounded-full bg-emerald-400 text-emerald-950 font-black text-sm shadow-md border-2 border-white animate-jelly shrink-0">
          ✓
        </span>
      );
    };

    const ResultStarsShowcase = ({ earnedStars = 0 }) => {
      const [litCount, setLitCount] = useState(0);
      useEffect(() => {
        setLitCount(0);
        if (earnedStars <= 0) return;
        const timers = [];
        for (let i = 1; i <= earnedStars; i++) {
          timers.push(setTimeout(() => {
            setLitCount(i);
            if (i === earnedStars) audio.sfxBonus();
            else audio.sfxSelect();
          }, 180 + (i - 1) * 240));
        }
        return () => timers.forEach(clearTimeout);
      }, [earnedStars]);

      const slots = [
        { idx: 1, sizeCls: 'w-11 h-11', posCls: '-rotate-6 translate-y-1' },
        { idx: 2, sizeCls: 'w-14 h-14', posCls: '-translate-y-1.5' },
        { idx: 3, sizeCls: 'w-11 h-11', posCls: 'rotate-6 translate-y-1' }
      ];

      return (
        <div className={`relative flex flex-col items-center justify-center rounded-2xl py-2.5 px-4 mb-3 border ${
          earnedStars >= 3
            ? 'bg-gradient-to-b from-amber-50 via-yellow-50/70 to-white border-amber-300/80 shadow-inner'
            : earnedStars >= 1
            ? 'bg-gradient-to-b from-amber-50/70 to-white border-amber-200/70'
            : 'bg-slate-50/70 border-slate-200'
        }`}>
          {earnedStars >= 1 && (
            <div className={`text-[10px] font-black tracking-widest uppercase px-3 py-0.5 rounded-full mb-2 border shadow-sm ${
              earnedStars >= 3
                ? 'bg-gradient-to-r from-amber-400 to-yellow-300 text-amber-950 border-amber-500'
                : 'bg-amber-100 text-amber-800 border-amber-300'
            }`}>
              {earnedStars >= 3 ? '★ PERFECT CLEAR! ★' : 'STAGE CLEAR!'}
            </div>
          )}
          <div className="flex items-end justify-center gap-3 py-1">
            {slots.map(({ idx, sizeCls, posCls }) => {
              const isFilled = earnedStars >= idx;
              const isLit = litCount >= idx;
              return (
                <div key={idx} className={`relative flex items-center justify-center ${posCls}`}>
                  {isFilled && isLit && (
                    <span className="pointer-events-none absolute left-1/2 top-1/2 w-10 h-10 rounded-full border-2 border-amber-400 animate-star-ring" />
                  )}
                  <div className={isFilled ? (isLit ? 'animate-result-star drop-shadow-[0_4px_10px_rgba(245,158,11,0.5)]' : 'opacity-0 scale-50') : 'opacity-80'}>
                    <StarBadge filled={isFilled && isLit} className={sizeCls} />
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    };

    const LevelResultScreen = ({
      score,
      baseScore = 0,
      earnedStars = 0,
      maxCombo = 0,
      correctCount = 0,
      wrongCount = 0,
      maxTime = 60,
      isDojo = false,
      accentClass = 'text-indigo-600',
      lives,
      progress,
      targetTotal,
      unitLabel = '題',
      elapsedSec = 0,
      lifeBonus = 0,
      accuracyBonus = 0,
      speedBonus = 0,
      onCompleteLevel,
      onRestart,
      onBackToMap
    }) => {
      const { isRelaxMode, getNextLevelForResult } = React.useContext(GameModeContext);
      const relaxActive = isRelaxMode && !isDojo;
      const isLivesMode = lives !== undefined;
      const bonusScore = isLivesMode ? (lifeBonus + speedBonus) : Math.max(0, score - baseScore);
      const totalAttempts = correctCount + wrongCount;
      const accuracy = totalAttempts > 0 ? Math.round((correctCount / totalAttempts) * 100) : 0;
      const avgSec = correctCount > 0 ? (maxTime / correctCount).toFixed(1) : '--';
      const nextLevelObj = !isDojo && earnedStars >= 1 && getNextLevelForResult ? getNextLevelForResult(earnedStars) : null;

      const renderActionButtons = () => (
        <div className="w-full space-y-2 mt-auto pt-2">
          {!isDojo && earnedStars >= 1 ? (
            nextLevelObj ? (
              <>
                <button
                  onClick={() => onCompleteLevel(earnedStars, score, true)}
                  className="w-full py-3.5 btn-3d-yellow text-amber-950 font-black text-base rounded-2xl shadow-xl"
                >
                  ▶ 下一關：Lv.{nextLevelObj.id} {nextLevelObj.title}
                </button>
                <button
                  onClick={() => onCompleteLevel(earnedStars, score, false)}
                  className="w-full py-2 text-xs font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl"
                >
                  🗺️ 返回聖域地圖
                </button>
              </>
            ) : (
              <button
                onClick={() => onCompleteLevel(earnedStars, score, false)}
                className="w-full py-3.5 btn-3d-yellow text-amber-950 font-black text-base rounded-2xl shadow-xl"
              >
                🏆 結算並返回地圖
              </button>
            )
          ) : (
            <>
              <button onClick={onRestart} className="w-full py-3.5 btn-3d-green text-white font-black text-base rounded-2xl shadow-xl">🔄 再挑戰一次！</button>
              <button onClick={onBackToMap} className="w-full py-2 text-xs font-bold text-slate-500 bg-slate-100 rounded-xl">返回聖域地圖</button>
            </>
          )}
        </div>
      );

      if (isLivesMode) {
        const outOfLives = !relaxActive && lives <= 0;
        return (
          <div className="flex-1 my-3 bg-white/95 rounded-3xl border-4 border-indigo-950 p-4 shadow-2xl flex flex-col justify-between items-center text-center animate-jelly overflow-y-auto no-scrollbar">
            <div className="w-full">
              <div className={`text-xs font-black uppercase tracking-widest mb-1 ${outOfLives ? 'text-rose-600' : accentClass}`}>
                {relaxActive
                  ? (earnedStars >= 3 ? '★ 達成三星畢業！' : '🌱 休閒練習結束')
                  : outOfLives
                  ? (earnedStars >= 1 ? '💔 餘命耗盡（保留星等）' : '💔 餘命耗盡，再接再厲')
                  : '👑 達成三星完美通關！'}
              </div>
              <h3 className="text-2xl font-black text-indigo-950 mb-2">{relaxActive ? '休閒練習結算' : '試煉結算'}</h3>

              <ResultStarsShowcase earnedStars={earnedStars} />

              <div className="bg-slate-100 rounded-2xl p-3 border-2 border-slate-200 w-full mb-2.5">
                <div className="text-[11px] text-slate-500 font-bold">榮譽榜總分（星等僅看答對{unitLabel}數）</div>
                <div className="text-4xl font-black font-mono text-indigo-950 leading-tight">{score}</div>
                <div className="flex items-center justify-center gap-1.5 mt-1.5 flex-wrap">
                  <span className="text-[10px] font-black bg-white border border-slate-200 text-slate-600 px-2 py-0.5 rounded-lg font-mono">
                    答對 {baseScore}
                  </span>
                  {lifeBonus > 0 && (
                    <span className="text-[10px] font-black bg-rose-100 border border-rose-300 text-rose-800 px-2 py-0.5 rounded-lg font-mono">
                      ❤️ 餘命 +{lifeBonus}
                    </span>
                  )}
                  {accuracyBonus > 0 && (
                    <span className="text-[10px] font-black bg-emerald-100 border border-emerald-300 text-emerald-800 px-2 py-0.5 rounded-lg font-mono">
                      🎯 精準 +{accuracyBonus}
                    </span>
                  )}
                  {speedBonus > 0 && (
                    <span className="text-[10px] font-black bg-amber-100 border border-amber-300 text-amber-800 px-2 py-0.5 rounded-lg font-mono">
                      ⚡ 效率 +{speedBonus}
                    </span>
                  )}
                </div>
              </div>

              <div className="grid grid-cols-3 gap-2 w-full text-left mb-3">
                <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-2.5 text-center">
                  <div className="text-[10px] font-black text-emerald-700">完成進度</div>
                  <div className="text-sm font-black font-mono text-emerald-950 mt-0.5">{progress}/{targetTotal}{unitLabel}</div>
                </div>
                <div className="bg-rose-50 border border-rose-200 rounded-xl p-2.5 text-center">
                  <div className="text-[10px] font-black text-rose-700">剩餘愛心</div>
                  <div className="text-sm font-black font-mono text-rose-950 mt-0.5">{relaxActive ? '∞ 無限' : `❤️ ×${lives}`}</div>
                </div>
                <div className="bg-sky-50 border border-sky-200 rounded-xl p-2.5 text-center">
                  <div className="text-[10px] font-black text-sky-700">本次耗時</div>
                  <div className="text-sm font-black font-mono text-sky-950 mt-0.5">{elapsedSec.toFixed(1)}s</div>
                </div>
              </div>
              <div className="text-[11px] font-bold text-slate-500">正確率 {accuracy}%（{correctCount} 對 / {wrongCount} 錯）</div>
            </div>

            {renderActionButtons()}
          </div>
        );
      }

      return (
        <div className="flex-1 my-3 bg-white/95 rounded-3xl border-4 border-indigo-950 p-4 shadow-2xl flex flex-col justify-between items-center text-center animate-jelly overflow-y-auto no-scrollbar">
          <div className="w-full">
            <div className={`text-xs font-black uppercase tracking-widest mb-1 ${accentClass}`}>
              {relaxActive ? (earnedStars >= 3 ? '★ 達成三星畢業！' : '🌱 休閒練習結束') : 'TIME UP! 時間到'}
            </div>
            <h3 className="text-2xl font-black text-indigo-950 mb-2">{isDojo ? '修行結算' : relaxActive ? '休閒練習結算' : '挑戰結算'}</h3>

            {!isDojo && <ResultStarsShowcase earnedStars={earnedStars} />}

            <div className="bg-slate-100 rounded-2xl p-3 border-2 border-slate-200 w-full mb-2.5">
              <div className="text-[11px] text-slate-500 font-bold">最終總分</div>
              <div className="text-4xl font-black font-mono text-indigo-950 leading-tight">{score}</div>
              <div className="flex items-center justify-center gap-2 mt-1.5 flex-wrap">
                <span className="text-[10px] font-black bg-white border border-slate-200 text-slate-600 px-2 py-0.5 rounded-lg font-mono">
                  基礎 {baseScore}
                </span>
                {bonusScore > 0 && (
                  <span className="text-[10px] font-black bg-amber-100 border border-amber-300 text-amber-800 px-2 py-0.5 rounded-lg font-mono">
                    🔥 連擊/獎勵 +{bonusScore}
                  </span>
                )}
              </div>
            </div>

            <div className="grid grid-cols-2 gap-2 w-full text-left mb-3">
              <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-2.5">
                <div className="text-[10px] font-black text-emerald-700">答對 / 答錯</div>
                <div className="text-sm font-black font-mono text-emerald-950 mt-0.5">{correctCount} 對 / {wrongCount} 錯</div>
              </div>
              <div className="bg-sky-50 border border-sky-200 rounded-xl p-2.5">
                <div className="text-[10px] font-black text-sky-700">正確率</div>
                <div className="text-sm font-black font-mono text-sky-950 mt-0.5">{accuracy}%</div>
              </div>
              {!relaxActive && (
                <>
                  <div className="bg-amber-50 border border-amber-200 rounded-xl p-2.5">
                    <div className="text-[10px] font-black text-amber-700">最高連擊</div>
                    <div className="text-sm font-black font-mono text-amber-950 mt-0.5">{maxCombo} COMBO</div>
                  </div>
                  <div className="bg-purple-50 border border-purple-200 rounded-xl p-2.5">
                    <div className="text-[10px] font-black text-purple-700">平均速度</div>
                    <div className="text-sm font-black font-mono text-purple-950 mt-0.5">{avgSec} 秒/題</div>
                  </div>
                </>
              )}
            </div>
          </div>

          {renderActionButtons()}
        </div>
      );
    };

    // ==================== 關卡引導模式 Hook（首次進場自動聚光引導一次；? 按鈕開啟純文字步驟卡） ====================
    const useLevelGuide = (currentStars, hasSeenGuide = false, onMarkGuideSeen = null) => {
      const [guideMode, setGuideMode] = useState(() => (!hasSeenGuide && currentStars === 0 ? 'spotlight' : null));
      const dismissGuide = useCallback(() => {
        setGuideMode(null);
        if (onMarkGuideSeen) onMarkGuideSeen();
      }, [onMarkGuideSeen]);
      const openGuide = useCallback(() => setGuideMode('manual'), []);
      return {
        showGuide: guideMode === 'spotlight',
        guideMode,
        openGuide,
        dismissGuide
      };
    };

    // ==================== 多步驟關卡共用：分段接力實機引導 Hook（Just-in-Time） ====================
    const useStagedLevelGuide = ({ currentStars, hasSeenGuide = false, onMarkGuideSeen = null, activeStageKey = null, phase = 0, enabled = true, finalStageKey = null }) => {
      const [guideMode, setGuideMode] = useState(null); // 'spotlight' | 'manual' | null
      const guidedStagesRef = useRef({});
      const skippedPhasesRef = useRef({});
      const skipAllOnMountRef = useRef(hasSeenGuide || currentStars > 0);

      // 「跳過」僅跳過同 Phase 的其他引導；「開始 ✓」僅關閉當下這一步氣泡
      const dismissGuide = useCallback((isSkip = false) => {
        setGuideMode(null);
        if (isSkip) {
          skippedPhasesRef.current[phase] = true;
        }
      }, [phase]);

      const openGuide = useCallback(() => setGuideMode('manual'), []);

      useEffect(() => {
        if (!enabled || !activeStageKey || skipAllOnMountRef.current || skippedPhasesRef.current[phase] || guideMode === 'manual') return;
        if (!guidedStagesRef.current[activeStageKey]) {
          guidedStagesRef.current[activeStageKey] = true;
          setGuideMode('spotlight');
          if (finalStageKey && activeStageKey === finalStageKey && onMarkGuideSeen) {
            onMarkGuideSeen();
          }
        }
      }, [enabled, activeStageKey, phase, guideMode, finalStageKey, onMarkGuideSeen]);

      return {
        showGuide: guideMode === 'spotlight',
        guideMode,
        openGuide,
        dismissGuide
      };
    };

    // ==================== 極簡手遊風：SVG 羽化多點聚光燈 + 蘋果觸控圓點 + 純文字步驟卡 ====================
    const CoachOverlay = ({ containerRef, active, mode = 'spotlight', steps = [], onDismiss }) => {
      const [stepIdx, setStepIdx] = useState(0);
      const [ready, setReady] = useState(false);
      const [secondaryReady, setSecondaryReady] = useState(false);
      const [layout, setLayout] = useState(null);

      useEffect(() => {
        if (!active) {
          setStepIdx(0);
          setReady(false);
          setSecondaryReady(false);
          setLayout(null);
          return;
        }
        if (mode === 'manual') {
          setReady(true);
          return;
        }
        // 等待外層 animate-jelly (0.4s) 結束後再量測顯示，避免一開始微移
        const t = setTimeout(() => setReady(true), 410);
        return () => clearTimeout(t);
      }, [active, mode]);

      useEffect(() => {
        if (!ready || mode === 'manual') {
          setSecondaryReady(false);
          return;
        }
        setSecondaryReady(false);
        const t = setTimeout(() => setSecondaryReady(true), 220);
        return () => clearTimeout(t);
      }, [ready, stepIdx, mode]);

      useEffect(() => {
        if (!active || !ready || mode === 'manual' || !containerRef?.current || steps.length === 0) return;
        const collectBoxes = (stepObj, root, rr) => {
          if (!stepObj) return [];
          const targetDefs = stepObj.targets || [stepObj];
          const out = [];
          for (const def of targetDefs) {
            const targetId = def.target || def.id;
            const targetEl = targetId ? root.querySelector(`[data-coach="${targetId}"]`) : null;
            if (!targetEl) continue;
            const tr = targetEl.getBoundingClientRect();
            if (tr.width === 0 && tr.height === 0) continue;
            const pad = def.pad ?? 6;
            const cx = tr.left - rr.left + tr.width * (def.anchorX ?? 0.5);
            const cy = tr.top - rr.top + tr.height * (def.anchorY ?? 0.5);

            let left, top, width, height;
            if (def.minW || def.minH) {
              width = Math.min(Math.max(def.minW ?? 0, tr.width + pad * 2), rr.width - 12);
              height = Math.min(Math.max(def.minH ?? 0, tr.height + pad * 2), rr.height - 12);
              left = Math.max(6, Math.min(rr.width - width - 6, cx - width / 2));
              top = Math.max(6, Math.min(rr.height - height - 6, cy - height / 2));
            } else {
              left = Math.max(4, tr.left - rr.left - pad);
              top = Math.max(4, tr.top - rr.top - pad);
              width = Math.min(rr.width - left - 4, tr.width + pad * 2);
              height = Math.min(rr.height - top - 4, tr.height + pad * 2);
            }
            out.push({ left, top, width, height, cx, cy, shape: def.shape || stepObj.shape || 'pill' });
          }
          return out;
        };

        const measure = () => {
          const root = containerRef.current;
          if (!root) return;
          const rr = root.getBoundingClientRect();
          if (rr.width === 0 || rr.height === 0) return;

          const curIdx = Math.min(stepIdx, steps.length - 1);
          const cur = steps[curIdx];
          const boxes = collectBoxes(cur, root, rr);
          let pivot = null;
          if (cur?.arcPivot) {
            const pvEl = root.querySelector(`[data-coach="${cur.arcPivot}"]`);
            if (pvEl) {
              const pr = pvEl.getBoundingClientRect();
              pivot = { cx: pr.left - rr.left + pr.width / 2, cy: pr.top - rr.top + pr.height / 2 };
            }
          }
          setLayout({ boxes, pivot, rootW: rr.width, rootH: rr.height });
        };

        const raf = requestAnimationFrame(measure);
        const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(measure) : null;
        if (ro && containerRef.current) ro.observe(containerRef.current);
        window.addEventListener('resize', measure);
        return () => {
          cancelAnimationFrame(raf);
          if (ro) ro.disconnect();
          window.removeEventListener('resize', measure);
        };
      }, [active, ready, stepIdx, steps, containerRef]);

      if (!active || !ready || steps.length === 0) return null;

      // 遊戲中點擊「?」：純文字步驟卡（不聚光、不抓 DOM 元件、不漏答案）
      if (mode === 'manual') {
        return (
          <div
            onClick={onDismiss}
            className="pointer-events-auto absolute inset-0 z-40 overflow-hidden rounded-3xl bg-slate-950/60 backdrop-blur-[2px] flex items-center justify-center p-4"
          >
            <div
              onClick={(e) => e.stopPropagation()}
              className="w-full max-w-[330px] bg-slate-900/95 border border-white/15 rounded-3xl p-4 shadow-2xl flex flex-col gap-3 animate-fly-in"
            >
              <div className="flex items-center justify-between gap-2 border-b border-white/10 pb-2.5">
                <div className="flex items-center gap-2">
                  <span className="w-6 h-6 rounded-full bg-sky-500/20 border border-sky-400/40 text-sky-300 text-xs font-black flex items-center justify-center">?</span>
                  <span className="text-sm font-black text-white tracking-wide">玩法與步驟說明</span>
                </div>
                <button
                  onClick={onDismiss}
                  className="w-6 h-6 rounded-full bg-white/10 hover:bg-white/20 text-slate-300 hover:text-white text-xs font-black flex items-center justify-center transition-colors"
                  aria-label="關閉說明"
                >
                  ✕
                </button>
              </div>
              <div className="flex flex-col gap-2.5">
                {steps.map((s, idx) => (
                  <div key={idx} className="flex items-start gap-2.5 bg-white/5 border border-white/10 rounded-2xl px-3 py-2">
                    <span className="w-5 h-5 rounded-full bg-sky-400/20 text-sky-300 text-[11px] font-mono font-black flex items-center justify-center shrink-0 mt-0.5">
                      {idx + 1}
                    </span>
                    <span className="text-[13px] font-bold text-slate-100 leading-snug">{s.desc || s.text}</span>
                  </div>
                ))}
              </div>
              <button
                onClick={onDismiss}
                className="w-full py-2.5 rounded-2xl bg-sky-500 hover:bg-sky-400 text-slate-950 font-black text-xs tracking-wide shadow-lg active:scale-[0.98] transition-all"
              >
                我知道了，繼續挑戰 ✓
              </button>
            </div>
          </div>
        );
      }

      const curIdx = Math.min(stepIdx, steps.length - 1);
      const curStep = steps[curIdx];
      const isLast = curIdx === steps.length - 1;
      const boxes = layout?.boxes || [];
      const primary = boxes[0];
      const secondary = boxes[1];
      const showBelow = primary ? (primary.top + primary.height / 2) < layout.rootH * 0.48 : true;
      const caretX = primary ? Math.max(24, Math.min(layout.rootW - 44, primary.cx - 10)) : 120;

      let bubbleStyle = {};
      let showCaret = true;
      if (curStep.placement === 'top') {
        showCaret = false;
        bubbleStyle = { top: '12px' };
      } else if (curStep.placement === 'bottom') {
        showCaret = false;
        bubbleStyle = { bottom: '12px' };
      } else if (layout && curStep.drag && primary && secondary) {
        showCaret = false;
        bubbleStyle = primary.top > layout.rootH * 0.62 ? { top: '12px' } : { bottom: '12px' };
      } else if (layout && primary) {
        if (showBelow) {
          let targetTop = Math.min(layout.rootH - 96, primary.top + primary.height + 12);
          if (secondary && secondary.top < targetTop + 88 && (secondary.top + secondary.height) > targetTop - 6) {
            targetTop = Math.min(layout.rootH - 96, secondary.top + secondary.height + 12);
            showCaret = false;
          }
          bubbleStyle = { top: `${targetTop}px` };
        } else {
          bubbleStyle = { bottom: `${Math.min(layout.rootH - 96, layout.rootH - primary.top + 12)}px` };
        }
      } else if (layout) {
        showCaret = false;
        bubbleStyle = { top: '50%', transform: 'translateY(-50%)' };
      }

      return (
        <div className="pointer-events-none absolute inset-0 z-40 overflow-hidden rounded-3xl">
          {/* SVG 羽化聚光燈遮罩（第 2 道追光從主聚光位置柔和滑向目標角） */}
          {layout && (
            <svg className="absolute inset-0 w-full h-full" viewBox={`0 0 ${layout.rootW} ${layout.rootH}`} preserveAspectRatio="none">
              <defs>
                <filter id="coachFeather" x="-45%" y="-45%" width="190%" height="190%">
                  <feGaussianBlur stdDeviation="8" />
                </filter>
                <mask id="coachSpotlightMask">
                  <rect x="0" y="0" width={layout.rootW} height={layout.rootH} fill="white" />
                  {boxes.map((b, i) => {
                    const useStart = i > 0 && !secondaryReady && primary;
                    const drawBox = useStart
                      ? { left: primary.cx - 24, top: primary.cy - 24, width: 48, height: 48, shape: b.shape }
                      : b;
                    const transStyle = {
                      transition: 'all 0.55s cubic-bezier(0.22, 1, 0.36, 1)'
                    };
                    return (drawBox.shape === 'circle' || drawBox.shape === 'ellipse') ? (
                      <ellipse
                        key={i}
                        cx={drawBox.left + drawBox.width / 2}

    const AUDIO_PREFS_KEY = 'trig_audio_prefs_v1';

    class AudioEngine {
      constructor() {
        this.ctx = null;
        this.stepNoiseBuf = null;
        this.fwNoiseBuf = null;
        this.sfxGain = null;
        this.bgmGain = null;
        this.bgmFilter = null;
        this.bgmScene = 'map';
        this.isDucked = false;
        this.bgmTimer = null;
        this.nextNoteTime = 0;
        this.bgmStep = 0;

        const saved = this.loadPrefs();
        this.bgmEnabled = saved.bgmEnabled;
        this.bgmVolume = saved.bgmVolume;
        this.sfxEnabled = saved.sfxEnabled;
        this.sfxVolume = saved.sfxVolume;

        if (typeof document !== 'undefined') {
          document.addEventListener('visibilitychange', () => {
            if (!this.ctx) return;
            if (document.hidden) {
              if (this.ctx.state === 'running') this.ctx.suspend().catch(() => {});
            } else if (this.bgmEnabled || this.sfxEnabled) {
              this.ctx.resume().then(() => {
                if (this.ctx) this.nextNoteTime = this.ctx.currentTime + 0.08;
              }).catch(() => {});
            }
          });
        }
      }

      get enabled() {
        return this.sfxEnabled;
      }

      loadPrefs() {
        const defaults = { bgmEnabled: true, bgmVolume: 0.7, sfxEnabled: true, sfxVolume: 0.85 };
        try {
          const raw = window.localStorage.getItem(AUDIO_PREFS_KEY);
          if (!raw) return defaults;
          const p = JSON.parse(raw);
          return {
            bgmEnabled: typeof p.bgmEnabled === 'boolean' ? p.bgmEnabled : defaults.bgmEnabled,
            bgmVolume: typeof p.bgmVolume === 'number' ? Math.min(1, Math.max(0, p.bgmVolume)) : defaults.bgmVolume,
            sfxEnabled: typeof p.sfxEnabled === 'boolean' ? p.sfxEnabled : defaults.sfxEnabled,
            sfxVolume: typeof p.sfxVolume === 'number' ? Math.min(1, Math.max(0, p.sfxVolume)) : defaults.sfxVolume
          };
        } catch (e) {
          return defaults;
        }
      }

      savePrefs() {
        try {
          window.localStorage.setItem(AUDIO_PREFS_KEY, JSON.stringify(this.getPrefs()));
        } catch (e) {}
      }

      getPrefs() {
        return {
          bgmEnabled: this.bgmEnabled,
          bgmVolume: this.bgmVolume,
          sfxEnabled: this.sfxEnabled,
          sfxVolume: this.sfxVolume
        };
      }

      getSfxDest() {
        return this.sfxGain || (this.ctx ? this.ctx.destination : null);
      }

      syncGains(rampSec = 0.12) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        if (this.sfxGain) {
          const targetSfx = this.sfxEnabled ? this.sfxVolume * 1.35 : 0;
          this.sfxGain.gain.cancelScheduledValues(now);
          this.sfxGain.gain.setValueAtTime(this.sfxGain.gain.value, now);
          this.sfxGain.gain.linearRampToValueAtTime(targetSfx, now + rampSec);
        }
        if (this.bgmGain && this.bgmFilter) {
          const duckMult = this.isDucked ? 0.58 : 1.0;
          const targetBgm = this.bgmEnabled ? this.bgmVolume * 0.13 * duckMult : 0;
          const targetFreq = this.isDucked ? 640 : (this.bgmScene === 'playing' ? 1550 : 1120);
          this.bgmGain.gain.cancelScheduledValues(now);
          this.bgmGain.gain.setValueAtTime(this.bgmGain.gain.value, now);
          this.bgmGain.gain.linearRampToValueAtTime(targetBgm, now + rampSec);
          this.bgmFilter.frequency.cancelScheduledValues(now);
          this.bgmFilter.frequency.setValueAtTime(this.bgmFilter.frequency.value, now);
          this.bgmFilter.frequency.linearRampToValueAtTime(targetFreq, now + rampSec);
        }
      }

      setAudioPrefs(patch) {
        if (typeof patch.bgmEnabled === 'boolean') this.bgmEnabled = patch.bgmEnabled;
        if (typeof patch.bgmVolume === 'number') this.bgmVolume = Math.min(1, Math.max(0, patch.bgmVolume));
        if (typeof patch.sfxEnabled === 'boolean') this.sfxEnabled = patch.sfxEnabled;
        if (typeof patch.sfxVolume === 'number') this.sfxVolume = Math.min(1, Math.max(0, patch.sfxVolume));
        this.savePrefs();
        this.syncGains(0.08);
        if (this.bgmEnabled && this.ctx && !this.bgmTimer) {
          this.startBgm();
        }
      }

      setBgmScene(scene) {
        if (this.bgmScene === scene) return;
        this.bgmScene = scene;
        this.bgmStep = 0;
        if (this.ctx) {
          this.nextNoteTime = this.ctx.currentTime + 0.08;
          this.syncGains(0.45);
        }
      }

      setModalDucking(ducked) {
        if (this.isDucked === ducked) return;
        this.isDucked = ducked;
        this.syncGains(0.28);
      }

      init() {
        try {
          if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            this.sfxGain = this.ctx.createGain();
            this.sfxGain.connect(this.ctx.destination);

            this.bgmFilter = this.ctx.createBiquadFilter();
            this.bgmFilter.type = 'lowpass';
            this.bgmFilter.frequency.setValueAtTime(1120, this.ctx.currentTime);
            this.bgmFilter.Q.setValueAtTime(0.7, this.ctx.currentTime);

            this.bgmGain = this.ctx.createGain();
            this.bgmGain.gain.setValueAtTime(0, this.ctx.currentTime);
            this.bgmFilter.connect(this.bgmGain);
            this.bgmGain.connect(this.ctx.destination);
          }
          if (this.ctx.state === 'suspended') {
            this.ctx.resume().then(() => {
              if (this.ctx) this.nextNoteTime = Math.max(this.nextNoteTime, this.ctx.currentTime + 0.05);
            }).catch(() => {});
          }
          if (this.ctx && !this.stepNoiseBuf) {
            const len = Math.floor(this.ctx.sampleRate * 0.04);
            const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < len; i++) {
              data[i] = Math.random() * 2 - 1;
            }
            this.stepNoiseBuf = buf;
          }
          this.syncGains(0.4);
          if (this.bgmEnabled && !this.bgmTimer) {
            this.startBgm();
          }
        } catch (e) {}
      }

      scheduleBgmTone(freq, startTime, dur, type = 'sine', peakVol = 0.25, attack = 0.04) {
        if (!this.ctx || !this.bgmFilter || !freq) return;
        try {
          const osc = this.ctx.createOscillator();
          const env = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, startTime);
          env.gain.setValueAtTime(0.0001, startTime);
          env.gain.linearRampToValueAtTime(peakVol, startTime + Math.min(attack, dur * 0.35));
          env.gain.exponentialRampToValueAtTime(0.0001, startTime + dur);
          osc.connect(env);
          env.connect(this.bgmFilter);
          osc.start(startTime);
          osc.stop(startTime + dur + 0.03);
        } catch (e) {}
      }

      scheduleBgmStep(step, t) {
        if (this.bgmScene === 'map') {
          // 聖域探索（約 72 BPM，每步 0.42s）：溫暖長音 Pad + 五聲音階鐘琴點綴
          const padRoots = [130.81, 110.0, 87.31, 98.0]; // C3 -> A2 -> F2 -> G2
          const padFifths = [196.0, 164.81, 130.81, 146.83];
          const chordIdx = Math.floor((step % 32) / 8);
          if (step % 8 === 0) {
            this.scheduleBgmTone(padRoots[chordIdx], t, 3.25, 'sine', 0.28, 0.45);
            this.scheduleBgmTone(padFifths[chordIdx], t, 3.1, 'triangle', 0.13, 0.55);
          }
          const mapMelody = [
            523.25, 0, 659.25, 587.33, 0, 440.0, 523.25, 0,
            392.0, 0, 523.25, 0, 587.33, 659.25, 0, 440.0,
            349.23, 0, 440.0, 523.25, 0, 659.25, 587.33, 0,
            392.0, 440.0, 0, 587.33, 523.25, 0, 392.0, 0
          ];
          const note = mapMelody[step % mapMelody.length];
          if (note > 0) {
            this.scheduleBgmTone(note, t, 0.95, 'sine', 0.14, 0.03);
          }
        } else {
          // 關卡挑戰（約 108 BPM，每步 0.275s）：輕快專注的琶音律動
          const bassProg = [110.0, 87.31, 130.81, 98.0]; // A2 -> F2 -> C3 -> G2
          const arpChords = [
            [220.0, 261.63, 329.63, 392.0],
            [174.61, 220.0, 261.63, 349.23],
            [261.63, 329.63, 392.0, 523.25],
            [196.0, 246.94, 293.66, 392.0]
          ];
          const chordIdx = Math.floor((step % 32) / 8);
          if (step % 4 === 0) {
            this.scheduleBgmTone(bassProg[chordIdx], t, 0.52, 'triangle', 0.22, 0.02);
          }
          const arpPattern = [0, 1, 2, 3, 2, 1, 2, 3];

      const maxX = Math.max(p1.x, p2.x, p3.x);
      const minY = Math.min(p1.y, p2.y, p3.y);
      const maxY = Math.max(p1.y, p2.y, p3.y);
      const shiftX = targetCenter.x - (minX + maxX) / 2;
      const shiftY = targetCenter.y - (minY + maxY) / 2;
      return {
        P1: { x: p1.x + shiftX, y: p1.y + shiftY },

    const computeOutwardMidPt = (p1, p2, centroid, offset = 24) => {
      const mx = (p1.x + p2.x) / 2;
      const my = (p1.y + p2.y) / 2;
      const dx = p2.x - p1.x;
      const dy = p2.y - p1.y;
      const len = Math.hypot(dx, dy) || 1;
      let nx = -dy / len;
      let ny = dx / len;
      if ((mx - centroid.x) * nx + (my - centroid.y) * ny < 0) {
        nx = -nx;
        ny = -ny;
      }
      return {
        x: Math.max(28, Math.min(472, mx + nx * offset)),
        y: Math.max(28, Math.min(472, my + ny * offset))
      };
    };

      const pC1 = { x: wP2.x + u21.x * sqSize, y: wP2.y + u21.y * sqSize };
      const pC2 = { x: pC1.x + u23.x * sqSize, y: pC1.y + u23.y * sqSize };
      const pC3 = { x: wP2.x + u23.x * sqSize, y: wP2.y + u23.y * sqSize };
      const rightAngleSquare = `${wP2.x},${wP2.y} ${pC1.x},${pC1.y} ${pC2.x},${pC2.y} ${pC3.x},${pC3.y}`;

      const uT_Other = { x: vT_Other.x / lT_Other, y: vT_Other.y / lT_Other };
      const vT_Right = { x: rightPt.x - targetPt.x, y: rightPt.y - targetPt.y };
      const lT_Right = Math.hypot(vT_Right.x, vT_Right.y);
      const uT_Right = { x: vT_Right.x / lT_Right, y: vT_Right.y / lT_Right };

      const arcP1 = { x: targetPt.x + uT_Right.x * arcRad, y: targetPt.y + uT_Right.y * arcRad };
      const arcP2 = { x: targetPt.x + uT_Other.x * arcRad, y: targetPt.y + uT_Other.y * arcRad };
      const cross = uT_Right.x * uT_Other.y - uT_Right.y * uT_Other.x;
      const sweep = cross > 0 ? 1 : 0;
      const arcPath = `M ${targetPt.x} ${targetPt.y} L ${arcP1.x} ${arcP1.y} A ${arcRad} ${arcRad} 0 0 ${sweep} ${arcP2.x} ${arcP2.y} Z`;
      const bisect = {
        x: targetPt.x + (uT_Right.x + uT_Other.x) * 0.5 * (arcRad + 28),
        y: targetPt.y + (uT_Right.y + uT_Other.y) * 0.5 * (arcRad + 28)
      };

      let questionText = "";
      let labels = [];
      let showArc = false;
      const useGreek = phase === 0 ? true : phase === 1 ? false : (Math.random() < 0.3);

      if (useGreek) {
        showArc = true;
        const greek = ['θ', 'α', 'β'][Math.floor(Math.random() * 3)];
        labels.push({ text: greek, x: bisect.x, y: bisect.y + 6, color: '#b45309' });
        questionText = `目標角 ${greek} 的 ${targetNameMap[targetType].title}`;
      } else {
        const targetLetter = targetIsP1 ? 'A' : 'B';
        const offsetPt = (pt, u1, u2, dist) => {
          const out = { x: -(u1.x + u2.x), y: -(u1.y + u2.y) };
          const l = Math.hypot(out.x, out.y);
          if (l < 0.001) return { x: pt.x, y: pt.y - dist };
          return { x: pt.x + (out.x/l)*dist, y: pt.y + (out.y/l)*dist };
        };
        const outP1 = offsetPt(wP1, u21, {x: (wP3.x-wP1.x)/hyp, y:(wP3.y-wP1.y)/hyp}, 36);
        const outP3 = offsetPt(wP3, u23, {x: (wP1.x-wP3.x)/hyp, y:(wP1.y-wP3.y)/hyp}, 36);
        const outP2 = { x: wP2.x - (u21.x + u23.x)*28, y: wP2.y - (u21.y + u23.y)*28 };
        labels.push({ text: 'A', x: outP1.x, y: outP1.y + 8, color: '#1e293b' });
        labels.push({ text: 'B', x: outP3.x, y: outP3.y + 8, color: '#1e293b' });
        labels.push({ text: 'C', x: outP2.x, y: outP2.y + 8, color: '#1e293b' });
        questionText = `∠${targetLetter} 的 ${targetNameMap[targetType].title}`;
      }

      return {
        pts: { P1: wP1, P2: wP2, P3: wP3 },
        rightAngleSquare, arcPath, showArc, labels,
        edges: edgesWithStyles,
        targetType,
        questionText,
        correctEdgeColorId: edgesWithStyles.find(e => e.id === targetType).colorId,
        conceptTip: targetNameMap[targetType].tip
      };
    };

    // ==================== 第 2 關隨機題目生成器：逆向破譯（畢氏整數對＋角度位置＋旋轉） ====================
    const generateLevel2Question = (phase, prevKey = '', usedKeys = null) => {
      const triplePool = phase === 0 ? [
        { adj: 4, opp: 3, hyp: 5 }, { adj: 3, opp: 4, hyp: 5 },
        { adj: 12, opp: 5, hyp: 13 }, { adj: 5, opp: 12, hyp: 13 }
      ] : phase === 1 ? [
        { adj: 4, opp: 3, hyp: 5 }, { adj: 3, opp: 4, hyp: 5 },
        { adj: 12, opp: 5, hyp: 13 }, { adj: 5, opp: 12, hyp: 13 },
        { adj: 15, opp: 8, hyp: 17 }, { adj: 8, opp: 15, hyp: 17 }
      ] : [
        { adj: 4, opp: 3, hyp: 5 }, { adj: 3, opp: 4, hyp: 5 },
        { adj: 12, opp: 5, hyp: 13 }, { adj: 5, opp: 12, hyp: 13 },
        { adj: 15, opp: 8, hyp: 17 }, { adj: 8, opp: 15, hyp: 17 },
        { adj: 24, opp: 7, hyp: 25 }, { adj: 7, opp: 24, hyp: 25 }
      ];
      const funcPool = ['sin', 'cos', 'tan'];

      let triple, targetIsP1, targetFunc, questionKey;
      for (let attempt = 0; attempt < 24; attempt++) {
        triple = triplePool[Math.floor(Math.random() * triplePool.length)];
        targetIsP1 = phase === 0 ? true : Math.random() > 0.5;
        targetFunc = funcPool[Math.floor(Math.random() * funcPool.length)];
        questionKey = `${triple.adj}_${triple.opp}_${triple.hyp}_${targetIsP1}_${targetFunc}`;
        const notUsed = !usedKeys || !usedKeys.has(questionKey);
        if (questionKey !== prevKey && (notUsed || attempt >= 16)) break;
      }

      const flip = Math.random() > 0.5 ? 1 : -1;
      const rotDeg = phase === 2 ? Math.floor(Math.random() * 360) : 0;
      const rotRad = (rotDeg * Math.PI) / 180;
      const scale = 335 / triple.hyp;
      const adjLen = triple.adj * scale;
      const oppLen = triple.opp * scale;

      const localPts = {
        P1: { x: 0, y: 0 },
        P2: { x: adjLen * flip, y: 0 },
        P3: { x: adjLen * flip, y: -oppLen }
      };
      const rotatePt = (pt) => ({
        x: pt.x * Math.cos(rotRad) - pt.y * Math.sin(rotRad),
        y: pt.x * Math.sin(rotRad) + pt.y * Math.cos(rotRad)
      });
      const { P1: wP1, P2: wP2, P3: wP3 } = centerTriangleBoundingBox(
        rotatePt(localPts.P1), rotatePt(localPts.P2), rotatePt(localPts.P3)
      );
      const centroid = {
        x: (wP1.x + wP2.x + wP3.x) / 3,
        y: (wP1.y + wP2.y + wP3.y) / 3
      };

      const targetPt = targetIsP1 ? wP1 : wP3;
      const otherPt = targetIsP1 ? wP3 : wP1;
      const rightPt = wP2;

      const edgeHyp = { id: 'hyp', labelCn: '斜邊', p1: targetPt, p2: otherPt, numVal: triple.hyp };
      const edgeOpp = { id: 'opp', labelCn: '對邊', p1: otherPt, p2: rightPt, numVal: targetIsP1 ? triple.opp : triple.adj };
      const edgeAdj = { id: 'adj', labelCn: '鄰邊', p1: targetPt, p2: rightPt, numVal: targetIsP1 ? triple.adj : triple.opp };
      const sides = [edgeHyp, edgeOpp, edgeAdj];

      const edgesWithStyles = sides.map((side) => ({
        ...side,
        displayText: String(side.numVal),
        midPt: computeOutwardMidPt(side.p1, side.p2, centroid, 24)
      }));

      const ratioDefMap = {
        sin: { num: 'opp', den: 'hyp', formula: '對邊 ÷ 斜邊' },
        cos: { num: 'adj', den: 'hyp', formula: '鄰邊 ÷ 斜邊' },
        tan: { num: 'opp', den: 'adj', formula: '對邊 ÷ 鄰邊' }
      };
      const def = ratioDefMap[targetFunc];
      const numEdge = edgesWithStyles.find(e => e.id === def.num);
      const denEdge = edgesWithStyles.find(e => e.id === def.den);

      const v21 = { x: wP1.x - wP2.x, y: wP1.y - wP2.y };
      const l21 = Math.hypot(v21.x, v21.y) || 1;
      const u21 = { x: v21.x / l21, y: v21.y / l21 };
      const v23 = { x: wP3.x - wP2.x, y: wP3.y - wP2.y };
      const l23 = Math.hypot(v23.x, v23.y) || 1;
      const u23 = { x: v23.x / l23, y: v23.y / l23 };

      const sqSize = 24;
      const pC1 = { x: wP2.x + u21.x * sqSize, y: wP2.y + u21.y * sqSize };
      const pC2 = { x: pC1.x + u23.x * sqSize, y: pC1.y + u23.y * sqSize };
      const pC3 = { x: wP2.x + u23.x * sqSize, y: wP2.y + u23.y * sqSize };
      const rightAngleSquare = `${wP2.x},${wP2.y} ${pC1.x},${pC1.y} ${pC2.x},${pC2.y} ${pC3.x},${pC3.y}`;

      const arcRad = Math.max(32, Math.min(52, Math.min(adjLen, oppLen) * 0.42));
      const vT_Other = { x: otherPt.x - targetPt.x, y: otherPt.y - targetPt.y };
      const lT_Other = Math.hypot(vT_Other.x, vT_Other.y) || 1;
      const uT_Other = { x: vT_Other.x / lT_Other, y: vT_Other.y / lT_Other };
      const vT_Right = { x: rightPt.x - targetPt.x, y: rightPt.y - targetPt.y };
      const lT_Right = Math.hypot(vT_Right.x, vT_Right.y) || 1;
      const uT_Right = { x: vT_Right.x / lT_Right, y: vT_Right.y / lT_Right };

      const arcP1 = { x: targetPt.x + uT_Right.x * arcRad, y: targetPt.y + uT_Right.y * arcRad };
      const arcP2 = { x: targetPt.x + uT_Other.x * arcRad, y: targetPt.y + uT_Other.y * arcRad };
      const cross = uT_Right.x * uT_Other.y - uT_Right.y * uT_Other.x;
      const sweep = cross > 0 ? 1 : 0;
      const arcPath = `M ${targetPt.x} ${targetPt.y} L ${arcP1.x} ${arcP1.y} A ${arcRad} ${arcRad} 0 0 ${sweep} ${arcP2.x} ${arcP2.y} Z`;
      const bisect = {
        x: targetPt.x + (uT_Right.x + uT_Other.x) * 0.5 * (arcRad + 24),
        y: targetPt.y + (uT_Right.y + uT_Other.y) * 0.5 * (arcRad + 24)
      };

      const angleName = phase === 0 ? 'θ' : ['θ', 'α', 'β'][Math.floor(Math.random() * 3)];
      const showArc = true;
      const labels = [{ text: angleName, x: bisect.x, y: bisect.y + 6, color: '#b45309', isAngle: true }];

      return {
        questionKey,
        pts: { P1: wP1, P2: wP2, P3: wP3 },
        rightAngleSquare, arcPath, showArc, labels,
        edges: edgesWithStyles,
        targetFunc,
        angleName,
        numText: numEdge.displayText,
        denText: denEdge.displayText,
        numEdgeId: numEdge.id,
        denEdgeId: denEdge.id,
        conceptTip: `${numEdge.displayText}(${numEdge.labelCn}) ÷ ${denEdge.displayText}(${denEdge.labelCn}) ＝ ${targetFunc} ${angleName}`
      };
    };

    // ==================== 第 3 關隨機題目生成器：未知邊獵人（比例狙擊） ====================
    const generateLevel3Question = (phase, prevKey = '') => {
      const triplePool = phase === 0 ? [
        { adj: 4, opp: 3, hyp: 5 }, { adj: 3, opp: 4, hyp: 5 }
      ] : phase === 1 ? [
        { adj: 4, opp: 3, hyp: 5 }, { adj: 3, opp: 4, hyp: 5 },
        { adj: 12, opp: 5, hyp: 13 }, { adj: 5, opp: 12, hyp: 13 }
      ] : [
        { adj: 4, opp: 3, hyp: 5 }, { adj: 3, opp: 4, hyp: 5 },
        { adj: 12, opp: 5, hyp: 13 }, { adj: 5, opp: 12, hyp: 13 },
        { adj: 15, opp: 8, hyp: 17 }, { adj: 8, opp: 15, hyp: 17 },
        { adj: 24, opp: 7, hyp: 25 }, { adj: 7, opp: 24, hyp: 25 }
      ];
      const funcList = ['sin', 'cos', 'tan'];
      const ratioDefMap = {
        sin: { num: 'opp', den: 'hyp' },
        cos: { num: 'adj', den: 'hyp' },
        tan: { num: 'opp', den: 'adj' }
      };

      let triple, k, targetFunc, knownId, targetId, targetIsP1, questionKey;
      for (let attempt = 0; attempt < 10; attempt++) {
        triple = triplePool[Math.floor(Math.random() * triplePool.length)];
        targetFunc = funcList[Math.floor(Math.random() * funcList.length)];
        const def = ratioDefMap[targetFunc];
        if (phase < 2) {
          const swap = Math.random() > 0.5;
          knownId = swap ? def.den : def.num;
          targetId = swap ? def.num : def.den;
        } else {
          const ids = shuffle(['hyp', 'opp', 'adj']);
          knownId = ids[0];
          targetId = ids[1];
        }
        const isBridge = knownId !== def.num && knownId !== def.den || (targetId !== def.num && targetId !== def.den);
        k = triple.hyp === 5
          ? (isBridge ? [1, 2][Math.floor(Math.random() * 2)] : [1, 2, 3][Math.floor(Math.random() * 3)])
          : triple.hyp === 13
          ? (isBridge ? 1 : [1, 2][Math.floor(Math.random() * 2)])
          : 1;
        targetIsP1 = phase === 0 ? true : Math.random() > 0.5;
        questionKey = `${triple.adj}_${triple.opp}_${triple.hyp}_${k}_${targetFunc}_${knownId}_${targetId}_${targetIsP1}`;
        if (questionKey !== prevKey) break;
      }

      const flip = Math.random() > 0.5 ? 1 : -1;
      const rotDeg = phase === 2 ? Math.floor(Math.random() * 360) : 0;
      const rotRad = (rotDeg * Math.PI) / 180;
      const scale = 305 / triple.hyp;
      const adjLen = triple.adj * scale;
      const oppLen = triple.opp * scale;

      const localPts = {
        P1: { x: 0, y: 0 },
        P2: { x: adjLen * flip, y: 0 },
        P3: { x: adjLen * flip, y: -oppLen }
      };
      const rotatePt = (pt) => ({
        x: pt.x * Math.cos(rotRad) - pt.y * Math.sin(rotRad),
        y: pt.x * Math.sin(rotRad) + pt.y * Math.cos(rotRad)
      });
      const { P1: wP1, P2: wP2, P3: wP3 } = centerTriangleBoundingBox(
        rotatePt(localPts.P1), rotatePt(localPts.P2), rotatePt(localPts.P3)
      );
      const centroid = {
        x: (wP1.x + wP2.x + wP3.x) / 3,
        y: (wP1.y + wP2.y + wP3.y) / 3
      };

      const targetPt = targetIsP1 ? wP1 : wP3;
      const otherPt = targetIsP1 ? wP3 : wP1;
      const rightPt = wP2;

      const baseMap = {
        hyp: triple.hyp,
        opp: targetIsP1 ? triple.opp : triple.adj,
        adj: targetIsP1 ? triple.adj : triple.opp
      };
      const actualMap = {
        hyp: baseMap.hyp * k,
        opp: baseMap.opp * k,
        adj: baseMap.adj * k
      };

      const sides = [
        { id: 'hyp', p1: targetPt, p2: otherPt, val: actualMap.hyp, baseVal: baseMap.hyp },
        { id: 'opp', p1: otherPt, p2: rightPt, val: actualMap.opp, baseVal: baseMap.opp },
        { id: 'adj', p1: targetPt, p2: rightPt, val: actualMap.adj, baseVal: baseMap.adj }
      ];

      const edgesWithStyles = sides.map((s) => ({
        ...s,
        role: s.id === targetId ? 'target' : s.id === knownId ? 'known' : 'blank',
        midPt: computeOutwardMidPt(s.p1, s.p2, centroid, 24)
      }));

      const targetVal = actualMap[targetId];
      const knownVal = actualMap[knownId];
      const def = ratioDefMap[targetFunc];
      const clueNum = baseMap[def.num];
      const clueDen = baseMap[def.den];

      // 產生 4 選 1 高擬真誘答（同三角形他邊、未乘倍數 k 的原始邊、相近整數）
      const thirdId = ['hyp', 'opp', 'adj'].find(id => id !== targetId && id !== knownId);
      const optSet = new Set([targetVal]);
      [
        actualMap[thirdId],
        baseMap[targetId],
        baseMap[thirdId] * (k > 1 ? k : 2),
        targetVal + k,
        targetVal - k,
        targetVal + 2,
        targetVal - 2,
        targetVal + 1,
        targetVal - 1,
        targetVal + 4
      ].forEach((cand) => {
        if (optSet.size < 4 && cand > 0 && Number.isInteger(cand)) optSet.add(cand);
      });
      let pad = 1;
      while (optSet.size < 4) {
        if (targetVal + pad > 0) optSet.add(targetVal + pad);
        pad += 1;
      }
      const sideOptions = shuffle(Array.from(optSet).map(String));

      const v21 = { x: wP1.x - wP2.x, y: wP1.y - wP2.y };
