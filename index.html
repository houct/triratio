          )}

          {gameState === 'ended' && (
            <LevelResultScreen
              score={finalScore}
              baseScore={baseScore}
              earnedStars={earnedStars}
              correctCount={correctCount}
              wrongCount={wrongCount}
              lives={lives}
              progress={progress}
              targetTotal={starsThreshold[2]}
              elapsedSec={elapsedSec}
              lifeBonus={lifeBonus}
              accuracyBonus={accuracyBonus}
              speedBonus={speedBonus}
              accentClass="text-cyan-600"
              onCompleteLevel={onCompleteLevel}
              onRestart={() => startGame(pickOrder)}
              onBackToMap={onBackToMap}
            />
          )}

          <CoachOverlay
            containerRef={containerRef}
            active={guideMode === 'manual' || (showGuide && gameState === 'playing')}
            mode={guideMode || 'spotlight'}
            onDismiss={dismissGuide}
            steps={guideMode === 'manual' ? (
              question?.phase === 0 ? [
                { text: '拖曳題目上的 (x, y) 坐標膠囊（或直接在網格上）至綠色瞄準圈放開。' },
                { text: '依三角比定義（sin=y/r、cos=x/r、tan=y/x）將圖上的 x、y、r 標籤拖進（或點擊填入）上方分子與分母格。' }
              ] : [
                { text: '依 x、y 軸格線，將題目 (x, y) 坐標膠囊（或直接在網格上）拖至對應整數格點放開。' },
                { text: '依 r = √(x² + y²) 將下方正確的 r 膠囊拖曳貼到動徑 r = ? 定點。' },
                { text: '依三角比定義（sin=y/r、cos=x/r、tan=y/x）將圖上的 x、y、r 標籤拖進（或點擊填入）上方分子與分母格。' }
              ]
            ) : stage === 'pickR' ? [
              {
                targets: [
                  { id: 'lv10-r-opts', shape: 'pill', pad: 8 },
                  { id: 'lv10-r-drop', shape: 'pill', pad: 12 }
                ],
                target: 'lv10-r-opts',
                drag: true,
                text: '依 r = √(x² + y²) 按住下方正確的 r 膠囊，拖曳貼到動徑 r = ? 上（也可點擊）！',
                shape: 'pill',
                pad: 8
              }
            ] : stage === 'ratio' ? [
              {
                target: 'lv10-tri',
                text: '圖上已標出橫坐標 x、縱坐標 y 與動徑 r，先看清各自對應的數值與正負號！',
                shape: 'circle',
                pad: 8,
                tap: false,
                placement: 'bottom'
              },
              {
                targets: [
                  { id: 'lv10-demo-tag', shape: 'pill', pad: 10 },
                  { id: 'lv10-ratio-box', shape: 'pill', pad: 10 }
                ],
                target: 'lv10-demo-tag',
                drag: true,
                text: '按住圖上的 x、y 或 r 標籤，拖進上方「分子 / 分母」框（也可直接點擊填入）！',
                shape: 'pill',
                pad: 10
              }
            ] : [
              {
                targets: [
                  { id: 'lv10-coord-chip', shape: 'pill', pad: 8 },
                  showTargetRing
                    ? { id: 'lv10-target-dot', shape: 'circle', pad: 12 }
                    : { id: 'lv10-tri', shape: 'circle', pad: 6 }
                ],
                target: 'lv10-coord-chip',
                drag: true,
                text: showTargetRing
                  ? '按住題目上的座標膠囊，直接拖進網格目標點放開（也可直接在網格拖曳）！'
                  : '按住題目上的座標膠囊，拖到網格對應的 (x, y) 整數格點放開！',
                shape: 'pill',
                pad: 8
              }
            ]}
          />
        </div>
      );
    };

    // ==================== 第 11 關組件：星象羅盤師（Lv.7 轉角 ＋ Lv.10 貼邊填定義） ====================
    const LV11_NUM_CAPSULES = ['-√3', '-1', '0', '1', '√3', '√2', '2'];

    const Level7AstroCompassMaster = ({ currentStars, onUpdateStars, onCompleteLevel, onBackToMap, hasSeenGuide = false, onMarkGuideSeen }) => {
      const { isRelaxMode } = React.useContext(GameModeContext);
      const starsThreshold = [2, 4, 6];
      const maxLives = 3;
      const healTarget = 2;
      const {
        gameState, progress, lives, healStreak, correctCount, wrongCount, elapsedSec,
        earnedStars, baseScore, lifeBonus, accuracyBonus, speedBonus, finalScore,
        startSession, recordCorrect, recordWrong, finishNow
      } = useLivesLevelSession({ starThresholds: starsThreshold, maxLives, healTarget, currentStars, onUpdateStars });

      const [pickOrder, setPickOrder] = useState('num');
      const [question, setQuestion] = useState(null);
      const [stage, setStage] = useState('rotate'); // 'rotate' | 'assign' | 'define'
      const [currentAngle, setCurrentAngle] = useState(0);
      const [isDragging, setIsDragging] = useState(false);

      // Step 2 (assign): 7 膠囊個別對應 x, y, r（支援預設 x→y→r 自動推進＋自行點框切換＋拖曳）
      const [assignedVals, setAssignedVals] = useState({ x: null, y: null, r: null });
      const [activeAssignSlot, setActiveAssignSlot] = useState('x');
      const [wrongSlotKey, setWrongSlotKey] = useState(null);
      const [dragAssignChip, setDragAssignChip] = useState(null);

      // Step 3 (define): 從圖上拖曳／點擊 x, y, r 進分子／分母框
      const [selectedNumerator, setSelectedNumerator] = useState(null);
      const [selectedDenominator, setSelectedDenominator] = useState(null);
      const [dragRatioKey, setDragRatioKey] = useState(null);

      const [isLockedSuccess, setIsLockedSuccess] = useState(false);
      const [feedbackAnim, setFeedbackAnim] = useState('');
      const [conceptTip, setConceptTip] = useState(null);
      const { showGuide, guideMode, openGuide, dismissGuide } = useStagedLevelGuide({
        currentStars,
        hasSeenGuide,
        onMarkGuideSeen,
        activeStageKey: question ? stage : null,
        phase: question ? question.phase : 0,
        enabled: gameState === 'playing',
        finalStageKey: 'define'
      });

      const containerRef = useRef(null);
      const dialSvgRef = useRef(null);
      const assignXRef = useRef(null);
      const assignYRef = useRef(null);
      const assignRRef = useRef(null);
      const numSlotRef = useRef(null);
      const denSlotRef = useRef(null);
      const lastTickAngleRef = useRef(0);
      const lastAtanRef = useRef(0);
      const exactAngleRef = useRef(0);
      const isDraggingRef = useRef(false);
      const didDragRef = useRef(false);
      const dragStartPtRef = useRef(null);
      const justSolvedAtRef = useRef(0);
      const bagRef = useRef({ specialBag: [], funcBag: [], lastAngle: undefined, p1AxisDone: false });
      const pendingNextRef = useRef(null);
      const preferredAssignOrderRef = useRef(['x', 'y', 'r']);
      const currentAssignOrderRef = useRef([]);

      const handleConfirmSkip = () => {
        if (!pendingNextRef.current) return;
        if (Date.now() - justSolvedAtRef.current < 260) return;
        const fn = pendingNextRef.current;
        pendingNextRef.current = null;
        audio.sfxClick();
        fn();
      };

      const width = 540, height = 540, origin = { x: 270, y: 270 }, R = 190;

      useEffect(() => { isDraggingRef.current = isDragging; }, [isDragging]);
      useEffect(() => {
        const preventTouchScroll = (e) => { if (isDraggingRef.current) e.preventDefault(); };
        document.addEventListener('touchmove', preventTouchScroll, { passive: false });
        return () => document.removeEventListener('touchmove', preventTouchScroll);
      }, []);

      const nextQuestion = (curProg) => {
        const phase = curProg >= starsThreshold[1] ? 2 : curProg >= starsThreshold[0] ? 1 : 0;
        const forceAxis = phase === 1 && curProg === starsThreshold[1] - 1 && !bagRef.current.p1AxisDone;
        const q = generateLevel7Question(phase, bagRef.current, forceAxis);
        if (phase === 1 && q.isAxis) bagRef.current.p1AxisDone = true;
        setQuestion(q);
        setStage('rotate');
        setCurrentAngle(0);
        exactAngleRef.current = 0;
        lastTickAngleRef.current = 0;
        setAssignedVals({ x: null, y: null, r: null });
        currentAssignOrderRef.current = [];
        setActiveAssignSlot(preferredAssignOrderRef.current[0] || 'x');
        setWrongSlotKey(null);
        setDragAssignChip(null);
        setSelectedNumerator(null);
        setSelectedDenominator(null);
        setDragRatioKey(null);
        setIsLockedSuccess(false);
        pendingNextRef.current = null;
        setConceptTip(null);
      };

      const startGame = (order = pickOrder) => {
        setPickOrder(order);
        bagRef.current = { specialBag: [], funcBag: [], lastAngle: undefined, p1AxisDone: false };
        setFeedbackAnim('');
        setSelectedNumerator(null);
        setSelectedDenominator(null);
        setConceptTip(null);
        const initProg = startSession();
        nextQuestion(initProg);
        audio.init();
      };

      useEffect(() => { startGame('num'); }, []);

      const applyPenalty = (delayEndMs = 480) => recordWrong({ delayEndMs }).gameOver;

      // ==================== Step 1: 5° 拖曳終邊（轉到目標角自動鎖定） ====================
      const handleDialPointerDown = (e) => {
        if (isLockedSuccess) {
          handleConfirmSkip();
          return;
        }
        if (gameState !== 'playing' || stage !== 'rotate' || !dialSvgRef.current || (!isRelaxMode && lives <= 0)) return;
        if (showGuide) dismissGuide(false);
        setIsDragging(true);
        didDragRef.current = false;
        dragStartPtRef.current = { x: e.clientX, y: e.clientY };
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
        const ctm = dialSvgRef.current.getScreenCTM();
        if (!ctm) return;
        const inv = ctm.inverse();
        const svgX = inv.a * e.clientX + inv.c * e.clientY + inv.e;
        const svgY = inv.b * e.clientX + inv.d * e.clientY + inv.f;
        lastAtanRef.current = Math.atan2(origin.y - svgY, svgX - origin.x) * (180 / Math.PI);
        exactAngleRef.current = currentAngle;
      };

      const handleDialPointerMove = (e) => {
        if (!isDragging || stage !== 'rotate' || !dialSvgRef.current) return;
        if (dragStartPtRef.current && Math.hypot(e.clientX - dragStartPtRef.current.x, e.clientY - dragStartPtRef.current.y) >= 6) {
          didDragRef.current = true;
        }
        const ctm = dialSvgRef.current.getScreenCTM();
        if (!ctm) return;
        const inv = ctm.inverse();
        const svgX = inv.a * e.clientX + inv.c * e.clientY + inv.e;
        const svgY = inv.b * e.clientX + inv.d * e.clientY + inv.f;
        const currentAtan = Math.atan2(origin.y - svgY, svgX - origin.x) * (180 / Math.PI);
        let diff = currentAtan - lastAtanRef.current;
        if (diff > 180) diff -= 360;
        if (diff < -180) diff += 360;
        exactAngleRef.current += diff;
        lastAtanRef.current = currentAtan;
        const clamped = Math.max(-15, Math.min(360, exactAngleRef.current));
        const snapped = ((Math.round(clamped / 5) * 5) % 360 + 360) % 360;
        if (snapped !== lastTickAngleRef.current) {
          audio.sfxTick();
          lastTickAngleRef.current = snapped;
        }
        setCurrentAngle(snapped);
      };

      const handleDialPointerUp = (e) => {
        if (!isDragging) return;
        setIsDragging(false);
        try { e?.currentTarget?.releasePointerCapture?.(e.pointerId); } catch (_) {}
        const clamped = Math.max(-15, Math.min(360, exactAngleRef.current));
        const finalAngle = didDragRef.current ? ((Math.round(clamped / 5) * 5) % 360 + 360) % 360 : currentAngle;
        if (stage === 'rotate' && question && finalAngle === question.targetAngle) {
          if (showGuide) dismissGuide(false);
          audio.sfxBonus();
          setConceptTip(null);
          setFeedbackAnim('animate-correct');
          setStage('assign');
          setTimeout(() => setFeedbackAnim(''), 280);
        }
      };

      const handleDialClick = () => {
        if (isLockedSuccess) {
          handleConfirmSkip();
          return;
        }
        if (gameState !== 'playing' || stage !== 'rotate' || !question || didDragRef.current || (!isRelaxMode && lives <= 0)) return;
        if (showGuide) dismissGuide(false);
        if (currentAngle === question.targetAngle) {
          audio.sfxBonus();
          setConceptTip(null);
          setFeedbackAnim('animate-correct');
          setStage('assign');
          setTimeout(() => setFeedbackAnim(''), 280);
        } else {
          audio.sfxError();
          const gameOver = applyPenalty(460);
          setConceptTip({
            text: `目標 ${question.targetAngle}° 在${question.locationLabel}（目前停在 ${currentAngle}°），調好後再輕點鎖定！`,
            id: Date.now()
          });
          setFeedbackAnim('animate-shake');
          if (!gameOver) setTimeout(() => setFeedbackAnim(''), 340);
        }
      };

      // ==================== Step 2: 7 膠囊個別對應 x, y, r ====================
      const getExpectedSlotVal = (slot) => !question ? '' : slot === 'x' ? question.xStr : slot === 'y' ? question.yStr : question.rStr;

      const attemptAssignSlot = (slot, val) => {
        if (gameState !== 'playing' || stage !== 'assign' || !question || assignedVals[slot] || (!isRelaxMode && lives <= 0)) return;
        if (showGuide) dismissGuide(false);
        if (val === getExpectedSlotVal(slot)) {
          audio.sfxSelect();
          setConceptTip(null);
          setWrongSlotKey(null);
          if (!currentAssignOrderRef.current.includes(slot)) {
            currentAssignOrderRef.current.push(slot);
          }
          const nextAssigned = { ...assignedVals, [slot]: val };
          setAssignedVals(nextAssigned);
          if (nextAssigned.x && nextAssigned.y && nextAssigned.r) {
            if (currentAssignOrderRef.current.length === 3) {
              preferredAssignOrderRef.current = [...currentAssignOrderRef.current];
            }
            audio.sfxBonus();
            setStage('define');
          } else {
            const nextEmpty = preferredAssignOrderRef.current.find(k => !nextAssigned[k]);
            if (nextEmpty) setActiveAssignSlot(nextEmpty);
          }
        } else {
          audio.sfxError();
          setWrongSlotKey(slot);
          setConceptTip({ text: question.assignTip, id: Date.now() });
          setFeedbackAnim('animate-shake');
          setTimeout(() => { setFeedbackAnim(''); setWrongSlotKey(null); }, 360);
        }
      };

      const findAssignSlot = (clientX, clientY) => {
        const hit = (el, slot) => {
          if (!el || assignedVals[slot]) return Infinity;
          const r = el.getBoundingClientRect();
          const cx = r.left + r.width / 2;
          const cy = r.top + r.height / 2;
          const d = Math.hypot(clientX - cx, clientY - cy);
          return d <= 56 ? d : Infinity;
        };
        const cands = [
          { slot: 'x', d: hit(assignXRef.current, 'x') },
          { slot: 'y', d: hit(assignYRef.current, 'y') },
          { slot: 'r', d: hit(assignRRef.current, 'r') }
        ].sort((a, b) => a.d - b.d);
        return cands[0].d < Infinity ? cands[0].slot : null;
      };

      const handleAssignChipDown = (e, val) => {
        if (gameState !== 'playing' || stage !== 'assign' || !question || (!isRelaxMode && lives <= 0)) return;
        if (showGuide) dismissGuide(false);
        e.preventDefault();
        audio.init();
        const touchOffsetY = e.pointerType === 'touch' ? 46 : 0;
        setDragAssignChip({
          val,
          startX: e.clientX,
          startY: e.clientY,
          clientX: e.clientX,
          clientY: e.clientY,
          touchOffsetY,
          moved: false,
          hoverSlot: findAssignSlot(e.clientX, e.clientY - touchOffsetY)
        });
      };

      useEffect(() => {
        if (!dragAssignChip) return;
        const onMove = (e) => {
          const offsetY = e.pointerType === 'touch' ? 46 : dragAssignChip.touchOffsetY || 0;
          const dist = Math.hypot(e.clientX - dragAssignChip.startX, e.clientY - dragAssignChip.startY);
          const moved = dragAssignChip.moved || dist >= 8;
          setDragAssignChip(prev => prev ? {
            ...prev,
            clientX: e.clientX,
            clientY: e.clientY,
            touchOffsetY: offsetY,
            moved,
            hoverSlot: findAssignSlot(e.clientX, e.clientY - offsetY)
          } : null);
        };
        const onUp = (e) => {
          const cur = dragAssignChip;
          setDragAssignChip(null);
          if (!cur) return;
          if (!cur.moved) {
            if (activeAssignSlot && !assignedVals[activeAssignSlot]) {
              attemptAssignSlot(activeAssignSlot, cur.val);
            }
          } else {
            const offsetY = e.pointerType === 'touch' ? 46 : cur.touchOffsetY || 0;
            const slot = findAssignSlot(e.clientX, e.clientY - offsetY);
            if (slot) attemptAssignSlot(slot, cur.val);
          }
        };
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
        window.addEventListener('pointercancel', onUp);
        return () => {
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
          window.removeEventListener('pointercancel', onUp);
        };
      }, [dragAssignChip, question, stage, assignedVals, activeAssignSlot]);

      // ==================== Step 3: 圖上拖曳／點擊 x, y, r 填定義 ====================
      const triggerSuccess = () => {
        if (showGuide) dismissGuide(false);
        justSolvedAtRef.current = Date.now();
        audio.sfxBonus();
        setIsLockedSuccess(true);
        setFeedbackAnim('animate-correct');
        const { completed, nextProgress } = recordCorrect({ wasMissed: false, delayEndMs: null });
        setConceptTip({
          tone: 'success',
          canSkip: true,
          skipLabel: completed ? '輕點查看結算 ▸' : '輕點繼續 ▸',
          text: completed ? '全關挑戰完成！' : '定義正確！',
          id: Date.now()
        });
        pendingNextRef.current = () => {
          pendingNextRef.current = null;
          setIsLockedSuccess(false);
          setFeedbackAnim('');
          if (completed) finishNow();
          else nextQuestion(nextProgress);
        };
      };

      const evaluateRatioPair = (numKey, denKey) => {
        if (numKey === question.correctNumeratorKey && denKey === question.correctDenominatorKey) {
          triggerSuccess();
        } else {
          audio.sfxError();
          const gameOver = applyPenalty(480);
          setConceptTip({ text: question.conceptTip, id: Date.now() });
          setFeedbackAnim('animate-shake');
          if (!gameOver) {
            setTimeout(() => { setFeedbackAnim(''); setSelectedNumerator(null); setSelectedDenominator(null); }, 400);
          }
        }
      };

      const handleDropRatioSlot = (key, slot) => {
        if (gameState !== 'playing' || stage !== 'define' || !question || isLockedSuccess || (!isRelaxMode && lives <= 0)) return;
        if (showGuide) dismissGuide(false);
        const nextNum = slot === 'num' ? key : selectedNumerator;
        const nextDen = slot === 'den' ? key : selectedDenominator;
        audio.sfxSelect();
        setSelectedNumerator(nextNum);
        setSelectedDenominator(nextDen);
        if (nextNum && nextDen) evaluateRatioPair(nextNum, nextDen);
      };

      const handleInputKey = (key) => {
        if (gameState !== 'playing' || stage !== 'define' || !question || isLockedSuccess || (!isRelaxMode && lives <= 0)) return;
        if (showGuide) dismissGuide(false);
        const firstKey = pickOrder === 'num' ? selectedNumerator : selectedDenominator;
        if (!firstKey) {
          audio.sfxSelect();
          if (pickOrder === 'num') setSelectedNumerator(key);
          else setSelectedDenominator(key);
        } else if (firstKey === key) {
          audio.sfxClick();
          setSelectedNumerator(null);
          setSelectedDenominator(null);
        } else {
          const numKey = pickOrder === 'num' ? firstKey : key;
          const denKey = pickOrder === 'num' ? key : firstKey;
          setSelectedNumerator(numKey);
          setSelectedDenominator(denKey);
          evaluateRatioPair(numKey, denKey);
        }
      };

      const findRatioSlot = (clientX, clientY) => {
        const hit = (el) => {
          if (!el) return false;
          const r = el.getBoundingClientRect();
          return clientX >= r.left - 18 && clientX <= r.right + 18 && clientY >= r.top - 14 && clientY <= r.bottom + 14;
        };
        if (hit(numSlotRef.current)) return 'num';
        if (hit(denSlotRef.current)) return 'den';
        return null;
      };

      const handleTagPointerDown = (e, key) => {
        if (stage === 'assign') {
          if (showGuide) dismissGuide(false);
          if (!assignedVals[key]) {
            e.stopPropagation();
            audio.sfxClick();
            setActiveAssignSlot(key);
          }
          return;
        }
        if (gameState !== 'playing' || stage !== 'define' || !question || isLockedSuccess || (!isRelaxMode && lives <= 0)) return;
        if (showGuide) dismissGuide(false);
        e.preventDefault();
        e.stopPropagation();
        audio.init();
        setDragRatioKey({
          key,
          startX: e.clientX,
          startY: e.clientY,
          clientX: e.clientX,
          clientY: e.clientY,
          moved: false,
          hoverSlot: findRatioSlot(e.clientX, e.clientY)
        });
      };

      useEffect(() => {
        if (!dragRatioKey) return;
        const onMove = (e) => {
          const dist = Math.hypot(e.clientX - dragRatioKey.startX, e.clientY - dragRatioKey.startY);
          const moved = dragRatioKey.moved || dist >= 8;
          setDragRatioKey(prev => prev ? {
            ...prev,
            clientX: e.clientX,
            clientY: e.clientY,
            moved,
            hoverSlot: findRatioSlot(e.clientX, e.clientY)
          } : null);
        };
        const onUp = (e) => {
          const cur = dragRatioKey;
          setDragRatioKey(null);
          if (!cur) return;
          if (!cur.moved) {
            handleInputKey(cur.key);
          } else {
            const slot = findRatioSlot(e.clientX, e.clientY);
            if (slot) handleDropRatioSlot(cur.key, slot);
          }
        };
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
        window.addEventListener('pointercancel', onUp);
        return () => {
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
          window.removeEventListener('pointercancel', onUp);
        };
      }, [dragRatioKey, question, stage, isLockedSuccess, selectedNumerator, selectedDenominator, pickOrder]);

      const getDisplayVal = (key) => !question ? '' : key === 'x' ? question.xStr : key === 'y' ? question.yStr : question.rStr;
      const isSuccessKey = (k) => Boolean(isLockedSuccess && question && (question.correctNumeratorKey === k || question.correctDenominatorKey === k));
      const rayAngles = Array.from({ length: 24 }, (_, i) => i * 15);
      const currentRad = (currentAngle * Math.PI) / 180;
      const ptTerminal = { x: origin.x + R * Math.cos(currentRad), y: origin.y - R * Math.sin(currentRad) };
      const isLv8NumTurn = (pickOrder === 'num' && !selectedNumerator) || (pickOrder === 'den' && selectedDenominator && !selectedNumerator);
      const isLv8DenTurn = (pickOrder === 'den' && !selectedDenominator) || (pickOrder === 'num' && selectedNumerator && !selectedDenominator);

      const renderSvgValLabel = (prefix, rawVal, fgColor) => {
        const val = String(rawVal);
        if (!val.includes('√')) {
          return (
            <text x="0" y="1" fill={fgColor} fontSize="15.5" fontWeight="900" textAnchor="middle" dominantBaseline="middle">
              {prefix}{val}
            </text>
          );
        }
        const idx = val.indexOf('√');
        const before = val.slice(0, idx);
        const rad = val.slice(idx + 1);
        const fullPrefix = `${prefix}${before}`;
        const prefixX = fullPrefix.length >= 3 ? -18 : -15;
        const tickX = fullPrefix.length >= 3 ? -1 : -2;
        return (
          <g>
            <text x={prefixX} y="1" fill={fgColor} fontSize="15" fontWeight="900" textAnchor="middle" dominantBaseline="middle">{fullPrefix}</text>
            <path d={`M ${tickX} 1.5 L ${tickX + 2.2} 0 L ${tickX + 4.4} 6.5 L ${tickX + 8.8} -7 L ${tickX + 21} -7`} fill="none" stroke={fgColor} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" />
            <text x={tickX + 15} y="2" fill={fgColor} fontSize="15" fontWeight="900" textAnchor="middle" dominantBaseline="middle">{rad}</text>
          </g>
        );
      };

      return (
        <div ref={containerRef} className="w-full h-full flex-1 flex flex-col justify-between pt-0.5 pb-1 relative animate-jelly min-h-0">

          {gameState === 'idle' && (
            <div className="flex-1 my-3 bg-white/95 rounded-3xl border-4 border-indigo-950 p-5 shadow-2xl flex flex-col justify-between text-center items-center">
              <div className="w-full space-y-2.5 pt-2">
                <div className="w-20 h-20 mx-auto rounded-3xl bg-violet-100 border-4 border-violet-500 flex items-center justify-center text-4xl shadow-inner animate-bounce">🔭</div>
                <h2 className="text-2xl font-black text-indigo-950 tracking-wide">星象羅盤師</h2>
                <div className="text-xs font-black text-violet-700 bg-violet-50 border border-violet-200 rounded-full px-3 py-1 inline-block">① 轉終邊 ➔ ② 填 x·y·r ➔ ③ 求比值</div>
              </div>
              <CompactStarPills starsThreshold={starsThreshold} livesMode maxLives={maxLives} />
              <div className="w-full space-y-2">
                <FractionOrderButtons onStartWithOrder={startGame} />
                <button onClick={onBackToMap} className="w-full py-2 text-xs font-bold text-slate-400 hover:text-slate-600">返回聖域地圖</button>
              </div>
            </div>
          )}

          {gameState === 'playing' && question && (
            <div className={`flex-1 min-h-0 flex flex-col justify-between gap-2 overflow-hidden pb-0.5 ${feedbackAnim}`}>
              <GameHUD
                progress={progress}
                starsThreshold={starsThreshold}
                lives={lives}
                maxLives={maxLives}
                healStreak={healStreak}
                healTarget={healTarget}
                onManualEnd={finishNow}
                onOpenGuide={openGuide}
              />

              <div className={`flex-1 min-h-0 bg-white rounded-3xl border-3 border-indigo-950 shadow-xl flex flex-col overflow-hidden transition-all duration-150 ${isLockedSuccess ? 'ring-4 ring-emerald-400/75' : ''}`}>
                <StagePhaseStrip phase={progress >= starsThreshold[1] ? 2 : progress >= starsThreshold[0] ? 1 : 0} labels={['單圈正特殊角 • 轉終邊 → 貼邊 → 定義', '加入象限角 • 軸上點 (x, y, r) 求值', '綜合特殊角 × 象限角 • 獨立推導比值']} />
                <div data-coach="lv11-target" className="bg-gradient-to-r from-violet-600 to-indigo-700 h-[66px] px-3.5 flex justify-between items-center text-white border-b-2 border-indigo-950 shrink-0">
                  <div className="flex items-center gap-1.5 min-w-0">
                    <span className="text-base sm:text-xl font-serif font-black shrink-0">{question.targetFunc}({question.targetAngle}°) =</span>
                    {(stage === 'rotate' || stage === 'assign') && (
                      <span className="inline-flex items-center justify-center min-w-[30px] h-[30px] px-2 rounded-lg bg-white/15 border border-white/40 text-amber-200 font-serif font-black text-base sm:text-lg shrink-0">?</span>
                    )}
                    {stage === 'define' && (
                      <div className="flex items-center gap-1.5 shrink-0">
                        <div data-coach="lv11-ratio-box" className="flex flex-col items-center">
                          <div
                            ref={numSlotRef}
                            onClick={() => { if (selectedNumerator && !isLockedSuccess) { audio.sfxClick(); setSelectedNumerator(null); } }}
                            className={`min-w-[56px] px-2 h-6 rounded-lg border-2 flex items-center justify-center font-bold text-xs transition-all ${
                              dragRatioKey?.hoverSlot === 'num'
                                ? 'border-emerald-300 bg-emerald-400/50 text-white scale-110 shadow-[0_0_12px_rgba(52,211,153,0.8)]'
                                : selectedNumerator
                                ? 'bg-emerald-400 border-emerald-200 text-emerald-950 font-black cursor-pointer active:scale-95'
                                : isLv8NumTurn
                                ? 'border-amber-300 bg-amber-400/30 text-amber-100 animate-pulse shadow-[0_0_10px_rgba(251,191,36,0.6)]'
                                : 'border-dashed border-white/40 text-violet-200/70 bg-white/5'
                            }`}
                          >
                            <span>{selectedNumerator ? <SqrtText text={`${selectedNumerator} (${getDisplayVal(selectedNumerator)})`} /> : '分子'}</span>
                          </div>
                          <div className="w-full h-0.5 bg-white/70 my-0.5"></div>
                          <div
                            ref={denSlotRef}
                            onClick={() => { if (selectedDenominator && !isLockedSuccess) { audio.sfxClick(); setSelectedDenominator(null); } }}
                            className={`min-w-[56px] px-2 h-6 rounded-lg border-2 flex items-center justify-center font-bold text-xs transition-all ${
                              dragRatioKey?.hoverSlot === 'den'
                                ? 'border-amber-300 bg-amber-400/50 text-white scale-110 shadow-[0_0_12px_rgba(251,191,36,0.8)]'
                                : selectedDenominator
                                ? 'bg-amber-400 border-amber-200 text-amber-950 font-black cursor-pointer active:scale-95'
                                : isLv8DenTurn
                                ? 'border-amber-300 bg-amber-400/30 text-amber-100 animate-pulse shadow-[0_0_10px_rgba(251,191,36,0.6)]'
                                : 'border-dashed border-white/40 text-violet-200/70 bg-white/5'
                            }`}
                          >
                            <span>{selectedDenominator ? <SqrtText text={`${selectedDenominator} (${getDisplayVal(selectedDenominator)})`} /> : '分母'}</span>
                          </div>
                        </div>
                        {isLockedSuccess && (
                          <div className="inline-flex items-center gap-1.5 text-amber-200 font-black animate-jelly shrink-0">
                            <span className="text-base sm:text-lg">=</span>
                            <FracText value={question.exactValText} size="xs" barClass="bg-amber-200" className="text-amber-200" />
                          </div>
                        )}
                        <SuccessBadge show={isLockedSuccess} />
                      </div>
                    )}
                  </div>
                  {(stage === 'rotate' || stage === 'assign') && (
                    <div className="flex items-center gap-1.5 shrink-0">
                      {stage === 'rotate' && (
                        <>
                          <span className="text-xs font-black bg-amber-400/20 text-amber-200 border border-amber-300/50 px-2.5 py-1 rounded-xl whitespace-nowrap">① 拖曳終邊</span>
                          <span className="text-xs font-black bg-white/20 px-2.5 py-1 rounded-xl border border-white/40 whitespace-nowrap">
                            {currentAngle}°
                          </span>
                        </>
                      )}
                      {stage === 'assign' && (
                        <span className="text-xs font-black bg-sky-400/20 text-sky-100 border border-sky-300/50 px-2.5 py-1 rounded-xl whitespace-nowrap">② 填入 x, y, r 數值</span>
                      )}
                    </div>
                  )}
                </div>

                <div onClick={handleConfirmSkip} className="relative w-full flex-1 min-h-0 bg-white flex items-center justify-center overflow-hidden">
                  <HintBanner tip={conceptTip} />
                  <svg
                    ref={dialSvgRef}
                    data-coach="lv11-board"
                    viewBox={`0 0 ${width} ${height}`}
                    preserveAspectRatio="xMidYMid meet"
                    className={`w-full h-full object-contain select-none ${stage === 'rotate' ? 'cursor-grab active:cursor-grabbing touch-none' : ''}`}
                    onPointerDown={handleDialPointerDown}
                    onPointerMove={handleDialPointerMove}
                    onPointerUp={handleDialPointerUp}
                    onPointerCancel={handleDialPointerUp}
                    onClick={handleDialClick}
                  >
                    <circle cx={origin.x} cy={origin.y} r={R} fill="none" stroke="#e2e8f0" strokeWidth="2" />
                    <line x1={38} y1={270} x2={502} y2={270} stroke="#64748b" strokeWidth="2.2" />
                    <line x1={270} y1={38} x2={270} y2={502} stroke="#64748b" strokeWidth="2.2" />

                    {stage === 'rotate' && rayAngles.map(deg => {
                      const rRad = (deg * Math.PI) / 180;
                      const isAxis = deg % 90 === 0;
                      const isSpecial = (deg % 30 === 0 || deg % 45 === 0) && !isAxis;
                      return (
                        <line
                          key={deg}
                          x1={origin.x}
                          y1={origin.y}
                          x2={origin.x + R * Math.cos(rRad)}
                          y2={origin.y - R * Math.sin(rRad)}
                          stroke={isAxis ? '#94a3b8' : isSpecial ? '#cbd5e1' : '#e2e8f0'}
                          strokeWidth={isAxis ? 2.4 : isSpecial ? 1.8 : 1.3}
                          strokeDasharray={isAxis ? undefined : isSpecial ? '5 5' : '4 4'}
                          opacity={isAxis ? 0.85 : isSpecial ? 0.95 : 0.85}
                        />
                      );
                    })}
                    {stage === 'rotate' ? [
                      { deg: 0, x: 492, y: 270 },
                      { deg: 90, x: 270, y: 52 },
                      { deg: 180, x: 44, y: 270 },
                      { deg: 270, x: 270, y: 492 }
                    ].map(ax => (
                      <text key={ax.deg} x={ax.x} y={ax.y} fill="#64748b" fontSize="14" fontWeight="900" textAnchor="middle" dominantBaseline="middle">{ax.deg}°</text>
                    )) : (
                      <g className="pointer-events-none">
                        <text x="506" y="255" fill="#64748b" fontSize="20" fontWeight="bold" textAnchor="middle">x</text>
                        <text x="285" y="48" fill="#64748b" fontSize="20" fontWeight="bold">y</text>
                      </g>
                    )}

                    {stage === 'rotate' ? (
                      <g>
                        <line x1={origin.x} y1={origin.y} x2={origin.x + R} y2={origin.y} stroke="#ef4444" strokeWidth="6" strokeLinecap="round" opacity="0.7" />
                        <g transform={`translate(${origin.x + 126}, ${origin.y + 24})`} className="pointer-events-none">
                          <rect x="-22" y="-11" width="44" height="22" rx="7" fill="#ffffff" stroke="#ef4444" strokeWidth="1.5" />
                          <text x="0" y="1" fill="#b91c1c" fontSize="11.5" fontWeight="900" textAnchor="middle" dominantBaseline="middle">始邊</text>
                        </g>
                        {currentAngle > 0 && (() => {
                          const arcR = 44;
                          const endX = origin.x + arcR * Math.cos(currentRad);
                          const endY = origin.y - arcR * Math.sin(currentRad);
                          const largeArc = currentAngle > 180 ? 1 : 0;
                          return (
                            <g className="pointer-events-none">
                              <path
                                d={`M ${origin.x} ${origin.y} L ${origin.x + arcR} ${origin.y} A ${arcR} ${arcR} 0 ${largeArc} 0 ${endX} ${endY} Z`}
                                fill="rgba(251, 191, 36, 0.14)"
                                stroke="none"
                              />
                              <path
                                d={`M ${origin.x + arcR} ${origin.y} A ${arcR} ${arcR} 0 ${largeArc} 0 ${endX} ${endY}`}
                                fill="none"
                                stroke="#f59e0b"
                                strokeWidth="4"
                                strokeLinecap="round"
                                opacity="0.85"
                              />
                            </g>
                          );
                        })()}
                        <line x1={origin.x} y1={origin.y} x2={ptTerminal.x} y2={ptTerminal.y} stroke="#3b82f6" strokeWidth="8" strokeLinecap="round" />
                        <g data-coach="lv11-dial" transform={`translate(${ptTerminal.x}, ${ptTerminal.y})`}>
                          <circle cx="0" cy="0" r={isDragging ? 22 : 18} fill="#2563eb" stroke="#ffffff" strokeWidth="4" />
                          <circle cx="0" cy="0" r="6" fill="#ffffff" />
                          <g transform={`translate(${Math.cos(currentRad) >= 0 ? 34 : -34}, ${Math.sin(currentRad) >= 0 ? -24 : 24})`} className="pointer-events-none">
                            <rect x="-22" y="-11" width="44" height="22" rx="8" fill="#ffffff" stroke="#3b82f6" strokeWidth="1.6" />
                            <text x="0" y="1" fill="#1d4ed8" fontSize="11.5" fontWeight="900" textAnchor="middle" dominantBaseline="middle">終邊</text>
                          </g>
                        </g>
                      </g>
                    ) : (
                      <g key={question.targetAngle + '_' + question.targetFunc}>
                        {question.principal > 0 && (() => {
                          const arcR = 38;
                          const endRad = (question.principal * Math.PI) / 180;
                          const endX = origin.x + arcR * Math.cos(endRad);

    // ==================== 第 10 關組件：正負傳送帶（分類滑卡） ====================
    const LV10_PHASE0_POOL = [
      { id: 'p0_sin40', expr: 'sin 40°', ans: 'pos', tip: '40° 在第 I 象限，所有函數皆正 (> 0)' },

    const LV10_PHASE1_POOL = [

      { id: 'p1_cos_n40', expr: 'cos(-40°)', ans: 'pos', tip: '-40° 在第 IV 象限，cos > 0' },
      { id: 'p1_tan_n50', expr: 'tan(-50°)', ans: 'neg', tip: '-50° 在第 IV 象限，tan < 0' },

      { id: 'p1_cos_n210', expr: 'cos(-210°)', ans: 'neg', tip: '-210° 同界 150°（第 II 象限），cos < 0' },

    const LV10_PHASE2_POOL = [
      { id: 'p2_q1_sc', lines: ['sin θ > 0', 'cos θ > 0'], ans: '1', tip: 'y > 0 且 x > 0 → 第 I 象限' },
      { id: 'p2_q1_ct', lines: ['cos θ > 0', 'tan θ > 0'], ans: '1', tip: 'cos>0 (I,IV) 與 tan>0 (I,III) → 第 I 象限' },
      { id: 'p2_q1_st', lines: ['sin θ > 0', 'tan θ > 0'], ans: '1', tip: 'sin>0 (I,II) 與 tan>0 (I,III) → 第 I 象限' },
      { id: 'p2_q2_sc', lines: ['sin θ > 0', 'cos θ < 0'], ans: '2', tip: 'y > 0 且 x < 0 → 第 II 象限' },

      { id: 'p2_q2_ct', lines: ['cos θ < 0', 'tan θ < 0'], ans: '2', tip: 'cos<0 (II,III) 與 tan<0 (II,IV) → 第 II 象限' },
      { id: 'p2_q3_sc', lines: ['sin θ < 0', 'cos θ < 0'], ans: '3', tip: 'y < 0 且 x < 0 → 第 III 象限' },

      { id: 'p2_q3_ct', lines: ['cos θ < 0', 'tan θ > 0'], ans: '3', tip: 'cos<0 (II,III) 與 tan>0 (I,III) → 第 III 象限' },

    const Level8QuadrantSignMaster = ({ currentStars, onUpdateStars, onCompleteLevel, onBackToMap, hasSeenGuide = false, onMarkGuideSeen }) => {
      const { isRelaxMode } = React.useContext(GameModeContext);
      const starsThreshold = [2, 5, 9];

      const {

      const [question, setQuestion] = useState(null);
      const [nextPreview, setNextPreview] = useState(null);
      const [isTransitioning, setIsTransitioning] = useState(false);
      const [dragOffset, setDragOffset] = useState({ x: 0, y: 0 });
      const [isDragging, setIsDragging] = useState(false);
      const [flyOutTarget, setFlyOutTarget] = useState(null);
      const [feedbackAnim, setFeedbackAnim] = useState('');
      const [wrongTargetKey, setWrongTargetKey] = useState(null);
      const [conceptTip, setConceptTip] = useState(null);
      const { showGuide, guideMode, openGuide, dismissGuide } = useLevelGuide(currentStars, hasSeenGuide, onMarkGuideSeen);

      const containerRef = useRef(null);
      const bag0Ref = useRef([]);
      const bag1Ref = useRef([]);
      const bag2Ref = useRef([]);
      const lastIdRef = useRef(null);
      const dragStartRef = useRef(null);
      const nextPreviewRef = useRef(null);
      const questionErrorsRef = useRef(0);
      const confirmTimerRef = useRef(null);
      const pendingNextRef = useRef(null);
      const handleConfirmSkip = () => {
        if (!pendingNextRef.current) return;
        clearTimeout(confirmTimerRef.current);
        const fn = pendingNextRef.current;
        pendingNextRef.current = null;
        audio.sfxClick();
        fn();
      };
      useEffect(() => () => clearTimeout(confirmTimerRef.current), []);

      const drawFromBag = (bagRef, sourcePool) => {
        if (bagRef.current.length === 0) {
          let fresh = shuffle(sourcePool);
          if (fresh.length > 1 && fresh[0].id === lastIdRef.current) {
            [fresh[0], fresh[fresh.length - 1]] = [fresh[fresh.length - 1], fresh[0]];
          }
          bagRef.current = fresh;
        }
        const item = bagRef.current.shift();
        lastIdRef.current = item.id;
        return item;
      };

      const pickQuestionForScore = (curProg) => {
        const phase = curProg >= starsThreshold[1] ? 2 : curProg >= starsThreshold[0] ? 1 : 0;
        const pool = phase === 0 ? LV10_PHASE0_POOL : phase === 1 ? LV10_PHASE1_POOL : LV10_PHASE2_POOL;
        const bag = phase === 0 ? bag0Ref : phase === 1 ? bag1Ref : bag2Ref;
        return { phase, ...drawFromBag(bag, pool) };
      };

      const advanceCard = (curProg) => {
        const curPhase = curProg >= starsThreshold[1] ? 2 : curProg >= starsThreshold[0] ? 1 : 0;
        const currentCard = nextPreviewRef.current && nextPreviewRef.current.phase === curPhase
          ? nextPreviewRef.current
          : pickQuestionForScore(curProg);
        const upcoming = pickQuestionForScore(curProg);
        nextPreviewRef.current = upcoming;
        questionErrorsRef.current = 0;
        setQuestion(currentCard);
        setNextPreview(upcoming);
        setDragOffset({ x: 0, y: 0 });
        setFlyOutTarget(null);
        setIsTransitioning(false);
        setConceptTip(null);
      };

      const startGame = () => {
        bag0Ref.current = []; bag1Ref.current = []; bag2Ref.current = []; lastIdRef.current = null;
        nextPreviewRef.current = null;
        setFeedbackAnim('');
        setWrongTargetKey(null); setConceptTip(null);
        setDragOffset({ x: 0, y: 0 }); setFlyOutTarget(null);
        setIsTransitioning(false);
        const initProg = startSession();
        advanceCard(initProg);
        audio.init();
      };

      useEffect(() => { startGame(); }, []);

      const getFlyVector = (choice) => {
        if (choice === 'neg') return { x: -240, y: -10 };
        if (choice === 'pos') return { x: 240, y: -10 };
        if (choice === '1') return { x: 180, y: -150 };
        if (choice === '2') return { x: -180, y: -150 };
        if (choice === '3') return { x: -180, y: 150 };
        if (choice === '4') return { x: 180, y: 150 };
        return { x: 0, y: 200 };
      };

      const submitSort = (choice) => {
        if (gameState !== 'playing' || !question || isTransitioning || (!isRelaxMode && lives <= 0)) return;
        if (choice === question.ans) {
          if (showGuide) dismissGuide();
          setIsTransitioning(true);
          setConceptTip(null);
          const errs = questionErrorsRef.current;
          audio.sfxSwipeSort(false, 0);
          setFlyOutTarget(getFlyVector(choice));
          setFeedbackAnim('animate-correct');
          const { completed, nextProgress } = recordCorrect({ wasMissed: errs > 0, delayEndMs: 260 });
          setTimeout(() => {
            setFeedbackAnim('');
            if (!completed) advanceCard(nextProgress);
          }, 240);
        } else {
          audio.sfxError();
          questionErrorsRef.current += 1;
          const { gameOver } = recordWrong({ delayEndMs: 360 });
          setWrongTargetKey(choice);
          setDragOffset({ x: 0, y: 0 });
          if (question?.tip) setConceptTip({ text: question.tip, id: Date.now() });
          setFeedbackAnim('animate-shake');
          if (!gameOver) {
            setTimeout(() => {
              setFeedbackAnim('');
              setWrongTargetKey(null);
            }, 350);
          }
        }
      };

      const getHoverTarget = (dx, dy) => {
        if (!question) return null;
        if (question.phase < 2) {
          if (dx < -45) return 'neg';
          if (dx > 45) return 'pos';
          return null;
        }
        if (Math.hypot(dx, dy) < 48) return null;
        if (dx >= 0 && dy < 0) return '1';
        if (dx < 0 && dy < 0) return '2';
        if (dx < 0 && dy >= 0) return '3';
        return '4';
      };

      const handleCardPointerDown = (e) => {
        if (gameState !== 'playing' || isTransitioning) return;
        e.currentTarget.setPointerCapture(e.pointerId);
        dragStartRef.current = { x: e.clientX, y: e.clientY };
        setIsDragging(true);
      };

      const handleCardPointerMove = (e) => {
        if (!isDragging || !dragStartRef.current) return;
        const dx = e.clientX - dragStartRef.current.x;
        const dy = question?.phase < 2
          ? (e.clientY - dragStartRef.current.y) * 0.22
          : (e.clientY - dragStartRef.current.y);
        setDragOffset({ x: dx, y: dy });
      };

      const handleCardPointerUp = () => {
        if (!isDragging) return;
        setIsDragging(false);
        dragStartRef.current = null;
        const target = getHoverTarget(dragOffset.x, dragOffset.y);
        if (target) {
          submitSort(target);
        } else {
          setDragOffset({ x: 0, y: 0 });
        }
      };

      const isFever = healStreak >= 4;
      const isWarm = healStreak >= 2 && healStreak < 4;
      const hoverTarget = isDragging ? getHoverTarget(dragOffset.x, dragOffset.y) : null;
      const cardTransform = flyOutTarget
        ? `translate(${flyOutTarget.x}px, ${flyOutTarget.y}px) rotate(${flyOutTarget.x * 0.08}deg) scale(0.82)`
        : `translate(${dragOffset.x}px, ${dragOffset.y}px) rotate(${dragOffset.x * 0.055}deg)`;

      return (
        <div ref={containerRef} className="w-full h-full flex-1 flex flex-col justify-between pt-0.5 pb-1 relative animate-jelly min-h-0">
          {gameState === 'idle' && (
            <div className="flex-1 my-3 bg-white/95 rounded-3xl border-4 border-indigo-950 p-5 shadow-2xl flex flex-col justify-between text-center items-center">
              <div className="w-full space-y-2.5 pt-2">
                <div className="w-20 h-20 mx-auto rounded-3xl bg-rose-100 border-4 border-rose-500 flex items-center justify-center text-4xl shadow-inner animate-bounce">⚡</div>
                <h2 className="text-2xl font-black text-indigo-950 tracking-wide">正負傳送帶</h2>
                <p className="text-xs text-slate-500 font-bold leading-relaxed max-w-xs mx-auto">
                  滑動或點擊分類中央題卡！前段分流 <span className="text-rose-600 font-black">左 &lt; 0</span> / <span className="text-emerald-600 font-black">右 &gt; 0</span>，高階切換為<span className="text-indigo-600 font-black">四角象限盤</span>！連對 4 題啟動 FEVER！
                </p>
              </div>
              <CompactStarPills starsThreshold={starsThreshold} livesMode maxLives={maxLives} />
              <div className="w-full space-y-2">
                <button onClick={startGame} className="w-full py-4 btn-3d-purple text-white font-black text-lg rounded-2xl shadow-xl tracking-wider active:scale-95">{isRelaxMode ? '🌱 開始休閒練習！' : '🚀 開始試煉！'}</button>
                <button onClick={onBackToMap} className="w-full py-2 text-xs font-bold text-slate-400 hover:text-slate-600">返回聖域地圖</button>
              </div>
            </div>
          )}

          {gameState === 'playing' && question && (
            <div className={`flex-1 min-h-0 flex flex-col justify-between gap-2 overflow-hidden pb-0.5 ${feedbackAnim}`}>
              <GameHUD
                progress={progress}
                starsThreshold={starsThreshold}
                lives={lives}
                maxLives={maxLives}
                healStreak={healStreak}
                healTarget={healTarget}
                onManualEnd={finishNow}
                onOpenGuide={openGuide}
              />

              <div className={`flex-1 min-h-0 rounded-3xl border-3 shadow-xl flex flex-col overflow-hidden transition-all duration-200 relative ${
                isFever
                  ? 'bg-gradient-to-b from-amber-950 via-purple-950 to-slate-950 border-amber-400 ring-4 ring-amber-400/75'
                  : isWarm
                  ? 'bg-gradient-to-b from-indigo-950 via-purple-950 to-slate-950 border-sky-400 ring-2 ring-sky-400/50'
                  : 'bg-gradient-to-b from-slate-900 via-indigo-950 to-slate-950 border-indigo-950'
              }`}>
                <div className={`h-6 px-3.5 flex justify-between items-center text-white border-b shrink-0 ${
                  isFever ? 'bg-amber-500/20 border-amber-400/50' : 'bg-slate-900/90 border-white/10'
                }`}>
                  <div className="flex items-center gap-1.5 min-w-0">
                    <span className={`w-1.5 h-1.5 rounded-full shrink-0 ${question.phase === 0 ? 'bg-emerald-400' : question.phase === 1 ? 'bg-sky-400' : 'bg-amber-400'}`} />
                    <span className="text-[11px] font-bold text-slate-200 truncate">
                      {question.phase === 0 ? '單一三角比 • 左右正負聖壇分流' : question.phase === 1 ? '進階角度與複合正負判別' : '四象限條件交集判別'}
                    </span>
                  </div>
                  {isFever ? (
                    <span className="text-[10px] font-black bg-amber-400 text-amber-950 px-2 py-0.5 rounded-full animate-pulse shadow shrink-0">🔥 連對 {healStreak}</span>
                  ) : isWarm ? (
                    <span className="text-[10px] font-black bg-sky-500 text-white px-2 py-0.5 rounded-full shrink-0">⚡ 連對 {healStreak}</span>
                  ) : null}
                </div>

                <div className="relative flex-1 min-h-0 p-2.5 flex flex-col justify-between overflow-hidden select-none">
                  <HintBanner tip={conceptTip} />

                  {question.phase < 2 ? (
                    <div className="flex-1 min-h-0 grid grid-cols-[78px_1fr_78px] sm:grid-cols-[96px_1fr_96px] items-center gap-2">
                      <button
                        data-coach="lv11-neg"
                        onClick={() => submitSort('neg')}
                        className={`h-full max-h-[260px] rounded-2xl border-2 flex flex-col items-center justify-center gap-1 transition-all active:scale-95 ${
                          wrongTargetKey === 'neg'
                            ? 'bg-red-500/80 border-red-200 text-white btn-wrong-flash'
                            : hoverTarget === 'neg'
                            ? 'bg-rose-500 border-white text-white scale-105 shadow-[0_0_24px_rgba(244,63,94,0.8)]'
                            : 'bg-rose-500/20 border-rose-400/60 text-rose-200 hover:bg-rose-500/35'
                        }`}
                      >
                        <span className="text-2xl sm:text-3xl font-mono font-black">&lt; 0</span>
                        <span className="text-xs font-black">負值聖壇</span>
                        <span className="text-[10px] opacity-80">⬅ 左滑</span>
                      </button>

                      <div className="relative h-full flex items-center justify-center">
                        {nextPreview && nextPreview.phase === question.phase && (
                          <div className="absolute w-full max-w-[220px] h-[136px] rounded-3xl bg-white/10 border border-white/20 scale-90 translate-y-4 opacity-50 flex items-center justify-center pointer-events-none px-2">
                            <span className="font-serif font-bold text-white/60 text-xs sm:text-sm whitespace-nowrap">{nextPreview.expr}</span>
                          </div>
                        )}
                        <div
                          data-coach="lv11-card"
                          onPointerDown={handleCardPointerDown}
                          onPointerMove={handleCardPointerMove}
                          onPointerUp={handleCardPointerUp}
                          onPointerCancel={handleCardPointerUp}
                          style={{
                            transform: cardTransform,
                            transition: isDragging ? 'none' : flyOutTarget ? 'transform 0.2s ease-out, opacity 0.2s ease-out' : 'transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1)',
                            opacity: flyOutTarget ? 0 : 1
                          }}
                          className={`relative z-10 w-full max-w-[240px] min-h-[148px] rounded-3xl bg-white border-4 px-3 py-4 shadow-2xl flex items-center justify-center text-center cursor-grab active:cursor-grabbing touch-none ${
                            isFever ? 'border-amber-400 shadow-[0_0_28px_rgba(251,191,36,0.55)]' : 'border-indigo-300'
                          }`}
                        >
                          <div className={`font-serif font-black text-indigo-950 whitespace-nowrap ${
                            question.expr.length > 12 ? 'text-lg sm:text-xl' : 'text-2xl sm:text-3xl'
                          }`}>{question.expr}</div>
                        </div>
                      </div>

                      <button
                        data-coach="lv11-pos"
                        onClick={() => submitSort('pos')}
                        className={`h-full max-h-[260px] rounded-2xl border-2 flex flex-col items-center justify-center gap-1 transition-all active:scale-95 ${
                          wrongTargetKey === 'pos'
                            ? 'bg-red-500/80 border-red-200 text-white btn-wrong-flash'
                            : hoverTarget === 'pos'
                            ? 'bg-emerald-500 border-white text-white scale-105 shadow-[0_0_24px_rgba(52,211,153,0.8)]'
                            : 'bg-emerald-500/20 border-emerald-400/60 text-emerald-200 hover:bg-emerald-500/35'
                        }`}
                      >
                        <span className="text-2xl sm:text-3xl font-mono font-black">&gt; 0</span>
                        <span className="text-xs font-black">正值聖壇</span>
                        <span className="text-[10px] opacity-80">右滑 ➡</span>
                      </button>
                    </div>
                  ) : (
                    <div className="flex-1 min-h-0 flex flex-col justify-between gap-2 relative">
                      <div className="grid grid-cols-2 gap-2 flex-1 min-h-0">
                        {[
                          { key: '2', label: '第 II 象限', sub: '↖ 左上' },
                          { key: '1', label: '第 I 象限', sub: '↗ 右上' },
                          { key: '3', label: '第 III 象限', sub: '↙ 左下' },
                          { key: '4', label: '第 IV 象限', sub: '↘ 右下' }
                        ].map(item => (
                          <button
                            key={item.key}
                            onClick={() => submitSort(item.key)}
                            className={`rounded-2xl border-2 flex flex-col items-center justify-center p-2 transition-all active:scale-95 ${
                              wrongTargetKey === item.key
                                ? 'bg-red-500/80 border-red-200 text-white btn-wrong-flash'
                                : hoverTarget === item.key
                                ? 'bg-amber-400 border-white text-amber-950 scale-[1.03] shadow-[0_0_20px_rgba(251,191,36,0.8)]'
                                : 'bg-indigo-900/55 border-indigo-400/50 text-indigo-100 hover:bg-indigo-800/70'
                            }`}
                          >
                            <span className="text-lg sm:text-xl font-serif font-black">{item.label}</span>
                            <span className="text-[10px] font-bold opacity-75">{item.sub}</span>
                          </button>
                        ))}
                      </div>

                      <div className="pointer-events-none absolute inset-0 flex items-center justify-center">
                        <div
                          data-coach="lv11-quadcard"
                          onPointerDown={handleCardPointerDown}
                          onPointerMove={handleCardPointerMove}
                          onPointerUp={handleCardPointerUp}
                          onPointerCancel={handleCardPointerUp}
                          style={{
                            transform: cardTransform,
                            transition: isDragging ? 'none' : flyOutTarget ? 'transform 0.2s ease-out, opacity 0.2s ease-out' : 'transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1)',
                            opacity: flyOutTarget ? 0 : 1
                          }}
                          className={`pointer-events-auto z-20 min-w-[170px] max-w-[240px] rounded-2xl bg-white border-4 px-4 py-3 shadow-2xl flex flex-col items-center justify-center gap-0.5 text-center cursor-grab active:cursor-grabbing touch-none ${
                            isFever ? 'border-amber-400 shadow-[0_0_26px_rgba(251,191,36,0.65)]' : 'border-indigo-400'
                          }`}
                        >
                          {(question.lines || [question.expr]).map((line, idx) => (
                            <div key={idx} className="text-base sm:text-lg font-serif font-black text-indigo-950 leading-snug whitespace-nowrap">{line}</div>
                          ))}
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {gameState === 'ended' && (
            <LevelResultScreen
              score={finalScore}
              baseScore={baseScore}
              earnedStars={earnedStars}
              correctCount={correctCount}
              wrongCount={wrongCount}
              lives={lives}
              progress={progress}
              targetTotal={starsThreshold[2]}
              elapsedSec={elapsedSec}
              lifeBonus={lifeBonus}
              accuracyBonus={accuracyBonus}
              speedBonus={speedBonus}
              accentClass="text-rose-600"
              onCompleteLevel={onCompleteLevel}
              onRestart={startGame}
              onBackToMap={onBackToMap}
            />
          )}

          <CoachOverlay
            containerRef={containerRef}
            active={guideMode === 'manual' || (showGuide && gameState === 'playing')}
            mode={guideMode || 'spotlight'}
            onDismiss={dismissGuide}
            steps={question?.phase < 2 ? [
              {
                target: 'lv11-card',
                text: '判斷題卡正負，左右拖曳或點擊聖壇',
                shape: 'ellipse',
                pad: 10
              },
              {
                targets: [
                  { id: 'lv11-neg', shape: 'ellipse', pad: 6 },
                  { id: 'lv11-pos', shape: 'ellipse', pad: 6 }
                ],
                target: 'lv11-neg',
                text: '負值拖左邊，正值拖右邊',
                shape: 'ellipse',
                pad: 6
              }
            ] : [
              {
                target: 'lv11-quadcard',
                text: '依正負條件，拖往對應象限',
                shape: 'ellipse',
                pad: 10
              }
            ]}
          />
        </div>
      );
    };


    // ==================== 雙欄波次配對引擎 (Lv.18) ====================
    const LevelLightingCardGame = ({ levelData, currentStars, onUpdateStars, onCompleteLevel, onBackToMap, hasSeenGuide = false, onMarkGuideSeen }) => {
      const levelConfig = levelData?.config || { quadrants: ['q1'], funcs: ['sin', 'cos', 'tan'] };
      const livesSession = useLivesLevelSession({
        starThresholds: [2, 4, 6],
        maxLives: 3,
        healTarget: 2,
        unitLabel: '波',
        currentStars,
        onUpdateStars
      });
      const gameState = livesSession.gameState;
      const [wrongCardUids, setWrongCardUids] = useState([]);
      const [conceptTip, setConceptTip] = useState(null);
      const { showGuide, guideMode, openGuide, dismissGuide } = useLevelGuide(currentStars, hasSeenGuide, onMarkGuideSeen);

      const containerRef = useRef(null);

      // 波次與動態難度狀態（左欄 3→4→5 張、右欄永遠多 1 張干擾卡 4→5→6 張）
      const [waveNumber, setWaveNumber] = useState(1);
      const [pairCount, setPairCount] = useState(3);
      const [leftCards, setLeftCards] = useState([]);
      const [rightCards, setRightCards] = useState([]);
      const [matchedUids, setMatchedUids] = useState(new Set());
      const [animatingOut, setAnimatingOut] = useState([]);
      const [selLeft, setSelLeft] = useState(null);
      const [selRight, setSelRight] = useState(null);
      const [isProcessing, setIsProcessing] = useState(false);

      const waveErrorsRef = useRef(0);
      const recentPairsRef = useRef([]);

      const formatQuestionLabel = (funcId, angleId) => {
        return `${TEXT_MAP['func'][funcId]} ${TEXT_MAP['angle_deg'][angleId]}`;
      };

      // 依波次漸進解鎖象限（第 1 波 I~II 象限、第 2 波 I~IV 象限、第 3 波起納入象限角）
      const getWaveQuadrants = useCallback((waveIdx) => {
        if (levelData && levelData.id >= 13 && levelData.id <= 18) {
          if (waveIdx === 1) return ['q1', 'q2'];
          if (waveIdx === 2) return ['q1', 'q2', 'q3', 'q4'];
          return ['q1', 'q2', 'q3', 'q4', 'axis'];
        }
        return levelConfig.quadrants || ['q1'];
      }, [levelData, levelConfig.quadrants]);

      const getWaveScopeLabel = (waveIdx) => {
        if (levelData && levelData.id >= 13 && levelData.id <= 18) {
          if (waveIdx === 1) return '第 I~II 象限特殊角配對';
          if (waveIdx === 2) return '第 I~IV 象限特殊角配對';
          return '全象限 ＋ 象限角配對';
        }
        return levelData?.subtitle || '題庫範圍';
      };

      // 象限分桶平均抽樣 ＋ 跨波防重複 ＋ 右欄多 1 張相反數干擾項發牌器
      const spawnWave = useCallback((targetPairs, waveIdx) => {
        const quads = getWaveQuadrants(waveIdx);
        const funcs = levelConfig.funcs || FUNC_TYPES;

        const recentSet = new Set(recentPairsRef.current);
        const buckets = {};
        const allPairs = [];

        quads.forEach(q => {
          const qAngles = ANGLE_GROUPS[q] || [];
          const qItems = [];
          funcs.forEach(f => {
            qAngles.forEach(a => {
              const item = {
                key: `${f}_${a}`,
                quad: q,
                funcId: f,
                angleId: a,
                valId: EVAL_MAP[f][a]
              };
              qItems.push(item);
              allPairs.push(item);
            });
          });
          buckets[q] = [
            ...shuffle(qItems.filter(p => !recentSet.has(p.key))),
            ...shuffle(qItems.filter(p => recentSet.has(p.key)))
          ];
        });

        const stageQuads = levelConfig.quadrants;
        const stageValSet = new Set();
        stageQuads.forEach(q => {
          (ANGLE_GROUPS[q] || []).forEach(a => {
            funcs.forEach(f => stageValSet.add(EVAL_MAP[f][a]));
          });
        });

        const waveUniqueValCount = new Set(allPairs.map(p => p.valId)).size;
        const maxLeftByPool = Math.min(waveUniqueValCount, Math.max(2, stageValSet.size - 1));
        const actualPairs = Math.max(2, Math.min(5, targetPairs, maxLeftByPool));

        const isGradualBroadLevel = levelData && levelData.id >= 13 && levelData.id <= 16;
        let bucketOrder = shuffle([...quads]);
        if (isGradualBroadLevel && waveIdx === 1 && quads.includes('q2') && quads.includes('q1')) {
          bucketOrder = ['q2', 'q1'];
        }

        const chosen = [];
        const usedVals = new Set();
        const usedKeys = new Set();

        let roundGuard = 0;
        while (chosen.length < actualPairs && roundGuard < 12) {
          let pickedInRound = false;
          for (const q of bucketOrder) {
            if (chosen.length >= actualPairs) break;
            const list = buckets[q] || [];
            const pickIdx = list.findIndex(item => !usedVals.has(item.valId) && !usedKeys.has(item.key));
            if (pickIdx >= 0) {
              const picked = list[pickIdx];
              usedVals.add(picked.valId);
              usedKeys.add(picked.key);
              chosen.push(picked);
              pickedInRound = true;
            }
          }
          if (!pickedInRound) break;
          roundGuard += 1;
        }

        if (chosen.length < actualPairs) {
          const fallbackPool = [
            ...shuffle(allPairs.filter(p => !recentSet.has(p.key))),
            ...shuffle(allPairs.filter(p => recentSet.has(p.key)))
          ];
          for (const item of fallbackPool) {
            if (chosen.length >= actualPairs) break;
            if (!usedVals.has(item.valId) && !usedKeys.has(item.key)) {
              usedVals.add(item.valId);
              usedKeys.add(item.key);
              chosen.push(item);
            }
          }
        }

        let distractorValId = null;
        for (const item of shuffle([...chosen])) {
          const oppVal = OPPOSITE_VAL_MAP[item.valId];
          if (oppVal && stageValSet.has(oppVal) && !usedVals.has(oppVal)) {
            distractorValId = oppVal;
            break;
          }
        }
        if (!distractorValId) {
          const unusedStageVals = shuffle(Array.from(stageValSet).filter(v => !usedVals.has(v)));
          if (unusedStageVals.length > 0) {
            distractorValId = unusedStageVals[0];
          } else {
            const fallbackGlobalVals = shuffle(Object.keys(TEXT_MAP['val']).filter(v => !usedVals.has(v)));
            distractorValId = fallbackGlobalVals[0] || '0';
          }
        }

        recentPairsRef.current = chosen.map(c => c.key);

        const now = Date.now();
        const lCards = shuffle(chosen).map((item, idx) => ({
          uid: `L_${waveIdx}_${now}_${idx}`,
          pairKey: item.key,
          funcId: item.funcId,
          angleId: item.angleId,
          valId: item.valId,
          label: formatQuestionLabel(item.funcId, item.angleId)
        }));

        const rightPool = [
          ...chosen.map(item => ({ pairKey: item.key, valId: item.valId, isDistractor: false })),
          { pairKey: 'distractor', valId: distractorValId, isDistractor: true }
        ];

        const rCards = shuffle(rightPool).map((item, idx) => ({
          uid: `R_${waveIdx}_${now}_${idx}`,
          pairKey: item.pairKey,
          valId: item.valId,
          isDistractor: item.isDistractor,
          label: TEXT_MAP['val'][item.valId]
        }));

        setPairCount(actualPairs);
        setLeftCards(lCards);
        setRightCards(rCards);
        setMatchedUids(new Set());
        setAnimatingOut([]);
        setSelLeft(null);
        setSelRight(null);
        setWrongCardUids([]);
        setConceptTip(null);
        setIsProcessing(false);
        waveErrorsRef.current = 0;
      }, [getWaveQuadrants, levelConfig.funcs, levelConfig.quadrants, levelData]);

      const startAdventureGame = () => {
        recentPairsRef.current = [];
        setWaveNumber(1);
        livesSession.startSession();
        spawnWave(3, 1);
      };

      useEffect(() => {
        startAdventureGame();
      }, []);

      const canvasRef = useRef(null);
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const parent = canvas.parentElement;
        const w = (canvas.width = parent?.clientWidth || 380);
        const h = (canvas.height = parent?.clientHeight || 640);
        const colors = ['#fde047', '#38bdf8', '#34d399', '#f472b6', '#fb923c', '#a78bfa'];
        const pieces = Array.from({ length: 72 }, () => ({
          x: Math.random() * w,
          y: -Math.random() * h * 0.45 - 10,
          vx: (Math.random() - 0.5) * 2.2,
          vy: 2.2 + Math.random() * 2.8,
          w: 6 + Math.random() * 6,
          h: 4 + Math.random() * 4,
          rot: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.22,
          color: colors[Math.floor(Math.random() * colors.length)]
        }));

        const start = performance.now();
        let rafId = null;
        const draw = (now) => {
          const elapsed = (now - start) / 1000;
          if (elapsed > 2.6) {
            ctx.clearRect(0, 0, w, h);
            return;
          }
          const alpha = elapsed > 1.9 ? Math.max(0, 1 - (elapsed - 1.9) / 0.7) : 1;
          ctx.clearRect(0, 0, w, h);
          ctx.globalAlpha = alpha;
          pieces.forEach(p => {
            p.x += p.vx + Math.sin(elapsed * 4 + p.rot) * 0.5;
            p.y += p.vy;
            p.rot += p.vRot;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
            ctx.restore();
          });
          rafId = requestAnimationFrame(draw);
        };
        rafId = requestAnimationFrame(draw);
        return () => { if (rafId) cancelAnimationFrame(rafId); };
      }, []);

      return <canvas ref={canvasRef} className="absolute inset-0 w-full h-full pointer-events-none z-40" />;
