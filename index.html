      const l21 = Math.hypot(v21.x, v21.y) || 1;
      const u21 = { x: v21.x / l21, y: v21.y / l21 };
      const v23 = { x: wP3.x - wP2.x, y: wP3.y - wP2.y };
      const l23 = Math.hypot(v23.x, v23.y) || 1;
      const u23 = { x: v23.x / l23, y: v23.y / l23 };

      const sqSize = 24;
      const pC1 = { x: wP2.x + u21.x * sqSize, y: wP2.y + u21.y * sqSize };
      const pC2 = { x: pC1.x + u23.x * sqSize, y: pC1.y + u23.y * sqSize };
      const pC3 = { x: wP2.x + u23.x * sqSize, y: wP2.y + u23.y * sqSize };
      const rightAngleSquare = `${wP2.x},${wP2.y} ${pC1.x},${pC1.y} ${pC2.x},${pC2.y} ${pC3.x},${pC3.y}`;

      const arcRad = Math.max(32, Math.min(52, Math.min(adjLen, oppLen) * 0.42));
      const vT_Other = { x: otherPt.x - targetPt.x, y: otherPt.y - targetPt.y };
      const lT_Other = Math.hypot(vT_Other.x, vT_Other.y) || 1;
      const uT_Other = { x: vT_Other.x / lT_Other, y: vT_Other.y / lT_Other };
      const vT_Right = { x: rightPt.x - targetPt.x, y: rightPt.y - targetPt.y };
      const lT_Right = Math.hypot(vT_Right.x, vT_Right.y) || 1;
      const uT_Right = { x: vT_Right.x / lT_Right, y: vT_Right.y / lT_Right };

      const arcP1 = { x: targetPt.x + uT_Right.x * arcRad, y: targetPt.y + uT_Right.y * arcRad };
      const arcP2 = { x: targetPt.x + uT_Other.x * arcRad, y: targetPt.y + uT_Other.y * arcRad };
      const cross = uT_Right.x * uT_Other.y - uT_Right.y * uT_Other.x;
      const sweep = cross > 0 ? 1 : 0;
      const arcPath = `M ${targetPt.x} ${targetPt.y} L ${arcP1.x} ${arcP1.y} A ${arcRad} ${arcRad} 0 0 ${sweep} ${arcP2.x} ${arcP2.y} Z`;
      const bisect = {
        x: targetPt.x + (uT_Right.x + uT_Other.x) * 0.5 * (arcRad + 24),
        y: targetPt.y + (uT_Right.y + uT_Other.y) * 0.5 * (arcRad + 24)
      };

      const angleName = ['θ', 'α', 'β'][Math.floor(Math.random() * 3)];
      const labels = [{ text: angleName, x: bisect.x, y: bisect.y + 6, color: '#b45309', isAngle: true }];

      const ratioSorted = [baseMap.opp, baseMap.adj, baseMap.hyp].sort((a, b) => a - b).join(':');
      const tipText = k > 1
        ? `比例 ${ratioSorted}（放大 ${k} 倍），已知 ${knownVal} → 目標 ? = ${targetVal}`
        : `畢氏三元數 ${ratioSorted}，已知 ${knownVal} → 目標 ? = ${targetVal}`;

      return {
        questionKey,
        pts: { P1: wP1, P2: wP2, P3: wP3 },
        rightAngleSquare, arcPath, labels,
        edges: edgesWithStyles,
        targetFunc,
        angleName,
        clueNum,
        clueDen,
        correctSideVal: String(targetVal),
        sideOptions,
        conceptTip: tipText
      };
    };

    // ==================== 第 4 關隨機題目生成器：黃金神殿（三段式密碼輪） ====================
    const SPECIAL_RATIO_MAP = {
      sin_30: '1/2', sin_45: '√2/2', sin_60: '√3/2',
      cos_30: '√3/2', cos_45: '√2/2', cos_60: '1/2',
      tan_30: '√3/3', tan_45: '1', tan_60: '√3'
    };
    const LV4_FUNCS = ['sin', 'cos', 'tan'];
    const LV4_DEGS = [30, 45, 60];
    const LV4_VALS = ['1/2', '√2/2', '√3/2', '√3/3', '1', '√3'];

    const buildGoldTriangleData = (deg, func, flip = 1) => {
      const stdAdj = deg === 45 ? 1 : (deg === 30 ? Math.sqrt(3) : 1);
      const stdOpp = deg === 45 ? 1 : (deg === 30 ? 1 : Math.sqrt(3));
      const stdHyp = deg === 45 ? Math.SQRT2 : 2;
      const stdAdjText = deg === 45 ? '1' : (deg === 30 ? '√3' : '1');
      const stdOppText = deg === 45 ? '1' : (deg === 30 ? '1' : '√3');
      const stdHypText = deg === 45 ? '√2' : '2';

      const scale = 300 / stdHyp;
      const adjLen = stdAdj * scale;
      const oppLen = stdOpp * scale;
      const { P1: wP1, P2: wP2, P3: wP3 } = centerTriangleBoundingBox(
        { x: 0, y: 0 },
        { x: adjLen * flip, y: 0 },
        { x: adjLen * flip, y: -oppLen }
      );
      const centroid = {
        x: (wP1.x + wP2.x + wP3.x) / 3,
        y: (wP1.y + wP2.y + wP3.y) / 3
      };

      const v21 = { x: wP1.x - wP2.x, y: wP1.y - wP2.y };
      const l21 = Math.hypot(v21.x, v21.y) || 1;
      const u21 = { x: v21.x / l21, y: v21.y / l21 };
      const v23 = { x: wP3.x - wP2.x, y: wP3.y - wP2.y };
      const l23 = Math.hypot(v23.x, v23.y) || 1;
      const u23 = { x: v23.x / l23, y: v23.y / l23 };

      const sqSize = 24;
      const pC1 = { x: wP2.x + u21.x * sqSize, y: wP2.y + u21.y * sqSize };
      const pC2 = { x: pC1.x + u23.x * sqSize, y: pC1.y + u23.y * sqSize };
      const pC3 = { x: wP2.x + u23.x * sqSize, y: wP2.y + u23.y * sqSize };
      const rightAngleSquare = `${wP2.x},${wP2.y} ${pC1.x},${pC1.y} ${pC2.x},${pC2.y} ${pC3.x},${pC3.y}`;

      const arcRad = 52;
      const vT_Other = { x: wP3.x - wP1.x, y: wP3.y - wP1.y };
      const lT_Other = Math.hypot(vT_Other.x, vT_Other.y) || 1;
      const uT_Other = { x: vT_Other.x / lT_Other, y: vT_Other.y / lT_Other };
      const vT_Right = { x: wP2.x - wP1.x, y: wP2.y - wP1.y };
      const lT_Right = Math.hypot(vT_Right.x, vT_Right.y) || 1;
      const uT_Right = { x: vT_Right.x / lT_Right, y: vT_Right.y / lT_Right };

      const arcP1 = { x: wP1.x + uT_Right.x * arcRad, y: wP1.y + uT_Right.y * arcRad };
      const arcP2 = { x: wP1.x + uT_Other.x * arcRad, y: wP1.y + uT_Other.y * arcRad };
      const cross = uT_Right.x * uT_Other.y - uT_Right.y * uT_Other.x;
      const sweep = cross > 0 ? 1 : 0;
      const arcPath = `M ${wP1.x} ${wP1.y} L ${arcP1.x} ${arcP1.y} A ${arcRad} ${arcRad} 0 0 ${sweep} ${arcP2.x} ${arcP2.y} Z`;
      const bisect = {
        x: wP1.x + (uT_Right.x + uT_Other.x) * 0.5 * (arcRad + 26),
        y: wP1.y + (uT_Right.y + uT_Other.y) * 0.5 * (arcRad + 26)
      };

      const roleMap = {
        sin: { num: 'opp', den: 'hyp' },
        cos: { num: 'adj', den: 'hyp' },
        tan: { num: 'opp', den: 'adj' }
      }[func];

      const edges = [
        { id: 'hyp', p1: wP1, p2: wP3, text: stdHypText },
        { id: 'opp', p1: wP3, p2: wP2, text: stdOppText },
        { id: 'adj', p1: wP1, p2: wP2, text: stdAdjText }
      ].map(e => ({
        ...e,
        role: e.id === roleMap.num ? 'num' : e.id === roleMap.den ? 'den' : 'unused',
        midPt: computeOutwardMidPt(e.p1, e.p2, centroid, 24)
      }));

      return {
        pts: { P1: wP1, P2: wP2, P3: wP3 },
        rightAngleSquare,
        arcPath,
        degLabel: { text: `${deg}°`, x: bisect.x, y: bisect.y + 6 },
        edges
      };
    };

    const generateLevel4Question = (phase, forcedVal = null) => {
      const targetVal = forcedVal || LV4_VALS[Math.floor(Math.random() * LV4_VALS.length)];
      const validPairs = [];
      LV4_FUNCS.forEach(f => LV4_DEGS.forEach(d => {
        if (SPECIAL_RATIO_MAP[`${f}_${d}`] === targetVal) validPairs.push({ f, d });
      }));

      // 統一單鎖過關；對雙解數值隨機混入「指定函數(優先 cos)」或「指定角度」單輪鎖定
      let lockType = 'none';
      let lockedFunc = null;
      let lockedDeg = null;
      if (validPairs.length > 1) {
        const r = Math.random();
        if (r < 0.55) {
          lockType = 'func';
          const cosPair = validPairs.find(p => p.f === 'cos');
          const picked = (cosPair && Math.random() < 0.78) ? cosPair : validPairs[Math.floor(Math.random() * validPairs.length)];
          lockedFunc = picked.f;
        } else if (phase >= 1 && r < 0.78) {
          lockType = 'deg';
          const picked = validPairs[Math.floor(Math.random() * validPairs.length)];
          lockedDeg = picked.d;
        }
      }

      // 確保初始轉輪組合必為錯誤等式，且鎖定輪直接停在指定值
      let initFunc = lockedFunc || LV4_FUNCS[0];
      let initDeg = lockedDeg || LV4_DEGS[0];
      for (let guard = 0; guard < 24; guard++) {
        if (!lockedFunc) initFunc = LV4_FUNCS[Math.floor(Math.random() * LV4_FUNCS.length)];
        if (!lockedDeg) initDeg = LV4_DEGS[Math.floor(Math.random() * LV4_DEGS.length)];
        if (SPECIAL_RATIO_MAP[`${initFunc}_${initDeg}`] !== targetVal) break;
      }

      return {
        questionKey: `${targetVal}_${lockType}_${lockedFunc || lockedDeg || 'free'}`,
        phase,
        lockedVal: targetVal,
        lockType,
        lockedFunc,
        lockedDeg,
        initFunc,
        initDeg,
        flip: phase === 0 ? 1 : (Math.random() > 0.5 ? 1 : -1)
      };
    };

    // ==================== 第 10 關隨機題目生成器：坐標網格建築師 ====================
    const generateLevel6Question = (phase, bagState = null, allowAxisPoint = false) => {
      // P1 最後一題有機會出現軸上點（不涉及象限角角度，純從 (x, y, r) 定義感受 0 與 ±1）
      if (allowAxisPoint && Math.random() < 0.65) {
        const axisPool = [
          { xVal: 3, yVal: 0, rVal: '3', rNum: 3, r2: 9, funcs: ['sin', 'cos', 'tan'] },
          { xVal: -4, yVal: 0, rVal: '4', rNum: 4, r2: 16, funcs: ['sin', 'cos', 'tan'] },
          { xVal: 0, yVal: 3, rVal: '3', rNum: 3, r2: 9, funcs: ['sin', 'cos'] },
          { xVal: 0, yVal: -4, rVal: '4', rNum: 4, r2: 16, funcs: ['sin', 'cos'] }
        ];
        const ap = axisPool[Math.floor(Math.random() * axisPool.length)];
        const targetFunc = ap.funcs[Math.floor(Math.random() * ap.funcs.length)];
        const correctNumeratorKey = targetFunc === 'cos' ? 'x' : 'y';
        const correctDenominatorKey = targetFunc === 'tan' ? 'x' : 'r';
        const k = Math.max(Math.abs(ap.xVal), Math.abs(ap.yVal));
        const rOptions = [{ label: ap.rVal, isCorrect: true }];
        const used = new Set([ap.rVal]);
        for (const d of ['0', String(ap.r2), `√${k}`, String(k + 1), String(k * 2)]) {
          if (rOptions.length >= 4) break;
          if (!used.has(d)) { used.add(d); rOptions.push({ label: d, isCorrect: false }); }
        }
        rOptions.sort(() => Math.random() - 0.5);
        const coordTipMap = {
          sin: '廣義角定義：sin(θ) = y / r（縱坐標 ÷ 動徑長）',
          cos: '廣義角定義：cos(θ) = x / r（橫坐標 ÷ 動徑長）',
          tan: '廣義角定義：tan(θ) = y / x（縱坐標 ÷ 橫坐標）'
        };
        return {
          phase, quad: 0, isAxis: true,
          xVal: ap.xVal, yVal: ap.yVal, rVal: ap.rVal, rNum: ap.rNum, r2: ap.r2,
          key: `axis,${ap.xVal},${ap.yVal},${targetFunc},${Date.now()}`,
          targetFunc, correctNumeratorKey, correctDenominatorKey,
          rOptions,
          conceptTip: coordTipMap[targetFunc]
        };
      }

      // 涵蓋 45° 對稱與經典小根式（配合 -4..4 52px 動態縮放保持寬敞）
      const triples = [
        { x: 1, y: 2, r2: 5, rLabel: '√5', rNum: Math.sqrt(5), group: '1-2' },
        { x: 2, y: 1, r2: 5, rLabel: '√5', rNum: Math.sqrt(5), group: '1-2' },
        { x: 1, y: 3, r2: 10, rLabel: '√10', rNum: Math.sqrt(10), group: '1-3' },
        { x: 3, y: 1, r2: 10, rLabel: '√10', rNum: Math.sqrt(10), group: '1-3' },
        { x: 2, y: 2, r2: 8, rLabel: '2√2', rNum: Math.SQRT2 * 2, group: '2-2' },
        { x: 3, y: 3, r2: 18, rLabel: '3√2', rNum: Math.SQRT2 * 3, group: '3-3' },
        { x: 3, y: 4, r2: 25, rLabel: '5', rNum: 5, group: '3-4' },
        { x: 4, y: 3, r2: 25, rLabel: '5', rNum: 5, group: '3-4' },
        { x: 2, y: 3, r2: 13, rLabel: '√13', rNum: Math.sqrt(13), group: '2-3' },
        { x: 3, y: 2, r2: 13, rLabel: '√13', rNum: Math.sqrt(13), group: '2-3' },
        { x: 2, y: 5, r2: 29, rLabel: '√29', rNum: Math.sqrt(29), group: '2-5' },
        { x: 5, y: 2, r2: 29, rLabel: '√29', rNum: Math.sqrt(29), group: '2-5' },
        { x: 3, y: 5, r2: 34, rLabel: '√34', rNum: Math.sqrt(34), group: '3-5' },
        { x: 5, y: 3, r2: 34, rLabel: '√34', rNum: Math.sqrt(34), group: '3-5' },
        { x: 4, y: 5, r2: 41, rLabel: '√41', rNum: Math.sqrt(41), group: '4-5' },
        { x: 5, y: 4, r2: 41, rLabel: '√41', rNum: Math.sqrt(41), group: '4-5' }
      ];
      const groups = ['1-2', '1-3', '2-2', '3-3', '3-4', '2-3', '2-5', '3-5', '4-5'];
      const funcList = ['sin', 'cos', 'tan'];

      let chosenGroup;
      if (bagState) {
        if (!bagState.groupBag || bagState.groupBag.length === 0) {
          bagState.groupBag = [...groups].sort(() => Math.random() - 0.5);
          if (bagState.lastGroup && bagState.groupBag[0] === bagState.lastGroup && bagState.groupBag.length > 1) {
            const swapIdx = 1 + Math.floor(Math.random() * (bagState.groupBag.length - 1));
            [bagState.groupBag[0], bagState.groupBag[swapIdx]] = [bagState.groupBag[swapIdx], bagState.groupBag[0]];
          }
        }
        chosenGroup = bagState.groupBag.shift();
        bagState.lastGroup = chosenGroup;
      } else {
        chosenGroup = groups[Math.floor(Math.random() * groups.length)];
      }

      const groupCandidates = triples.filter(t => t.group === chosenGroup);
      const base = groupCandidates[Math.floor(Math.random() * groupCandidates.length)];

      let targetFunc;
      if (bagState) {
        if (!bagState.funcBag || bagState.funcBag.length === 0) {
          bagState.funcBag = [...funcList].sort(() => Math.random() - 0.5);
          if (bagState.lastFunc && bagState.funcBag[0] === bagState.lastFunc && bagState.funcBag.length > 1) {
            const swapIdx = 1 + Math.floor(Math.random() * (bagState.funcBag.length - 1));
            [bagState.funcBag[0], bagState.funcBag[swapIdx]] = [bagState.funcBag[swapIdx], bagState.funcBag[0]];
          }
        }
        targetFunc = bagState.funcBag.shift();
        bagState.lastFunc = targetFunc;
      } else {
        targetFunc = funcList[Math.floor(Math.random() * funcList.length)];
      }

      let q;
      if (bagState) {
        if (phase === 0) {
          if (!bagState.p0QuadBag || bagState.p0QuadBag.length === 0) {
            bagState.p0QuadBag = [1, 2].sort(() => Math.random() - 0.5);
          }
          q = bagState.p0QuadBag.shift();
        } else {
          if (!bagState.quadBag || bagState.quadBag.length === 0) {
            bagState.quadBag = [1, 2, 3, 4].sort(() => Math.random() - 0.5);
            if (bagState.lastQuad && bagState.quadBag[0] === bagState.lastQuad && bagState.quadBag.length > 1) {
              const swapIdx = 1 + Math.floor(Math.random() * (bagState.quadBag.length - 1));
              [bagState.quadBag[0], bagState.quadBag[swapIdx]] = [bagState.quadBag[swapIdx], bagState.quadBag[0]];
            }
          }
          q = bagState.quadBag.shift();
        }
        bagState.lastQuad = q;
      } else {
        q = phase === 0 ? (Math.random() > 0.5 ? 1 : 2) : (Math.floor(Math.random() * 4) + 1);
      }

      const signX = (q === 2 || q === 3) ? -1 : 1;
      const signY = (q === 3 || q === 4) ? -1 : 1;
      const xVal = base.x * signX;
      const yVal = base.y * signY;
      const key = `${xVal},${yVal},${targetFunc},${Date.now()}`;

      const rLabel = base.rLabel;
      const rNum = base.rNum;
      const r2 = base.r2;

      let correctNumeratorKey = 'y', correctDenominatorKey = 'r';
      if (targetFunc === 'sin') { correctNumeratorKey = 'y'; correctDenominatorKey = 'r'; }
      else if (targetFunc === 'cos') { correctNumeratorKey = 'x'; correctDenominatorKey = 'r'; }
      else { correctNumeratorKey = 'y'; correctDenominatorKey = 'x'; }

      // Phase 1/2 針對性迷思誘答（3-4-5 陷阱、45° 誤認、加減號記反、忘記開根號、直接相加）
      const ax = Math.abs(xVal), ay = Math.abs(yVal);
      const diff2 = Math.abs(ax * ax - ay * ay);
      const diffSqrtInt = Math.round(Math.sqrt(diff2));
      const diffLabel = diff2 === 0 ? '√2' : (diffSqrtInt * diffSqrtInt === diff2 ? String(diffSqrtInt) : `√${diff2}`);
      const targetedDistractors = [];
      if ((ax === 3 && ay === 5) || (ax === 5 && ay === 3)) targetedDistractors.push('4');
      if ((ax === 4 && ay === 5) || (ax === 5 && ay === 4)) targetedDistractors.push('3');
      if (ax === ay) targetedDistractors.push(String(ax), String(r2), String(ax + ay), '√2');
      else {
        const sumSqrtInt = Math.round(Math.sqrt(ax + ay));
        targetedDistractors.push(diffLabel, String(r2), String(ax + ay));
        if (sumSqrtInt * sumSqrtInt !== ax + ay) targetedDistractors.push(`√${ax + ay}`);
      }
      const fallbackPool = ['5', '√5', '√10', '√13', '2√2', '3√2', '√29', '√34', '√41', '7', '13', '25'];

      const rOptions = [{ label: rLabel, isCorrect: true }];
      const usedLabels = new Set([rLabel]);
      for (const lbl of [...targetedDistractors, ...fallbackPool]) {
        if (rOptions.length >= 4) break;
        if (!usedLabels.has(lbl)) {
          usedLabels.add(lbl);
          rOptions.push({ label: lbl, isCorrect: false });
        }
      }
      rOptions.sort(() => Math.random() - 0.5);

      const coordTipMap = {
        sin: '廣義角定義：sin(θ) = y / r（縱坐標 ÷ 動徑長）',
        cos: '廣義角定義：cos(θ) = x / r（橫坐標 ÷ 動徑長）',
        tan: '廣義角定義：tan(θ) = y / x（縱坐標 ÷ 橫坐標）'
      };

      return {
        phase, quad: q, xVal, yVal, rVal: rLabel, rNum, r2, key,
        targetFunc, correctNumeratorKey, correctDenominatorKey,
        rOptions,
        conceptTip: coordTipMap[targetFunc]
      };
    };

    // ==================== 第 11 關隨機題目生成器：星象羅盤師（單圈正特殊角＋象限角） ====================
    const generateLevel7Question = (phase, bagState = null, forceAxis = false) => {
      const specialAngles = [30, 45, 60, 120, 135, 150, 210, 225, 240, 300, 315, 330];
      const axisAngles = [0, 90, 180, 270];
      const funcList = ['sin', 'cos', 'tan'];

      let targetAngle;
      if (phase === 0) {
        if (bagState) {
          if (!bagState.specialBag || bagState.specialBag.length === 0) {
            bagState.specialBag = [...specialAngles].sort(() => Math.random() - 0.5);
            if (bagState.lastAngle !== undefined && bagState.specialBag[0] === bagState.lastAngle) {
              const sIdx = 1 + Math.floor(Math.random() * (bagState.specialBag.length - 1));
              [bagState.specialBag[0], bagState.specialBag[sIdx]] = [bagState.specialBag[sIdx], bagState.specialBag[0]];
            }
          }
          targetAngle = bagState.specialBag.shift();
        } else {
          targetAngle = specialAngles[Math.floor(Math.random() * specialAngles.length)];
        }
      } else {
        const pickAxis = forceAxis || (Math.random() < 0.45);
        if (pickAxis) {
          const avail = axisAngles.filter(a => a !== bagState?.lastAngle);
          targetAngle = avail[Math.floor(Math.random() * avail.length)];
        } else {
          if (bagState) {
            if (!bagState.specialBag || bagState.specialBag.length === 0) {
              bagState.specialBag = [...specialAngles].sort(() => Math.random() - 0.5);
              if (bagState.lastAngle !== undefined && bagState.specialBag[0] === bagState.lastAngle) {
                const sIdx = 1 + Math.floor(Math.random() * (bagState.specialBag.length - 1));
                [bagState.specialBag[0], bagState.specialBag[sIdx]] = [bagState.specialBag[sIdx], bagState.specialBag[0]];
              }
            }
            targetAngle = bagState.specialBag.shift();
          } else {
            targetAngle = specialAngles[Math.floor(Math.random() * specialAngles.length)];
          }
        }
      }
      if (bagState) bagState.lastAngle = targetAngle;

      const principal = ((targetAngle % 360) + 360) % 360;
      const isAxis = principal % 90 === 0;
      const isTanUndefined = principal === 90 || principal === 270;
      const allowedFuncs = isTanUndefined ? ['sin', 'cos'] : funcList;
      let targetFunc;
      if (bagState) {
        if (!bagState.funcBag || bagState.funcBag.length === 0) {
          bagState.funcBag = [...funcList].sort(() => Math.random() - 0.5);
        }
        const idx = bagState.funcBag.findIndex(f => allowedFuncs.includes(f));
        targetFunc = idx >= 0 ? bagState.funcBag.splice(idx, 1)[0] : allowedFuncs[Math.floor(Math.random() * allowedFuncs.length)];
      } else {
        targetFunc = allowedFuncs[Math.floor(Math.random() * allowedFuncs.length)];
      }

      let xStr = '1', yStr = '0', rStr = '1', xNum = 1, yNum = 0, rNum = 1, locationLabel = '', refAngle = 0;
      if (principal === 0) { xStr = '1'; yStr = '0'; rStr = '1'; xNum = 1; yNum = 0; rNum = 1; locationLabel = '正向 X 軸'; }
      else if (principal === 90) { xStr = '0'; yStr = '1'; rStr = '1'; xNum = 0; yNum = 1; rNum = 1; locationLabel = '正向 Y 軸'; }
      else if (principal === 180) { xStr = '-1'; yStr = '0'; rStr = '1'; xNum = -1; yNum = 0; rNum = 1; locationLabel = '負向 X 軸'; }
      else if (principal === 270) { xStr = '0'; yStr = '-1'; rStr = '1'; xNum = 0; yNum = -1; rNum = 1; locationLabel = '負向 Y 軸'; }
      else {
        const rad = (principal * Math.PI) / 180;
        const cosPos = Math.cos(rad) > 0;
        const sinPos = Math.sin(rad) > 0;
        if (cosPos && sinPos) { locationLabel = '第 I 象限'; refAngle = principal; }
        else if (!cosPos && sinPos) { locationLabel = '第 II 象限'; refAngle = 180 - principal; }
        else if (!cosPos && !sinPos) { locationLabel = '第 III 象限'; refAngle = principal - 180; }
        else { locationLabel = '第 IV 象限'; refAngle = 360 - principal; }

        if (principal % 45 === 0) {
          rStr = '√2'; rNum = Math.SQRT2;
          xStr = cosPos ? '1' : '-1'; xNum = cosPos ? 1 : -1;
          yStr = sinPos ? '1' : '-1'; yNum = sinPos ? 1 : -1;
        } else if (principal % 60 === 0) {
          rStr = '2'; rNum = 2;
          xStr = cosPos ? '1' : '-1'; xNum = cosPos ? 1 : -1;
          yStr = sinPos ? '√3' : '-√3'; yNum = sinPos ? Math.sqrt(3) : -Math.sqrt(3);
        } else {
          rStr = '2'; rNum = 2;
          xStr = cosPos ? '√3' : '-√3'; xNum = cosPos ? Math.sqrt(3) : -Math.sqrt(3);
          yStr = sinPos ? '1' : '-1'; yNum = sinPos ? 1 : -1;
        }
      }

      const origin = { x: 270, y: 270 };
      const R = 190;
      const ptP = { x: origin.x + (xNum / rNum) * R, y: origin.y - (yNum / rNum) * R };
      const ptFootX = { x: ptP.x, y: origin.y };
      const ptFootY = { x: origin.x, y: ptP.y };
      const sqSize = 12;
      const dirX = xNum >= 0 ? -1 : 1;
      const dirY = yNum >= 0 ? -1 : 1;
      const rightAngleSquareX = `${ptFootX.x},${ptFootX.y} ${ptFootX.x + dirX * sqSize},${ptFootX.y} ${ptFootX.x + dirX * sqSize},${ptFootX.y + dirY * sqSize} ${ptFootX.x},${ptFootX.y + dirY * sqSize}`;

      const correctNumeratorKey = targetFunc === 'cos' ? 'x' : 'y';
      const correctDenominatorKey = targetFunc === 'tan' ? 'x' : 'r';
      const exactValText = TEXT_MAP['val'][EVAL_MAP[targetFunc][String(principal)]];

      const assignTip = isAxis
        ? `觀察 ${principal}° 落在哪條坐標軸正負向，單位圓軸上點座標為 0 或 ±1，動徑 r = 1`
        : `先確認該象限的 x、y 正負號，再依 ${refAngle}° 直角三角形邊長比填入對應數值`;

      return {
        phase, targetAngle, principal, isAxis, refAngle, targetFunc, locationLabel,
        xStr, yStr, rStr, xNum, yNum, rNum,
        ptP, ptFootX, ptFootY, rightAngleSquareX,
        correctNumeratorKey, correctDenominatorKey, exactValText,
        assignTip,
        conceptTip: `廣義角定義：${targetFunc}(θ) = ${correctNumeratorKey} / ${correctDenominatorKey}`
      };
    };

    // ==================== 第 1 關組件：直角三角神之眼（餘命進度制） ====================
    const Level1EdgeMaster = ({ currentStars, hasSeenGuide = false, onMarkGuideSeen, onUpdateStars, onCompleteLevel, onBackToMap }) => {
      const { isRelaxMode } = React.useContext(GameModeContext);
      const starsThreshold = [3, 6, 9];
      const maxLives = 3;
      const healTarget = 3;
      const {
        gameState, progress, lives, healStreak, correctCount, wrongCount, elapsedSec,
        earnedStars, baseScore, lifeBonus, accuracyBonus, speedBonus, finalScore,
        startSession, recordCorrect, recordWrong, finishNow
      } = useLivesLevelSession({ starThresholds: starsThreshold, maxLives, healTarget, currentStars, onUpdateStars });

      const [question, setQuestion] = useState(null);
      const [feedbackAnim, setFeedbackAnim] = useState('');
      const [correctEdgeId, setCorrectEdgeId] = useState(null);
      const [wrongBtnKey, setWrongBtnKey] = useState(null);
      const [wrongHintType, setWrongHintType] = useState(null);
      const [wrongHintFading, setWrongHintFading] = useState(false);
      const [conceptTip, setConceptTip] = useState(null);
      const { showGuide, guideMode, openGuide, dismissGuide } = useLevelGuide(currentStars, hasSeenGuide, onMarkGuideSeen);

      const containerRef = useRef(null);
      const prevTypeRef = useRef('');
      const questionMissedRef = useRef(false);
      const confirmTimerRef = useRef(null);
      const wrongHintTimersRef = useRef([]);
      const pendingNextRef = useRef(null);
      const clearWrongHintTimers = () => {
        wrongHintTimersRef.current.forEach(t => clearTimeout(t));
        wrongHintTimersRef.current = [];
      };
      const handleConfirmSkip = () => {
        if (!pendingNextRef.current) return;
        clearTimeout(confirmTimerRef.current);
        const fn = pendingNextRef.current;
        pendingNextRef.current = null;
        audio.sfxClick();
        fn();
      };
      useEffect(() => () => {
        clearTimeout(confirmTimerRef.current);
        clearWrongHintTimers();
      }, []);


      const nextQuestion = (curProg) => {
        clearWrongHintTimers();
        const phase = curProg >= starsThreshold[1] ? 2 : curProg >= starsThreshold[0] ? 1 : 0;
        const q = generateQuestion(phase, prevTypeRef.current);
        prevTypeRef.current = q.targetType;
        questionMissedRef.current = false;
        setQuestion(q);
        setCorrectEdgeId(null);
        setWrongBtnKey(null);
        setWrongHintType(null);
        setWrongHintFading(false);
        setConceptTip(null);
      };

      const startGame = () => {
        clearTimeout(confirmTimerRef.current);
        clearWrongHintTimers();
        pendingNextRef.current = null;
        prevTypeRef.current = '';
        questionMissedRef.current = false;
        setFeedbackAnim('');
        setCorrectEdgeId(null); setWrongBtnKey(null); setWrongHintType(null); setWrongHintFading(false); setConceptTip(null);
        const initProg = startSession();
        nextQuestion(initProg);
        audio.init();
      };

      useEffect(() => {
        startGame();
      }, []);

      const handleSelectColor = (colorId) => {
        if (gameState !== 'playing' || !question || correctEdgeId || (!isRelaxMode && lives <= 0)) return;
        if (colorId === question.correctEdgeColorId) {
          clearWrongHintTimers();
          audio.sfxMatch();
          if (showGuide) dismissGuide();
          setCorrectEdgeId(colorId);
          setWrongBtnKey(null);
          setWrongHintType(null);
          setWrongHintFading(false);
          setConceptTip(null);
          setFeedbackAnim('animate-correct');
          const confirmDur = 750;
          const { completed, nextProgress } = recordCorrect({ wasMissed: questionMissedRef.current, delayEndMs: confirmDur });
          if (!completed) {
            const advanceFn = () => {
              pendingNextRef.current = null;
              setFeedbackAnim('');
              nextQuestion(nextProgress);
            };
            pendingNextRef.current = advanceFn;
            confirmTimerRef.current = setTimeout(advanceFn, confirmDur);
          } else {
            setTimeout(() => setFeedbackAnim(''), confirmDur);
          }
        } else {
          clearWrongHintTimers();
          audio.sfxError();
          questionMissedRef.current = true;
          const { gameOver } = recordWrong({ delayEndMs: 520 });
          setWrongBtnKey(colorId);
          setWrongHintType(question.targetType);
          setWrongHintFading(false);
          setConceptTip({ text: question.conceptTip, id: Date.now() });
          setFeedbackAnim('animate-shake');
          if (!gameOver) {
            wrongHintTimersRef.current = [
              setTimeout(() => { setFeedbackAnim(''); setWrongBtnKey(null); }, 450),
              setTimeout(() => setWrongHintFading(true), 1800),
              setTimeout(() => { setWrongHintType(null); setWrongHintFading(false); }, 2250)
            ];
          }
        }
      };

      const lv1CoachSteps = useMemo(() => ([
        {
          tap: false,
          desc: '看上方題目要求，並對照圖中的目標角',
          targets: [
            { target: 'lv1-prompt', anchorX: 0.5, anchorY: 0.5, pad: 8, shape: 'ellipse' },
            { target: question?.showArc ? 'lv1-angle' : 'lv1-vertex', anchorX: 0.5, anchorY: 0.5, minW: 76, minH: 76, shape: 'circle' }
          ]
        },
        {
          target: 'lv1-canvas-edge',
          anchorX: 0.5,
          anchorY: 0.5,
          minW: 84,
          minH: 84,
          shape: 'circle',
          tap: true,
          desc: '直接點擊圖上對應的邊線作答！'
        },
        {
          target: 'hud-stars',
          anchorX: 0.5,
          anchorY: 0.5,
          pad: 6,
          shape: 'pill',
          tap: false,
          desc: '答對亮格，集滿三顆星即可通關'
        }
      ]), [question?.showArc]);

      return (
        <div ref={containerRef} className="w-full h-full flex-1 flex flex-col justify-between pt-0.5 pb-1 relative animate-jelly min-h-0">

          {gameState === 'idle' && (
            <div className="flex-1 my-3 bg-white/95 rounded-3xl border-4 border-indigo-950 p-5 shadow-2xl flex flex-col justify-between text-center items-center">
              <div className="w-full space-y-3 pt-2">
                <div className="w-20 h-20 mx-auto rounded-3xl bg-emerald-100 border-4 border-emerald-500 flex items-center justify-center text-4xl shadow-inner animate-bounce">👁️</div>
                <h2 className="text-2xl font-black text-indigo-950 tracking-wide">三邊神之眼</h2>
                <p className="text-xs text-slate-500 font-bold leading-relaxed max-w-xs mx-auto">
                  觀察基準角，辨識並點選直角三角形的<span className="text-blue-600 font-black">斜邊</span>、<span className="text-red-600 font-black">對邊</span>或<span className="text-emerald-600 font-black">鄰邊</span>！
                </p>
              </div>
              <CompactStarPills starsThreshold={starsThreshold} livesMode maxLives={maxLives} />
              <div className="w-full space-y-2">
                <button onClick={startGame} className="w-full py-4 btn-3d-green text-white font-black text-lg rounded-2xl shadow-xl tracking-wider active:scale-95">{isRelaxMode ? '🌱 開始休閒練習！' : '🚀 開始試煉！'}</button>
                <button onClick={onBackToMap} className="w-full py-2 text-xs font-bold text-slate-400 hover:text-slate-600">返回聖域地圖</button>
              </div>
            </div>
          )}

          {gameState === 'playing' && question && (
            <div className={`flex-1 min-h-0 flex flex-col justify-between gap-2 overflow-hidden pb-0.5 ${feedbackAnim}`}>
              <GameHUD
                progress={progress}
                starsThreshold={starsThreshold}
                lives={lives}
                maxLives={maxLives}
                healStreak={healStreak}
                healTarget={healTarget}
                onManualEnd={finishNow}
                onOpenGuide={openGuide}
              />

              <div className={`flex-1 min-h-0 bg-white rounded-3xl border-3 border-indigo-950 shadow-xl flex flex-col overflow-hidden transition-all duration-150 ${correctEdgeId ? 'ring-4 ring-emerald-400/75' : ''}`}>
                <StagePhaseStrip phase={progress >= starsThreshold[1] ? 2 : progress >= starsThreshold[0] ? 1 : 0} labels={['底角定位 • 辨識三邊', '雙角切換 • 對邊鄰邊互換', '全向旋轉 • 視覺脫離慣性']} />
                <div data-coach="lv1-prompt" className="bg-gradient-to-r from-emerald-500 to-green-600 py-2.5 px-3 flex items-center justify-center gap-2 text-white text-center shrink-0 border-b-2 border-emerald-700">
                  <span className="text-base sm:text-lg font-black tracking-wide drop-shadow">{question.questionText}</span>
                  <SuccessBadge show={Boolean(correctEdgeId)} />
                </div>

                <div onClick={handleConfirmSkip} className="relative w-full flex-1 min-h-0 bg-white flex items-center justify-center overflow-hidden">
                  <HintBanner tip={conceptTip} />
                  <svg viewBox="0 0 500 500" className="w-full h-full object-contain drop-shadow-md">
                    <TriangleBlueprintBg id="triGridLv1" />
                    <polygon points={`${question.pts.P1.x},${question.pts.P1.y} ${question.pts.P2.x},${question.pts.P2.y} ${question.pts.P3.x},${question.pts.P3.y}`} fill="#f0fdf4" stroke="none" />
                    <polygon points={question.rightAngleSquare} fill={wrongHintType === 'hyp' ? '#fef3c7' : '#f1f5f9'} stroke={wrongHintType === 'hyp' ? '#f59e0b' : '#94a3b8'} strokeWidth={wrongHintType === 'hyp' ? '4' : '2.5'} />
                    {question.showArc && (
                      <g data-coach="lv1-angle">
                        <TriangleAngleArc d={question.arcPath} />
                      </g>
                    )}
                    {(wrongHintType === 'opp' || wrongHintType === 'hyp' || wrongHintType === 'adj') && (() => {
                      const adjEdge = question.edges.find(e => e.id === 'adj');
                      const oppEdge = question.edges.find(e => e.id === 'opp');
                      const hypEdge = question.edges.find(e => e.id === 'hyp');
                      if (!adjEdge || !oppEdge || !hypEdge) return null;
                      const hintOpacity = wrongHintFading ? 0 : 0.9;
                      if (wrongHintType === 'opp' || wrongHintType === 'hyp') {
                        const fromPt = wrongHintType === 'opp' ? adjEdge.p1 : adjEdge.p2;
                        const toEdge = wrongHintType === 'opp' ? oppEdge : hypEdge;
                        const mx = (toEdge.p1.x + toEdge.p2.x) / 2;
                        const my = (toEdge.p1.y + toEdge.p2.y) / 2;
                        return (
                          <g className="pointer-events-none transition-opacity duration-500" opacity={hintOpacity}>
                            <defs>
                              <marker id="lv1Arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                                <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#f59e0b" />
                              </marker>
                            </defs>
                            <line x1={fromPt.x} y1={fromPt.y} x2={mx} y2={my} stroke="#f59e0b" strokeWidth="3.5" strokeDasharray="8 6" strokeLinecap="round" markerEnd="url(#lv1Arrow)">
                              <animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.1s" repeatCount="indefinite" />
                            </line>
                          </g>
                        );
                      }
                      const p1 = adjEdge.p1;
                      const p2 = adjEdge.p2;
                      const other = oppEdge.p1;
                      const mx = (p1.x + p2.x) / 2;
                      const my = (p1.y + p2.y) / 2;
                      const dx = p2.x - p1.x;
                      const dy = p2.y - p1.y;
                      const len = Math.hypot(dx, dy) || 1;
                      let nx = -dy / len;
                      let ny = dx / len;
                      if (nx * (other.x - mx) + ny * (other.y - my) < 0) {
                        nx = -nx;
                        ny = -ny;
                      }
                      const cx = mx + nx * 32;
                      const cy = my + ny * 32;
                      return (
                        <g className="pointer-events-none transition-opacity duration-500" opacity={hintOpacity}>
                          <path d={`M ${p1.x} ${p1.y} Q ${cx} ${cy} ${p2.x} ${p2.y}`} fill="none" stroke="#f59e0b" strokeWidth="3.5" strokeDasharray="8 6" strokeLinecap="round">
                            <animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.1s" repeatCount="indefinite" />
                          </path>
                          <circle cx={p1.x} cy={p1.y} r="6" fill="#f59e0b" />
                          <circle cx={p2.x} cy={p2.y} r="6" fill="#f59e0b" />
                        </g>
                      );
                    })()}
                    {question.edges.map((edge, idx) => {
                      const isHit = correctEdgeId === edge.colorId;
                      const isWrongEdge = wrongBtnKey === edge.colorId;
                      const isCoachEdge = edge.colorId === question.correctEdgeColorId;
                      const midX = (edge.p1.x + edge.p2.x) / 2;
                      const midY = (edge.p1.y + edge.p2.y) / 2;
                      const edgeLabelMap = { hyp: '斜邊', opp: '對邊', adj: '鄰邊' };
                      return (
                        <g key={idx} className="cursor-pointer group" opacity={correctEdgeId && !isHit ? 0.28 : 1} onClick={(e) => { e.stopPropagation(); if (correctEdgeId) { handleConfirmSkip(); } else { handleSelectColor(edge.colorId); } }}>
                          {isHit && <line x1={edge.p1.x} y1={edge.p1.y} x2={edge.p2.x} y2={edge.p2.y} stroke="#34d399" strokeWidth="26" strokeLinecap="round" opacity="0.7" />}
                          {isWrongEdge && <line x1={edge.p1.x} y1={edge.p1.y} x2={edge.p2.x} y2={edge.p2.y} stroke="#fca5a5" strokeWidth="24" strokeLinecap="round" opacity="0.85" />}
                          <line x1={edge.p1.x} y1={edge.p1.y} x2={edge.p2.x} y2={edge.p2.y} stroke={isWrongEdge ? '#dc2626' : edge.color.bg} strokeWidth="14" strokeLinecap="round" className="transition-opacity group-hover:opacity-80" />
                          <line x1={edge.p1.x} y1={edge.p1.y} x2={edge.p2.x} y2={edge.p2.y} stroke="transparent" strokeWidth="48" strokeLinecap="round" />
                          {isHit && (
                            <g transform={`translate(${midX}, ${midY})`} className="pointer-events-none">
                              <rect x="-32" y="-16" width="64" height="32" rx="12" fill="#065f46" stroke="#ffffff" strokeWidth="2.5" />
                              <text x="0" y="2" fill="#ffffff" fontSize="18" fontWeight="900" textAnchor="middle" dominantBaseline="middle">{edgeLabelMap[edge.id]}</text>
                            </g>
                          )}
                          {isCoachEdge && <circle cx={midX} cy={midY} r="2" fill="transparent" data-coach="lv1-canvas-edge" className="pointer-events-none" />}
                        </g>
                      );
                    })}
                    <TriangleJointDots pts={question.pts} />
                    {question.labels.map((lbl, idx) => (
                      <g key={idx} className="pointer-events-none">
                        {lbl.isTargetVertex && (
                          <circle data-coach="lv1-vertex" cx={lbl.x} cy={lbl.y - 2} r="20" fill="#fef3c7" stroke="#f59e0b" strokeWidth="2.5" opacity="0.95" />
                        )}
                        <text x={lbl.x} y={lbl.y} fill={lbl.color} fontSize={lbl.isTargetVertex ? "32" : "30"} fontWeight="900" textAnchor="middle" dominantBaseline="middle" className="font-serif drop-shadow">{lbl.text}</text>
                      </g>
                    ))}
                  </svg>
                </div>
              </div>
              <CoachOverlay
                containerRef={containerRef}
                active={guideMode === 'manual' || (gameState === 'playing' && showGuide && !correctEdgeId)}
            mode={guideMode || 'spotlight'}
                steps={lv1CoachSteps}
                onDismiss={dismissGuide}
              />
            </div>
          )}

          {gameState === 'ended' && (
            <LevelResultScreen
              score={finalScore}
              baseScore={baseScore}
              earnedStars={earnedStars}
              correctCount={correctCount}
              wrongCount={wrongCount}
              lives={lives}
              progress={progress}
              targetTotal={starsThreshold[2]}
              elapsedSec={elapsedSec}
              lifeBonus={lifeBonus}
              accuracyBonus={accuracyBonus}
              speedBonus={speedBonus}
              accentClass="text-emerald-600"
              onCompleteLevel={onCompleteLevel}
              onRestart={startGame}
              onBackToMap={onBackToMap}
            />
          )}
        </div>
      );
    };


    // ==================== 第 2 關組件：比值之密碼（餘命進度制） ====================
    const Level2RatioMaster = ({ currentStars, hasSeenGuide = false, onMarkGuideSeen, onUpdateStars, onCompleteLevel, onBackToMap }) => {
      const { isRelaxMode } = React.useContext(GameModeContext);
      const starsThreshold = [3, 6, 9];
      const maxLives = 3;
      const healTarget = 3;
      const {
        gameState, progress, lives, healStreak, correctCount, wrongCount, elapsedSec,
        earnedStars, baseScore, lifeBonus, accuracyBonus, speedBonus, finalScore,
        startSession, recordCorrect, recordWrong, finishNow
      } = useLivesLevelSession({ starThresholds: starsThreshold, maxLives, healTarget, currentStars, onUpdateStars });

      const [question, setQuestion] = useState(null);
      const [solvedFunc, setSolvedFunc] = useState(null);
      const [feedbackAnim, setFeedbackAnim] = useState('');
      const [wrongBtnKey, setWrongBtnKey] = useState(null);
      const [wrongHintActive, setWrongHintActive] = useState(false);
      const [conceptTip, setConceptTip] = useState(null);
      const { showGuide, guideMode, openGuide, dismissGuide } = useLevelGuide(currentStars, hasSeenGuide, onMarkGuideSeen);

      const containerRef = useRef(null);
      const prevKeyRef = useRef('');
      const usedKeysRef = useRef(new Set());
      const questionMissedRef = useRef(false);
      const confirmTimerRef = useRef(null);
      const pendingNextRef = useRef(null);
      const handleConfirmSkip = () => {
        if (!pendingNextRef.current) return;
        clearTimeout(confirmTimerRef.current);
        const fn = pendingNextRef.current;
        pendingNextRef.current = null;
        audio.sfxClick();
        fn();
      };
      useEffect(() => () => clearTimeout(confirmTimerRef.current), []);


      const nextQuestion = (curProg) => {
        const phase = curProg >= starsThreshold[1] ? 2 : curProg >= starsThreshold[0] ? 1 : 0;
        const q = generateLevel2Question(phase, prevKeyRef.current, usedKeysRef.current);
        prevKeyRef.current = q.questionKey;
        usedKeysRef.current.add(q.questionKey);
        questionMissedRef.current = false;
        setQuestion(q);
        setSolvedFunc(null);
        setWrongBtnKey(null);
        setWrongHintActive(false);
        setConceptTip(null);
      };

      const startGame = () => {
        clearTimeout(confirmTimerRef.current);
        pendingNextRef.current = null;
        prevKeyRef.current = '';
        usedKeysRef.current = new Set();
        questionMissedRef.current = false;
        setFeedbackAnim('');
        setSolvedFunc(null);
        setWrongBtnKey(null); setWrongHintActive(false); setConceptTip(null);
        const initProg = startSession();
        nextQuestion(initProg);
        audio.init();
      };

      useEffect(() => {
        startGame();
      }, []);

      const lv2CoachSteps = useMemo(() => ([
        {
          tap: false,
          desc: '比對上方比值線索與三角形各邊長',
          targets: [
            { target: 'lv2-clue', anchorX: 0.5, anchorY: 0.5, pad: 8, shape: 'ellipse' },
            { target: 'lv2-tri', anchorX: 0.5, anchorY: 0.5, pad: 38, minW: 240, minH: 210, shape: 'ellipse' }
          ]
        },
        {
          target: 'lv2-btn',
          anchorX: 0.5,
          anchorY: 0.5,
          pad: 8,
          shape: 'pill',
          tap: true,
          desc: '依分子與分母對應邊的關係，選出 sin、cos 或 tan'
        }
      ]), []);

      const handleSelectFunc = (funcId) => {
        if (gameState !== 'playing' || !question || solvedFunc || wrongBtnKey || (!isRelaxMode && lives <= 0)) return;
        if (funcId === question.targetFunc) {
          audio.sfxMatch();
          if (showGuide) dismissGuide();
          setSolvedFunc(funcId);
          setWrongHintActive(false);
          setConceptTip(null);
          setFeedbackAnim('animate-correct');
          const confirmDur = 900;
          const { completed, nextProgress } = recordCorrect({ wasMissed: questionMissedRef.current, delayEndMs: confirmDur });
          if (!completed) {
            const advanceFn = () => {
              pendingNextRef.current = null;
              setFeedbackAnim('');
              nextQuestion(nextProgress);
            };
            pendingNextRef.current = advanceFn;
            confirmTimerRef.current = setTimeout(advanceFn, confirmDur);
          } else {
            setTimeout(() => setFeedbackAnim(''), confirmDur);
          }
        } else {
          audio.sfxError();
          questionMissedRef.current = true;
          const { gameOver } = recordWrong({ delayEndMs: 460 });
          setWrongBtnKey(funcId);
          setWrongHintActive(true);
          setConceptTip({ text: question.conceptTip, id: Date.now() });
          setFeedbackAnim('animate-shake');
          if (!gameOver) {
            setTimeout(() => { setFeedbackAnim(''); setWrongBtnKey(null); }, 350);
          }
        }
      };

      return (
        <div ref={containerRef} className="w-full h-full flex-1 flex flex-col justify-between pt-0.5 pb-1 relative animate-jelly min-h-0">

          {gameState === 'idle' && (
            <div className="flex-1 my-3 bg-white/95 rounded-3xl border-4 border-indigo-950 p-5 shadow-2xl flex flex-col justify-between text-center items-center">
              <div className="w-full space-y-2.5 pt-2">
                <div className="w-20 h-20 mx-auto rounded-3xl bg-teal-100 border-4 border-teal-500 flex items-center justify-center text-4xl shadow-inner animate-bounce">🧩</div>
                <h2 className="text-2xl font-black text-indigo-950 tracking-wide">比值之密碼</h2>
                <p className="text-xs text-slate-500 font-bold leading-relaxed max-w-xs mx-auto">
                  觀察神殿給出的比值密碼，從容破譯它是 <span className="text-blue-600 font-black">sin</span>、<span className="text-emerald-600 font-black">cos</span> 還是 <span className="text-purple-600 font-black">tan</span>！
                </p>
              </div>
              <CompactStarPills starsThreshold={starsThreshold} livesMode maxLives={maxLives} />
              <div className="w-full space-y-2">
                <button onClick={startGame} className="w-full py-4 btn-3d-blue text-white font-black text-lg rounded-2xl shadow-xl tracking-wider active:scale-95">{isRelaxMode ? '🌱 開始休閒練習！' : '🚀 開始試煉！'}</button>
                <button onClick={onBackToMap} className="w-full py-2 text-xs font-bold text-slate-400 hover:text-slate-600">返回聖域地圖</button>
              </div>
            </div>
          )}

          {gameState === 'playing' && question && (
            <div className={`flex-1 min-h-0 flex flex-col justify-between gap-2 overflow-hidden pb-0.5 ${feedbackAnim}`}>
              <GameHUD
                progress={progress}
                starsThreshold={starsThreshold}
                lives={lives}
                maxLives={maxLives}
                healStreak={healStreak}
                healTarget={healTarget}
                onManualEnd={finishNow}
                onOpenGuide={openGuide}
              />

              <div className={`flex-1 min-h-0 bg-white rounded-3xl border-3 border-indigo-950 shadow-xl flex flex-col overflow-hidden transition-all duration-150 ${solvedFunc ? 'ring-4 ring-emerald-400/75' : ''}`}>
                <StagePhaseStrip phase={progress >= starsThreshold[1] ? 2 : progress >= starsThreshold[0] ? 1 : 0} labels={['基礎畢氏對 • 固定底角逆推', '進階畢氏對 • 頂角底角切換', '全角度旋轉 • 自由逆向破譯']} />
                <div data-coach="lv2-clue" className="bg-slate-800 py-2 px-3 flex items-center justify-center gap-2.5 text-white border-b-2 border-slate-700 shrink-0">
                  <div className="flex items-center gap-1.5 font-serif font-black text-lg">
                    <span className={`min-w-[44px] px-2.5 py-0.5 rounded-xl border-2 text-center transition-all ${
                      solvedFunc
                        ? 'bg-emerald-500 border-emerald-300 text-white scale-105 shadow-sm'
                        : 'border-dashed border-amber-300/80 bg-amber-400/15 text-amber-200 animate-pulse'
                    }`}>
                      {solvedFunc || '?'}
                    </span>
                    <span className="text-xl text-amber-200">{question.angleName}</span>
                  </div>
                  <span className="text-lg font-serif font-black text-slate-300">=</span>
                  <div className="flex flex-col items-center">
                    <div className="min-w-[64px] px-2.5 h-6 rounded-lg bg-emerald-500/20 border border-emerald-400/60 flex items-center justify-center font-serif font-black text-sm text-emerald-200">
                      {question.numText}
                    </div>
                    <div className="w-16 h-0.5 bg-slate-400 my-1"></div>
                    <div className="min-w-[64px] px-2.5 h-6 rounded-lg bg-cyan-500/20 border border-cyan-400/60 flex items-center justify-center font-serif font-black text-sm text-cyan-200">
                      {question.denText}
                    </div>
                  </div>
                  <SuccessBadge show={Boolean(solvedFunc)} />
                </div>

                <div onClick={handleConfirmSkip} className="relative w-full flex-1 min-h-0 bg-white flex items-center justify-center overflow-hidden">
                  <HintBanner tip={conceptTip} />
                  <svg viewBox="0 0 500 500" className="w-full h-full object-contain drop-shadow-md">
                    <TriangleBlueprintBg id="triGridLv2" />
                    <polygon data-coach="lv2-tri" points={`${question.pts.P1.x},${question.pts.P1.y} ${question.pts.P2.x},${question.pts.P2.y} ${question.pts.P3.x},${question.pts.P3.y}`} fill="#f0fdfa" stroke="none" />
                    <polygon points={question.rightAngleSquare} fill="#f1f5f9" stroke="#94a3b8" strokeWidth="2.5" />
                    {question.showArc && (
                      <g data-coach="lv1-angle">
                        <TriangleAngleArc d={question.arcPath} />
                      </g>
                    )}
                    {question.edges.map((edge, idx) => {
                      const isNum = (solvedFunc || wrongHintActive) && edge.id === question.numEdgeId;
                      const isDen = (solvedFunc || wrongHintActive) && edge.id === question.denEdgeId;
                      const showRole = Boolean(solvedFunc) && (isNum || isDen);
                      const roleMap = { hyp: '斜邊', opp: '對邊', adj: '鄰邊' };
                      const strokeColor = isNum ? '#10b981' : isDen ? '#06b6d4' : '#334155';
                      const pillY = Math.min(474, edge.midPt.y + 30);
                      return (
                        <g key={idx}>
                          {(isNum || isDen) && (
                            <line x1={edge.p1.x} y1={edge.p1.y} x2={edge.p2.x} y2={edge.p2.y} stroke={isNum ? '#6ee7b7' : '#67e8f9'} strokeWidth="24" strokeLinecap="round" opacity="0.85" />
                          )}
                          <line x1={edge.p1.x} y1={edge.p1.y} x2={edge.p2.x} y2={edge.p2.y} stroke={strokeColor} strokeWidth={isNum || isDen ? '14' : '11'} strokeLinecap="round" />
                          <circle cx={edge.midPt.x} cy={edge.midPt.y} r="21" fill="#ffffff" stroke={strokeColor} strokeWidth="3" />
                          <text x={edge.midPt.x} y={edge.midPt.y + 1} fill={strokeColor} fontSize="18" fontWeight="900" textAnchor="middle" dominantBaseline="middle" className="font-serif pointer-events-none">{edge.displayText}</text>
                          {showRole && (
                            <g transform={`translate(${edge.midPt.x}, ${pillY})`} className="pointer-events-none">
                              <rect x="-26" y="-11" width="52" height="22" rx="11" fill={isNum ? '#059669' : '#0891b2'} stroke="#ffffff" strokeWidth="2" />
                              <text x="0" y="1" fill="#ffffff" fontSize="12" fontWeight="900" textAnchor="middle" dominantBaseline="middle">{roleMap[edge.id]}</text>
                            </g>
                          )}
                        </g>
                      );
                    })}
                    <TriangleJointDots pts={question.pts} />
                    {question.labels.map((lbl, idx) => (
                      <g key={idx} className="pointer-events-none">
                        {lbl.isTargetVertex && (
                          <circle data-coach="lv1-vertex" cx={lbl.x} cy={lbl.y - 2} r="20" fill="#fef3c7" stroke="#f59e0b" strokeWidth="2.5" opacity="0.95" />
                        )}
                        <text x={lbl.x} y={lbl.y} fill={lbl.color} fontSize={lbl.isTargetVertex ? "32" : "30"} fontWeight="900" textAnchor="middle" dominantBaseline="middle" className="font-serif drop-shadow">{lbl.text}</text>
                      </g>
                    ))}
                  </svg>
                </div>

                <div data-coach="lv10-btns" className="bg-slate-50 border-t-2 border-slate-200 p-2 grid grid-cols-3 gap-2 shrink-0">
                  {[
                    { id: 'sin', btnClass: 'btn-3d-blue text-white' },
                    { id: 'cos', btnClass: 'btn-3d-green text-white' },
                    { id: 'tan', btnClass: 'btn-3d-purple text-white' }
                  ].map((fn) => {
                    const isCoachBtn = showGuide && !solvedFunc && fn.id === question.targetFunc;
                    return (
                      <button
                        key={fn.id}
                        data-coach={isCoachBtn ? 'lv2-btn' : undefined}
                        onClick={() => handleSelectFunc(fn.id)}
                        className={`py-3.5 font-serif font-black text-xl rounded-2xl shadow-md active:scale-95 transition-all flex items-center justify-center ${fn.btnClass} ${solvedFunc === fn.id ? 'ring-4 ring-amber-300 scale-[1.03]' : isCoachBtn ? 'ring-4 ring-amber-300/90' : ''} ${wrongBtnKey === fn.id ? 'btn-wrong-flash' : ''}`}
                      >
                        {fn.id}
                      </button>
                    );
                  })}
                </div>
              </div>
              <CoachOverlay
                containerRef={containerRef}
                active={guideMode === 'manual' || (gameState === 'playing' && showGuide && !solvedFunc)}
            mode={guideMode || 'spotlight'}
                steps={lv2CoachSteps}
                onDismiss={dismissGuide}
              />
            </div>
          )}

          {gameState === 'ended' && (
            <LevelResultScreen
              score={finalScore}
              baseScore={baseScore}
              earnedStars={earnedStars}
              correctCount={correctCount}
              wrongCount={wrongCount}
              lives={lives}
              progress={progress}
              targetTotal={starsThreshold[2]}
              elapsedSec={elapsedSec}
              lifeBonus={lifeBonus}
              accuracyBonus={accuracyBonus}
              speedBonus={speedBonus}
              accentClass="text-cyan-600"
              onCompleteLevel={onCompleteLevel}
              onRestart={startGame}
              onBackToMap={onBackToMap}
            />
          )}
        </div>
      );
    };


    // ==================== 第 3 關組件：未知邊獵人（比例狙擊｜餘命進度制） ====================
    const Level3MissingSideMaster = ({ currentStars, hasSeenGuide = false, onMarkGuideSeen, onUpdateStars, onCompleteLevel, onBackToMap }) => {
      const { isRelaxMode } = React.useContext(GameModeContext);
      const starsThreshold = [2, 5, 9];
      const maxLives = 3;
      const healTarget = 3;
      const {
        gameState, progress, lives, healStreak, correctCount, wrongCount, elapsedSec,
        earnedStars, baseScore, lifeBonus, accuracyBonus, speedBonus, finalScore,
        startSession, recordCorrect, recordWrong, finishNow
      } = useLivesLevelSession({ starThresholds: starsThreshold, maxLives, healTarget, currentStars, onUpdateStars });

      const [question, setQuestion] = useState(null);
      const [solvedVal, setSolvedVal] = useState(null);
      const [feedbackAnim, setFeedbackAnim] = useState('');
      const [wrongBtnKey, setWrongBtnKey] = useState(null);
      const [wrongHintActive, setWrongHintActive] = useState(false);
      const [conceptTip, setConceptTip] = useState(null);
      const { showGuide, guideMode, openGuide, dismissGuide } = useLevelGuide(currentStars, hasSeenGuide, onMarkGuideSeen);

      const containerRef = useRef(null);
      const prevKeyRef = useRef('');
      const questionMissedRef = useRef(false);
      const confirmTimerRef = useRef(null);
      const pendingNextRef = useRef(null);
      const handleConfirmSkip = () => {
        if (!pendingNextRef.current) return;
        clearTimeout(confirmTimerRef.current);
        const fn = pendingNextRef.current;
        pendingNextRef.current = null;
        audio.sfxClick();
        fn();
      };
      useEffect(() => () => clearTimeout(confirmTimerRef.current), []);


      const nextQuestion = (curProg) => {
        const phase = curProg >= starsThreshold[1] ? 2 : curProg >= starsThreshold[0] ? 1 : 0;
        const q = generateLevel3Question(phase, prevKeyRef.current);
        prevKeyRef.current = q.questionKey;
        questionMissedRef.current = false;
        setQuestion(q);
        setSolvedVal(null);
        setWrongBtnKey(null);
        setWrongHintActive(false);
        setConceptTip(null);
      };

      const startGame = () => {
        clearTimeout(confirmTimerRef.current);
        pendingNextRef.current = null;
        prevKeyRef.current = '';
        questionMissedRef.current = false;
        setFeedbackAnim('');
        setSolvedVal(null);
        setWrongBtnKey(null); setWrongHintActive(false); setConceptTip(null);
        const initProg = startSession();
        nextQuestion(initProg);
        audio.init();
      };

      useEffect(() => {
        startGame();
      }, []);

      const lv3CoachSteps = useMemo(() => ([
        {
          tap: false,
          desc: '依上方三角比與已知邊，推算紅色 ? 邊長',
          targets: [
            { target: 'lv3-clue', anchorX: 0.5, anchorY: 0.5, pad: 8, shape: 'ellipse' },
            { target: 'lv3-unknown', anchorX: 0.5, anchorY: 0.5, minW: 78, minH: 78, shape: 'circle' }
          ]
        },
        {
          target: 'lv3-btn',
          anchorX: 0.5,
          anchorY: 0.5,
          pad: 8,
          shape: 'pill',
          tap: true,
          desc: '點擊正確的邊長數值作答'
        }
      ]), []);

      const handleSelectOption = (opt) => {
        if (gameState !== 'playing' || !question || solvedVal || wrongBtnKey || (!isRelaxMode && lives <= 0)) return;
        if (opt === question.correctSideVal) {
          audio.sfxBonus();
          if (showGuide) dismissGuide();
          setSolvedVal(opt);
          setWrongHintActive(false);
          setFeedbackAnim('animate-correct');
          const confirmDur = 1100;
          const { completed, nextProgress } = recordCorrect({ wasMissed: questionMissedRef.current, delayEndMs: confirmDur });
          setConceptTip({
            node: (
              <span className="inline-flex items-center gap-1.5 font-serif font-black">
                <span>{question.targetFunc}({question.angleName}) =</span>
                <FracText value={`${question.clueNum}/${question.clueDen}`} size="sm" barClass="bg-emerald-900" />
                <span>➔ ? = {opt}</span>
              </span>
            ),
            tone: 'success',
            canSkip: !completed,
            id: Date.now()
          });
          if (!completed) {
            const advanceFn = () => {
              pendingNextRef.current = null;
              setFeedbackAnim('');
              nextQuestion(nextProgress);
            };
            pendingNextRef.current = advanceFn;
            confirmTimerRef.current = setTimeout(advanceFn, confirmDur);
          } else {
            setTimeout(() => setFeedbackAnim(''), confirmDur);
          }
        } else {
          audio.sfxError();
          questionMissedRef.current = true;
          const { gameOver } = recordWrong({ delayEndMs: 480 });
          setWrongBtnKey(opt);
          setWrongHintActive(true);
          setConceptTip({ text: question.conceptTip, id: Date.now() });
          setFeedbackAnim('animate-shake');
          if (!gameOver) {
            setTimeout(() => { setFeedbackAnim(''); setWrongBtnKey(null); }, 350);
          }
        }
      };

      return (
        <div ref={containerRef} className="w-full h-full flex-1 flex flex-col justify-between pt-0.5 pb-1 relative animate-jelly min-h-0">

          {gameState === 'idle' && (
            <div className="flex-1 my-3 bg-white/95 rounded-3xl border-4 border-indigo-950 p-5 shadow-2xl flex flex-col justify-between text-center items-center">
              <div className="w-full space-y-2.5 pt-2">
                <div className="w-20 h-20 mx-auto rounded-3xl bg-indigo-100 border-4 border-indigo-500 flex items-center justify-center text-4xl shadow-inner animate-bounce">🔍</div>
                <h2 className="text-2xl font-black text-indigo-950 tracking-wide">未知邊獵人</h2>
                <p className="text-xs text-slate-500 font-bold leading-relaxed max-w-xs mx-auto">
                  結合圖上的已知邊長與上方三角比線索，從容推算並選出紅色 <span className="text-rose-600 font-black">?</span> 未知邊長！
                </p>
              </div>
              <CompactStarPills starsThreshold={starsThreshold} livesMode maxLives={maxLives} />
              <div className="w-full space-y-2">
                <button onClick={startGame} className="w-full py-4 btn-3d-blue text-white font-black text-lg rounded-2xl shadow-xl tracking-wider active:scale-95">{isRelaxMode ? '🌱 開始休閒練習！' : '🚀 開始試煉！'}</button>
                <button onClick={onBackToMap} className="w-full py-2 text-xs font-bold text-slate-400 hover:text-slate-600">返回聖域地圖</button>
              </div>
            </div>
          )}

          {gameState === 'playing' && question && (
            <div className={`flex-1 min-h-0 flex flex-col justify-between gap-2 overflow-hidden pb-0.5 ${feedbackAnim}`}>
              <GameHUD
                progress={progress}
                starsThreshold={starsThreshold}
                lives={lives}
                maxLives={maxLives}
                healStreak={healStreak}
                healTarget={healTarget}
                onManualEnd={finishNow}
                onOpenGuide={openGuide}
              />

              <div className={`flex-1 min-h-0 bg-white rounded-3xl border-3 border-indigo-950 shadow-xl flex flex-col overflow-hidden transition-all duration-150 ${solvedVal ? 'ring-4 ring-emerald-400/75' : ''}`}>
                <StagePhaseStrip phase={progress >= starsThreshold[1] ? 2 : progress >= starsThreshold[0] ? 1 : 0} labels={['3-4-5 比例狙擊 • 固定底角', '多組畢氏對 • 雙角比例切換', '全向旋轉 • 綜合未知邊狙擊']} />
                <div data-coach="lv3-clue" className="bg-gradient-to-r from-indigo-600 to-blue-700 py-2 px-3.5 flex items-center justify-between gap-2 text-white border-b-2 border-indigo-800 shrink-0">
                  <div className="flex items-center gap-2">
                    <span className="text-[11px] font-black bg-white/15 px-2 py-0.5 rounded-lg">線索</span>
                    <span className="inline-flex items-center gap-1.5 text-lg sm:text-xl font-serif font-black tracking-wide">
                      <span>{question.targetFunc}({question.angleName}) =</span>
                      <FracText value={`${question.clueNum}/${question.clueDen}`} size="sm" />
                    </span>
                  </div>
                  <div className="flex items-center gap-1.5">
                    <span className={`px-2.5 py-0.5 rounded-lg font-serif font-black text-base border-2 transition-all ${
                      solvedVal
                        ? 'bg-emerald-400 border-emerald-200 text-emerald-950 scale-110'
                        : 'bg-rose-500/35 border-rose-200 text-white animate-pulse'
                    }`}>
                      {solvedVal ? `? = ${solvedVal}` : '求 ? 邊'}
                    </span>
                    <SuccessBadge show={Boolean(solvedVal)} />
                  </div>
                </div>

                <div onClick={handleConfirmSkip} className="relative w-full flex-1 min-h-0 bg-white flex items-center justify-center overflow-hidden">
                  <HintBanner tip={conceptTip} />
                  <svg viewBox="0 0 500 500" className="w-full h-full object-contain drop-shadow-md">
                    <TriangleBlueprintBg id="triGridLv3" />
                    <polygon points={`${question.pts.P1.x},${question.pts.P1.y} ${question.pts.P2.x},${question.pts.P2.y} ${question.pts.P3.x},${question.pts.P3.y}`} fill="#f8fafc" stroke="none" />
                    <polygon points={question.rightAngleSquare} fill="#f1f5f9" stroke="#94a3b8" strokeWidth="2.5" />
                    <TriangleAngleArc d={question.arcPath} />

                    {question.edges.map((edge, idx) => {
                      const isTarget = edge.role === 'target';
                      const isKnown = edge.role === 'known';
                      const strokeCol = isTarget
                        ? (solvedVal ? '#10b981' : '#e11d48')
                        : isKnown
                        ? '#1e3a8a'
                        : '#64748b';
                      const circleFill = isTarget ? (solvedVal ? '#ecfdf5' : '#fff1f2') : '#eff6ff';
                      const textCol = isTarget ? (solvedVal ? '#047857' : '#be123c') : '#1e3a8a';
                      return (
                        <g key={idx}>
                          <line
                            x1={edge.p1.x} y1={edge.p1.y} x2={edge.p2.x} y2={edge.p2.y}
                            stroke={strokeCol}
                            strokeWidth={isTarget ? (solvedVal ? '14' : '12') : isKnown ? '12' : '10'}
                            strokeLinecap="round"
                            strokeDasharray={isTarget && !solvedVal ? '9 7' : 'none'}
                          />
                          {(isTarget || isKnown) && (
                            <g data-coach={isTarget ? 'lv3-unknown' : undefined} className={isTarget && !solvedVal ? 'animate-pulse' : ''}>
                              <circle cx={edge.midPt.x} cy={edge.midPt.y} r="22" fill={circleFill} stroke={strokeCol} strokeWidth="3.5" />
                              <text x={edge.midPt.x} y={edge.midPt.y + 1} fill={textCol} fontSize="19" fontWeight="900" textAnchor="middle" dominantBaseline="middle" className="font-serif pointer-events-none">
                                {isTarget ? (solvedVal || '?') : edge.val}
                              </text>
                              {(solvedVal || wrongHintActive) && (() => {
                                const roleMap = { hyp: '斜邊', opp: '對邊', adj: '鄰邊' };
                                const pillY = Math.min(474, edge.midPt.y + 32);
                                return (
                                  <g transform={`translate(${edge.midPt.x}, ${pillY})`} className="pointer-events-none">
                                    <rect x="-26" y="-11" width="52" height="22" rx="11" fill={isTarget ? (solvedVal ? '#059669' : '#e11d48') : '#1e3a8a'} stroke="#ffffff" strokeWidth="2" />
                                    <text x="0" y="1" fill="#ffffff" fontSize="12" fontWeight="900" textAnchor="middle" dominantBaseline="middle">{roleMap[edge.id]}</text>
                                  </g>
                                );
                              })()}
                            </g>
                          )}
                        </g>
                      );
                    })}

                    {question.labels.map((lbl, idx) => (
                      <text key={idx} x={lbl.x} y={lbl.y} fill={lbl.color} fontSize="30" fontWeight="900" textAnchor="middle" dominantBaseline="middle" className="font-serif drop-shadow pointer-events-none">
                        {lbl.text}
                      </text>
                    ))}
                  </svg>
                </div>

                <div className="bg-slate-50 border-t-2 border-slate-200 p-2 h-[120px] shrink-0">
                  <div className="h-full grid grid-cols-2 grid-rows-2 gap-2">
                    {question.sideOptions.map((opt, idx) => {
                      const isCoachBtn = showGuide && !solvedVal && opt === question.correctSideVal;
                      return (
                        <button
                          key={idx}
                          data-coach={isCoachBtn ? 'lv3-btn' : undefined}
                          onClick={() => handleSelectOption(opt)}
                          className={`h-full btn-3d-blue text-white font-black text-xl rounded-2xl shadow-md active:scale-95 transition-all flex items-center justify-center font-serif tracking-wider ${solvedVal === opt ? 'ring-4 ring-emerald-300' : isCoachBtn ? 'ring-4 ring-amber-300/90' : ''} ${wrongBtnKey === opt ? 'btn-wrong-flash' : ''}`}
                        >
                          {opt}
                        </button>
                      );
                    })}
                  </div>
                </div>
              </div>
              <CoachOverlay
                containerRef={containerRef}
                active={guideMode === 'manual' || (gameState === 'playing' && showGuide && !solvedVal)}
            mode={guideMode || 'spotlight'}
                steps={lv3CoachSteps}
                onDismiss={dismissGuide}
              />
            </div>
          )}

          {gameState === 'ended' && (
            <LevelResultScreen
              score={finalScore}
              baseScore={baseScore}
              earnedStars={earnedStars}
              correctCount={correctCount}
              wrongCount={wrongCount}
              lives={lives}
              progress={progress}
              targetTotal={starsThreshold[2]}
              elapsedSec={elapsedSec}
              lifeBonus={lifeBonus}
              accuracyBonus={accuracyBonus}
              speedBonus={speedBonus}
              accentClass="text-indigo-600"
              onCompleteLevel={onCompleteLevel}
              onRestart={startGame}
              onBackToMap={onBackToMap}
            />
          )}
        </div>
      );
    };


    // ==================== 第 4 關組件：黃金神殿（3D 立體滾輪＋聖印開鎖機關） ====================
    const TempleDrumWheel = ({ label, options, value, formatOption = (v) => String(v), bannedVal = null, locked = false, disabled = false, onStep }) => {
      const [dragOffset, setDragOffset] = useState(0);
      const [isDragging, setIsDragging] = useState(false);
      const [lockedBump, setLockedBump] = useState(false);
      const dragStartYRef = useRef(null);
      const draggedRef = useRef(false);
      const isDraggingRef = useRef(false);
      const bumpTimerRef = useRef(null);
      useEffect(() => () => clearTimeout(bumpTimerRef.current), []);
      useEffect(() => { isDraggingRef.current = isDragging; }, [isDragging]);
      useEffect(() => {
        const preventTouchScroll = (e) => { if (isDraggingRef.current) e.preventDefault(); };
        document.addEventListener('touchmove', preventTouchScroll, { passive: false });
        return () => document.removeEventListener('touchmove', preventTouchScroll);
      }, []);
      const idx = options.indexOf(value);
      const prevOpt = options[(idx - 1 + options.length) % options.length];
      const nextOpt = options[(idx + 1) % options.length];

      const triggerLockedFeedback = () => {
        if (!locked) return;
        audio.sfxClick();
        clearTimeout(bumpTimerRef.current);
        setLockedBump(true);
        bumpTimerRef.current = setTimeout(() => setLockedBump(false), 240);
      };

      const handlePointerDown = (e) => {
        if (locked) {
          triggerLockedFeedback();
          return;
        }
        if (disabled) return;
        e.preventDefault();
        dragStartYRef.current = e.clientY;
        draggedRef.current = false;
        setIsDragging(true);
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch {}
      };

      const handlePointerMove = (e) => {
        if (disabled || dragStartYRef.current === null) return;
        const dy = e.clientY - dragStartYRef.current;
        if (Math.abs(dy) >= 4) draggedRef.current = true;
        if (Math.abs(dy) >= 18) {
          onStep(dy < 0 ? 1 : -1);
          dragStartYRef.current = e.clientY;
          setDragOffset(0);
        } else {
          setDragOffset(dy * 0.75);
        }
      };

      const handlePointerUp = (e) => {
        dragStartYRef.current = null;
        setIsDragging(false);
        setDragOffset(0);
        try { e.currentTarget.releasePointerCapture(e.pointerId); } catch {}
      };

      const handleWheel = (e) => {
        if (locked) {
          triggerLockedFeedback();
          return;
        }
        if (disabled) return;
        e.preventDefault();
        onStep(e.deltaY > 0 ? 1 : -1);
      };

      const renderSlotText = (opt, role) => {
        const isBanned = bannedVal === opt;
        const tiltStyle =
          role === 'prev'
            ? { transform: 'perspective(160px) rotateX(48deg) scaleY(0.82)' }
            : role === 'next'
            ? { transform: 'perspective(160px) rotateX(-48deg) scaleY(0.82)' }
            : { transform: 'perspective(160px) rotateX(0deg) scaleY(1)' };
        return (
          <span
            style={tiltStyle}
            className={`inline-flex items-center justify-center font-serif font-black tracking-wide transition-transform duration-100 ${
              role === 'curr'
                ? `text-xl drop-shadow-[0_1px_0_rgba(255,255,255,0.65)] ${isBanned ? 'text-rose-700 line-through decoration-2' : 'text-amber-950'}`
                : `text-base ${isBanned ? 'text-rose-600/55 line-through' : 'text-amber-950/55'}`
            }`}
          >
            {formatOption(opt)}
            {role === 'curr' && isBanned && <span className="ml-0.5 text-xs no-underline">🚫</span>}
          </span>
        );
      };

      return (
        <div
          className={`relative h-[108px] rounded-[16px] overflow-hidden flex flex-col select-none touch-none transition-transform ${
            locked
              ? 'border border-stone-600/90 shadow-[0_6px_12px_rgba(0,0,0,0.45),inset_0_1px_0_rgba(255,255,255,0.15)]'
              : 'border border-amber-300/90 shadow-[0_8px_16px_rgba(120,53,15,0.45),inset_0_1px_0_rgba(255,255,255,0.7)]'
          } ${lockedBump ? 'animate-shake' : ''}`}
          style={{
            background: locked
              ? 'linear-gradient(180deg, #1c1917 0%, #3f3b37 22%, #57534e 42%, #44403c 68%, #1c1917 100%)'
              : 'linear-gradient(180deg, #451a03 0%, #92400e 12%, #d97706 24%, #fef3c7 38%, #fffbeb 46%, #fde68a 56%, #d97706 76%, #78350f 90%, #290f02 100%)'
          }}
        >
          {/* 擬真金屬圓柱滾筒區（無矩形銘牌外框，直接突出於軸心） */}
          <div
            onPointerDown={handlePointerDown}
            onPointerMove={handlePointerMove}
            onPointerUp={handlePointerUp}
            onPointerCancel={handlePointerUp}
            onWheel={handleWheel}
            className={`relative flex-1 shadow-[inset_0_14px_18px_rgba(0,0,0,0.65),inset_0_-14px_18px_rgba(0,0,0,0.65)] overflow-hidden touch-none ${
              locked ? 'cursor-not-allowed' : 'cursor-grab active:cursor-grabbing'
            }`}
          >
            {locked ? (
              <div className="relative z-10 h-full flex items-center justify-center px-2">
                <span className="absolute top-1.5 right-2 text-[10px] opacity-80">🔒</span>
                <span className="font-serif font-black text-xl text-amber-200 tracking-wide drop-shadow-[0_1px_2px_rgba(0,0,0,0.8)]">{formatOption(value)}</span>
              </div>
            ) : (
              <>
                {/* 左右立體金屬軸環＋滾花齒紋（Knurling） */}
                <div
                  className="pointer-events-none absolute inset-y-0 left-0 w-2.5 z-20 border-r border-amber-950/40"
                  style={{ backgroundImage: 'repeating-linear-gradient(to bottom, rgba(69,26,3,0.7) 0px, rgba(69,26,3,0.7) 2px, rgba(254,243,199,0.6) 2px, rgba(254,243,199,0.6) 4px, transparent 4px, transparent 6px)' }}
                />
                <div
                  className="pointer-events-none absolute inset-y-0 right-0 w-2.5 z-20 border-l border-amber-950/40"
                  style={{ backgroundImage: 'repeating-linear-gradient(to bottom, rgba(69,26,3,0.7) 0px, rgba(69,26,3,0.7) 2px, rgba(254,243,199,0.6) 2px, rgba(254,243,199,0.6) 4px, transparent 4px, transparent 6px)' }}
                />

                {/* 隨手指滑動的滾筒本體（含金屬刻槽線） */}
                <div
                  style={{ transform: `translateY(${dragOffset}px)` }}
                  className={`relative z-10 h-full flex flex-col items-center justify-between py-1 px-3 ${isDragging ? '' : 'transition-transform duration-150 ease-out'}`}
                >
                  <button
                    type="button"
                    onClick={() => { if (!draggedRef.current && !disabled) onStep(-1); }}
                    className="w-full h-[28px] flex items-center justify-center cursor-pointer"
                    aria-label={`上一個${label}`}
                  >
                    {renderSlotText(prevOpt, 'prev')}
                  </button>

                  <div className="w-full h-[1.5px] bg-gradient-to-r from-transparent via-amber-950/50 to-transparent shadow-[0_1px_0_rgba(255,255,255,0.6)]" />

                  <div className="w-full h-[36px] flex items-center justify-center pointer-events-none">
                    {renderSlotText(value, 'curr')}
                  </div>

                  <div className="w-full h-[1.5px] bg-gradient-to-r from-transparent via-amber-950/50 to-transparent shadow-[0_1px_0_rgba(255,255,255,0.6)]" />

                  <button
                    type="button"
                    onClick={() => { if (!draggedRef.current && !disabled) onStep(1); }}
                    className="w-full h-[28px] flex items-center justify-center cursor-pointer"
                    aria-label={`下一個${label}`}
                  >
                    {renderSlotText(nextOpt, 'next')}
                  </button>
                </div>

                {/* 中央金框觀景線 */}
                <div className="pointer-events-none absolute inset-x-2.5 top-1/2 -translate-y-1/2 h-[38px] rounded-md border-y-2 border-amber-800/75 bg-white/10 shadow-[inset_0_1px_0_rgba(255,255,255,0.65),0_2px_5px_rgba(69,26,3,0.3)] z-10" />
              </>
            )}

            {/* 圓柱上下弧面深槽陰影 */}
            <div className="pointer-events-none absolute inset-x-0 top-0 h-5 bg-gradient-to-b from-black/60 to-transparent z-20" />
            <div className="pointer-events-none absolute inset-x-0 bottom-0 h-5 bg-gradient-to-t from-black/60 to-transparent z-20" />
          </div>
        </div>
      );
    };

    const Level4SpecialAnglesMaster = ({ currentStars, hasSeenGuide = false, onMarkGuideSeen, onUpdateStars, onCompleteLevel, onBackToMap }) => {
      const { isRelaxMode } = React.useContext(GameModeContext);
      const starsThreshold = [2, 4, 6];
      const maxLives = 3;
      const healTarget = 2;
      const {
        gameState, progress, lives, healStreak, correctCount, wrongCount, elapsedSec,
        earnedStars, baseScore, lifeBonus, accuracyBonus, speedBonus, finalScore,
        startSession, recordCorrect, recordWrong, finishNow
      } = useLivesLevelSession({ starThresholds: starsThreshold, maxLives, healTarget, currentStars, onUpdateStars });

      const [question, setQuestion] = useState(null);
      const [selFunc, setSelFunc] = useState('sin');
      const [selDeg, setSelDeg] = useState(30);
      const [solvedKeys, setSolvedKeys] = useState([]);
      const [isSolved, setIsSolved] = useState(false);
      const [wrongLock, setWrongLock] = useState(false);
      const [feedbackAnim, setFeedbackAnim] = useState('');
      const [conceptTip, setConceptTip] = useState(null);
