<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>勇闖三角比聖域</title>
  
  <!-- 載入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 載入 Google 字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">

  <!-- 載入 React, ReactDOM 與 Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- 載入 Three.js 與 OrbitControls (3D 微縮幾何聖域引擎) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <style>
    html, body {
      height: 100dvh;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .pt-safe {
      padding-top: max(0.5rem, env(safe-area-inset-top));
    }
    .pb-safe {
      padding-bottom: max(0.5rem, env(safe-area-inset-bottom));
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* 手遊立體 3D 糖果按鈕 */
    .btn-3d-yellow {
      background: linear-gradient(to bottom, #fde047, #eab308);
      border-bottom: 5px solid #a16207;
      transition: all 0.08s ease-in-out;
    }
    .btn-3d-yellow:active {
      transform: translateY(4px);
      border-bottom-width: 1px;
    }

    .btn-3d-blue {
      background: linear-gradient(to bottom, #60a5fa, #2563eb);
      border-bottom: 5px solid #1e40af;
      transition: all 0.08s ease-in-out;
    }
    .btn-3d-blue:active {
      transform: translateY(4px);
      border-bottom-width: 1px;
    }

    .btn-3d-green {
      background: linear-gradient(to bottom, #4ade80, #16a34a);
      border-bottom: 5px solid #166534;
      transition: all 0.08s ease-in-out;
    }
    .btn-3d-green:active {
      transform: translateY(4px);
      border-bottom-width: 1px;
    }

    .btn-3d-purple {
      background: linear-gradient(to bottom, #c084fc, #9333ea);
      border-bottom: 5px solid #6b21a8;
      transition: all 0.08s ease-in-out;
    }
    .btn-3d-purple:active {
      transform: translateY(4px);
      border-bottom-width: 1px;
    }

    /* 答錯按鈕閃紅特效 (0.35秒) */
    @keyframes btnFlashRed {
      0%, 100% { filter: brightness(1); }
      25%, 75% {
        background: linear-gradient(to bottom, #f87171, #dc2626) !important;
        border-color: #7f1d1d !important;
        color: #ffffff !important;
        box-shadow: 0 0 18px rgba(239, 68, 68, 0.95) !important;
        transform: scale(0.96);
      }
    }
    .btn-wrong-flash {
      animation: btnFlashRed 0.35s ease-in-out;
    }

    /* 果凍彈跳特效 */
    @keyframes jellyPop {
      0% { transform: scale(0.85); opacity: 0; }
      50% { transform: scale(1.06); opacity: 1; }
      75% { transform: scale(0.97); }
      100% { transform: scale(1); }
    }
    .animate-jelly {
      animation: jellyPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    /* 答錯晃動 */
    @keyframes shakeWrong {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .animate-shake {
      animation: shakeWrong 0.35s ease-in-out;
    }

    /* 答對向上飄浮浮光 */
    @keyframes popCorrect {
      0% { transform: scale(0.9); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    .animate-correct {
      animation: popCorrect 0.25s ease-out;
    }

    @keyframes floatUpFade {
      0% { opacity: 0; transform: translateY(4px) scale(0.85); }
      20% { opacity: 1; transform: translateY(-2px) scale(1.06); }
      100% { opacity: 0; transform: translateY(-16px) scale(0.95); }
    }
    .animate-float-up {
      animation: floatUpFade 0.85s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    @keyframes timePenaltyFade {
      0% { opacity: 0; transform: scale(0.75) translateY(2px); }
      18% { opacity: 1; transform: scale(1.08) translateY(0); }
      65% { opacity: 1; transform: scale(1) translateY(0); }
      100% { opacity: 0; transform: scale(0.92) translateY(-5px); }
    }
    .animate-time-penalty {
      animation: timePenaltyFade 0.85s ease-out forwards;
    }

    /* 卡牌進出場動畫 */
    @keyframes flyIn {
      0% { transform: perspective(600px) translate3d(0, -40px, 100px) rotateX(25deg) scale(0.75); opacity: 0; }
      55% { transform: perspective(600px) translate3d(0, 6px, 0px) rotateX(-6deg) scale(1.03); opacity: 1; }
      100% { transform: perspective(600px) translate3d(0, 0, 0) rotateX(0deg) scale(1); opacity: 1; }
    }
    @keyframes popOut {
      0% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 rgba(250,204,21,0); }
      40% { transform: scale(1.12); opacity: 1; filter: brightness(1.15); box-shadow: 0 0 20px rgba(250,204,21,0.95); border-color: rgb(250,204,21); }
      100% { transform: scale(0.5); opacity: 0.25; }
    }
    .animate-fly-in { animation: flyIn 0.36s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
    .animate-pop-out { animation: popOut 0.28s cubic-bezier(0.4, 0, 0.2, 1) forwards; pointer-events: none; }

    /* Lv.7 星光泡泡爆破與背景閃爍動畫 */
    @keyframes starBurstRing {
      0% { transform: translate(-50%, -50%) scale(0.35); opacity: 0.95; }
      100% { transform: translate(-50%, -50%) scale(1.9); opacity: 0; }
    }
    .animate-star-ring {
      animation: starBurstRing 0.48s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes starBurstSpark {
      0% { transform: translate(-50%, -50%) translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -50%) translate(var(--tx), var(--ty)) scale(0.2); opacity: 0; }
    }
    .animate-star-spark {
      animation: starBurstSpark 0.46s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes twinkleStar {
      0%, 100% { opacity: 0.25; transform: scale(0.85); }
      50% { opacity: 0.9; transform: scale(1.2); }
    }
    .animate-twinkle {
      animation: twinkleStar var(--tw-dur, 3s) ease-in-out var(--tw-delay, 0s) infinite;
    }

    @keyframes slowSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-slow-spin {
      animation: slowSpin 26s linear infinite;
    }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    .animate-float-slow {
      animation: floatSlow 3.4s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-gradient-to-b from-sky-400 via-indigo-700 to-slate-950 h-[100dvh] w-full overflow-hidden text-slate-800 flex justify-center selection:bg-amber-300">

  <div id="root" class="w-full sm:max-w-md h-[100dvh] flex flex-col relative overflow-hidden bg-sky-400/20 sm:shadow-2xl"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // ==================== 共用 SVG 圖示元件 ====================
    const StarBadge = ({ filled, className = "w-6 h-6" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill={filled ? "#fbbf24" : "#334155"} stroke={filled ? "#b45309" : "#1e293b"} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`${className} transition-all duration-300 ${filled ? 'drop-shadow-[0_0_8px_rgba(251,191,36,0.9)] scale-110' : 'opacity-40'}`}>
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
      </svg>
    );

    // ==================== 即時教學糾錯提示浮層（不推擠畫布高度） ====================
    const HintBanner = ({ tip }) => {
      if (!tip) return null;
      return (
        <div key={tip.id} className="absolute bottom-2 left-2 right-2 z-20 bg-amber-50/95 backdrop-blur-sm border-2 border-amber-400 rounded-xl px-3 py-1.5 text-xs font-black text-amber-950 flex items-center gap-1.5 shadow-md animate-jelly pointer-events-none">
          <span>💡</span>
          <span>{tip.text}</span>
        </div>
      );
    };

    // ==================== 共用遊戲頂部 HUD ====================
    const GameHUD = ({ score, combo, timeLeft, maxTime, starsThreshold, isDojo = false, extraRight = null, timeStatusLabel = null }) => {
      const [scorePop, setScorePop] = useState(null);
      const [timePop, setTimePop] = useState(null);
      const [barFlash, setBarFlash] = useState(false);
      const [comboBurstId, setComboBurstId] = useState(0);
      const prevScoreRef = useRef(score);
      const prevTimeRef = useRef(timeLeft);
      const prevComboRef = useRef(combo);

      useEffect(() => {
        const diff = score - prevScoreRef.current;
        if (diff > 0) {
          const id = Date.now() + Math.random();
          setScorePop({ diff, id });
          const timer = setTimeout(() => setScorePop(prev => prev?.id === id ? null : prev), 850);
          prevScoreRef.current = score;
          return () => clearTimeout(timer);
        }
        prevScoreRef.current = score;
      }, [score]);

      useEffect(() => {
        const drop = +(prevTimeRef.current - timeLeft).toFixed(2);
        if (drop >= 0.4) {
          const id = Date.now() + Math.random();
          setTimePop({ sec: drop, id });
          setBarFlash(true);
          const flashTimer = setTimeout(() => setBarFlash(false), 350);
          const timer = setTimeout(() => setTimePop(prev => prev?.id === id ? null : prev), 880);
          prevTimeRef.current = timeLeft;
          return () => { clearTimeout(flashTimer); clearTimeout(timer); };
        }
        prevTimeRef.current = timeLeft;
      }, [timeLeft]);

      useEffect(() => {
        if ((prevComboRef.current < 3 && combo >= 3) || (prevComboRef.current < 6 && combo >= 6)) {
          setComboBurstId(c => c + 1);
        }
        prevComboRef.current = combo;
      }, [combo]);

      const mult = combo >= 6 ? 1.5 : combo >= 3 ? 1.2 : 1.0;
      const activePips = combo >= 6 ? 3 : combo >= 3 ? combo - 3 : combo;
      const stageBadge = combo >= 6
        ? 'bg-amber-400 border-amber-600 text-amber-950 animate-pulse'
        : combo >= 3
        ? 'bg-sky-500 border-sky-700 text-white'
        : 'bg-slate-100 border-slate-300 text-slate-600';
      const activePipClass = combo >= 6
        ? 'bg-amber-400 border-amber-600 shadow-[0_0_6px_rgba(251,191,36,0.9)] scale-110'
        : combo >= 3
        ? 'bg-amber-400 border-amber-600 scale-105'
        : 'bg-emerald-400 border-emerald-600 scale-105';
      return (
        <div className="bg-white/95 backdrop-blur border-2 sm:border-3 border-indigo-950 rounded-2xl p-2 shadow-md shrink-0 flex flex-col gap-1">
          <div className="flex justify-between items-center px-0.5 gap-2">
            <div className="flex items-end gap-1.5 shrink-0 relative">
              <div className="flex flex-col">
                <span className="text-[9px] font-black text-slate-400 uppercase leading-none">SCORE</span>
                <span className={`text-xl sm:text-2xl font-black font-mono leading-none mt-0.5 transition-all duration-150 ${scorePop ? 'text-emerald-600 scale-110 origin-left' : 'text-indigo-950 scale-100'}`}>{score}</span>
              </div>
              {scorePop && (
                <span
                  key={scorePop.id}
                  className="px-1.5 py-0.5 rounded-lg bg-emerald-500 text-white text-[11px] font-black font-mono shadow-sm leading-none mb-0.5 animate-float-up pointer-events-none"
                >
                  +{scorePop.diff}
                </span>
              )}
            </div>

            <div className="flex items-center gap-2.5">
              {extraRight}
              <div key={comboBurstId} className={`flex items-center gap-2 shrink-0 ${comboBurstId > 0 ? 'animate-jelly' : ''}`}>
                <div className="flex items-center gap-2 px-0.5" aria-label={`連擊充能 ${combo}`}>
                  {[0, 1, 2].map((i) => (
                    <span
                      key={i}
                      className={`w-2.5 h-2.5 rotate-45 rounded-[2px] border transition-all duration-200 ${i < activePips ? activePipClass : 'bg-slate-200 border-slate-300'}`}
                    />
                  ))}
                </div>
                <div className={`px-2 py-1 rounded-lg text-[11px] font-black border-2 leading-none transition-all ${stageBadge}`}>
                  ⚡ x{mult}
                </div>
              </div>
            </div>
          </div>

          <div className={`w-full bg-slate-200 rounded-full h-2 overflow-hidden border relative shadow-inner transition-colors ${barFlash ? 'border-red-500 ring-2 ring-red-400/50' : 'border-slate-300'}`}>
            <div
              className={`h-full rounded-full transition-all duration-100 ease-linear ${barFlash ? 'bg-red-500' : timeLeft < 10 ? 'bg-red-500 animate-pulse' : 'bg-sky-500'}`}
              style={{ width: `${Math.min(100, Math.max(0, (timeLeft / maxTime) * 100))}%` }}
            ></div>
          </div>
          <div className="flex justify-between items-center text-[9px] font-black text-slate-500 uppercase -mt-0.5 px-0.5 leading-none">
            <span className="flex items-center gap-1.5">
              <span>倒數 {Math.ceil(timeLeft)} 秒 {timeStatusLabel}</span>
              {timePop && (
                <span key={timePop.id} className="px-1.5 py-0.5 rounded-md bg-red-500 text-white text-[9px] font-mono font-black leading-none animate-time-penalty pointer-events-none">
                  -{timePop.sec}s
                </span>
              )}
            </span>
            <span>滿時 {maxTime} 秒</span>
          </div>

          {!isDojo && starsThreshold && (
            <div className="w-full relative h-2.5 bg-slate-200 rounded-full border border-slate-300 mt-0.5">
              <div
                className="absolute top-0 left-0 h-full bg-gradient-to-r from-amber-300 to-amber-500 rounded-full transition-all duration-300"
                style={{ width: `${Math.min(100, (score / starsThreshold[2]) * 100)}%` }}
              ></div>
              {[0, 1, 2].map((i) => {
                const perc = (starsThreshold[i] / starsThreshold[2]) * 100;
                return (
                  <div key={i} className="absolute top-1/2 -translate-y-1/2 -ml-2" style={{ left: `${perc}%` }}>
                    <StarBadge filled={score >= starsThreshold[i]} className="w-3.5 h-3.5" />
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    };

    // ==================== 共用進關：精簡星等列 & 先分子/先分母雙開局按鈕 ====================
    const CompactStarPills = ({ starsThreshold, maxTime }) => (
      <div className="w-full space-y-1.5">
        <div className="text-[11px] font-black text-slate-400 tracking-wider text-center">⏱️ {maxTime} 秒挑戰</div>
        <div className="grid grid-cols-3 gap-1.5">
          {[
            { stars: '⭐', color: 'text-emerald-600 bg-emerald-50 border-emerald-200', val: starsThreshold[0] },
            { stars: '⭐⭐', color: 'text-blue-600 bg-blue-50 border-blue-200', val: starsThreshold[1] },
            { stars: '⭐⭐⭐', color: 'text-purple-600 bg-purple-50 border-purple-200', val: starsThreshold[2] }
          ].map((item, idx) => (
            <div key={idx} className={`rounded-xl border px-2 py-2 flex flex-col items-center justify-center ${item.color}`}>
              <span className="text-[11px] leading-none">{item.stars}</span>
              <span className="font-mono font-black text-xs mt-1">{item.val}</span>
            </div>
          ))}
        </div>
      </div>
    );

    const FractionOrderButtons = ({ onStartWithOrder }) => (
      <div className="w-full space-y-1.5">
        <div className="text-[11px] font-black text-slate-400 tracking-wider text-center">選擇順序直接開局</div>
        <div className="grid grid-cols-2 gap-2.5">
          <button
            onClick={() => onStartWithOrder('num')}
            className="py-3.5 px-3 btn-3d-blue text-white font-black rounded-2xl shadow-xl active:scale-95 flex flex-col items-center justify-center gap-2"
          >
            <div className="flex flex-col items-center">
              <div className="w-12 h-5 rounded-md bg-amber-300 border-2 border-white text-indigo-950 text-[10px] font-black flex items-center justify-center shadow-sm">① 分子</div>
              <div className="w-14 h-0.5 bg-white/80 my-1"></div>
              <div className="w-12 h-5 rounded-md border-2 border-dashed border-white/60 bg-white/10 text-white/80 text-[10px] font-bold flex items-center justify-center">② 分母</div>
            </div>
            <span className="text-sm tracking-wide">🚀 先選分子</span>
          </button>

          <button
            onClick={() => onStartWithOrder('den')}
            className="py-3.5 px-3 btn-3d-purple text-white font-black rounded-2xl shadow-xl active:scale-95 flex flex-col items-center justify-center gap-2"
          >
            <div className="flex flex-col items-center">
              <div className="w-12 h-5 rounded-md border-2 border-dashed border-white/60 bg-white/10 text-white/80 text-[10px] font-bold flex items-center justify-center">② 分子</div>
              <div className="w-14 h-0.5 bg-white/80 my-1"></div>
              <div className="w-12 h-5 rounded-md bg-amber-300 border-2 border-white text-indigo-950 text-[10px] font-black flex items-center justify-center shadow-sm">① 分母</div>
            </div>
            <span className="text-sm tracking-wide">🚀 先選分母</span>
          </button>
        </div>
      </div>
    );

    // ==================== 答對完成 ✓ 徽章 & 共用挑戰結算統計卡 ====================
    const SuccessBadge = ({ show }) => {
      if (!show) return null;
      return (
        <span className="inline-flex items-center justify-center w-6 h-6 rounded-full bg-emerald-400 text-emerald-950 font-black text-sm shadow-md border-2 border-white animate-jelly shrink-0">
          ✓
        </span>
      );
    };

    const LevelResultScreen = ({
      score,
      baseScore = 0,
      earnedStars = 0,
      maxCombo = 0,
      correctCount = 0,
      wrongCount = 0,
      maxTime = 60,
      isDojo = false,
      accentClass = 'text-indigo-600',
      onCompleteLevel,
      onRestart,
      onBackToMap
    }) => {
      const bonusScore = Math.max(0, score - baseScore);
      const totalAttempts = correctCount + wrongCount;
      const accuracy = totalAttempts > 0 ? Math.round((correctCount / totalAttempts) * 100) : 0;
      const avgSec = correctCount > 0 ? (maxTime / correctCount).toFixed(1) : '--';

      return (
        <div className="flex-1 my-3 bg-white/95 rounded-3xl border-4 border-indigo-950 p-4 shadow-2xl flex flex-col justify-between items-center text-center animate-jelly overflow-y-auto no-scrollbar">
          <div className="w-full">
            <div className={`text-xs font-black uppercase tracking-widest mb-1 ${accentClass}`}>TIME UP! 時間到</div>
            <h3 className="text-2xl font-black text-indigo-950 mb-2.5">{isDojo ? '修行結算' : '挑戰結算'}</h3>

            {!isDojo && (
              <div className="flex justify-center gap-2 mb-3">
                <StarBadge filled={earnedStars >= 1} className="w-9 h-9" />
                <StarBadge filled={earnedStars >= 2} className="w-9 h-9" />
                <StarBadge filled={earnedStars >= 3} className="w-9 h-9" />
              </div>
            )}

            <div className="bg-slate-100 rounded-2xl p-3 border-2 border-slate-200 w-full mb-2.5">
              <div className="text-[11px] text-slate-500 font-bold">最終總分</div>
              <div className="text-4xl font-black font-mono text-indigo-950 leading-tight">{score}</div>
              <div className="flex items-center justify-center gap-2 mt-1.5 flex-wrap">
                <span className="text-[10px] font-black bg-white border border-slate-200 text-slate-600 px-2 py-0.5 rounded-lg font-mono">
                  基礎 {baseScore}
                </span>
                {bonusScore > 0 && (
                  <span className="text-[10px] font-black bg-amber-100 border border-amber-300 text-amber-800 px-2 py-0.5 rounded-lg font-mono">
                    🔥 連擊/獎勵 +{bonusScore}
                  </span>
                )}
              </div>
            </div>

            <div className="grid grid-cols-2 gap-2 w-full text-left mb-3">
              <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-2.5">
                <div className="text-[10px] font-black text-emerald-700">答對 / 答錯</div>
                <div className="text-sm font-black font-mono text-emerald-950 mt-0.5">{correctCount} 對 / {wrongCount} 錯</div>
              </div>
              <div className="bg-sky-50 border border-sky-200 rounded-xl p-2.5">
                <div className="text-[10px] font-black text-sky-700">正確率</div>
                <div className="text-sm font-black font-mono text-sky-950 mt-0.5">{accuracy}%</div>
              </div>
              <div className="bg-amber-50 border border-amber-200 rounded-xl p-2.5">
                <div className="text-[10px] font-black text-amber-700">最高連擊</div>
                <div className="text-sm font-black font-mono text-amber-950 mt-0.5">{maxCombo} COMBO</div>
              </div>
              <div className="bg-purple-50 border border-purple-200 rounded-xl p-2.5">
                <div className="text-[10px] font-black text-purple-700">平均速度</div>
                <div className="text-sm font-black font-mono text-purple-950 mt-0.5">{avgSec} 秒/題</div>
              </div>
            </div>
          </div>

          <div className="w-full space-y-2 mt-auto pt-1">
            {!isDojo && earnedStars >= 1 ? (

    const AUDIO_PREFS_KEY = 'trig_audio_prefs_v1';

    class AudioEngine {
      constructor() {
        this.ctx = null;
        this.stepNoiseBuf = null;
        this.fwNoiseBuf = null;
        this.sfxGain = null;
        this.bgmGain = null;
        this.bgmFilter = null;
        this.bgmScene = 'map';
        this.isDucked = false;
        this.bgmTimer = null;
        this.nextNoteTime = 0;
        this.bgmStep = 0;

        const saved = this.loadPrefs();
        this.bgmEnabled = saved.bgmEnabled;
        this.bgmVolume = saved.bgmVolume;
        this.sfxEnabled = saved.sfxEnabled;
        this.sfxVolume = saved.sfxVolume;

        if (typeof document !== 'undefined') {
          document.addEventListener('visibilitychange', () => {
            if (!this.ctx) return;
            if (document.hidden) {
              if (this.ctx.state === 'running') this.ctx.suspend().catch(() => {});
            } else if (this.bgmEnabled || this.sfxEnabled) {
              this.ctx.resume().then(() => {
                if (this.ctx) this.nextNoteTime = this.ctx.currentTime + 0.08;
              }).catch(() => {});
            }
          });
        }
      }

      get enabled() {
        return this.sfxEnabled;
      }

      loadPrefs() {
        const defaults = { bgmEnabled: true, bgmVolume: 0.7, sfxEnabled: true, sfxVolume: 0.85 };
        try {
          const raw = window.localStorage.getItem(AUDIO_PREFS_KEY);
          if (!raw) return defaults;
          const p = JSON.parse(raw);
          return {
            bgmEnabled: typeof p.bgmEnabled === 'boolean' ? p.bgmEnabled : defaults.bgmEnabled,
            bgmVolume: typeof p.bgmVolume === 'number' ? Math.min(1, Math.max(0, p.bgmVolume)) : defaults.bgmVolume,
            sfxEnabled: typeof p.sfxEnabled === 'boolean' ? p.sfxEnabled : defaults.sfxEnabled,
            sfxVolume: typeof p.sfxVolume === 'number' ? Math.min(1, Math.max(0, p.sfxVolume)) : defaults.sfxVolume
          };
        } catch (e) {
          return defaults;
        }
      }

      savePrefs() {
        try {
          window.localStorage.setItem(AUDIO_PREFS_KEY, JSON.stringify(this.getPrefs()));
        } catch (e) {}
      }

      getPrefs() {
        return {
          bgmEnabled: this.bgmEnabled,
          bgmVolume: this.bgmVolume,
          sfxEnabled: this.sfxEnabled,
          sfxVolume: this.sfxVolume
        };
      }

      getSfxDest() {
        return this.sfxGain || (this.ctx ? this.ctx.destination : null);
      }

      syncGains(rampSec = 0.12) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        if (this.sfxGain) {
          const targetSfx = this.sfxEnabled ? this.sfxVolume : 0;
          this.sfxGain.gain.cancelScheduledValues(now);
          this.sfxGain.gain.setValueAtTime(this.sfxGain.gain.value, now);
          this.sfxGain.gain.linearRampToValueAtTime(targetSfx, now + rampSec);
        }
        if (this.bgmGain && this.bgmFilter) {
          const duckMult = this.isDucked ? 0.58 : 1.0;
          const targetBgm = this.bgmEnabled ? this.bgmVolume * 0.24 * duckMult : 0;
          const targetFreq = this.isDucked ? 640 : (this.bgmScene === 'playing' ? 1550 : 1120);
          this.bgmGain.gain.cancelScheduledValues(now);
          this.bgmGain.gain.setValueAtTime(this.bgmGain.gain.value, now);
          this.bgmGain.gain.linearRampToValueAtTime(targetBgm, now + rampSec);
          this.bgmFilter.frequency.cancelScheduledValues(now);
          this.bgmFilter.frequency.setValueAtTime(this.bgmFilter.frequency.value, now);
          this.bgmFilter.frequency.linearRampToValueAtTime(targetFreq, now + rampSec);
        }
      }

      setAudioPrefs(patch) {
        if (typeof patch.bgmEnabled === 'boolean') this.bgmEnabled = patch.bgmEnabled;
        if (typeof patch.bgmVolume === 'number') this.bgmVolume = Math.min(1, Math.max(0, patch.bgmVolume));
        if (typeof patch.sfxEnabled === 'boolean') this.sfxEnabled = patch.sfxEnabled;
        if (typeof patch.sfxVolume === 'number') this.sfxVolume = Math.min(1, Math.max(0, patch.sfxVolume));
        this.savePrefs();
        this.syncGains(0.08);
        if (this.bgmEnabled && this.ctx && !this.bgmTimer) {
          this.startBgm();
        }
      }

      setBgmScene(scene) {
        if (this.bgmScene === scene) return;
        this.bgmScene = scene;
        this.bgmStep = 0;
        if (this.ctx) {
          this.nextNoteTime = this.ctx.currentTime + 0.08;
          this.syncGains(0.45);
        }
      }

      setModalDucking(ducked) {
        if (this.isDucked === ducked) return;
        this.isDucked = ducked;
        this.syncGains(0.28);
      }

      init() {
        try {
          if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            this.sfxGain = this.ctx.createGain();
            this.sfxGain.connect(this.ctx.destination);

            this.bgmFilter = this.ctx.createBiquadFilter();
            this.bgmFilter.type = 'lowpass';
            this.bgmFilter.frequency.setValueAtTime(1120, this.ctx.currentTime);
            this.bgmFilter.Q.setValueAtTime(0.7, this.ctx.currentTime);

            this.bgmGain = this.ctx.createGain();
            this.bgmGain.gain.setValueAtTime(0, this.ctx.currentTime);
            this.bgmFilter.connect(this.bgmGain);
            this.bgmGain.connect(this.ctx.destination);
          }
          if (this.ctx.state === 'suspended') {
            this.ctx.resume().then(() => {
              if (this.ctx) this.nextNoteTime = Math.max(this.nextNoteTime, this.ctx.currentTime + 0.05);
            }).catch(() => {});
          }
          if (this.ctx && !this.stepNoiseBuf) {
            const len = Math.floor(this.ctx.sampleRate * 0.04);
            const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < len; i++) {
              data[i] = Math.random() * 2 - 1;
            }
            this.stepNoiseBuf = buf;
          }
          this.syncGains(0.4);
          if (this.bgmEnabled && !this.bgmTimer) {
            this.startBgm();
          }
        } catch (e) {}
      }

      scheduleBgmTone(freq, startTime, dur, type = 'sine', peakVol = 0.25, attack = 0.04) {
        if (!this.ctx || !this.bgmFilter || !freq) return;
        try {
          const osc = this.ctx.createOscillator();
          const env = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, startTime);
          env.gain.setValueAtTime(0.0001, startTime);
          env.gain.linearRampToValueAtTime(peakVol, startTime + Math.min(attack, dur * 0.35));
          env.gain.exponentialRampToValueAtTime(0.0001, startTime + dur);
          osc.connect(env);
          env.connect(this.bgmFilter);
          osc.start(startTime);
          osc.stop(startTime + dur + 0.03);
        } catch (e) {}
      }

      scheduleBgmStep(step, t) {
        if (this.bgmScene === 'map') {
          // 聖域探索（約 72 BPM，每步 0.42s）：溫暖長音 Pad + 五聲音階鐘琴點綴
          const padRoots = [130.81, 110.0, 87.31, 98.0]; // C3 -> A2 -> F2 -> G2
          const padFifths = [196.0, 164.81, 130.81, 146.83];
          const chordIdx = Math.floor((step % 32) / 8);
          if (step % 8 === 0) {
            this.scheduleBgmTone(padRoots[chordIdx], t, 3.25, 'sine', 0.28, 0.45);
            this.scheduleBgmTone(padFifths[chordIdx], t, 3.1, 'triangle', 0.13, 0.55);
          }
          const mapMelody = [
            523.25, 0, 659.25, 587.33, 0, 440.0, 523.25, 0,
            392.0, 0, 523.25, 0, 587.33, 659.25, 0, 440.0,
            349.23, 0, 440.0, 523.25, 0, 659.25, 587.33, 0,
            392.0, 440.0, 0, 587.33, 523.25, 0, 392.0, 0
          ];
          const note = mapMelody[step % mapMelody.length];
          if (note > 0) {
            this.scheduleBgmTone(note, t, 0.95, 'sine', 0.14, 0.03);
          }
        } else {
          // 關卡挑戰（約 108 BPM，每步 0.275s）：輕快專注的琶音律動
          const bassProg = [110.0, 87.31, 130.81, 98.0]; // A2 -> F2 -> C3 -> G2
          const arpChords = [
            [220.0, 261.63, 329.63, 392.0],
            [174.61, 220.0, 261.63, 349.23],
            [261.63, 329.63, 392.0, 523.25],
            [196.0, 246.94, 293.66, 392.0]
          ];
          const chordIdx = Math.floor((step % 32) / 8);
          if (step % 4 === 0) {
            this.scheduleBgmTone(bassProg[chordIdx], t, 0.52, 'triangle', 0.22, 0.02);
          }
          const arpPattern = [0, 1, 2, 3, 2, 1, 2, 3];
          const arpNote = arpChords[chordIdx][arpPattern[step % 8]];
          this.scheduleBgmTone(arpNote, t, 0.24, 'sine', 0.12, 0.015);
          if (step % 8 === 0 || step % 8 === 3 || step % 8 === 6) {
            this.scheduleBgmTone(arpNote * 2, t, 0.32, 'sine', 0.06, 0.015);
          }
        }
      }

      startBgm() {
        if (!this.ctx || this.bgmTimer) return;
        this.nextNoteTime = this.ctx.currentTime + 0.06;
        this.bgmTimer = setInterval(() => {
          if (!this.ctx || !this.bgmEnabled || this.ctx.state !== 'running' || (typeof document !== 'undefined' && document.hidden)) {
            return;
          }
          const lookahead = 0.18;
          const stepDur = this.bgmScene === 'map' ? 0.42 : 0.275;
          if (this.nextNoteTime < this.ctx.currentTime - 0.5) {
            this.nextNoteTime = this.ctx.currentTime + 0.05;
          }
          while (this.nextNoteTime < this.ctx.currentTime + lookahead) {
            this.scheduleBgmStep(this.bgmStep, this.nextNoteTime);
            this.nextNoteTime += stepDur;
            this.bgmStep = (this.bgmStep + 1) % 64;
          }
        }, 80);
      }

      play(freq, type, dur, vol=0.1) {
        if (!this.ctx || !this.sfxEnabled) return;
        try {
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
          osc.type = type; osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0, t); gain.gain.linearRampToValueAtTime(vol, t + dur*0.1); gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
          osc.connect(gain); gain.connect(this.getSfxDest());
          osc.start(t); osc.stop(t + dur);
        } catch (e) {}
      }
      sfxClick() { this.play(800, 'sine', 0.05, 0.05); }
      sfxSelect() { this.play(1200, 'sine', 0.1, 0.05); }
      sfxMatch() { this.play(800, 'triangle', 0.1, 0.1); setTimeout(() => this.play(1200, 'sine', 0.2, 0.1), 100); }
      sfxHint() { this.play(600, 'sine', 0.3, 0.1); }
      sfxError() { this.play(200, 'sawtooth', 0.2, 0.1); }
      sfxBonus() { this.play(1046, 'sine', 0.1, 0.1); setTimeout(() => this.play(1318, 'sine', 0.3, 0.1), 100); }
      sfxTimeUp() { this.play(150, 'sawtooth', 0.5, 0.2); }
      sfxTick() { this.play(1600, 'square', 0.015, 0.04); }
      sfxStep(stepIdx = 0, isAscending = true) {
        if (!this.ctx || !this.sfxEnabled) return;
        try {
          if (!this.stepNoiseBuf) this.init();
          if (!this.stepNoiseBuf) return;

          const t = this.ctx.currentTime;
          const isRightFoot = stepIdx % 2 === 1;
          const humanize = 0.96 + Math.random() * 0.08;
          const dirShift = isAscending ? (stepIdx % 5) * 0.02 : -(stepIdx % 5) * 0.015;
          const freqMult = (isRightFoot ? 1.06 : 1.0) * humanize + dirShift;

          const triggerImpact = (startTime, centerFreq, qVal, dur, peakGain) => {
            const src = this.ctx.createBufferSource();
            src.buffer = this.stepNoiseBuf;

            const bp = this.ctx.createBiquadFilter();
            bp.type = 'bandpass';
            bp.frequency.setValueAtTime(centerFreq, startTime);
            bp.Q.setValueAtTime(qVal, startTime);

            const hp = this.ctx.createBiquadFilter();
            hp.type = 'highpass';
            hp.frequency.setValueAtTime(420, startTime);

            const env = this.ctx.createGain();
            env.gain.setValueAtTime(0.0001, startTime);
            env.gain.linearRampToValueAtTime(peakGain, startTime + 0.0012);
            env.gain.exponentialRampToValueAtTime(0.0001, startTime + dur);

            src.connect(bp);
            bp.connect(hp);
            hp.connect(env);
            env.connect(this.getSfxDest());

            src.start(startTime);
            src.stop(startTime + dur + 0.005);
          };

          triggerImpact(t, 3400 * freqMult, 3.8, 0.009, 0.24);
          const clackDelay = (0.048 + Math.random() * 0.006);
          triggerImpact(t + clackDelay, 1320 * freqMult, 2.8, 0.015, 0.16);
          triggerImpact(t + 0.036, 2600 * freqMult, 2.2, 0.014, 0.042);
        } catch (e) {}
      }
      sfxTeleportOut() {
        if (!this.ctx || !this.sfxEnabled) return;
        try {
          const t = this.ctx.currentTime;
          [523.25, 783.99].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = idx === 0 ? 'sine' : 'triangle';
            osc.frequency.setValueAtTime(freq, t);
            osc.frequency.exponentialRampToValueAtTime(freq * 2.0, t + 0.32);
            gain.gain.setValueAtTime(0.001, t);
            gain.gain.linearRampToValueAtTime(idx === 0 ? 0.07 : 0.04, t + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.34);
            osc.connect(gain);
            gain.connect(this.getSfxDest());
            osc.start(t);
            osc.stop(t + 0.35);
          });
        } catch (e) {}
      }
      sfxTeleportIn() {
        if (!this.ctx || !this.sfxEnabled) return;
        try {
          const t = this.ctx.currentTime;
          const sweep = this.ctx.createOscillator();
          const sweepGain = this.ctx.createGain();
          sweep.type = 'sine';
          sweep.frequency.setValueAtTime(1174.66, t);
          sweep.frequency.exponentialRampToValueAtTime(587.33, t + 0.35);
          sweepGain.gain.setValueAtTime(0.001, t);
          sweepGain.gain.linearRampToValueAtTime(0.055, t + 0.04);
          sweepGain.gain.exponentialRampToValueAtTime(0.001, t + 0.38);
          sweep.connect(sweepGain);
          sweepGain.connect(this.getSfxDest());
          sweep.start(t);
          sweep.stop(t + 0.4);

      getFireworkNoiseBuf() {
        if (!this.ctx) return null;
        if (!this.fwNoiseBuf) {
          const len = Math.floor(this.ctx.sampleRate * 0.45);
          const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);

      sfxFireworkLaunch() {

      sfxBubblePop(stepIdx = 0) {

      sfxWaveClear() {

      sfxFeverStart() {

          const t = this.ctx.currentTime;
          [659.25, 880, 1046.5, 1318.5].forEach((freq, i) => {

            gain.gain.linearRampToValueAtTime(0.16, st + 0.012);

    }
    const audio = new AudioEngine();

    // ==================== 共用包圍盒視覺真置中工具 ====================
    const centerTriangleBoundingBox = (p1, p2, p3, targetCenter = { x: 250, y: 250 }) => {
      const minX = Math.min(p1.x, p2.x, p3.x);
      const maxX = Math.max(p1.x, p2.x, p3.x);
      const minY = Math.min(p1.y, p2.y, p3.y);
      const maxY = Math.max(p1.y, p2.y, p3.y);
      const shiftX = targetCenter.x - (minX + maxX) / 2;
      const shiftY = targetCenter.y - (minY + maxY) / 2;
      return {
        P1: { x: p1.x + shiftX, y: p1.y + shiftY },
        P2: { x: p2.x + shiftX, y: p2.y + shiftY },
        P3: { x: p3.x + shiftX, y: p3.y + shiftY }
      };
    };

    // 計算邊長圓標向三角形外側法向量偏移後的座標（避免圓標壓在線段正中央）
    const computeOutwardMidPt = (p1, p2, centroid, offset = 24) => {
      const mx = (p1.x + p2.x) / 2;
      const my = (p1.y + p2.y) / 2;
      const dx = p2.x - p1.x;
      const dy = p2.y - p1.y;
      const len = Math.hypot(dx, dy) || 1;
      let nx = -dy / len;
      let ny = dx / len;
      if ((mx - centroid.x) * nx + (my - centroid.y) * ny < 0) {
        nx = -nx;
        ny = -ny;
      }
      return {
        x: Math.max(28, Math.min(472, mx + nx * offset)),
        y: Math.max(28, Math.min(472, my + ny * offset))
      };
    };

    // ==================== 第 1 關隨機三角形生成器 ====================
    const generateQuestion = (phase, prevType = '') => {
      const alphaDeg = Math.floor(Math.random() * 35) + 28;
      const alphaRad = (alphaDeg * Math.PI) / 180;
      const hyp = 365;
      const adjLen = hyp * Math.cos(alphaRad);
      const oppLen = hyp * Math.sin(alphaRad);
      const flip = Math.random() > 0.5 ? 1 : -1;
      const rotDeg = phase === 2 ? Math.floor(Math.random() * 360) : 0;
      const rotRad = (rotDeg * Math.PI) / 180;

      const localPts = {
        P1: { x: 0, y: 0 },
        P2: { x: adjLen * flip, y: 0 },
        P3: { x: adjLen * flip, y: -oppLen }
      };
      const rotatePt = (pt) => ({
        x: pt.x * Math.cos(rotRad) - pt.y * Math.sin(rotRad),
        y: pt.x * Math.sin(rotRad) + pt.y * Math.cos(rotRad)
      });
      const { P1: wP1, P2: wP2, P3: wP3 } = centerTriangleBoundingBox(
        rotatePt(localPts.P1), rotatePt(localPts.P2), rotatePt(localPts.P3)
      );

      const targetIsP1 = phase === 0 ? true : Math.random() > 0.5;
      const targetPt = targetIsP1 ? wP1 : wP3;
      const otherPt = targetIsP1 ? wP3 : wP1;
      const rightPt = wP2;

      const sides = [
        { id: 'hyp', p1: targetPt, p2: otherPt },
        { id: 'opp', p1: otherPt, p2: rightPt },
        { id: 'adj', p1: targetPt, p2: rightPt }
      ];
      const colorPalettes = [
        { bg: '#3b82f6', border: '#1d4ed8', name: '藍邊', id: 'blue' },
        { bg: '#ef4444', border: '#b91c1c', name: '紅邊', id: 'red' },
        { bg: '#10b981', border: '#047857', name: '綠邊', id: 'green' }
      ].sort(() => Math.random() - 0.5);

      const edgesWithStyles = sides.map((side, idx) => ({
        ...side, color: colorPalettes[idx], colorId: colorPalettes[idx].id
      }));

      const targetTypes = ['hyp', 'opp', 'adj'].filter(t => t !== prevType);
      const targetType = targetTypes[Math.floor(Math.random() * targetTypes.length)];
      const targetNameMap = {
        hyp: { title: '斜邊 (Hypotenuse)', tip: '斜邊 = 直角(90°)正對面的最長邊' },
        opp: { title: '對邊 (Opposite)', tip: '對邊 = 目標銳角目光正對面的邊' },
        adj: { title: '鄰邊 (Adjacent)', tip: '鄰邊 = 貼著目標銳角且非斜邊的股' }
      };

      const v21 = { x: wP1.x - wP2.x, y: wP1.y - wP2.y };
      const l21 = Math.hypot(v21.x, v21.y);
      const u21 = { x: v21.x / l21, y: v21.y / l21 };
      const v23 = { x: wP3.x - wP2.x, y: wP3.y - wP2.y };
      const l23 = Math.hypot(v23.x, v23.y);
      const u23 = { x: v23.x / l23, y: v23.y / l23 };

      const sqSize = 26;
      const pC1 = { x: wP2.x + u21.x * sqSize, y: wP2.y + u21.y * sqSize };
      const pC2 = { x: pC1.x + u23.x * sqSize, y: pC1.y + u23.y * sqSize };
      const pC3 = { x: wP2.x + u23.x * sqSize, y: wP2.y + u23.y * sqSize };
      const rightAngleSquare = `${wP2.x},${wP2.y} ${pC1.x},${pC1.y} ${pC2.x},${pC2.y} ${pC3.x},${pC3.y}`;

      const arcRad = 58;
      const vT_Other = { x: otherPt.x - targetPt.x, y: otherPt.y - targetPt.y };
      const lT_Other = Math.hypot(vT_Other.x, vT_Other.y);
      const uT_Other = { x: vT_Other.x / lT_Other, y: vT_Other.y / lT_Other };
      const vT_Right = { x: rightPt.x - targetPt.x, y: rightPt.y - targetPt.y };
      const lT_Right = Math.hypot(vT_Right.x, vT_Right.y);
      const uT_Right = { x: vT_Right.x / lT_Right, y: vT_Right.y / lT_Right };

      const arcP1 = { x: targetPt.x + uT_Right.x * arcRad, y: targetPt.y + uT_Right.y * arcRad };
      const arcP2 = { x: targetPt.x + uT_Other.x * arcRad, y: targetPt.y + uT_Other.y * arcRad };
      const cross = uT_Right.x * uT_Other.y - uT_Right.y * uT_Other.x;
      const sweep = cross > 0 ? 1 : 0;
      const arcPath = `M ${targetPt.x} ${targetPt.y} L ${arcP1.x} ${arcP1.y} A ${arcRad} ${arcRad} 0 0 ${sweep} ${arcP2.x} ${arcP2.y} Z`;
      const bisect = {
        x: targetPt.x + (uT_Right.x + uT_Other.x) * 0.5 * (arcRad + 28),
        y: targetPt.y + (uT_Right.y + uT_Other.y) * 0.5 * (arcRad + 28)
      };

      let questionText = "";
      let labels = [];

          const l = Math.hypot(out.x, out.y);
          if (l < 0.001) return { x: pt.x, y: pt.y - dist };
          return { x: pt.x + (out.x/l)*dist, y: pt.y + (out.y/l)*dist };
        };
        const outP1 = offsetPt(wP1, u21, {x: (wP3.x-wP1.x)/hyp, y:(wP3.y-wP1.y)/hyp}, 36);
        const outP3 = offsetPt(wP3, u23, {x: (wP1.x-wP3.x)/hyp, y:(wP1.y-wP3.y)/hyp}, 36);
        const outP2 = { x: wP2.x - (u21.x + u23.x)*28, y: wP2.y - (u21.y + u23.y)*28 };
        labels.push({ text: 'A', x: outP1.x, y: outP1.y + 8, color: '#1e293b' });
        labels.push({ text: 'B', x: outP3.x, y: outP3.y + 8, color: '#1e293b' });
        labels.push({ text: 'C', x: outP2.x, y: outP2.y + 8, color: '#1e293b' });

        edges: edgesWithStyles,

        questionText,
        correctEdgeColorId: edgesWithStyles.find(e => e.id === targetType).colorId,

    // ==================== 第 2 關隨機題目生成器 ====================
    const generateLevel2Question = (phase, prevFunc = '') => {
      const triplePool = [

      const adjLen = triple.adj * scale;
      const oppLen = triple.opp * scale;

      const localPts = {
        P1: { x: 0, y: 0 },
        P2: { x: adjLen * flip, y: 0 },

      const rotatePt = (pt) => ({

      });
      const { P1: wP1, P2: wP2, P3: wP3 } = centerTriangleBoundingBox(

      );

      const targetPt = targetIsP1 ? wP1 : wP3;
      const otherPt = targetIsP1 ? wP3 : wP1;

      const edgeOpp = { id: 'opp', p1: otherPt, p2: rightPt, numVal: targetIsP1 ? triple.opp : triple.adj, segName: targetIsP1 ? 'BC' : 'AC' };
      const edgeAdj = { id: 'adj', p1: targetPt, p2: rightPt, numVal: targetIsP1 ? triple.adj : triple.opp, segName: targetIsP1 ? 'AC' : 'BC' };

        { bg: '#ef4444', border: '#b91c1c', name: '紅邊', id: 'red' },

      ].sort(() => Math.random() - 0.5);

      const useGreek = phase === 0 ? true : phase === 1 ? false : (Math.random() < 0.3);
      const edgesWithStyles = sides.map((side, idx) => {
        const displayText = useGreek ? String(side.numVal) : side.segName;
        return {
          ...side, color: colorPalettes[idx], colorId: colorPalettes[idx].id,
          displayText, midPt: { x: (side.p1.x + side.p2.x) / 2, y: (side.p1.y + side.p2.y) / 2 }
        };
      });

      const funcList = ['sin', 'cos', 'tan'].filter(f => f !== prevFunc);
      const targetFunc = funcList[Math.floor(Math.random() * funcList.length)];
      const defTipMap = {
        sin: 'sin = 對邊 ÷ 斜邊（先點對邊當分子，再點斜邊當分母）',
        cos: 'cos = 鄰邊 ÷ 斜邊（先點鄰邊當分子，再點斜邊當分母）',
        tan: 'tan = 對邊 ÷ 鄰邊（先點對邊當分子，再點鄰邊當分母）'
      };

      let correctNumeratorType = 'opp';
      let correctDenominatorType = 'hyp';
      if (targetFunc === 'sin') { correctNumeratorType = 'opp'; correctDenominatorType = 'hyp'; }
      else if (targetFunc === 'cos') { correctNumeratorType = 'adj'; correctDenominatorType = 'hyp'; }
      else if (targetFunc === 'tan') { correctNumeratorType = 'opp'; correctDenominatorType = 'adj'; }

      const correctNumEdge = edgesWithStyles.find(e => e.id === correctNumeratorType);
      const correctDenEdge = edgesWithStyles.find(e => e.id === correctDenominatorType);

      const v21 = { x: wP1.x - wP2.x, y: wP1.y - wP2.y };
      const l21 = Math.hypot(v21.x, v21.y);
      const u21 = { x: v21.x / l21, y: v21.y / l21 };
      const v23 = { x: wP3.x - wP2.x, y: wP3.y - wP2.y };
      const l23 = Math.hypot(v23.x, v23.y);
      const u23 = { x: v23.x / l23, y: v23.y / l23 };

      const sqSize = 24;
      const pC1 = { x: wP2.x + u21.x * sqSize, y: wP2.y + u21.y * sqSize };
      const pC2 = { x: pC1.x + u23.x * sqSize, y: pC1.y + u23.y * sqSize };
      const pC3 = { x: wP2.x + u23.x * sqSize, y: wP2.y + u23.y * sqSize };
      const rightAngleSquare = `${wP2.x},${wP2.y} ${pC1.x},${pC1.y} ${pC2.x},${pC2.y} ${pC3.x},${pC3.y}`;

      const arcRad = 55;
      const vT_Other = { x: otherPt.x - targetPt.x, y: otherPt.y - targetPt.y };
      const lT_Other = Math.hypot(vT_Other.x, vT_Other.y);
      const uT_Other = { x: vT_Other.x / lT_Other, y: vT_Other.y / lT_Other };
      const vT_Right = { x: rightPt.x - targetPt.x, y: rightPt.y - targetPt.y };
      const lT_Right = Math.hypot(vT_Right.x, vT_Right.y);
      const uT_Right = { x: vT_Right.x / lT_Right, y: vT_Right.y / lT_Right };

      const arcP1 = { x: targetPt.x + uT_Right.x * arcRad, y: targetPt.y + uT_Right.y * arcRad };
      const arcP2 = { x: targetPt.x + uT_Other.x * arcRad, y: targetPt.y + uT_Other.y * arcRad };
      const cross = uT_Right.x * uT_Other.y - uT_Right.y * uT_Other.x;
      const sweep = cross > 0 ? 1 : 0;
      const arcPath = `M ${targetPt.x} ${targetPt.y} L ${arcP1.x} ${arcP1.y} A ${arcRad} ${arcRad} 0 0 ${sweep} ${arcP2.x} ${arcP2.y} Z`;
      const bisect = {
        x: targetPt.x + (uT_Right.x + uT_Other.x) * 0.5 * (arcRad + 26),
        y: targetPt.y + (uT_Right.y + uT_Other.y) * 0.5 * (arcRad + 26)
      };

      let questionTitle = "";
      let labels = [];
      let showArc = false;
      if (useGreek) {
        showArc = true;
        const greek = ['θ', 'α', 'β'][Math.floor(Math.random() * 3)];
        labels.push({ text: greek, x: bisect.x, y: bisect.y + 6, color: '#b45309', isAngle: true });
        questionTitle = `${targetFunc}(${greek})`;
      } else {
        const targetLetter = targetIsP1 ? 'A' : 'B';
        const offsetPt = (pt, u1, u2, dist) => {
          const out = { x: -(u1.x + u2.x), y: -(u1.y + u2.y) };
          const l = Math.hypot(out.x, out.y);
          if (l < 0.001) return { x: pt.x, y: pt.y - dist };
          return {
            x: Math.max(22, Math.min(478, pt.x + (out.x/l)*dist)),
            y: Math.max(22, Math.min(478, pt.y + (out.y/l)*dist))
          };
        };
        const outP1 = offsetPt(wP1, u21, {x: (wP3.x-wP1.x)/355, y:(wP3.y-wP1.y)/355}, 36);
        const outP3 = offsetPt(wP3, u23, {x: (wP1.x-wP3.x)/355, y:(wP1.y-wP3.y)/355}, 36);
        const outP2 = {
          x: Math.max(22, Math.min(478, wP2.x - (u21.x + u23.x)*28)),
          y: Math.max(22, Math.min(478, wP2.y - (u21.y + u23.y)*28))
        };
        labels.push({ text: 'A', x: outP1.x, y: outP1.y + 8, color: targetLetter === 'A' ? '#d97706' : '#1e293b', isTargetVertex: targetLetter === 'A' });
        labels.push({ text: 'B', x: outP3.x, y: outP3.y + 8, color: targetLetter === 'B' ? '#d97706' : '#1e293b', isTargetVertex: targetLetter === 'B' });
        labels.push({ text: 'C', x: outP2.x, y: outP2.y + 8, color: '#1e293b' });
        questionTitle = `${targetFunc}(∠${targetLetter})`;
      }

      return {
        pts: { P1: wP1, P2: wP2, P3: wP3 },
        rightAngleSquare, arcPath, showArc, labels,
        edges: edgesWithStyles, targetFunc, questionTitle,
        correctNumeratorEdgeId: correctNumEdge.colorId,
        correctDenominatorEdgeId: correctDenEdge.colorId,
        conceptTip: defTipMap[targetFunc]
      };
    };

    // ==================== 第 3 關隨機題目生成器：未知邊獵人（兩段式） ====================
    const generateLevel3Question = (phase, prevKey = '') => {
      const triplePool = phase === 0 ? [
        { adj: 4, opp: 3, hyp: 5 }, { adj: 3, opp: 4, hyp: 5 },
        { adj: 12, opp: 5, hyp: 13 }, { adj: 5, opp: 12, hyp: 13 }
      ] : [
        { adj: 4, opp: 3, hyp: 5 }, { adj: 3, opp: 4, hyp: 5 },
        { adj: 12, opp: 5, hyp: 13 }, { adj: 5, opp: 12, hyp: 13 },
        { adj: 15, opp: 8, hyp: 17 }, { adj: 8, opp: 15, hyp: 17 },
        { adj: 24, opp: 7, hyp: 25 }, { adj: 7, opp: 24, hyp: 25 }
      ];
      const funcList = ['sin', 'cos', 'tan'];

      let triple, targetIsP1, hideIndex, targetFunc, questionKey;
      for (let attempt = 0; attempt < 8; attempt++) {
        triple = triplePool[Math.floor(Math.random() * triplePool.length)];
        targetIsP1 = phase === 0 ? true : Math.random() > 0.5;
        hideIndex = phase === 0 ? (Math.random() > 0.5 ? 0 : 1) : Math.floor(Math.random() * 3);
        targetFunc = funcList[Math.floor(Math.random() * funcList.length)];
        questionKey = `${triple.adj}_${triple.opp}_${triple.hyp}_${hideIndex}_${targetFunc}_${targetIsP1}`;
        if (questionKey !== prevKey) break;
      }

      const flip = Math.random() > 0.5 ? 1 : -1;
      const rotDeg = phase === 2 ? Math.floor(Math.random() * 360) : 0;
      const rotRad = (rotDeg * Math.PI) / 180;
      const scale = 300 / triple.hyp;
      const adjLen = triple.adj * scale;
      const oppLen = triple.opp * scale;

      const localPts = {
        P1: { x: 0, y: 0 },
        P2: { x: adjLen * flip, y: 0 },
        P3: { x: adjLen * flip, y: -oppLen }
      };
      const rotatePt = (pt) => ({
        x: pt.x * Math.cos(rotRad) - pt.y * Math.sin(rotRad),
        y: pt.x * Math.sin(rotRad) + pt.y * Math.cos(rotRad)
      });
      const { P1: wP1, P2: wP2, P3: wP3 } = centerTriangleBoundingBox(
        rotatePt(localPts.P1), rotatePt(localPts.P2), rotatePt(localPts.P3)
      );
      const centroid = {
        x: (wP1.x + wP2.x + wP3.x) / 3,
        y: (wP1.y + wP2.y + wP3.y) / 3
      };

      const targetPt = targetIsP1 ? wP1 : wP3;
      const otherPt = targetIsP1 ? wP3 : wP1;
      const rightPt = wP2;

      const hypVal = triple.hyp;
      const oppVal = targetIsP1 ? triple.opp : triple.adj;
      const adjVal = targetIsP1 ? triple.adj : triple.opp;

      const colorPalettes = [
        { bg: '#3b82f6', border: '#1d4ed8', name: '藍邊', id: 'blue' },
        { bg: '#ef4444', border: '#b91c1c', name: '紅邊', id: 'red' },
        { bg: '#10b981', border: '#047857', name: '綠邊', id: 'green' }
      ].sort(() => Math.random() - 0.5);

      const sides = [
        { id: 'hyp', p1: targetPt, p2: otherPt, numVal: hypVal, isHidden: hideIndex === 0 },
        { id: 'opp', p1: otherPt, p2: rightPt, numVal: oppVal, isHidden: hideIndex === 1 },
        { id: 'adj', p1: targetPt, p2: rightPt, numVal: adjVal, isHidden: hideIndex === 2 }
      ];
      const hiddenSide = sides[hideIndex];
      const knownVals = sides.filter(s => !s.isHidden).map(s => s.numVal);

      const edgesWithStyles = sides.map((side, idx) => ({
        ...side,
        color: colorPalettes[idx],
        colorId: colorPalettes[idx].id,
        displayText: String(side.numVal),
        midPt: computeOutwardMidPt(side.p1, side.p2, centroid, 24)
      }));

      // 第一階段：4 選 1 未知邊選項（含兩已知邊相加/相減誘答與相近整數）
      const correctSideVal = String(hiddenSide.numVal);
      const sideOptSet = new Set([hiddenSide.numVal]);
      const sumCand = knownVals[0] + knownVals[1];
      const diffCand = Math.abs(knownVals[0] - knownVals[1]);
      if (sumCand > 0 && !sideOptSet.has(sumCand)) sideOptSet.add(sumCand);
      if (diffCand > 0 && !sideOptSet.has(diffCand)) sideOptSet.add(diffCand);
      for (const delta of [1, -1, 2, -2, 3, -3, 4]) {
        if (sideOptSet.size >= 4) break;
        const cand = hiddenSide.numVal + delta;
        if (cand > 0 && !sideOptSet.has(cand)) sideOptSet.add(cand);
      }
      const sideOptions = shuffle(Array.from(sideOptSet).map(String));

      // 第二階段：三角比定義
      const ratioDefMap = {
        sin: { num: 'opp', den: 'hyp', text: '對 / 斜' },
        cos: { num: 'adj', den: 'hyp', text: '鄰 / 斜' },
        tan: { num: 'opp', den: 'adj', text: '對 / 鄰' }
      };
      const def = ratioDefMap[targetFunc];
      const correctNumEdge = edgesWithStyles.find(e => e.id === def.num);
      const correctDenEdge = edgesWithStyles.find(e => e.id === def.den);

      const v21 = { x: wP1.x - wP2.x, y: wP1.y - wP2.y };
      const l21 = Math.hypot(v21.x, v21.y) || 1;
      const u21 = { x: v21.x / l21, y: v21.y / l21 };
      const v23 = { x: wP3.x - wP2.x, y: wP3.y - wP2.y };
      const l23 = Math.hypot(v23.x, v23.y) || 1;
      const u23 = { x: v23.x / l23, y: v23.y / l23 };

      const sqSize = 24;
      const pC1 = { x: wP2.x + u21.x * sqSize, y: wP2.y + u21.y * sqSize };
      const pC2 = { x: pC1.x + u23.x * sqSize, y: pC1.y + u23.y * sqSize };
      const pC3 = { x: wP2.x + u23.x * sqSize, y: wP2.y + u23.y * sqSize };
      const rightAngleSquare = `${wP2.x},${wP2.y} ${pC1.x},${pC1.y} ${pC2.x},${pC2.y} ${pC3.x},${pC3.y}`;

      const arcRad = Math.max(32, Math.min(52, Math.min(adjLen, oppLen) * 0.42));
      const vT_Other = { x: otherPt.x - targetPt.x, y: otherPt.y - targetPt.y };
      const lT_Other = Math.hypot(vT_Other.x, vT_Other.y) || 1;
      const uT_Other = { x: vT_Other.x / lT_Other, y: vT_Other.y / lT_Other };
      const vT_Right = { x: rightPt.x - targetPt.x, y: rightPt.y - targetPt.y };
      const lT_Right = Math.hypot(vT_Right.x, vT_Right.y) || 1;
      const uT_Right = { x: vT_Right.x / lT_Right, y: vT_Right.y / lT_Right };

      const arcP1 = { x: targetPt.x + uT_Right.x * arcRad, y: targetPt.y + uT_Right.y * arcRad };
      const arcP2 = { x: targetPt.x + uT_Other.x * arcRad, y: targetPt.y + uT_Other.y * arcRad };
      const cross = uT_Right.x * uT_Other.y - uT_Right.y * uT_Other.x;
      const sweep = cross > 0 ? 1 : 0;
      const arcPath = `M ${targetPt.x} ${targetPt.y} L ${arcP1.x} ${arcP1.y} A ${arcRad} ${arcRad} 0 0 ${sweep} ${arcP2.x} ${arcP2.y} Z`;
      const bisect = {
        x: targetPt.x + (uT_Right.x + uT_Other.x) * 0.5 * (arcRad + 24),
        y: targetPt.y + (uT_Right.y + uT_Other.y) * 0.5 * (arcRad + 24)
      };

      const useGreek = phase === 0;
      let questionTitle = '', labels = [], showArc = false, arcDashed = false;
      if (useGreek) {
        showArc = true;
        const greek = ['θ', 'α', 'β'][Math.floor(Math.random() * 3)];
        labels.push({ text: greek, x: bisect.x, y: bisect.y + 6, color: '#b45309', isAngle: true });
        questionTitle = `${targetFunc}(${greek})`;
      } else {
        showArc = phase === 1;
        arcDashed = phase === 1;
        const targetLetter = targetIsP1 ? 'A' : 'B';
        const offsetPt = (pt, u1, u2, dist) => {
          const out = { x: -(u1.x + u2.x), y: -(u1.y + u2.y) };
          const l = Math.hypot(out.x, out.y);
          if (l < 0.001) return { x: pt.x, y: pt.y - dist };
          return {
            x: Math.max(22, Math.min(478, pt.x + (out.x / l) * dist)),
            y: Math.max(22, Math.min(478, pt.y + (out.y / l) * dist))
          };
        };
        const hypLen = Math.hypot(wP3.x - wP1.x, wP3.y - wP1.y) || 1;
        const outP1 = offsetPt(wP1, u21, { x: (wP3.x - wP1.x) / hypLen, y: (wP3.y - wP1.y) / hypLen }, 34);
        const outP3 = offsetPt(wP3, u23, { x: (wP1.x - wP3.x) / hypLen, y: (wP1.y - wP3.y) / hypLen }, 34);
        const outP2 = {
          x: Math.max(22, Math.min(478, wP2.x - (u21.x + u23.x) * 26)),
          y: Math.max(22, Math.min(478, wP2.y - (u21.y + u23.y) * 26))
        };
        labels.push({ text: 'A', x: outP1.x, y: outP1.y + 6, color: !showArc && targetLetter === 'A' ? '#d97706' : '#1e293b', isTargetVertex: !showArc && targetLetter === 'A' });
        labels.push({ text: 'B', x: outP3.x, y: outP3.y + 6, color: !showArc && targetLetter === 'B' ? '#d97706' : '#1e293b', isTargetVertex: !showArc && targetLetter === 'B' });
        labels.push({ text: 'C', x: outP2.x, y: outP2.y + 6, color: '#1e293b' });
        questionTitle = `${targetFunc}(∠${targetLetter})`;
      }

      const legA = Math.min(oppVal, adjVal);
      const legB = Math.max(oppVal, adjVal);

      return {
        questionKey,
        pts: { P1: wP1, P2: wP2, P3: wP3 },
        rightAngleSquare, arcPath, showArc, arcDashed, labels,
        edges: edgesWithStyles,
        targetFunc,
        questionTitle,
        correctSideVal,
        sideOptions,
        correctNumeratorEdgeId: correctNumEdge.colorId,
        correctDenominatorEdgeId: correctDenEdge.colorId,
        sideTip: `畢氏定理：${legA}² + ${legB}² = ${hypVal}²`,
        ratioTip: `${targetFunc} ＝ ${def.text}`,
        flipTip: `上下放反！${targetFunc} ＝ ${def.text}`
      };
    };

    // ==================== 第 4 關隨機題目生成器：黃金神殿（兩段式） ====================
    const generateLevel4Question = (phase, prevKey = '') => {
      const funcList = ['sin', 'cos', 'tan'];
      let is45, targetDeg, missingSideIdx, targetFunc, targetIsP1, questionKey;
      for (let attempt = 0; attempt < 8; attempt++) {
        is45 = Math.random() > 0.6;
        targetDeg = is45 ? 45 : (Math.random() > 0.5 ? 30 : 60);
        missingSideIdx = Math.floor(Math.random() * 3);
        targetFunc = funcList[Math.floor(Math.random() * funcList.length)];
        targetIsP1 = phase === 0 ? true : Math.random() > 0.5;
        questionKey = `${targetDeg}_${missingSideIdx}_${targetFunc}_${targetIsP1}`;
        if (questionKey !== prevKey) break;
      }

      const stdAdj = targetDeg === 45 ? 1 : (targetDeg === 30 ? Math.sqrt(3) : 1);
      const stdOpp = targetDeg === 45 ? 1 : (targetDeg === 30 ? 1 : Math.sqrt(3));
      const stdHyp = targetDeg === 45 ? Math.SQRT2 : 2;
      const stdAdjText = targetDeg === 45 ? '1' : (targetDeg === 30 ? '√3' : '1');
      const stdOppText = targetDeg === 45 ? '1' : (targetDeg === 30 ? '1' : '√3');
      const stdHypText = targetDeg === 45 ? '√2' : '2';

      const flip = phase === 0 ? 1 : (Math.random() > 0.5 ? 1 : -1);
      const rotDeg = phase === 0 ? 0 : phase === 1 ? ([0, 90, 180, 270][Math.floor(Math.random() * 4)]) : Math.floor(Math.random() * 360);
      const rotRad = (rotDeg * Math.PI) / 180;
      const scale = 305 / stdHyp;
      const adjLen = stdAdj * scale;
      const oppLen = stdOpp * scale;

      const localPts = {
        P1: { x: 0, y: 0 },
        P2: { x: adjLen * flip, y: 0 },
        P3: { x: adjLen * flip, y: -oppLen }
      };
      const rotatePt = (pt) => ({
        x: pt.x * Math.cos(rotRad) - pt.y * Math.sin(rotRad),
        y: pt.x * Math.sin(rotRad) + pt.y * Math.cos(rotRad)
      });
      const { P1: wP1, P2: wP2, P3: wP3 } = centerTriangleBoundingBox(
        rotatePt(localPts.P1), rotatePt(localPts.P2), rotatePt(localPts.P3)
      );
      const centroid = {
        x: (wP1.x + wP2.x + wP3.x) / 3,
        y: (wP1.y + wP2.y + wP3.y) / 3
      };

      const targetPt = targetIsP1 ? wP1 : wP3;
      const otherPt = targetIsP1 ? wP3 : wP1;
      const rightPt = wP2;

      const v21 = { x: wP1.x - wP2.x, y: wP1.y - wP2.y };
      const l21 = Math.hypot(v21.x, v21.y) || 1;
      const u21 = { x: v21.x / l21, y: v21.y / l21 };
      const v23 = { x: wP3.x - wP2.x, y: wP3.y - wP2.y };
      const l23 = Math.hypot(v23.x, v23.y) || 1;
      const u23 = { x: v23.x / l23, y: v23.y / l23 };

      const sqSize = 24;
      const pC1 = { x: wP2.x + u21.x * sqSize, y: wP2.y + u21.y * sqSize };
      const pC2 = { x: pC1.x + u23.x * sqSize, y: pC1.y + u23.y * sqSize };
      const pC3 = { x: wP2.x + u23.x * sqSize, y: wP2.y + u23.y * sqSize };
      const rightAngleSquare = `${wP2.x},${wP2.y} ${pC1.x},${pC1.y} ${pC2.x},${pC2.y} ${pC3.x},${pC3.y}`;

      const arcRad = 52;
      const vT_Other = { x: otherPt.x - targetPt.x, y: otherPt.y - targetPt.y };
      const lT_Other = Math.hypot(vT_Other.x, vT_Other.y) || 1;
      const uT_Other = { x: vT_Other.x / lT_Other, y: vT_Other.y / lT_Other };
      const vT_Right = { x: rightPt.x - targetPt.x, y: rightPt.y - targetPt.y };
      const lT_Right = Math.hypot(vT_Right.x, vT_Right.y) || 1;
      const uT_Right = { x: vT_Right.x / lT_Right, y: vT_Right.y / lT_Right };

      const arcP1 = { x: targetPt.x + uT_Right.x * arcRad, y: targetPt.y + uT_Right.y * arcRad };
      const arcP2 = { x: targetPt.x + uT_Other.x * arcRad, y: targetPt.y + uT_Other.y * arcRad };
      const cross = uT_Right.x * uT_Other.y - uT_Right.y * uT_Other.x;
      const sweep = cross > 0 ? 1 : 0;
      const arcPath = `M ${targetPt.x} ${targetPt.y} L ${arcP1.x} ${arcP1.y} A ${arcRad} ${arcRad} 0 0 ${sweep} ${arcP2.x} ${arcP2.y} Z`;
      const bisect = {
        x: targetPt.x + (uT_Right.x + uT_Other.x) * 0.5 * (arcRad + 26),
        y: targetPt.y + (uT_Right.y + uT_Other.y) * 0.5 * (arcRad + 26)
      };

      const labels = [{ text: `${targetDeg}°`, x: bisect.x, y: bisect.y + 6, color: '#b45309' }];
      const colorPalettes = [
        { bg: '#3b82f6', border: '#1d4ed8', name: '藍邊', id: 'blue' },
        { bg: '#ef4444', border: '#b91c1c', name: '紅邊', id: 'red' },
        { bg: '#10b981', border: '#047857', name: '綠邊', id: 'green' }
      ].sort(() => Math.random() - 0.5);

      const sides = [
        { id: 'hyp', p1: targetPt, p2: otherPt, standardText: stdHypText, isHidden: missingSideIdx === 0 },
        { id: 'opp', p1: otherPt, p2: rightPt, standardText: stdOppText, isHidden: missingSideIdx === 1 },
        { id: 'adj', p1: targetPt, p2: rightPt, standardText: stdAdjText, isHidden: missingSideIdx === 2 }
      ];
      const missingSide = sides[missingSideIdx];

      const edgesWithStyles = sides.map((s, idx) => ({
        ...s,
        color: colorPalettes[idx],
        colorId: colorPalettes[idx].id,
        displayText: s.standardText,
        midPt: computeOutwardMidPt(s.p1, s.p2, centroid, 24)
      }));

      const ratioDefMap = {
        sin: { num: 'opp', den: 'hyp', text: '對 / 斜' },
        cos: { num: 'adj', den: 'hyp', text: '鄰 / 斜' },
        tan: { num: 'opp', den: 'adj', text: '對 / 鄰' }
      };
      const def = ratioDefMap[targetFunc];
      const correctNumEdge = edgesWithStyles.find(e => e.id === def.num);
      const correctDenEdge = edgesWithStyles.find(e => e.id === def.den);

      const evalAnsMap = {
        'sin_30': '1/2', 'sin_45': '√2/2', 'sin_60': '√3/2',
        'cos_30': '√3/2', 'cos_45': '√2/2', 'cos_60': '1/2',
        'tan_30': '√3/3', 'tan_45': '1', 'tan_60': '√3'
      };
      const exactVal = evalAnsMap[`${targetFunc}_${targetDeg}`];
      const sideTip = is45
        ? '45°-45°-90° ＝ 1 : 1 : √2'
        : '30°-60°-90° ＝ 1 : √3 : 2';
      const ratioTip = targetDeg === 30
        ? `30° 對邊最短 ＝ 1，${targetFunc}(30°) ＝ ${exactVal}`
        : targetDeg === 60
        ? `60° 對邊 ＝ √3，${targetFunc}(60°) ＝ ${exactVal}`
        : `45° 兩股皆 ＝ 1，${targetFunc}(45°) ＝ ${exactVal}`;

      return {
        questionKey,
        pts: { P1: wP1, P2: wP2, P3: wP3 },
        rightAngleSquare, arcPath, labels,
        edges: edgesWithStyles,
        targetDeg,
        targetFunc,
        questionTitle: `${targetFunc}(${targetDeg}°)`,
        correctSideVal: missingSide.standardText,
        sideOptions: ['1', '√2', '√3', '2'],
        correctNumeratorEdgeId: correctNumEdge.colorId,
        correctDenominatorEdgeId: correctDenEdge.colorId,
        hideRatioNumbers: phase === 2,
        sideTip,
        ratioTip,
        flipTip: `上下放反！${targetFunc} ＝ ${def.text}`
      };
    };

    // ==================== 第 7 關隨機題目生成器：動徑星標 ====================
    const generateLevel6Question = (phase) => {
      const baseTriples = [
        { x: 4, y: 3, r: 5 }, { x: 3, y: 4, r: 5 },
        { x: 12, y: 5, r: 13 }, { x: 5, y: 12, r: 13 },
        { x: 15, y: 8, r: 17 }, { x: 8, y: 15, r: 17 }
      ];
      const base = baseTriples[Math.floor(Math.random() * baseTriples.length)];
      let q = phase === 0 ? (Math.random() > 0.5 ? 1 : 2) : (Math.floor(Math.random() * 4) + 1);
      let signX = 1, signY = 1;
      if (q === 2) { signX = -1; signY = 1; }
      else if (q === 3) { signX = -1; signY = -1; }
      else if (q === 4) { signX = 1; signY = -1; }

      const xVal = base.x * signX;
      const yVal = base.y * signY;
      const rVal = base.r;
      const scale = 190 / rVal;
      const origin = { x: 270, y: 270 };
      const ptP = { x: origin.x + xVal * scale, y: origin.y - yVal * scale };
      const ptFootX = { x: ptP.x, y: origin.y };
      const ptFootY = { x: origin.x, y: ptP.y };
      const rayLen = 255;
      const ptRay = { x: origin.x + (xVal / rVal) * rayLen, y: origin.y - (yVal / rVal) * rayLen };

      const funcList = ['sin', 'cos', 'tan'];
      const targetFunc = funcList[Math.floor(Math.random() * funcList.length)];
      let correctNumeratorKey = 'y', correctDenominatorKey = 'r';
      if (targetFunc === 'sin') { correctNumeratorKey = 'y'; correctDenominatorKey = 'r'; }
      else if (targetFunc === 'cos') { correctNumeratorKey = 'x'; correctDenominatorKey = 'r'; }
      else { correctNumeratorKey = 'y'; correctDenominatorKey = 'x'; }

      const sqSize = 12;
      const dirX = xVal >= 0 ? -1 : 1;
      const dirY = yVal >= 0 ? -1 : 1;
      const rightAngleSquareX = `${ptFootX.x},${ptFootX.y} ${ptFootX.x + dirX * sqSize},${ptFootX.y} ${ptFootX.x + dirX * sqSize},${ptFootX.y + dirY * sqSize} ${ptFootX.x},${ptFootX.y + dirY * sqSize}`;
      const rightAngleSquareY = `${ptFootY.x},${ptFootY.y} ${ptFootY.x + dirX * sqSize},${ptFootY.y} ${ptFootY.x + dirX * sqSize},${ptFootY.y + dirY * sqSize} ${ptFootY.x},${ptFootY.y + dirY * sqSize}`;

      const coordTipMap = {
        sin: '廣義角定義：sin(θ) = y / r（縱坐標 ÷ 動徑長）',
        cos: '廣義角定義：cos(θ) = x / r（橫坐標 ÷ 動徑長）',
        tan: '廣義角定義：tan(θ) = y / x（縱坐標 ÷ 橫坐標）'
      };

      let thetaRad = Math.atan2(yVal, xVal);
      if (thetaRad <= 0) thetaRad += Math.PI * 2;
      const arcR = 44;
      const arcStartX = origin.x + arcR;
      const arcStartY = origin.y;
      const arcEndX = origin.x + arcR * Math.cos(thetaRad);
      const arcEndY = origin.y - arcR * Math.sin(thetaRad);
      const largeArc = thetaRad > Math.PI ? 1 : 0;
      const angleArcPath = `M ${arcStartX} ${arcStartY} A ${arcR} ${arcR} 0 ${largeArc} 0 ${arcEndX} ${arcEndY}`;
      const angleSectorPath = `M ${origin.x} ${origin.y} L ${arcStartX} ${arcStartY} A ${arcR} ${arcR} 0 ${largeArc} 0 ${arcEndX} ${arcEndY} Z`;
      const midRad = thetaRad * 0.5;
      const thetaLabelPt = {
        x: origin.x + (arcR + 18) * Math.cos(midRad),
        y: origin.y - (arcR + 18) * Math.sin(midRad)
      };

      return {
        phase, quad: q, xVal, yVal, rVal,
        ptP, ptFootX, ptFootY, ptRay,
        rightAngleSquareX, rightAngleSquareY,
        angleArcPath, angleSectorPath, thetaLabelPt, arcEnd: { x: arcEndX, y: arcEndY },
        targetFunc, correctNumeratorKey, correctDenominatorKey,
        conceptTip: coordTipMap[targetFunc]
      };
    };

    // ==================== 第 8 關隨機題目生成器：星象羅盤師 ====================
    const generateLevel7Question = (phase, prevAngle = null) => {
      let anglePool = [];
      if (phase === 0) anglePool = [30, 45, 60, 120, 135, 150, 210, 225, 240, 300, 315, 330];
      else if (phase === 1) anglePool = [-30, -45, -60, -120, -135, -150, -210, -240, -300, -315, 0, 90, 180, 270];
      else anglePool = [390, 405, 420, 480, 495, 510, 570, 600, 660, 675, -390, -405, -420];

      let targetAngle = anglePool[Math.floor(Math.random() * anglePool.length)];
      while (targetAngle === prevAngle && anglePool.length > 1) {
        targetAngle = anglePool[Math.floor(Math.random() * anglePool.length)];
      }

      const principal = ((targetAngle % 360) + 360) % 360;
      const isTanUndefined = principal === 90 || principal === 270;
      const funcPool = isTanUndefined ? ['sin', 'cos'] : ['sin', 'cos', 'tan'];
      const targetFunc = funcPool[Math.floor(Math.random() * funcPool.length)];

      let xStr = '1', yStr = '0', rStr = '1', xNum = 1, yNum = 0, rNum = 1, locationLabel = '';
      if (principal === 0) { xStr = '1'; yStr = '0'; rStr = '1'; xNum = 1; yNum = 0; rNum = 1; locationLabel = '正向 X 軸'; }
      else if (principal === 90) { xStr = '0'; yStr = '1'; rStr = '1'; xNum = 0; yNum = 1; rNum = 1; locationLabel = '正向 Y 軸'; }
      else if (principal === 180) { xStr = '-1'; yStr = '0'; rStr = '1'; xNum = -1; yNum = 0; rNum = 1; locationLabel = '負向 X 軸'; }
      else if (principal === 270) { xStr = '0'; yStr = '-1'; rStr = '1'; xNum = 0; yNum = -1; rNum = 1; locationLabel = '負向 Y 軸'; }
      else {
        const rad = (principal * Math.PI) / 180;
        const cosPos = Math.cos(rad) > 0;
        const sinPos = Math.sin(rad) > 0;
        if (cosPos && sinPos) locationLabel = '第 I 象限';
        else if (!cosPos && sinPos) locationLabel = '第 II 象限';
        else if (!cosPos && !sinPos) locationLabel = '第 III 象限';
        else locationLabel = '第 IV 象限';

        if (principal % 45 === 0) {
          rStr = '√2'; rNum = Math.SQRT2;
          xStr = cosPos ? '1' : '-1'; xNum = cosPos ? 1 : -1;
          yStr = sinPos ? '1' : '-1'; yNum = sinPos ? 1 : -1;
        } else if (principal % 60 === 0) {
          rStr = '2'; rNum = 2;
          xStr = cosPos ? '1' : '-1'; xNum = cosPos ? 1 : -1;
          yStr = sinPos ? '√3' : '-√3'; yNum = sinPos ? Math.sqrt(3) : -Math.sqrt(3);
        } else {
          rStr = '2'; rNum = 2;
          xStr = cosPos ? '√3' : '-√3'; xNum = cosPos ? Math.sqrt(3) : -Math.sqrt(3);
          yStr = sinPos ? '1' : '-1'; yNum = sinPos ? 1 : -1;
        }
      }

      const origin = { x: 270, y: 270 };
      const R = 195;
      const ptP = { x: origin.x + (xNum / rNum) * R, y: origin.y - (yNum / rNum) * R };
      const ptFootX = { x: ptP.x, y: origin.y };
      const ptFootY = { x: origin.x, y: ptP.y };
      const sqSize = 12;
      const dirX = xNum >= 0 ? -1 : 1;
      const dirY = yNum >= 0 ? -1 : 1;
      const rightAngleSquareX = `${ptFootX.x},${ptFootX.y} ${ptFootX.x + dirX * sqSize},${ptFootX.y} ${ptFootX.x + dirX * sqSize},${ptFootX.y + dirY * sqSize} ${ptFootX.x},${ptFootX.y + dirY * sqSize}`;
      const rightAngleSquareY = `${ptFootY.x},${ptFootY.y} ${ptFootY.x + dirX * sqSize},${ptFootY.y} ${ptFootY.x + dirX * sqSize},${ptFootY.y + dirY * sqSize} ${ptFootY.x},${ptFootY.y + dirY * sqSize}`;

      const correctNumeratorKey = targetFunc === 'cos' ? 'x' : 'y';
      const correctDenominatorKey = targetFunc === 'tan' ? 'x' : 'r';
      const exactValText = TEXT_MAP['val'][EVAL_MAP[targetFunc][String(principal)]];
      const rawVal = targetFunc === 'sin' ? yNum / rNum : targetFunc === 'cos' ? xNum / rNum : yNum / xNum;
      const signText = Math.abs(rawVal) < 1e-6 ? '= 0' : rawVal > 0 ? '> 0' : '< 0';

      return {
        targetAngle, principal, targetFunc, locationLabel,
        xStr, yStr, rStr, xNum, yNum, rNum,
        ptP, ptFootX, ptFootY, rightAngleSquareX, rightAngleSquareY,
        correctNumeratorKey, correctDenominatorKey, exactValText, signText,
        conceptTip: `${targetFunc}(θ) = ${correctNumeratorKey} / ${correctDenominatorKey}（請先點 ${correctNumeratorKey}，再點 ${correctDenominatorKey}）`
      };
    };

    // ==================== 第 1 關組件：直角三角神之眼 ====================
    const Level1EdgeMaster = ({ currentStars, onUpdateStars, onCompleteLevel, onBackToMap }) => {
      const [gameState, setGameState] = useState('idle');

      const timerRef = useRef(null);

      const maxTime = 30;

      const nextQuestion = (currentScore) => {

        setCorrectCount(0); setWrongCount(0);

                setGameState('ended');

      const earnedStars = useMemo(() => {

          setCorrectCount(c => c + 1);
          const newCombo = combo + 1;
          setCombo(newCombo);
          if (newCombo > maxCombo) setMaxCombo(newCombo);

        } else {

          const timePenalty = +(maxTime * 0.03).toFixed(2);
          setTimeLeft(prev => {

            if (nextT <= 0) {
              clearInterval(timerRef.current);
              audio.sfxTimeUp();
              setGameState('ended');
            }
            return nextT;
          });
          setWrongBtnKey(colorId);
          setConceptTip({ text: question.conceptTip, id: Date.now() });
          setFeedbackAnim('animate-shake');
          setTimeout(() => { setFeedbackAnim(''); setWrongBtnKey(null); }, 350);
        }
      };

      return (
        <div className="w-full h-full flex-1 flex flex-col justify-between pt-0.5 pb-1 relative animate-jelly min-h-0">

          {gameState === 'idle' && (
            <div className="flex-1 my-3 bg-white/95 rounded-3xl border-4 border-indigo-950 p-5 shadow-2xl flex flex-col justify-between text-center items-center">
              <div className="w-full space-y-3 pt-2">
                <div className="w-20 h-20 mx-auto rounded-3xl bg-emerald-100 border-4 border-emerald-500 flex items-center justify-center text-4xl shadow-inner animate-bounce">👁️</div>
                <h2 className="text-2xl font-black text-indigo-950 tracking-wide">三邊神之眼</h2>
                <p className="text-xs text-slate-500 font-bold leading-relaxed max-w-xs mx-auto">

                </p>

              <div className="w-full bg-emerald-50/80 border-2 border-emerald-200 rounded-2xl p-3 space-y-2 text-left text-xs font-bold text-indigo-950">
                <div className="text-[11px] font-black text-emerald-800 uppercase tracking-wider text-center">🎯 30秒通關標準</div>

              <div className="w-full space-y-2">
                <button onClick={startGame} className="w-full py-4 btn-3d-green text-white font-black text-lg rounded-2xl shadow-xl tracking-wider active:scale-95">🚀 開始 30 秒挑戰！</button>
                <button onClick={onBackToMap} className="w-full py-2 text-xs font-bold text-slate-400 hover:text-slate-600">返回聖域地圖</button>
              </div>
            </div>

          {gameState === 'playing' && question && (
            <div className={`flex-1 min-h-0 flex flex-col justify-between gap-2 overflow-hidden pb-0.5 ${feedbackAnim}`}>
              <GameHUD score={score} combo={combo} timeLeft={timeLeft} maxTime={maxTime} starsThreshold={starsThreshold} />

              <div className={`flex-1 min-h-0 bg-white rounded-3xl border-3 border-indigo-950 shadow-xl flex flex-col overflow-hidden transition-all duration-150 ${correctEdgeId ? 'ring-4 ring-emerald-400/75' : ''}`}>
                <div className="bg-gradient-to-r from-emerald-500 to-green-600 py-2.5 px-3 flex items-center justify-center gap-2 text-white text-center shrink-0 border-b-2 border-emerald-700">

                      style={{ backgroundColor: edge.color.bg, borderColor: edge.color.border }}
                      className={`py-3 text-white font-black text-base rounded-2xl shadow-md border-b-4 active:border-b-0 active:translate-y-1 transition-all flex items-center justify-center ${correctEdgeId === edge.colorId ? 'ring-4 ring-emerald-300 scale-[1.03]' : ''} ${wrongBtnKey === edge.colorId ? 'btn-wrong-flash' : ''}`}

    // ==================== 第 2 關組件：比值之密碼 ====================
    const Level2RatioMaster = ({ currentStars, onUpdateStars, onCompleteLevel, onBackToMap }) => {

        setCorrectCount(0); setWrongCount(0);
        setTimeLeft(maxTime); setFeedbackAnim('');

      useEffect(() => {

          timerRef.current = setInterval(() => {
            setTimeLeft(prev => {
              if (prev <= 0.1) {
                clearInterval(timerRef.current);
                audio.sfxTimeUp();
                setGameState('ended');
                return 0;
              }
              return +(prev - 0.1).toFixed(1);

      }, [gameState, isLockedSuccess]);

      const earnedStars = useMemo(() => {

      }, [score]);

      useEffect(() => {
        if (gameState === 'ended' && earnedStars > currentStars) onUpdateStars(earnedStars, score);

      const handleSelectEdge = (edge) => {
