                <div className="relative w-full flex-1 min-h-0 bg-white flex items-center justify-center overflow-hidden">
                  <HintBanner tip={conceptTip} />
                  <div className="pointer-events-none absolute top-2 inset-x-0 flex justify-center z-10">
                    <span data-coach="lv7-confirm-tip" className="text-[11px] font-black text-sky-800 bg-sky-50/90 border border-sky-200 px-3 py-0.5 rounded-full shadow-sm">
                      拖曳藍點旋轉，調好後輕點空白處鎖定
                    </span>
                  </div>
                  {isLockedSuccess && <div className="absolute inset-0 bg-amber-400/25 z-30 pointer-events-none animate-ping"></div>}
                  <svg ref={dialSvgRef} viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="xMidYMid meet" className="w-full h-full object-contain cursor-grab active:cursor-grabbing select-none" onPointerDown={handlePointerDown} onPointerMove={handlePointerMove} onPointerUp={handlePointerUp} onPointerCancel={handlePointerUp}>
                    <defs>
                      <pattern id="gridLv5" width="100" height="100" patternUnits="userSpaceOnUse" x="270" y="270">
                        <rect width="100" height="100" fill="#ffffff" />
                        <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#e2e8f0" strokeWidth="2.5" />
                      </pattern>
                      <marker id="arrowHeadLv5" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                        <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b" />
                      </marker>
                    </defs>
                    <rect width="100%" height="100%" fill="url(#gridLv5)" />
                    <line x1={30} y1={270} x2={510} y2={270} stroke="#94a3b8" strokeWidth="2.5" />
                    <line x1={270} y1={30} x2={270} y2={510} stroke="#94a3b8" strokeWidth="2.5" />
                    <text x="500" y="255" fill="#94a3b8" fontSize="24" fontWeight="bold">x</text>
                    <text x="285" y="50" fill="#94a3b8" fontSize="24" fontWeight="bold">y</text>
                    <text x="440" y="100" fill="#e2e8f0" fontSize="64" fontWeight="bold" opacity="0.6">I</text>
                    <text x="80" y="100" fill="#e2e8f0" fontSize="64" fontWeight="bold" opacity="0.6">II</text>
                    <text x="80" y="460" fill="#e2e8f0" fontSize="64" fontWeight="bold" opacity="0.6">III</text>
                    <text x="440" y="460" fill="#e2e8f0" fontSize="64" fontWeight="bold" opacity="0.6">IV</text>
                    {rayAngles.map(deg => {
                      const rRad = (deg * Math.PI) / 180;
                      const isAxis = deg % 90 === 0;
                      const isThirty = deg % 30 === 0;
                      const showLabel = lv7Phase === 0 ? true : lv7Phase === 1 ? isAxis : false;
                      const labelR = isAxis ? 232 : isThirty ? 224 : 246;
                      return (
                        <g key={deg}>
                          <line x1={270} y1={270} x2={270 + 200 * Math.cos(rRad)} y2={270 - 200 * Math.sin(rRad)} stroke="#94a3b8" strokeWidth={isAxis ? 3 : 2} strokeDasharray={isAxis ? "none" : "5 5"} />
                          {showLabel && (
                            <text
                              x={270 + labelR * Math.cos(rRad)}
                              y={270 - labelR * Math.sin(rRad)}
                              fill={isAxis ? '#334155' : '#475569'}
                              fontSize={isAxis ? '20' : isThirty ? '16' : '15'}
                              fontWeight="900"
                              textAnchor="middle"
                              dominantBaseline="middle"
                              className="font-mono pointer-events-none"
                            >
                              {deg}°
                            </text>
                          )}
                        </g>
                      );
                    })}
                    <path d={generateSpiral()} fill="none" stroke={isLockedSuccess ? "#fbbf24" : "#f59e0b"} strokeWidth={isLockedSuccess ? "6" : "4.5"} strokeLinecap="round" strokeLinejoin="round" markerEnd="url(#arrowHeadLv5)" />
                    <line x1={270} y1={270} x2={490} y2={270} stroke="#ef4444" strokeWidth="8" strokeLinecap="round" />
                    <rect x="435" y="282" width="56" height="26" fill="white" stroke="#ef4444" strokeWidth="1.5" rx="6" />
                    <text x="463" y="300" fill="#b91c1c" fontSize="16" fontWeight="900" textAnchor="middle">始邊</text>
                    <line x1={270} y1={270} x2={ptTerminal.x} y2={ptTerminal.y} stroke={isLockedSuccess ? "#f59e0b" : "#3b82f6"} strokeWidth={isLockedSuccess ? "11" : "8"} strokeLinecap="round" />
                    <g transform={`translate(${270 + 135 * Math.cos(currentRad)}, ${270 - 135 * Math.sin(currentRad)})`} className="pointer-events-none">
                      <rect x="-26" y="-12" width="52" height="24" fill="white" stroke={isLockedSuccess ? "#d97706" : "#3b82f6"} strokeWidth="1.8" rx="6" />
                      <text x="0" y="1" fill={isLockedSuccess ? "#b45309" : "#1d4ed8"} fontSize="15" fontWeight="900" textAnchor="middle" dominantBaseline="middle">終邊</text>
                    </g>
                    <g data-coach="lv7-dial" transform={`translate(${ptTerminal.x}, ${ptTerminal.y})`}>
                      {(isDragging || isLockedSuccess) && <circle cx="0" cy="0" r={isLockedSuccess ? 50 : 44} fill={isLockedSuccess ? "#fde047" : "#60a5fa"} opacity="0.4" className="animate-pulse" />}
                      <circle cx="0" cy="0" r={isDragging ? 22 : 18} fill={isLockedSuccess ? "#f59e0b" : "#2563eb"} stroke="#ffffff" strokeWidth="4" />
                      <circle cx="0" cy="0" r="6" fill="#ffffff" />
                    </g>
                    <circle cx={270} cy={270} r={height} fill="transparent" style={{ touchAction: 'none' }} className="cursor-grab active:cursor-grabbing" />
                  </svg>
                </div>
              </div>
                );
              })()}
              <CoachOverlay
                containerRef={containerRef}
                active={guideMode === 'manual' || (gameState === 'playing' && showGuide && !isLockedSuccess)}
            mode={guideMode || 'spotlight'}
                steps={lv7CoachSteps}
                onDismiss={dismissGuide}
              />
            </div>
          )}

          {gameState === 'ended' && (
            <LevelResultScreen
              score={finalScore}
              baseScore={baseScore}
              earnedStars={earnedStars}
              correctCount={correctCount}
              wrongCount={wrongCount}
              lives={lives}
              progress={progress}
              targetTotal={starsThreshold[2]}
              elapsedSec={elapsedSec}
              lifeBonus={lifeBonus}
              accuracyBonus={accuracyBonus}
              speedBonus={speedBonus}
              accentClass="text-sky-600"
              onCompleteLevel={onCompleteLevel}
              onRestart={startGame}
              onBackToMap={onBackToMap}
            />
          )}
        </div>
      );
    };


    // ==================== 第 7 關組件：同界角星爆（Target Pop） ====================
    const isCoterminalAngle = (a, b) => (((a - b) % 360) + 360) % 360 === 0;

    const generateCoterminalWave = (phase, prevBase = null, bagRef = null) => {
      const basePools = {
        0: [20, 30, 40, 45, 50, 60, 75, 110, 120, 135, 150],
        1: [-120, -45, -60, -150, -30, -135, 210, 225, 240, 300, 315],
        2: [410, -300, 495, -225, 390, -315, 420, -240, 510, -405]
      };
      const pool = basePools[phase] || basePools[0];
      let baseAngle;
      if (bagRef) {
        if (!bagRef[phase] || bagRef[phase].length === 0) {
          bagRef[phase] = shuffle([...pool]);
          if (bagRef[phase].length > 1 && bagRef[phase][0] === prevBase) {
            bagRef[phase].push(bagRef[phase].shift());
          }
        }
        baseAngle = bagRef[phase].shift();
      } else {
        baseAngle = pool[Math.floor(Math.random() * pool.length)];
        while (baseAngle === prevBase && pool.length > 1) {
          baseAngle = pool[Math.floor(Math.random() * pool.length)];
        }
      }

      const principal = ((baseAngle % 360) + 360) % 360;
      let correctAngles;
      if (phase === 0) {
        correctAngles = [360, -360, 720].map(d => baseAngle + d);
      } else if (phase === 1) {
        if (baseAngle < 0) {
          const extras = shuffle([-360, 720, -720]).slice(0, 2).map(d => baseAngle + d);
          correctAngles = [principal, ...extras];
        } else {
          correctAngles = shuffle([360, -360, 720, -720]).slice(0, 3).map(d => baseAngle + d);
        }
      } else {
        const candidates = [principal, principal - 360, principal + 360, principal + 720, principal - 720]
          .filter(a => a !== baseAngle);
        const rest = shuffle(candidates.filter(a => a !== principal)).slice(0, principal !== baseAngle ? 2 : 3);
        correctAngles = principal !== baseAngle ? [principal, ...rest] : rest;
      }

      const usedSet = new Set([baseAngle, ...correctAngles]);
      const trapCandidates = [
        -baseAngle,
        180 - baseAngle,
        baseAngle + 180,
        baseAngle - 180,
        -principal,
        180 - principal,
        baseAngle < 0 ? baseAngle - 120 : -baseAngle - 180,
        360 - baseAngle,
        baseAngle + 90,
        baseAngle - 90,
        -baseAngle + 360,
        -baseAngle - 360
      ];

      const trapAngles = [];
      for (const cand of trapCandidates) {
        if (trapAngles.length >= 3) break;
        if (!usedSet.has(cand) && !isCoterminalAngle(cand, baseAngle)) {
          usedSet.add(cand);
          trapAngles.push(cand);
        }
      }
      while (trapAngles.length < 3) {
        const fallback = baseAngle + (trapAngles.length + 1) * 70;
        if (!usedSet.has(fallback) && !isCoterminalAngle(fallback, baseAngle)) {
          usedSet.add(fallback);
          trapAngles.push(fallback);
        }
      }

      const templates = [
        // W 型（仙后座）
        [{ x: 16, y: 44 }, { x: 32, y: 74 }, { x: 50, y: 44 }, { x: 68, y: 74 }, { x: 84, y: 38 }, { x: 50, y: 18 }],
        // 勺子（北斗型）
        [{ x: 16, y: 26 }, { x: 42, y: 22 }, { x: 44, y: 52 }, { x: 18, y: 58 }, { x: 66, y: 42 }, { x: 84, y: 72 }],
        // 十字（天鵝座型）
        [{ x: 50, y: 18 }, { x: 50, y: 48 }, { x: 50, y: 78 }, { x: 18, y: 44 }, { x: 82, y: 44 }, { x: 76, y: 76 }],
        // 環狀（皇冠型）
        [{ x: 50, y: 18 }, { x: 82, y: 34 }, { x: 78, y: 68 }, { x: 50, y: 78 }, { x: 22, y: 68 }, { x: 18, y: 34 }],
        // 斜向流星帶
        [{ x: 16, y: 72 }, { x: 36, y: 52 }, { x: 58, y: 32 }, { x: 82, y: 20 }, { x: 44, y: 78 }, { x: 78, y: 60 }],
        // 鑽石雙翼型
        [{ x: 50, y: 18 }, { x: 22, y: 38 }, { x: 78, y: 38 }, { x: 34, y: 70 }, { x: 66, y: 70 }, { x: 50, y: 46 }]
      ];
      const chosenTpl = templates[Math.floor(Math.random() * templates.length)];
      const flipX = Math.random() > 0.5;
      const flipY = Math.random() > 0.5;
      const slots = shuffle(chosenTpl.map(pt => ({
        x: flipX ? 100 - pt.x : pt.x,
        y: flipY ? 96 - pt.y : pt.y
      })));
      const items = shuffle([
        ...correctAngles.map(ang => ({ angle: ang, isCorrect: true })),
        ...trapAngles.map(ang => ({ angle: ang, isCorrect: false }))
      ]).map((item, idx) => ({
        uid: `B_${Date.now()}_${idx}_${Math.random()}`,
        angle: item.angle,
        isCorrect: item.isCorrect,
        x: Math.max(15, Math.min(85, slots[idx].x + (Math.random() - 0.5) * 4)),
        y: Math.max(18, Math.min(78, slots[idx].y + (Math.random() - 0.5) * 4)),
        swayPhase: Math.random() * Math.PI * 2,
        status: 'active'
      }));

      return { baseAngle, phase, bubbles: items };
    };

    const LevelCoterminalPopMaster = ({ currentStars, hasSeenGuide = false, onMarkGuideSeen, onUpdateStars, onCompleteLevel, onBackToMap }) => {
      const { isRelaxMode } = React.useContext(GameModeContext);
      const starsThreshold = [2, 4, 6];
      const maxLives = 3;
      const healTarget = 2;
      const {
        gameState, progress, lives, healStreak, correctCount, wrongCount, elapsedSec,
        earnedStars, baseScore, lifeBonus, accuracyBonus, speedBonus, finalScore,
        startSession, recordCorrect, recordWrong, finishNow
      } = useLivesLevelSession({ starThresholds: starsThreshold, maxLives, healTarget, unitLabel: '波', currentStars, onUpdateStars });

      const [waveNum, setWaveNum] = useState(1);
      const [baseAngle, setBaseAngle] = useState(50);
      const [bubbles, setBubbles] = useState([]);
      const [waveCleared, setWaveCleared] = useState(false);
      const [feedbackAnim, setFeedbackAnim] = useState('');
      const [conceptTip, setConceptTip] = useState(null);
      const [bursts, setBursts] = useState([]);
      const [wrongFlash, setWrongFlash] = useState(false);
      const [wrongDiagram, setWrongDiagram] = useState(null);
      const [linkedUids, setLinkedUids] = useState([]);
      const [dragLinePt, setDragLinePt] = useState(null);
      const { showGuide, guideMode, openGuide, dismissGuide } = useLevelGuide(currentStars, hasSeenGuide, onMarkGuideSeen);

      const containerRef = useRef(null);
      const boardRef = useRef(null);
      const baseBagRef = useRef({ 0: [], 1: [], 2: [] });
      const isLinkingRef = useRef(false);
      const showGuideRef = useRef(showGuide);
      useEffect(() => { showGuideRef.current = showGuide; }, [showGuide]);


      const starsBg = useMemo(() => (
        Array.from({ length: 22 }, (_, i) => ({
          id: i,
          left: `${(i * 37 + 11) % 94 + 3}%`,
          top: `${(i * 53 + 7) % 88 + 6}%`,
          size: i % 4 === 0 ? 3 : 2,
          delay: `${((i * 0.43) % 2.8).toFixed(2)}s`,
          dur: `${(2.2 + (i % 5) * 0.55).toFixed(2)}s`
        }))
      ), []);

      const bubblesRef = useRef([]);
      const baseAngleRef = useRef(null);
      const waveErrorsRef = useRef(0);
      const waveLockedRef = useRef(false);
      const progressRef = useRef(0);
      const recordWrongRef = useRef(recordWrong);
      const rafRef = useRef(null);
      const waveTimeoutRef = useRef(null);
      const pendingWaveNextRef = useRef(null);
      const handleWaveConfirmSkip = () => {
        if (!pendingWaveNextRef.current) return;
        clearTimeout(waveTimeoutRef.current);
        const fn = pendingWaveNextRef.current;
        pendingWaveNextRef.current = null;
        audio.sfxClick();
        fn();
      };

      useEffect(() => { progressRef.current = progress; }, [progress]);
      useEffect(() => { recordWrongRef.current = recordWrong; }, [recordWrong]);

      const spawnNextWave = useCallback((curProg) => {
        setWrongDiagram(null);
        setLinkedUids([]);
        setDragLinePt(null);
        isLinkingRef.current = false;
        const phase = curProg >= starsThreshold[1] ? 2 : curProg >= starsThreshold[0] ? 1 : 0;
        const w = generateCoterminalWave(phase, baseAngleRef.current, baseBagRef.current);
        baseAngleRef.current = w.baseAngle;
        waveErrorsRef.current = 0;
        waveLockedRef.current = false;
        setWaveCleared(false);
        setBaseAngle(w.baseAngle);
        bubblesRef.current = w.bubbles;
        setBubbles(w.bubbles);
      }, []);

      const startGame = () => {
        clearTimeout(waveTimeoutRef.current);
        baseAngleRef.current = null;
        baseBagRef.current = { 0: [], 1: [], 2: [] };
        setWaveNum(1);
        setFeedbackAnim('');
        setConceptTip(null);
        setWrongDiagram(null);
        setBursts([]);
        setWrongFlash(false);
        const initProg = startSession();
        spawnNextWave(initProg);
        audio.init();
      };

      useEffect(() => {
        startGame();
      }, []);

      const lv8CoachSteps = useMemo(() => ([
        {
          target: 'lv8-base',
          anchorX: 0.5,
          anchorY: 0.5,
          pad: 6,
          shape: 'ellipse',
          tap: false,
          desc: '看上方基準角，找出相差 360° 整數倍的 3 顆同界星'
        },
        {
          target: 'lv8-correct',
          anchorX: 0.5,
          anchorY: 0.5,
          minW: 84,
          minH: 84,
          shape: 'circle',
          tap: true,
          desc: '滑動一筆連（或依序點擊）串起 3 顆同界角星！'
        }
      ]), []);

      useEffect(() => {
        return () => {
          clearTimeout(waveTimeoutRef.current);
        };
      }, []);

      const handleBubbleTap = (bubble) => {
        if (gameState !== 'playing' || waveLockedRef.current || bubble.status !== 'active' || (!isRelaxMode && lives <= 0)) return;
        if (bubble.isCorrect) {
          const nextBubbles = bubblesRef.current.map(b => b.uid === bubble.uid ? { ...b, status: 'linked' } : b);
          const remainingCorrect = nextBubbles.filter(b => b.isCorrect && b.status === 'active').length;
          const stepIdx = 2 - remainingCorrect;
          audio.sfxBubblePop(stepIdx);

          setLinkedUids(prev => prev.includes(bubble.uid) ? prev : [...prev, bubble.uid]);

          const burstId = `${bubble.uid}-${Date.now()}`;
          const bx = bubble.renderX ?? bubble.x;
          const by = bubble.y;
          setBursts(prev => [...prev, { id: burstId, x: bx, y: by, isWaveEnd: remainingCorrect === 0 }]);
          setTimeout(() => {
            setBursts(prev => prev.filter(item => item.id !== burstId));
          }, 500);

          setConceptTip(null);

          if (remainingCorrect === 0) {
            waveLockedRef.current = true;
            isLinkingRef.current = false;
            setDragLinePt(null);
            setWaveCleared(true);
            audio.sfxWaveClear();
            setFeedbackAnim('animate-correct');
            bubblesRef.current = nextBubbles.map(b => b.status === 'active' ? { ...b, status: 'fade' } : b);
            setBubbles(bubblesRef.current);
            const confirmDur = 1400;
            const { completed, nextProgress } = recordCorrect({ wasMissed: waveErrorsRef.current > 0, delayEndMs: confirmDur });
            setConceptTip(null);
            if (!completed) {
              const advanceWaveFn = () => {
                pendingWaveNextRef.current = null;
                setFeedbackAnim('');
                setWaveNum(w => w + 1);
                spawnNextWave(nextProgress);
              };
              pendingWaveNextRef.current = advanceWaveFn;
              waveTimeoutRef.current = setTimeout(advanceWaveFn, confirmDur);
            } else {
              setTimeout(() => setFeedbackAnim(''), confirmDur);
            }
          } else {
            bubblesRef.current = nextBubbles;
            setBubbles(nextBubbles);
          }
        } else {
          isLinkingRef.current = false;
          setDragLinePt(null);
          audio.sfxError();
          waveErrorsRef.current += 1;
          const { gameOver } = recordWrong({ delayEndMs: 450 });
          bubblesRef.current = bubblesRef.current.map(b => b.uid === bubble.uid ? { ...b, status: 'wrong' } : b);
          setBubbles(bubblesRef.current);
          setConceptTip(null);
          if (!gameOver) {
            setWrongDiagram({
              baseAngle,
              wrongAngle: bubble.angle,
              diff: Math.abs(bubble.angle - baseAngle)
            });
          }
          setFeedbackAnim('animate-shake');
          setWrongFlash(true);
          if (!gameOver) {
            setTimeout(() => {
              setFeedbackAnim('');
              setWrongFlash(false);
            }, 350);
          }
        }
      };

      const getBoardPct = (clientX, clientY) => {
        const el = boardRef.current;
        if (!el) return null;
        const rect = el.getBoundingClientRect();
        if (!rect.width || !rect.height) return null;
        return {
          x: Math.max(0, Math.min(100, ((clientX - rect.left) / rect.width) * 100)),
          y: Math.max(0, Math.min(100, ((clientY - rect.top) / rect.height) * 100)),
          w: rect.width,
          h: rect.height
        };
      };

      const findHitStar = (pt) => {
        if (!pt) return null;
        let best = null;
        let bestDist = Infinity;
        for (const b of bubblesRef.current) {
          if (b.status !== 'active') continue;
          const bx = b.renderX ?? b.x;
          const by = b.y;
          const dx = ((pt.x - bx) / 100) * pt.w;
          const dy = ((pt.y - by) / 100) * pt.h;
          const dist = Math.hypot(dx, dy);
          if (dist <= 44 && dist < bestDist) {
            best = b;
            bestDist = dist;
          }
        }
        return best;
      };

      const handleBoardPointerDown = (e) => {
        if (wrongDiagram) {
          audio.sfxClick();
          setWrongDiagram(null);
          return;
        }
        if (waveCleared && pendingWaveNextRef.current) {
          handleWaveConfirmSkip();
          return;
        }
        if (gameState !== 'playing' || waveLockedRef.current || (!isRelaxMode && lives <= 0)) return;
        const pt = getBoardPct(e.clientX, e.clientY);
        const hit = findHitStar(pt);
        isLinkingRef.current = true;
        if (e.currentTarget.setPointerCapture) {
          try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
        }
        if (hit) {
          handleBubbleTap(hit);
        }
        if (!waveLockedRef.current && isLinkingRef.current && pt) {
          setDragLinePt({ x: pt.x, y: pt.y });
        }
      };

      const handleBoardPointerMove = (e) => {
        if (!isLinkingRef.current || gameState !== 'playing' || waveLockedRef.current) return;
        const pt = getBoardPct(e.clientX, e.clientY);
        if (!pt) return;
        setDragLinePt({ x: pt.x, y: pt.y });
        const hit = findHitStar(pt);
        if (hit) {
          handleBubbleTap(hit);
        }
      };

      const handleBoardPointerUp = (e) => {
        isLinkingRef.current = false;
        setDragLinePt(null);
        if (e.currentTarget.releasePointerCapture) {
          try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (_) {}
        }
      };

      const poppedCorrectCount = bubbles.filter(b => b.isCorrect && b.status === 'linked').length;

      return (
        <div ref={containerRef} className="w-full h-full flex-1 flex flex-col justify-between pt-0.5 pb-1 relative animate-jelly min-h-0">
          {gameState === 'idle' && (

    const Level9QuadrantNavigator = ({ currentStars, onUpdateStars, onCompleteLevel, onBackToMap, hasSeenGuide = false, onMarkGuideSeen }) => {

      const containerRef = useRef(null);
      const bag0Ref = useRef([]);

      const lastIdRef = useRef(null);
      const dragStartRef = useRef(null);
      const nextPreviewRef = useRef(null);
      const questionErrorsRef = useRef(0);
      const confirmTimerRef = useRef(null);
      const pendingNextRef = useRef(null);
      const handleConfirmSkip = () => {
        if (!pendingNextRef.current) return;
        clearTimeout(confirmTimerRef.current);
        const fn = pendingNextRef.current;
        pendingNextRef.current = null;
        audio.sfxClick();
        fn();
      };
      useEffect(() => () => clearTimeout(confirmTimerRef.current), []);

      const drawFromBag = (bagRef, sourcePool) => {
        if (bagRef.current.length === 0) {
          let fresh = shuffle(sourcePool);
          if (fresh.length > 1 && fresh[0].id === lastIdRef.current) {
            const swapIdx = 1 + Math.floor(Math.random() * (fresh.length - 1));
            [fresh[0], fresh[swapIdx]] = [fresh[swapIdx], fresh[0]];
          }
          bagRef.current = fresh;
        }
        const picked = bagRef.current.shift();
        lastIdRef.current = picked.id;
        return picked;
      };

      const pickQuestionForProg = (curProg) => {
        const phase = curProg >= starsThreshold[1] ? 2 : curProg >= starsThreshold[0] ? 1 : 0;
        const pool = phase === 0 ? LEVEL9_PHASE0_POOL : phase === 1 ? LEVEL9_PHASE1_POOL : LEVEL9_PHASE2_POOL;
        const bagRef = phase === 0 ? bag0Ref : phase === 1 ? bag1Ref : bag2Ref;
        return { ...drawFromBag(bagRef, pool), phase };
      };

      const advanceCard = (curProg) => {
        const curPhase = curProg >= starsThreshold[1] ? 2 : curProg >= starsThreshold[0] ? 1 : 0;
        const currentCard = nextPreviewRef.current && nextPreviewRef.current.phase === curPhase
          ? nextPreviewRef.current
          : pickQuestionForProg(curProg);
        const upcoming = pickQuestionForProg(curProg);
        nextPreviewRef.current = upcoming;
        questionErrorsRef.current = 0;
        setQuestion(currentCard);
        setNextPreview(upcoming);
        setDragOffset({ x: 0, y: 0 });
        setFlyOutTarget(null);
        setIsTransitioning(false);
        setConceptTip(null);
        setFlashRay(null);
      };

      const startGame = () => {
        bag0Ref.current = []; bag1Ref.current = []; bag2Ref.current = []; lastIdRef.current = null;
        nextPreviewRef.current = null;
        setFeedbackAnim('');
        setWrongTargetKey(null); setConceptTip(null); setFlashRay(null);
        setDragOffset({ x: 0, y: 0 }); setFlyOutTarget(null);
        setIsTransitioning(false);
        const initProg = startSession();
        advanceCard(initProg);
        audio.init();
      };

      useEffect(() => { startGame(); }, []);

      const getFlyVector = (choice) => {
        if (choice === '1') return { x: 180, y: -150 };
        if (choice === '2') return { x: -180, y: -150 };
        if (choice === '3') return { x: -180, y: 150 };
        if (choice === '4') return { x: 180, y: 150 };
        return { x: 0, y: 200 };
      };

      const submitSort = (choice) => {
        if (gameState !== 'playing' || !question || isTransitioning || (!isRelaxMode && lives <= 0)) return;
        if (choice === question.ans) {
          if (showGuide) dismissGuide();
          setIsTransitioning(true);
          setFlashRay({ stdDeg: question.std, deg: question.deg, ok: true });
          const errs = questionErrorsRef.current;
          audio.sfxSwipeSort(false, 0);
          setFlyOutTarget(getFlyVector(choice));
          setFeedbackAnim('animate-correct');
          const confirmDur = question.phase >= 1 ? 1500 : 800;
          const { completed, nextProgress } = recordCorrect({ wasMissed: errs > 0, delayEndMs: confirmDur });
          if (question.phase >= 1 && question.tip) {
            const shortEq = question.tip.split('（')[0].replace(/➔.*$/, '').trim();
            setConceptTip({
              text: shortEq || question.tip,
              tone: 'success',
              canSkip: !completed,
              id: Date.now()
            });
          } else {
            setConceptTip(null);
          }
          const advanceFn = () => {
            pendingNextRef.current = null;
            setFeedbackAnim('');
            if (!completed) advanceCard(nextProgress);
          };
          pendingNextRef.current = advanceFn;
          confirmTimerRef.current = setTimeout(advanceFn, confirmDur);
        } else {
          audio.sfxError();
          questionErrorsRef.current += 1;
          setFlashRay({ stdDeg: question.std, ok: false });
          const { gameOver } = recordWrong({ delayEndMs: 360 });
          setWrongTargetKey(choice);
          setDragOffset({ x: 0, y: 0 });
          if (question?.tip) setConceptTip({ text: question.tip, id: Date.now() });
          setFeedbackAnim('animate-shake');
          if (!gameOver) {
            setTimeout(() => {
              setFeedbackAnim('');
              setWrongTargetKey(null);
            }, 350);
          }
        }
      };

      const getHoverTarget = (dx, dy) => {
        if (!question) return null;
        if (Math.hypot(dx, dy) < 48) return null;
        if (dx >= 0 && dy < 0) return '1';
        if (dx < 0 && dy < 0) return '2';
        if (dx < 0 && dy >= 0) return '3';
        return '4';
      };

      const handleCardPointerDown = (e) => {
        if (gameState !== 'playing' || isTransitioning || !question || (!isRelaxMode && lives <= 0)) return;
        e.currentTarget.setPointerCapture(e.pointerId);
        dragStartRef.current = { x: e.clientX, y: e.clientY };
        setIsDragging(true);
      };

      const handleCardPointerMove = (e) => {
        if (!isDragging || !dragStartRef.current) return;
        setDragOffset({
          x: e.clientX - dragStartRef.current.x,
          y: e.clientY - dragStartRef.current.y
        });
      };

      const handleCardPointerUp = (e) => {
        if (!isDragging) return;
        setIsDragging(false);
        if (e.currentTarget.hasPointerCapture(e.pointerId)) e.currentTarget.releasePointerCapture(e.pointerId);
        const choice = getHoverTarget(dragOffset.x, dragOffset.y);
        dragStartRef.current = null;
        if (choice) submitSort(choice);
        else setDragOffset({ x: 0, y: 0 });
      };

      const hoverTarget = isDragging ? getHoverTarget(dragOffset.x, dragOffset.y) : null;
      const cardTransform = flyOutTarget
        ? `translate3d(${flyOutTarget.x}px, ${flyOutTarget.y}px, 0) rotate(${flyOutTarget.x * 0.08}deg) scale(0.85)`
        : `translate3d(${dragOffset.x}px, ${dragOffset.y}px, 0) rotate(${dragOffset.x * 0.06}deg)`;

      const quadButtons = [
        { key: '2', label: '第 II 象限', sub: '↖ 左上', range: '90°～180°' },
        { key: '1', label: '第 I 象限', sub: '↗ 右上', range: '0°～90°' },
        { key: '3', label: '第 III 象限', sub: '↙ 左下', range: '180°～270°' },
        { key: '4', label: '第 IV 象限', sub: '↘ 右下', range: '270°～360°' }
      ];

      const rayRad = flashRay ? (flashRay.stdDeg * Math.PI) / 180 : 0;
      const sweepArcPath = useMemo(() => {
        if (!flashRay || !flashRay.ok || flashRay.deg === undefined || flashRay.deg === 0) return '';
        const steps = 28;
        const pts = [];
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          const a = (flashRay.deg * t * Math.PI) / 180;
          const r = 20 + 18 * t;
          pts.push(`${i === 0 ? 'M' : 'L'} ${(100 + r * Math.cos(a)).toFixed(1)} ${(100 - r * Math.sin(a)).toFixed(1)}`);
        }
        return pts.join(' ');
      }, [flashRay]);

      return (
        <div ref={containerRef} className="w-full h-full flex-1 flex flex-col justify-between pt-0.5 pb-1 relative animate-jelly min-h-0">
          {gameState === 'playing' && question && (
            <div className={`flex-1 min-h-0 flex flex-col justify-between gap-2 overflow-hidden pb-0.5 ${feedbackAnim}`}>
              <GameHUD
                progress={progress}
                starsThreshold={starsThreshold}
                lives={lives}
                maxLives={maxLives}
                healStreak={healStreak}
                healTarget={healTarget}
                onManualEnd={finishNow}
                onOpenGuide={openGuide}
              />

              <div className="flex-1 min-h-0 rounded-3xl border-3 border-teal-900 bg-gradient-to-b from-slate-900 via-indigo-950 to-slate-950 shadow-xl flex flex-col overflow-hidden relative">
                <StagePhaseStrip phase={question.phase} labels={['正角空間定位（附區間鷹架）', '撤除區間 • 負角與單圈轉換', '多圈同界角 ＋ 坐標軸上角']} />

                <div onClick={handleConfirmSkip} data-coach="lv9-board" className="relative flex-1 min-h-0 p-2.5 flex flex-col justify-between gap-2 overflow-hidden select-none">
                  <HintBanner tip={conceptTip} />

                  <div className="relative flex-1 min-h-0 grid grid-cols-2 gap-2">
                    {/* 背景坐標軸與閃現終邊射線 */}
                    <svg viewBox="0 0 200 200" className="pointer-events-none absolute inset-0 w-full h-full z-10 opacity-90" preserveAspectRatio="xMidYMid meet">
                      <line x1="12" y1="100" x2="188" y2="100" stroke="rgba(148,163,184,0.35)" strokeWidth="1.5" strokeDasharray="4 4" />
                      <line x1="100" y1="12" x2="100" y2="188" stroke="rgba(148,163,184,0.35)" strokeWidth="1.5" strokeDasharray="4 4" />
                      {flashRay && (
                        <g>
                          {flashRay.ok && sweepArcPath && (
                            <>
                              <line x1="100" y1="100" x2="174" y2="100" stroke="rgba(148,163,184,0.5)" strokeWidth="2" strokeLinecap="round" />
                              <path
                                d={sweepArcPath}
                                fill="none"
                                stroke={flashRay.deg >= 0 ? '#34d399' : '#fbbf24'}
                                strokeWidth="3"
                                strokeLinecap="round"
                                className="animate-arc-sweep"
                              />
                            </>
                          )}
                          <line
                            x1="100"
                            y1="100"
                            x2={100 + 74 * Math.cos(rayRad)}
                            y2={100 - 74 * Math.sin(rayRad)}
                            stroke={flashRay.ok ? '#34d399' : '#fb7185'}
                            strokeWidth="4.5"
                            strokeLinecap="round"
                          />
                          <circle
                            cx={100 + 74 * Math.cos(rayRad)}
                            cy={100 - 74 * Math.sin(rayRad)}
                            r="5"
                            fill={flashRay.ok ? '#fde047' : '#fb7185'}
                          />
                        </g>
                      )}
                    </svg>

                    {quadButtons.map(item => (
                      <button
                        key={item.key}
                        onClick={() => submitSort(item.key)}
                        className={`rounded-2xl border-2 flex flex-col items-center justify-center p-2 transition-all active:scale-95 ${
                          wrongTargetKey === item.key
                            ? 'bg-red-500/80 border-red-200 text-white btn-wrong-flash'
                            : hoverTarget === item.key
                            ? 'bg-teal-400 border-white text-slate-950 scale-[1.03] shadow-[0_0_20px_rgba(45,212,191,0.85)]'
                            : 'bg-indigo-900/50 border-teal-400/35 text-teal-50 hover:bg-indigo-800/65'
                        }`}
                      >
                        <span className="text-lg sm:text-xl font-serif font-black">{item.label}</span>
                        <span className="text-[10px] font-bold opacity-75">{item.sub}</span>
                        {question.phase === 0 && (
                          <span className="mt-1 text-[10px] font-mono font-bold text-teal-200/80 bg-slate-950/40 px-1.5 py-0.5 rounded-md">
                            {item.range}
                          </span>
                        )}
                      </button>
                    ))}

                    <div className="pointer-events-none absolute inset-0 flex items-center justify-center z-20">
                      <div
                        data-coach="lv9-card"
                        onPointerDown={handleCardPointerDown}
                        onPointerMove={handleCardPointerMove}
                        onPointerUp={handleCardPointerUp}
                        onPointerCancel={handleCardPointerUp}
                        style={{
                          transform: cardTransform,
                          transition: isDragging ? 'none' : flyOutTarget ? 'transform 0.2s ease-out, opacity 0.2s ease-out' : 'transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1)',
                          opacity: flyOutTarget ? 0 : 1
                        }}
                        className="pointer-events-auto min-w-[146px] max-w-[200px] rounded-2xl bg-white border-4 border-teal-400 px-4 py-3 shadow-2xl flex flex-col items-center justify-center text-center cursor-grab active:cursor-grabbing touch-none"
                      >
                        <div className="text-[10px] font-black text-teal-600 uppercase tracking-widest">θ</div>
                        <div className="text-3xl sm:text-4xl font-mono font-black text-indigo-950 leading-tight">{question.deg}°</div>
                      </div>
                    </div>
                  </div>

                  {question.phase >= 2 && (
                    <button
                      onClick={() => submitSort('axis')}
                      className={`w-full py-2.5 rounded-2xl border-2 font-black text-xs sm:text-sm flex items-center justify-center gap-1.5 transition-all active:scale-95 shrink-0 animate-jelly ${
                        wrongTargetKey === 'axis'
                          ? 'bg-red-500/80 border-red-200 text-white btn-wrong-flash'
                          : 'bg-amber-400/20 hover:bg-amber-400/30 border-amber-300/70 text-amber-200 shadow'
                      }`}
                    >
                      <span>✦</span>
                      <span>落在坐標軸上（不屬任一象限）</span>
                    </button>
                  )}
                </div>
              </div>
            </div>
          )}

          {gameState === 'ended' && (
            <LevelResultScreen
              score={finalScore}
              baseScore={baseScore}
              earnedStars={earnedStars}
              correctCount={correctCount}
              wrongCount={wrongCount}
              lives={lives}
              progress={progress}
              targetTotal={starsThreshold[2]}
              elapsedSec={elapsedSec}
              lifeBonus={lifeBonus}
              accuracyBonus={accuracyBonus}
              speedBonus={speedBonus}
              accentClass="text-teal-600"
              onCompleteLevel={onCompleteLevel}
              onRestart={startGame}
              onBackToMap={onBackToMap}
            />
          )}

          <CoachOverlay
            containerRef={containerRef}
            active={guideMode === 'manual' || (showGuide && gameState === 'playing')}
            mode={guideMode || 'spotlight'}
            onDismiss={dismissGuide}
            steps={[
              {
                target: 'lv9-card',
                text: '拖曳角度卡到對應象限，或直接點擊象限',
                shape: 'ellipse',
                pad: 10,
                tap: false
              },
              {
                target: 'lv9-board',
                text: '正角逆時針、負角順時針判斷終邊位置',
                shape: 'rect',
                pad: 4,
                tap: false
              }
            ]}
          />
        </div>
      );
    };

    // ==================== 第 8 關組件：動徑星標 ====================
    const Level6VectorCompassMaster = ({ currentStars, onUpdateStars, onCompleteLevel, onBackToMap, hasSeenGuide = false, onMarkGuideSeen }) => {
      const { isRelaxMode } = React.useContext(GameModeContext);
      const starsThreshold = [2, 4, 6];
      const maxLives = 3;
      const healTarget = 2;
      const {
        gameState, progress, lives, healStreak, correctCount, wrongCount, elapsedSec,
        earnedStars, baseScore, lifeBonus, accuracyBonus, speedBonus, finalScore,
        startSession, recordCorrect, recordWrong, finishNow
      } = useLivesLevelSession({ starThresholds: starsThreshold, maxLives, healTarget, currentStars, onUpdateStars });

      const [pickOrder, setPickOrder] = useState('num');
      const [question, setQuestion] = useState(null);
      const [stage, setStage] = useState('drag'); // 'drag' | 'pickR' | 'ratio'
      const [curP, setCurP] = useState({ x: 0, y: 0 });
      const [isDraggingP, setIsDraggingP] = useState(false);
      const [dragCoordChip, setDragCoordChip] = useState(null); // { clientX, clientY, overGrid }
      const [dragRChip, setDragRChip] = useState(null); // { opt, startX, startY, clientX, clientY, moved, overDrop }
      const [dragRatioKey, setDragRatioKey] = useState(null); // { key, startX, startY, clientX, clientY, moved, hoverSlot }
      const [selectedNumerator, setSelectedNumerator] = useState(null);
      const [selectedDenominator, setSelectedDenominator] = useState(null);
      const [feedbackAnim, setFeedbackAnim] = useState('');
      const [floatingText, setFloatingText] = useState(null);
      const [isLockedSuccess, setIsLockedSuccess] = useState(false);
      const [wrongBtnKey, setWrongBtnKey] = useState(null);
      const [conceptTip, setConceptTip] = useState(null);

      // 分段接力實機引導（Just-in-Time：依序在 drag / ratio / pickR 首次出現時演示）
      const { showGuide, guideMode, openGuide, dismissGuide } = useStagedLevelGuide({
        currentStars,
        hasSeenGuide,
        onMarkGuideSeen,
        activeStageKey: question ? stage : null,
        phase: question ? question.phase : 0,
        enabled: gameState === 'playing',
        finalStageKey: 'pickR'
      });

      const containerRef = useRef(null);
      const svgRef = useRef(null);
      const rDropRef = useRef(null);
      const numSlotRef = useRef(null);
      const denSlotRef = useRef(null);
      const questionMissedRef = useRef(false);
      const justSolvedAtRef = useRef(0);
      const bagRef = useRef({ groupBag: [], funcBag: [], p0QuadBag: [], quadBag: [], lastGroup: null, lastFunc: null, lastQuad: null });
      const [rSnapFlash, setRSnapFlash] = useState(false);
      const confirmTimerRef = useRef(null);
      const pendingNextRef = useRef(null);
      const handleConfirmSkip = () => {
        if (!pendingNextRef.current) return;
        if (Date.now() - justSolvedAtRef.current < 260) return;
        clearTimeout(confirmTimerRef.current);
        const fn = pendingNextRef.current;
        pendingNextRef.current = null;
        audio.sfxClick();
        fn();
      };
      useEffect(() => () => clearTimeout(confirmTimerRef.current), []);

      const triggerFloat = (text, color) => {
        const id = Date.now();
        setFloatingText({ text, color, id });
        setTimeout(() => setFloatingText(prev => prev?.id === id ? null : prev), 800);
      };

      const nextQuestion = (curProg) => {
        const phase = curProg >= starsThreshold[1] ? 2 : curProg >= starsThreshold[0] ? 1 : 0;
        const isLastOfP1 = phase === 1 && curProg === starsThreshold[1] - 1;
        const nextQ = generateLevel6Question(phase, bagRef.current, isLastOfP1);
        questionMissedRef.current = false;
        setQuestion(nextQ);
        setStage('drag');
        setCurP({ x: 0, y: 0 });
        setIsDraggingP(false);
        setDragCoordChip(null);
        setDragRChip(null);
        setDragRatioKey(null);
        setRSnapFlash(false);
        setSelectedNumerator(null);
        setSelectedDenominator(null);
        setWrongBtnKey(null);
        setConceptTip(null);
      };

      const startGame = (order = pickOrder) => {
        setPickOrder(order);
        questionMissedRef.current = false;
        bagRef.current = { groupBag: [], funcBag: [], p0QuadBag: [], quadBag: [], lastGroup: null, lastFunc: null, lastQuad: null };
        setFeedbackAnim('');
        setSelectedNumerator(null); setSelectedDenominator(null);
        setIsLockedSuccess(false); setWrongBtnKey(null); setConceptTip(null);
        setDragCoordChip(null); setDragRChip(null); setDragRatioKey(null);
        setRSnapFlash(false);
        const initProg = startSession();
        nextQuestion(initProg);
        audio.init();
      };

      useEffect(() => { startGame('num'); }, []);

      const triggerQuestionSuccess = () => {
        if (showGuide) dismissGuide(false);
        justSolvedAtRef.current = Date.now();
        audio.sfxBonus();
        setIsLockedSuccess(true);
        setFeedbackAnim('animate-correct');
        const { completed, nextProgress } = recordCorrect({ wasMissed: questionMissedRef.current, delayEndMs: null });
        setConceptTip({
          tone: 'success',
          canSkip: true,
          skipLabel: completed ? '輕點查看結算 ▸' : '輕點繼續 ▸',
          text: completed ? '全關挑戰完成！' : '定義正確！',
          id: Date.now()
        });
        pendingNextRef.current = () => {
          pendingNextRef.current = null;
          setIsLockedSuccess(false);
          setFeedbackAnim('');
          if (completed) {
            finishNow();
          } else {
            nextQuestion(nextProgress);
          }
        };
      };

      const applyQuestionPenalty = (delayEndMs = 480) => {
        if (questionMissedRef.current) return false;
        questionMissedRef.current = true;
        return recordWrong({ delayEndMs }).gameOver;
      };

      const handlePickR = (opt) => {
        if (gameState !== 'playing' || !question || stage !== 'pickR' || isLockedSuccess || (!isRelaxMode && lives <= 0)) return;
        if (showGuide) dismissGuide(false);
        if (opt.isCorrect) {
          audio.sfxSelect();
          setConceptTip(null);
          setWrongBtnKey(null);
          setRSnapFlash(true);
          setTimeout(() => setRSnapFlash(false), 480);
          setStage('ratio');
        } else {
          audio.sfxError();
          const gameOver = applyQuestionPenalty(450);
          setWrongBtnKey(opt.label);
          setConceptTip({
            text: `動徑恆正：r = √(x² + y²) = √(${question.xVal * question.xVal} + ${question.yVal * question.yVal})`,
            id: Date.now()
          });
          setFeedbackAnim('animate-shake');
          if (!gameOver) {
            setTimeout(() => { setFeedbackAnim(''); setWrongBtnKey(null); }, 380);
          }
        }
      };

      const evaluateRatioPair = (numKey, denKey) => {
        if (numKey === question.correctNumeratorKey && denKey === question.correctDenominatorKey) {
          triggerQuestionSuccess('定義正確!');
        } else {
          audio.sfxError();
          const gameOver = applyQuestionPenalty(480);
          setWrongBtnKey(denKey);
          setConceptTip({ text: question.conceptTip, id: Date.now() });
          setFeedbackAnim('animate-shake');
          if (!gameOver) {
            setTimeout(() => { setFeedbackAnim(''); setSelectedNumerator(null); setSelectedDenominator(null); setWrongBtnKey(null); }, 400);
          }
        }
      };

      const handleDropRatioSlot = (key, slot) => {
        if (gameState !== 'playing' || !question || stage !== 'ratio' || isLockedSuccess || (!isRelaxMode && lives <= 0)) return;
        if (showGuide) dismissGuide(false);
        const nextNum = slot === 'num' ? key : selectedNumerator;
        const nextDen = slot === 'den' ? key : selectedDenominator;
        audio.sfxSelect();
        setSelectedNumerator(nextNum);
        setSelectedDenominator(nextDen);
        if (nextNum && nextDen) {
          evaluateRatioPair(nextNum, nextDen);
        }
      };

      const handleInputKey = (key) => {
        if (gameState !== 'playing' || !question || stage !== 'ratio' || isLockedSuccess || (!isRelaxMode && lives <= 0)) return;
        if (showGuide) dismissGuide(false);
        const firstKey = pickOrder === 'num' ? selectedNumerator : selectedDenominator;
        if (!firstKey) {
          audio.sfxSelect();
          if (pickOrder === 'num') setSelectedNumerator(key);
          else setSelectedDenominator(key);
        } else if (firstKey === key) {
          audio.sfxClick();
          setSelectedNumerator(null);
          setSelectedDenominator(null);
        } else {
          const numKey = pickOrder === 'num' ? firstKey : key;
          const denKey = pickOrder === 'num' ? key : firstKey;
          setSelectedNumerator(numKey);
          setSelectedDenominator(denKey);
          evaluateRatioPair(numKey, denKey);
        }
      };

      const maxCoord = question ? Math.max(Math.abs(question.xVal), Math.abs(question.yVal)) : 4;
      const gridRange = maxCoord <= 3 ? 4 : 5;
      const GRID_STEP = maxCoord <= 3 ? 52 : 42;
      const GRID_ORIGIN = 270;
      const gridExtent = gridRange * GRID_STEP;
      const gridTicks = Array.from({ length: gridRange * 2 + 1 }, (_, idx) => idx - gridRange);
      const toSvgPt = (gx, gy) => ({ x: GRID_ORIGIN + gx * GRID_STEP, y: GRID_ORIGIN - gy * GRID_STEP });

      const getGridFromPointer = (clientX, clientY, requireInside = false) => {
        const el = svgRef.current;
        if (!el) return null;
        const rect = el.getBoundingClientRect();
        if (!rect.width || !rect.height) return null;
        if (requireInside && (clientX < rect.left || clientX > rect.right || clientY < rect.top || clientY > rect.bottom)) {
          return null;
        }
        const size = Math.min(rect.width, rect.height);
        const left = rect.left + (rect.width - size) / 2;
        const top = rect.top + (rect.height - size) / 2;
        const vx = ((clientX - left) / size) * 540;
        const vy = ((clientY - top) / size) * 540;
        const gx = Math.max(-gridRange, Math.min(gridRange, Math.round((vx - GRID_ORIGIN) / GRID_STEP)));
        const gy = Math.max(-gridRange, Math.min(gridRange, Math.round((GRID_ORIGIN - vy) / GRID_STEP)));
        return { x: gx, y: gy };
      };

      const commitGridP = (pt) => {
        if (!question || !pt) return;
        if (pt.x === question.xVal && pt.y === question.yVal) {
          if (showGuide) dismissGuide(false);
          audio.sfxSelect();
          setConceptTip(null);
          setStage(question.phase >= 1 ? 'pickR' : 'ratio');
        } else if (pt.x !== 0 || pt.y !== 0) {
          if (question.phase >= 1) {
            audio.sfxError();
            const gameOver = applyQuestionPenalty(420);
            setFeedbackAnim('animate-shake');
            if (!gameOver) setTimeout(() => setFeedbackAnim(''), 340);
          }
          setConceptTip({
            text: `目標在 (${question.xVal}, ${question.yVal})，目前停在 (${pt.x}, ${pt.y})`,
            id: Date.now()
          });
        }
      };

      const handleGridPointerDown = (e) => {
        if (isLockedSuccess) {
          handleConfirmSkip();
          return;
        }
        if (gameState !== 'playing' || !question || stage !== 'drag' || (!isRelaxMode && lives <= 0)) return;
        const offsetY = e.pointerType === 'touch' ? 42 : 0;
        const pt = getGridFromPointer(e.clientX, e.clientY - offsetY);
        if (!pt) return;
        setIsDraggingP(true);
        setCurP(pt);
        if (e.currentTarget.setPointerCapture) {
          try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
        }
      };

      const handleGridPointerMove = (e) => {
        if (!isDraggingP || isLockedSuccess || stage !== 'drag') return;
        const offsetY = e.pointerType === 'touch' ? 42 : 0;
        const pt = getGridFromPointer(e.clientX, e.clientY - offsetY);
        if (!pt) return;
        if (pt.x !== curP.x || pt.y !== curP.y) {
          setCurP(pt);
        }
      };

      const handleGridPointerUp = (e) => {
        if (!isDraggingP) return;
        setIsDraggingP(false);
        if (e.currentTarget.releasePointerCapture) {
          try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (_) {}
        }
        if (!question || isLockedSuccess || stage !== 'drag') return;
        commitGridP(curP);
      };

      // 從頂部題目坐標膠囊直接拖曳進網格（觸控自動往上偏移 46px 避開手指遮擋）
      const handleCoordChipDown = (e) => {
        if (gameState !== 'playing' || !question || stage !== 'drag' || isLockedSuccess || (!isRelaxMode && lives <= 0)) return;
        e.preventDefault();
        if (showGuide) dismissGuide(false);
        audio.init();
        const touchOffsetY = e.pointerType === 'touch' ? 46 : 0;
        const startPt = getGridFromPointer(e.clientX, e.clientY - touchOffsetY, true);
        if (startPt) setCurP(startPt);
        setDragCoordChip({ clientX: e.clientX, clientY: e.clientY, touchOffsetY, overGrid: Boolean(startPt) });
      };

      useEffect(() => {
        if (!dragCoordChip) return;
        const onMove = (e) => {
          const offsetY = e.pointerType === 'touch' ? 46 : dragCoordChip.touchOffsetY || 0;
          const pt = getGridFromPointer(e.clientX, e.clientY - offsetY, true);
          if (pt) setCurP(pt);
          setDragCoordChip({ clientX: e.clientX, clientY: e.clientY, touchOffsetY: offsetY, overGrid: Boolean(pt) });
        };
        const onUp = (e) => {
          const offsetY = e.pointerType === 'touch' ? 46 : dragCoordChip.touchOffsetY || 0;
          const pt = getGridFromPointer(e.clientX, e.clientY - offsetY, true);
          setDragCoordChip(null);
          if (pt) {
            setCurP(pt);
            commitGridP(pt);
          }
        };
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
        window.addEventListener('pointercancel', onUp);
        return () => {
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
          window.removeEventListener('pointercancel', onUp);
        };
      }, [dragCoordChip, question, stage, isLockedSuccess]);

      // Phase 1/2：拖曳動徑 r 膠囊貼到動徑 r = ? 定點（亦支援點擊）
      const isOverRDrop = (clientX, clientY) => {
        const el = rDropRef.current;
        if (!el) return false;
        const r = el.getBoundingClientRect();
        const cx = r.left + r.width / 2;
        const cy = r.top + r.height / 2;
        return Math.hypot(clientX - cx, clientY - cy) <= 68;
      };

      const handleRChipDown = (e, opt) => {
        if (gameState !== 'playing' || !question || stage !== 'pickR' || isLockedSuccess || (!isRelaxMode && lives <= 0)) return;
        e.preventDefault();
        audio.init();
        setDragRChip({
          opt,
          startX: e.clientX,
          startY: e.clientY,
          clientX: e.clientX,
          clientY: e.clientY,
          moved: false,
          overDrop: isOverRDrop(e.clientX, e.clientY)
        });
      };

      useEffect(() => {
        if (!dragRChip) return;
        const onMove = (e) => {
          const dist = Math.hypot(e.clientX - dragRChip.startX, e.clientY - dragRChip.startY);
          const moved = dragRChip.moved || dist >= 8;
          setDragRChip(prev => prev ? {
            ...prev,
            clientX: e.clientX,
            clientY: e.clientY,
            moved,
            overDrop: isOverRDrop(e.clientX, e.clientY)
          } : null);
        };
        const onUp = (e) => {
          const cur = dragRChip;
          setDragRChip(null);
          if (!cur) return;
          if (!cur.moved || isOverRDrop(e.clientX, e.clientY)) {
            handlePickR(cur.opt);
          }
        };
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
        window.addEventListener('pointercancel', onUp);
        return () => {
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
          window.removeEventListener('pointercancel', onUp);
        };
      }, [dragRChip, question, stage, isLockedSuccess]);

      // 第 2 步（ratio）：支援從圖上 x / y / r 標籤拖曳放進分子／分母框，亦支援點擊快填
      const findRatioSlot = (clientX, clientY) => {
        const hit = (el) => {
          if (!el) return false;
          const r = el.getBoundingClientRect();
          return clientX >= r.left - 18 && clientX <= r.right + 18 && clientY >= r.top - 14 && clientY <= r.bottom + 14;
        };
        if (hit(numSlotRef.current)) return 'num';
        if (hit(denSlotRef.current)) return 'den';
        return null;
      };

      const handleTagPointerDown = (e, key) => {
        if (gameState !== 'playing' || !question || stage !== 'ratio' || isLockedSuccess || (!isRelaxMode && lives <= 0)) return;
        e.preventDefault();
        e.stopPropagation();
        audio.init();
        setDragRatioKey({
          key,
          startX: e.clientX,
          startY: e.clientY,
          clientX: e.clientX,
          clientY: e.clientY,
          moved: false,
          hoverSlot: findRatioSlot(e.clientX, e.clientY)
        });
      };

      useEffect(() => {
        if (!dragRatioKey) return;
        const onMove = (e) => {
          const dist = Math.hypot(e.clientX - dragRatioKey.startX, e.clientY - dragRatioKey.startY);
          const moved = dragRatioKey.moved || dist >= 8;
          setDragRatioKey(prev => prev ? {
            ...prev,
            clientX: e.clientX,
            clientY: e.clientY,
            moved,
            hoverSlot: findRatioSlot(e.clientX, e.clientY)
          } : null);
        };
        const onUp = (e) => {
          const cur = dragRatioKey;
          setDragRatioKey(null);
          if (!cur) return;
          if (!cur.moved) {
            handleInputKey(cur.key);
          } else {
            const slot = findRatioSlot(e.clientX, e.clientY);
            if (slot) handleDropRatioSlot(cur.key, slot);
          }
        };
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
        window.addEventListener('pointercancel', onUp);
        return () => {
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
          window.removeEventListener('pointercancel', onUp);
        };
      }, [dragRatioKey, question, stage, isLockedSuccess, selectedNumerator, selectedDenominator, pickOrder]);

      const getDisplayVal = (key) => !question ? '' : key === 'x' ? question.xVal : key === 'y' ? question.yVal : question.rVal;
      const isLv7NumTurn = (pickOrder === 'num' && !selectedNumerator) || (pickOrder === 'den' && selectedDenominator && !selectedNumerator);
      const isLv7DenTurn = (pickOrder === 'den' && !selectedDenominator) || (pickOrder === 'num' && selectedNumerator && !selectedDenominator);

      const pLocked = stage !== 'drag';
      const activeCoord = stage === 'drag' ? curP : { x: question?.xVal ?? 0, y: question?.yVal ?? 0 };
      const hasVector = activeCoord.x !== 0 || activeCoord.y !== 0;
      const svgP = toSvgPt(activeCoord.x, activeCoord.y);
      const svgFootX = { x: svgP.x, y: GRID_ORIGIN };
      const svgFootY = { x: GRID_ORIGIN, y: svgP.y };
      const curR2 = activeCoord.x * activeCoord.x + activeCoord.y * activeCoord.y;
      const curRInt = Math.round(Math.sqrt(curR2));
      const curRLabel = stage === 'pickR' ? '?' : (pLocked && question?.rVal ? question.rVal : (curRInt * curRInt === curR2 ? String(curRInt) : `√${curR2}`));
      let thetaRad = hasVector ? Math.atan2(activeCoord.y, activeCoord.x) : 0;
      if (thetaRad < 0 && hasVector) thetaRad += Math.PI * 2;
      const isPosXAxis = hasVector && activeCoord.x > 0 && activeCoord.y === 0;
      const rPxLen = Math.hypot(svgP.x - GRID_ORIGIN, svgP.y - GRID_ORIGIN);
      const arcR = Math.min(34, Math.max(18, rPxLen * 0.26));
      const arcEnd = { x: GRID_ORIGIN + arcR * Math.cos(thetaRad), y: GRID_ORIGIN - arcR * Math.sin(thetaRad) };
      const largeArc = thetaRad > Math.PI ? 1 : 0;
      const angleArcPath = (hasVector && !isPosXAxis) ? `M ${GRID_ORIGIN + arcR} ${GRID_ORIGIN} A ${arcR} ${arcR} 0 ${largeArc} 0 ${arcEnd.x} ${arcEnd.y}` : '';
      const angleSectorPath = (hasVector && !isPosXAxis) ? `M ${GRID_ORIGIN} ${GRID_ORIGIN} L ${GRID_ORIGIN + arcR} ${GRID_ORIGIN} A ${arcR} ${arcR} 0 ${largeArc} 0 ${arcEnd.x} ${arcEnd.y} Z` : '';
      const thetaLabelPt = hasVector ? (
        isPosXAxis
          ? { x: GRID_ORIGIN + arcR + 8, y: GRID_ORIGIN - 14 }
          : { x: GRID_ORIGIN + (arcR + 14) * Math.cos(thetaRad / 2), y: GRID_ORIGIN - (arcR + 14) * Math.sin(thetaRad / 2) }
      ) : null;
      const isPureSym = Boolean(question && question.phase === 2 && !isLockedSuccess);
      const isSuccessKey = (k) => Boolean(isLockedSuccess && question && (question.correctNumeratorKey === k || question.correctDenominatorKey === k));
      const simplifiedVal = useMemo(() => {
        if (!question) return null;
        const { xVal, yVal, rVal, correctNumeratorKey, correctDenominatorKey } = question;
        const num = correctNumeratorKey === 'x' ? xVal : yVal;
        if (correctDenominatorKey === 'r') {
          if (num === 0) return '0';
          if (question.isAxis) return num > 0 ? '1' : '-1';
          if (Math.abs(xVal) === Math.abs(yVal) && rVal.includes('√2')) {
            return num < 0 ? '-√2/2' : '√2/2';
          }
          return `${num}/${rVal}`;
        }
        // tan = y / x
        if (yVal === 0) return '0';
        const gcd = (a, b) => (b === 0 ? a : gcd(b, a % b));
        const ay = Math.abs(yVal), ax = Math.abs(xVal);
        const g = gcd(ay, ax);
        const neg = (yVal * xVal) < 0;
        const sn = ay / g, sd = ax / g;
        return sd === 1 ? `${neg ? '-' : ''}${sn}` : `${neg ? '-' : ''}${sn}/${sd}`;
      }, [question]);
      const targetSvgP = question ? toSvgPt(question.xVal, question.yVal) : null;
      const showTargetRing = stage === 'drag' && question && question.phase === 0;
      // P(x, y) 膠囊永遠朝遠離原點的外側偏移並夾在畫板邊界內
      const pTagOffsetX = activeCoord.x >= 0 ? 52 : -52;
      const pTagOffsetY = activeCoord.y >= 0 ? -32 : 32;
      const pTagX = Math.max(54, Math.min(486, svgP.x + pTagOffsetX));
      const pTagY = Math.max(26, Math.min(514, svgP.y + pTagOffsetY));

      return (
        <div ref={containerRef} className="w-full h-full flex-1 flex flex-col justify-between pt-0.5 pb-1 relative animate-jelly min-h-0">

          {gameState === 'idle' && (
            <div className="flex-1 my-3 bg-white/95 rounded-3xl border-4 border-indigo-950 p-5 shadow-2xl flex flex-col justify-between text-center items-center">
              <div className="w-full space-y-2.5 pt-2">
                <div className="w-20 h-20 mx-auto rounded-3xl bg-cyan-100 border-4 border-cyan-500 flex items-center justify-center text-4xl shadow-inner animate-bounce">🎯</div>
                <h2 className="text-2xl font-black text-indigo-950 tracking-wide">坐標網格建築師</h2>
                <p className="text-xs text-slate-500 font-bold leading-relaxed max-w-xs mx-auto">
                  在坐標網格上拖曳藍點 <span className="text-cyan-600 font-black">P(x, y)</span> 建構直角三角形，推導動徑 <span className="text-amber-600 font-black">r</span> 與廣義角三角比！
                </p>
                <div className="text-xs font-black text-cyan-700 bg-cyan-50 border border-cyan-200 rounded-full px-3 py-1 inline-block">x · y · r</div>
              </div>
              <CompactStarPills starsThreshold={starsThreshold} livesMode maxLives={maxLives} />
              <div className="w-full space-y-2">
                <FractionOrderButtons onStartWithOrder={startGame} />
                <button onClick={onBackToMap} className="w-full py-2 text-xs font-bold text-slate-400 hover:text-slate-600">返回聖域地圖</button>
              </div>
            </div>
          )}

          {gameState === 'playing' && question && (
            <div className={`flex-1 min-h-0 flex flex-col justify-between gap-2 overflow-hidden pb-0.5 ${feedbackAnim}`}>
              <GameHUD
                progress={progress}
                starsThreshold={starsThreshold}
                lives={lives}
                maxLives={maxLives}
                healStreak={healStreak}
                healTarget={healTarget}
                onManualEnd={finishNow}
                onOpenGuide={openGuide}
              />

              <div className={`flex-1 min-h-0 bg-white rounded-3xl border-3 border-indigo-950 shadow-xl flex flex-col overflow-hidden transition-all duration-150 ${isLockedSuccess ? 'ring-4 ring-emerald-400/75' : ''}`}>
                <StagePhaseStrip phase={progress >= starsThreshold[1] ? 2 : progress >= starsThreshold[0] ? 1 : 0} labels={['拖點建構 P(x,y) → 填比值', '無瞄準圈定位 → 拖 r 貼定點', '無瞄準圈＋純符號 x/y/r → 定義盲測']} />
                <div data-coach="lv10-prompt" className="bg-gradient-to-r from-cyan-600 to-indigo-700 h-[66px] px-3.5 flex justify-between items-center text-white border-b-2 border-indigo-900 shrink-0">
                  {stage === 'drag' && (
                    <div className="flex items-center gap-2">
                      <span className="text-sm sm:text-base font-black">拖曳坐標</span>
                      <button
                        type="button"
                        data-coach="lv10-coord-chip"
                        onPointerDown={handleCoordChipDown}
                        className={`bg-slate-900/90 border-2 border-cyan-300 px-3 py-0.5 rounded-xl font-mono font-black text-sm text-cyan-200 shadow-[0_3px_10px_rgba(34,211,238,0.35)] cursor-grab active:cursor-grabbing active:scale-95 touch-none select-none transition-transform ${dragCoordChip ? 'opacity-45 scale-95' : 'hover:scale-105'}`}
                      >
                        ({question.xVal}, {question.yVal})
                      </button>
                      <span className="text-xs font-bold text-cyan-100/90 hidden sm:inline">進網格 → 求 {question.targetFunc}(θ)</span>
                    </div>
                  )}
                  {stage === 'pickR' && (
                    <div className="flex items-center gap-2">
                      <span className="text-sm sm:text-base font-black">已知 P({question.xVal}, {question.yVal})，將</span>
                      <span className="bg-amber-400 text-amber-950 px-2.5 py-0.5 rounded-xl font-mono font-black text-sm">r = ?</span>
                      <span className="text-xs font-bold text-cyan-100/90 hidden sm:inline">拖到動徑上</span>
                    </div>
                  )}
                  {stage === 'ratio' && (
                    <div className="flex items-center gap-1.5 min-w-0">
                      <span className="text-base sm:text-xl font-serif font-black shrink-0">{question.targetFunc}(θ) =</span>
                      <div data-coach="lv10-ratio-box" className="flex flex-col items-center shrink-0">
                        <div
                          ref={numSlotRef}
                          onClick={() => { if (selectedNumerator && !isLockedSuccess) { audio.sfxClick(); setSelectedNumerator(null); } }}
                          className={`min-w-[58px] px-2 h-6 rounded-lg border-2 flex items-center justify-center font-bold text-xs transition-all ${
                            dragRatioKey?.hoverSlot === 'num'
                              ? 'border-emerald-300 bg-emerald-400/50 text-white scale-110 shadow-[0_0_12px_rgba(52,211,153,0.8)]'
                              : selectedNumerator
                              ? 'bg-emerald-400 border-emerald-200 text-emerald-950 font-black cursor-pointer active:scale-95'
                              : isLv7NumTurn
                              ? 'border-amber-300 bg-amber-400/30 text-amber-100 animate-pulse shadow-[0_0_10px_rgba(251,191,36,0.6)]'
                              : 'border-dashed border-white/40 text-cyan-100/70 bg-white/5'
                          }`}
                        >
                          <span>{selectedNumerator ? (isPureSym ? selectedNumerator : <SqrtText text={`${selectedNumerator} (${getDisplayVal(selectedNumerator)})`} />) : '分子'}</span>
                        </div>
                        <div className="w-full h-0.5 bg-white/70 my-0.5"></div>
                        <div
                          ref={denSlotRef}
                          onClick={() => { if (selectedDenominator && !isLockedSuccess) { audio.sfxClick(); setSelectedDenominator(null); } }}
                          className={`min-w-[58px] px-2 h-6 rounded-lg border-2 flex items-center justify-center font-bold text-xs transition-all ${
                            dragRatioKey?.hoverSlot === 'den'
                              ? 'border-amber-300 bg-amber-400/50 text-white scale-110 shadow-[0_0_12px_rgba(251,191,36,0.8)]'
                              : selectedDenominator
                              ? 'bg-amber-400 border-amber-200 text-amber-950 font-black cursor-pointer active:scale-95'
                              : isLv7DenTurn
                              ? 'border-amber-300 bg-amber-400/30 text-amber-100 animate-pulse shadow-[0_0_10px_rgba(251,191,36,0.6)]'
                              : 'border-dashed border-white/40 text-cyan-100/70 bg-white/5'
                          }`}
                        >
                          <span>{selectedDenominator ? (isPureSym ? selectedDenominator : <SqrtText text={`${selectedDenominator} (${getDisplayVal(selectedDenominator)})`} />) : '分母'}</span>
                        </div>
                      </div>
                      {isLockedSuccess && simplifiedVal && (
                        <div className="inline-flex items-center gap-1.5 text-amber-200 font-black animate-jelly shrink-0">
                          <span className="text-base sm:text-lg">=</span>
                          <FracText value={simplifiedVal} size="xs" barClass="bg-amber-200" className="text-amber-200" />
                        </div>
                      )}
                      <SuccessBadge show={isLockedSuccess} />
                    </div>
                  )}
                  <span className="text-xs font-black bg-white/20 px-2.5 py-1 rounded-xl border border-white/40 whitespace-nowrap">
                    {question.quad === 0 ? '坐標軸上' : `第 ${['I', 'II', 'III', 'IV'][question.quad - 1]} 象限`}
                  </span>
                </div>

                <div onClick={handleConfirmSkip} className="relative w-full flex-1 min-h-0 bg-white flex items-center justify-center overflow-hidden">
                  <HintBanner tip={conceptTip} />
                  <svg
                    ref={svgRef}
                    data-coach="lv10-tri"
                    viewBox="0 0 540 540"
                    preserveAspectRatio="xMidYMid meet"
                    onPointerDown={handleGridPointerDown}
                    onPointerMove={handleGridPointerMove}
                    onPointerUp={handleGridPointerUp}
                    onPointerCancel={handleGridPointerUp}
                    className="w-full h-full object-contain select-none touch-none cursor-crosshair"
                  >
                    {/* 動態縮放整數格線 */}
                    {gridTicks.map(i => (
                      <React.Fragment key={i}>
                        <line x1={GRID_ORIGIN + i * GRID_STEP} y1={GRID_ORIGIN - gridExtent} x2={GRID_ORIGIN + i * GRID_STEP} y2={GRID_ORIGIN + gridExtent} stroke={i === 0 ? '#64748b' : '#e2e8f0'} strokeWidth={i === 0 ? '2.5' : '1.2'} />
                        <line x1={GRID_ORIGIN - gridExtent} y1={GRID_ORIGIN - i * GRID_STEP} x2={GRID_ORIGIN + gridExtent} y2={GRID_ORIGIN - i * GRID_STEP} stroke={i === 0 ? '#64748b' : '#e2e8f0'} strokeWidth={i === 0 ? '2.5' : '1.2'} />
                        {i !== 0 && (
                          <>
                            <text x={GRID_ORIGIN + i * GRID_STEP} y={GRID_ORIGIN + 15} fill={(isDraggingP || dragCoordChip?.overGrid) && curP.x === i ? '#0284c7' : '#94a3b8'} fontSize={(isDraggingP || dragCoordChip?.overGrid) && curP.x === i ? '14' : '11.5'} fontWeight="bold" textAnchor="middle">{i}</text>
                            <text x={GRID_ORIGIN - 13} y={GRID_ORIGIN - i * GRID_STEP + 4} fill={(isDraggingP || dragCoordChip?.overGrid) && curP.y === i ? '#0284c7' : '#94a3b8'} fontSize={(isDraggingP || dragCoordChip?.overGrid) && curP.y === i ? '14' : '11.5'} fontWeight="bold" textAnchor="end">{i}</text>
                          </>
                        )}
                      </React.Fragment>
                    ))}
                    <text x={GRID_ORIGIN + gridExtent + 14} y={GRID_ORIGIN + 5} fill="#64748b" fontSize="20" fontWeight="bold">x</text>
                    <text x={GRID_ORIGIN + 6} y={GRID_ORIGIN - gridExtent - 12} fill="#64748b" fontSize="20" fontWeight="bold">y</text>

                    {/* 拖曳對位十字準線（手機觸控防指腹遮擋輔助） */}
                    {(isDraggingP || dragCoordChip?.overGrid) && stage === 'drag' && (
                      <g className="pointer-events-none">
                        <line x1={svgP.x} y1={GRID_ORIGIN - gridExtent} x2={svgP.x} y2={GRID_ORIGIN + gridExtent} stroke="#38bdf8" strokeWidth="1.8" strokeDasharray="4 4" opacity="0.7" />
                        <line x1={GRID_ORIGIN - gridExtent} y1={svgP.y} x2={GRID_ORIGIN + gridExtent} y2={svgP.y} stroke="#38bdf8" strokeWidth="1.8" strokeDasharray="4 4" opacity="0.7" />
                      </g>
                    )}

                    {/* Phase 0 目標瞄準圈（Phase 1/2 隱藏） */}
                    {showTargetRing && targetSvgP && (
                      <g data-coach="lv10-target-dot" className="pointer-events-none">
                        <circle cx={targetSvgP.x} cy={targetSvgP.y} r="22" fill="rgba(16, 185, 129, 0.14)" stroke="#10b981" strokeWidth="2.5" strokeDasharray="5 4" />
                        <circle cx={targetSvgP.x} cy={targetSvgP.y} r="6" fill="#10b981" opacity="0.7" />
                      </g>
                    )}

                    {/* 始邊 (正向 x 軸) */}
                    <line x1={GRID_ORIGIN} y1={GRID_ORIGIN} x2={GRID_ORIGIN + gridExtent} y2={GRID_ORIGIN} stroke="#ef4444" strokeWidth="5" strokeLinecap="round" opacity="0.55" />

                    {/* 拖曳階段僅顯示細導引線，避免突然長出全部標籤；鎖定後才柔和生長出直角三角形 */}
                    {hasVector && !pLocked && (
                      <line x1={GRID_ORIGIN} y1={GRID_ORIGIN} x2={svgP.x} y2={svgP.y} stroke="#38bdf8" strokeWidth="3" strokeDasharray="6 5" strokeLinecap="round" opacity="0.85" />
                    )}

                    {hasVector && pLocked && (
                      <g key={question.key}>
                        <g className="animate-lv10-fade" style={{ animationDelay: '100ms' }}>

                            return (
                              <g>
                                <text x={prefixX} y="1" fill={fg} fontSize="14" fontWeight="900" textAnchor="middle" dominantBaseline="middle">r={coef}</text>
                                <path d={`M ${tickOffset} 1.5 L ${tickOffset + 2.2} 0 L ${tickOffset + 4.6} 6.5 L ${tickOffset + 8.8} -6.5 L ${lineEnd} -6.5`} fill="none" stroke={fg} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" />
                                <text x={radX} y="2" fill={fg} fontSize="13.5" fontWeight="900" textAnchor="middle" dominantBaseline="middle">{rad}</text>
                              </g>
                            );
                          })() : (
                            <text x="0" y="1" fill={isSuccessKey('r') || rSnapFlash ? '#ffffff' : '#b45309'} fontSize="14.5" fontWeight="900" textAnchor="middle" dominantBaseline="middle">
                              {stage === 'pickR' ? 'r = ?' : `r=${curRLabel}`}

                        {/* x 標籤 */}
                        <g
                          data-coach="lv10-demo-tag"

                          style={{ animationDelay: '200ms' }}
                          onPointerDown={(e) => handleTagPointerDown(e, 'x')}
                        >
                          <rect x={isPureSym ? '-19' : '-30'} y="-13" width={isPureSym ? '38' : '60'} height="26" fill={isSuccessKey('x') ? '#10b981' : 'white'} stroke={isSuccessKey('x') ? '#059669' : '#2563eb'} strokeWidth={isSuccessKey('x') ? '3.5' : '2.5'} rx="9" />
                          <text x="0" y="1" fill={isSuccessKey('x') ? '#ffffff' : '#1d4ed8'} fontSize={isPureSym ? '16' : '14.5'} fontWeight="900" fontFamily={isPureSym ? 'serif' : undefined} fontStyle={isPureSym ? 'italic' : undefined} textAnchor="middle" dominantBaseline="middle">{isPureSym ? 'x' : `x=${activeCoord.x}`}</text>
                        </g>

                        {/* y 標籤 */}
                        <g
                          transform={`translate(${GRID_ORIGIN + (activeCoord.x >= 0 ? -36 : 36)}, ${svgFootY.y})`}

                    {/* 藍點 P（外側避讓膠囊） */}
                    <g transform={`translate(${svgP.x}, ${svgP.y})`}>
                      {stage === 'drag' && !isDraggingP && !dragCoordChip && (

                    <g transform={`translate(${pTagX}, ${pTagY})`} className="pointer-events-none">
                      <rect x="-46" y="-14" width="92" height="28" fill="#0f172a" rx="10" stroke="#38bdf8" strokeWidth="2" />

              </div>

          )}

          {/* 跟隨指標的浮動拖曳膠囊（使用 Portal 掛載於 body，避免外層 animate-jelly transform 造成 fixed 座標偏移） */}
          {typeof document !== 'undefined' && ReactDOM.createPortal(
            <>
              {dragCoordChip && question && (
                <div
                  className="fixed z-[150] pointer-events-none -translate-x-1/2 -translate-y-1/2 px-3 py-1 rounded-xl bg-slate-900/95 border-2 border-cyan-300 text-cyan-200 font-mono font-black text-sm shadow-2xl"
                  style={{ left: dragCoordChip.clientX, top: dragCoordChip.clientY - (dragCoordChip.touchOffsetY || 0) }}
                >
                  P({question.xVal}, {question.yVal})
                </div>
              )}
              {dragRChip && dragRChip.moved && (
                <div
                  className={`fixed z-[150] pointer-events-none -translate-x-1/2 -translate-y-1/2 px-3 py-1.5 rounded-2xl border-2 font-mono font-black text-sm shadow-2xl ${dragRChip.overDrop ? 'bg-emerald-400 border-emerald-200 text-emerald-950 scale-110' : 'bg-amber-400 border-amber-200 text-amber-950'}`}
                  style={{ left: dragRChip.clientX, top: dragRChip.clientY }}
                >
                  <span className="inline-flex items-center gap-0.5">r = <SqrtText text={dragRChip.opt.label} /></span>

              )}
              {dragRatioKey && dragRatioKey.moved && question && (
                <div
                  className={`fixed z-[150] pointer-events-none -translate-x-1/2 -translate-y-1/2 px-3 py-1 rounded-xl border-2 font-mono font-black text-sm shadow-2xl ${
                    dragRatioKey.hoverSlot
                      ? 'bg-emerald-400 border-emerald-200 text-emerald-950 scale-110'
                      : dragRatioKey.key === 'x'
                      ? 'bg-blue-600 border-blue-200 text-white'
                      : dragRatioKey.key === 'y'
                      ? 'bg-red-600 border-rose-200 text-white'

                  style={{ left: dragRatioKey.clientX, top: dragRatioKey.clientY }}
                >
                  <span className="inline-flex items-center gap-0.5">{isPureSym ? dragRatioKey.key : <>{dragRatioKey.key} = <SqrtText text={String(getDisplayVal(dragRatioKey.key))} /></>}</span>
