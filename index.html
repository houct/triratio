      return (
        <div className="w-full h-full flex-1 flex flex-col justify-between pt-0.5 pb-1 relative animate-jelly min-h-0">

          {gameState === 'idle' && (
            <div className="flex-1 my-3 bg-white/95 rounded-3xl border-4 border-indigo-950 p-5 shadow-2xl flex flex-col justify-between text-center items-center">
              <div className="w-full space-y-2.5 pt-2">
                <div className="w-20 h-20 mx-auto rounded-3xl bg-teal-100 border-4 border-teal-500 flex items-center justify-center text-4xl shadow-inner animate-bounce">🧩</div>
                <h2 className="text-2xl font-black text-indigo-950 tracking-wide">比值之密碼</h2>
                <div className="text-xs font-black text-teal-700 bg-teal-50 border border-teal-200 rounded-full px-3 py-1 inline-block">sin · cos · tan</div>
              </div>
              <CompactStarPills starsThreshold={starsThreshold} maxTime={maxTime} />
              <div className="w-full space-y-2">
                <FractionOrderButtons onStartWithOrder={startGame} />
                <button onClick={onBackToMap} className="w-full py-2 text-xs font-bold text-slate-400 hover:text-slate-600">返回聖域地圖</button>
              </div>
            </div>
          )}

          {gameState === 'playing' && question && (
            <div className={`flex-1 min-h-0 flex flex-col justify-between gap-2 overflow-hidden pb-0.5 ${feedbackAnim}`}>
              <GameHUD score={score} combo={combo} timeLeft={timeLeft} maxTime={maxTime} starsThreshold={starsThreshold} />

              <div className={`flex-1 min-h-0 bg-white rounded-3xl border-3 border-indigo-950 shadow-xl flex flex-col overflow-hidden transition-all duration-150 ${isLockedSuccess ? 'ring-4 ring-emerald-400/75' : ''}`}>
                <div className="bg-slate-800 py-2 px-3 flex items-center justify-center gap-3 text-white border-b-2 border-slate-700 shrink-0">
                  <span className="text-lg font-serif font-black">{question.questionTitle} =</span>
                  <div className="flex flex-col items-center">
                    <div
                      onClick={() => { if (selectedNumEdge) { audio.sfxClick(); setSelectedNumEdge(null); } }}
                      className={`w-20 h-6 rounded-lg border-2 flex items-center justify-center font-bold text-xs transition-all ${
                        selectedNumEdge
                          ? 'bg-emerald-500 border-emerald-300 text-white cursor-pointer active:scale-95 shadow-[0_0_10px_rgba(16,185,129,0.5)]'
                          : isLv2NumTurn
                          ? 'border-amber-300 bg-amber-400/20 text-amber-200 animate-pulse shadow-[0_0_12px_rgba(251,191,36,0.55)]'
                          : 'border-dashed border-slate-500 text-slate-500'
                      }`}
                    >
                      <span>{selectedNumEdge ? selectedNumEdge.displayText : '分子'}</span>
                    </div>
                    <div className="w-20 h-0.5 bg-slate-400 my-1"></div>
                    <div
                      onClick={() => { if (selectedDenEdge) { audio.sfxClick(); setSelectedDenEdge(null); } }}
                      className={`w-20 h-6 rounded-lg border-2 flex items-center justify-center font-bold text-xs transition-all ${
                        selectedDenEdge
                          ? 'bg-cyan-500 border-cyan-300 text-white cursor-pointer active:scale-95 shadow-[0_0_10px_rgba(6,182,212,0.5)]'
                          : isLv2DenTurn
                          ? 'border-amber-300 bg-amber-400/20 text-amber-200 animate-pulse shadow-[0_0_12px_rgba(251,191,36,0.55)]'
                          : 'border-dashed border-slate-500 text-slate-500'
                      }`}
                    >
                      <span>{selectedDenEdge ? selectedDenEdge.displayText : '分母'}</span>
                    </div>
                  </div>
                  <SuccessBadge show={isLockedSuccess} />
                </div>

                <div className="relative w-full flex-1 min-h-0 bg-white flex items-center justify-center overflow-hidden">
                  <HintBanner tip={conceptTip} />
                  <svg viewBox="0 0 500 500" className="w-full h-full object-contain drop-shadow-md">
                    <polygon points={`${question.pts.P1.x},${question.pts.P1.y} ${question.pts.P2.x},${question.pts.P2.y} ${question.pts.P3.x},${question.pts.P3.y}`} fill="#f0fdfa" stroke="none" />
                    <polygon points={question.rightAngleSquare} fill="#f1f5f9" stroke="#94a3b8" strokeWidth="2.5" />
                    {question.showArc && <path d={question.arcPath} fill="#fef08a" stroke="#ca8a04" strokeWidth="2.5" />}
                    {question.edges.map((edge, idx) => {
                      const isEdgeSelected = selectedNumEdge?.colorId === edge.colorId || selectedDenEdge?.colorId === edge.colorId;
                      return (
                        <g key={idx} className="cursor-pointer group" onClick={() => handleSelectEdge(edge)}>
                          {isEdgeSelected && <line x1={edge.p1.x} y1={edge.p1.y} x2={edge.p2.x} y2={edge.p2.y} stroke="#facc15" strokeWidth="24" strokeLinecap="round" opacity="0.7" />}
                          <line x1={edge.p1.x} y1={edge.p1.y} x2={edge.p2.x} y2={edge.p2.y} stroke={edge.color.bg} strokeWidth="14" strokeLinecap="round" className="transition-opacity group-hover:opacity-85" />
                          <line x1={edge.p1.x} y1={edge.p1.y} x2={edge.p2.x} y2={edge.p2.y} stroke="transparent" strokeWidth="44" strokeLinecap="round" />
                          <circle cx={edge.midPt.x} cy={edge.midPt.y} r="21" fill="#ffffff" stroke={isEdgeSelected ? "#eab308" : edge.color.border} strokeWidth={isEdgeSelected ? "4" : "3"} />
                          <text x={edge.midPt.x} y={edge.midPt.y + 1} fill={edge.color.border} fontSize="18" fontWeight="900" textAnchor="middle" dominantBaseline="middle" className="font-serif pointer-events-none">{edge.displayText}</text>
                        </g>
                      );
                    })}
                    {question.labels.map((lbl, idx) => (
                      <g key={idx} className="pointer-events-none">
                        {lbl.isTargetVertex && (
                          <circle cx={lbl.x} cy={lbl.y - 2} r="20" fill="#fef3c7" stroke="#f59e0b" strokeWidth="2.5" opacity="0.95" />
                        )}
                        <text x={lbl.x} y={lbl.y} fill={lbl.color} fontSize={lbl.isTargetVertex ? "32" : "30"} fontWeight="900" textAnchor="middle" dominantBaseline="middle" className="font-serif drop-shadow">{lbl.text}</text>
                      </g>
                    ))}
                  </svg>
                </div>

                <div className="bg-slate-50 border-t-2 border-slate-200 p-2 grid grid-cols-3 gap-2 shrink-0">
                  {question.edges.map((edge) => {
                    const isEdgeSelected = selectedNumEdge?.colorId === edge.colorId || selectedDenEdge?.colorId === edge.colorId;
                    return (
                      <button
                        key={edge.colorId}
                        onClick={() => handleSelectEdge(edge)}
                        style={{ backgroundColor: edge.color.bg, borderColor: edge.color.border }}
                        className={`py-3 text-white font-black text-base rounded-2xl shadow-md border-b-4 active:border-b-0 active:translate-y-1 transition-all flex items-center justify-center font-serif ${isEdgeSelected ? 'ring-4 ring-amber-300 scale-[1.02]' : ''} ${wrongBtnKey === edge.colorId ? 'btn-wrong-flash' : ''}`}
                      >
                        {edge.displayText} ({edge.color.name})
                      </button>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          {gameState === 'ended' && (
            <LevelResultScreen
              score={score}
              baseScore={baseScore}
              earnedStars={earnedStars}
              maxCombo={maxCombo}
              correctCount={correctCount}
              wrongCount={wrongCount}
              maxTime={maxTime}
              accentClass="text-cyan-600"
              onCompleteLevel={onCompleteLevel}
              onRestart={() => startGame(pickOrder)}
              onBackToMap={onBackToMap}
            />
          )}
        </div>
      );
    };

    // ==================== 第 3 / 4 關共用兩段式互動引擎：解鎖未知邊 ➔ 建構三角比 ====================
    const TwoStageTriangleMaster = ({ currentStars, onUpdateStars, onCompleteLevel, onBackToMap, config }) => {
      const [gameState, setGameState] = useState('idle');
      const [pickOrder, setPickOrder] = useState('den');
      const [timeLeft, setTimeLeft] = useState(60);
      const [score, setScore] = useState(0);
      const [baseScore, setBaseScore] = useState(0);
      const [combo, setCombo] = useState(0);
      const [maxCombo, setMaxCombo] = useState(0);
      const [correctCount, setCorrectCount] = useState(0);
      const [wrongCount, setWrongCount] = useState(0);
      const [question, setQuestion] = useState(null);
      const [stage, setStage] = useState('side'); // 'side' | 'ratio'
      const [sideUnlocked, setSideUnlocked] = useState(false);
      const [selectedDenEdge, setSelectedDenEdge] = useState(null);
      const [selectedNumEdge, setSelectedNumEdge] = useState(null);
      const [isLockedSuccess, setIsLockedSuccess] = useState(false);
      const [feedbackAnim, setFeedbackAnim] = useState('');
      const [floatingText, setFloatingText] = useState(null);
      const [wrongBtnKey, setWrongBtnKey] = useState(null);
      const [conceptTip, setConceptTip] = useState(null);

      const timerRef = useRef(null);
      const actionTimerRef = useRef(null);
      const inputLockedRef = useRef(false);
      const prevQuestionKeyRef = useRef('');
      const maxTime = 60;
      const starsThreshold = [600, 1200, 1800];

      const triggerFloat = (text, color) => {
        const id = Date.now();
        setFloatingText({ text, color, id });
        setTimeout(() => setFloatingText(prev => prev?.id === id ? null : prev), 800);
      };

      const nextQuestion = (currentScore) => {
        const phase = currentScore >= starsThreshold[1] ? 2 : currentScore >= starsThreshold[0] ? 1 : 0;
        const q = config.generateQuestion(phase, prevQuestionKeyRef.current);
        prevQuestionKeyRef.current = q.questionKey || '';
        setQuestion(q);
        setStage('side');
        setSideUnlocked(false);
        setSelectedDenEdge(null);
        setSelectedNumEdge(null);
        setIsLockedSuccess(false);
        setWrongBtnKey(null);
        setConceptTip(null);
        inputLockedRef.current = false;
      };

      const startGame = (order = pickOrder) => {
        clearTimeout(actionTimerRef.current);
        prevQuestionKeyRef.current = '';
        setPickOrder(order);
        setScore(0); setBaseScore(0); setCombo(0); setMaxCombo(0);
        setCorrectCount(0); setWrongCount(0);
        setTimeLeft(maxTime); setFeedbackAnim('');
        setSelectedDenEdge(null); setSelectedNumEdge(null);
        setWrongBtnKey(null); setConceptTip(null);
        setIsLockedSuccess(false);
        inputLockedRef.current = false;
        setGameState('playing');
        nextQuestion(0);
        audio.init();
      };

      useEffect(() => {
        if (gameState === 'playing' && !isLockedSuccess) {
          timerRef.current = setInterval(() => {
            setTimeLeft(prev => {
              if (prev <= 0.1) {
                clearInterval(timerRef.current);
                audio.sfxTimeUp();
                setGameState('ended');
                return 0;
              }
              return +(prev - 0.1).toFixed(1);
            });
          }, 100);
        } else {
          clearInterval(timerRef.current);
        }
        return () => clearInterval(timerRef.current);
      }, [gameState, isLockedSuccess]);

      useEffect(() => {
        return () => clearTimeout(actionTimerRef.current);
      }, []);

      const earnedStars = useMemo(() => {
        if (score >= starsThreshold[2]) return 3;
        if (score >= starsThreshold[1]) return 2;
        if (score >= starsThreshold[0]) return 1;
        return 0;
      }, [score]);

      useEffect(() => {
        if (gameState === 'ended' && earnedStars > currentStars) onUpdateStars(earnedStars, score);
      }, [gameState, earnedStars]);

      const applyWrongPenalty = (tipText, btnKey, floatMsg) => {
        audio.sfxError();
        setCombo(0);
        setWrongCount(w => w + 1);
        inputLockedRef.current = true;
        const timePenalty = +(maxTime * 0.03).toFixed(2);
        setTimeLeft(prev => {
          const nextT = Math.max(0, +(prev - timePenalty).toFixed(2));
          if (nextT <= 0) {
            clearInterval(timerRef.current);
            audio.sfxTimeUp();
            setGameState('ended');
          }
          return nextT;
        });
        setWrongBtnKey(btnKey);
        setConceptTip({ text: tipText, id: Date.now() });
        triggerFloat(`-${timePenalty} 秒! ${floatMsg}`, "text-red-500");
        setFeedbackAnim('animate-shake');
        clearTimeout(actionTimerRef.current);
        actionTimerRef.current = setTimeout(() => {
          setFeedbackAnim('');
          setWrongBtnKey(null);
          setSelectedDenEdge(null);
          setSelectedNumEdge(null);
          inputLockedRef.current = false;
        }, 350);
      };

      const handleSelectSideOption = (opt) => {
        if (gameState !== 'playing' || !question || stage !== 'side' || inputLockedRef.current) return;
        if (opt === question.correctSideVal) {
          audio.sfxBonus();
          inputLockedRef.current = true;
          const mult = combo >= 6 ? 1.5 : combo >= 3 ? 1.2 : 1.0;
          const sideEarned = Math.floor(50 * mult);
          setScore(prev => prev + sideEarned);
          setBaseScore(b => b + 50);
          setSideUnlocked(true);
          setConceptTip(null);
          triggerFloat(`解鎖 ? ＝ ${opt} +${sideEarned}`, "text-emerald-500");
          clearTimeout(actionTimerRef.current);
          actionTimerRef.current = setTimeout(() => {
            setStage('ratio');
            inputLockedRef.current = false;
          }, 300);
        } else {
          applyWrongPenalty(question.sideTip, opt, '未知邊錯誤');
        }
      };

      const handleSelectRatioEdge = (edge) => {
        if (gameState !== 'playing' || !question || stage !== 'ratio' || inputLockedRef.current || isLockedSuccess) return;
        const firstEdge = pickOrder === 'num' ? selectedNumEdge : selectedDenEdge;
        if (!firstEdge) {
          audio.sfxSelect();
          if (pickOrder === 'num') setSelectedNumEdge(edge);
          else setSelectedDenEdge(edge);
        } else if (firstEdge.colorId === edge.colorId) {
          audio.sfxClick();
          setSelectedNumEdge(null);
          setSelectedDenEdge(null);
        } else {
          const numEdge = pickOrder === 'num' ? firstEdge : edge;
          const denEdge = pickOrder === 'num' ? edge : firstEdge;
          if (numEdge.colorId === question.correctNumeratorEdgeId && denEdge.colorId === question.correctDenominatorEdgeId) {
            audio.sfxMatch();
            inputLockedRef.current = true;
            setSelectedNumEdge(numEdge);
            setSelectedDenEdge(denEdge);
            setIsLockedSuccess(true);
            const mult = combo >= 6 ? 1.5 : combo >= 3 ? 1.2 : 1.0;
            const earned = Math.floor(120 * mult);
            const newScore = score + earned;
            setScore(newScore);
            setBaseScore(b => b + 120);
            setCorrectCount(c => c + 1);
            const newCombo = combo + 1;
            setCombo(newCombo);
            if (newCombo > maxCombo) setMaxCombo(newCombo);
            setConceptTip(null);
            triggerFloat(`+${earned}`, config.theme.floatColor);
            setFeedbackAnim('animate-correct');
            clearTimeout(actionTimerRef.current);
            actionTimerRef.current = setTimeout(() => {
              setFeedbackAnim('');
              nextQuestion(newScore);
            }, 500);
          } else {
            const isFlipped = numEdge.colorId === question.correctDenominatorEdgeId && denEdge.colorId === question.correctNumeratorEdgeId;
            applyWrongPenalty(
              isFlipped ? question.flipTip : question.ratioTip,
              edge.colorId,
              isFlipped ? '分子分母顛倒' : '比值定義錯誤'
            );
          }
        }
      };

      const theme = config.theme;
      const showEdgeNumbersInRatio = !question?.hideRatioNumbers || isLockedSuccess;
      const isRatioNumTurn = (pickOrder === 'num' && !selectedNumEdge) || (pickOrder === 'den' && selectedDenEdge && !selectedNumEdge);
      const isRatioDenTurn = (pickOrder === 'den' && !selectedDenEdge) || (pickOrder === 'num' && selectedNumEdge && !selectedDenEdge);

      return (
        <div className="w-full h-full flex-1 flex flex-col justify-between pt-0.5 pb-1 relative animate-jelly min-h-0">

          {gameState === 'idle' && (
            <div className="flex-1 my-3 bg-white/95 rounded-3xl border-4 border-indigo-950 p-5 shadow-2xl flex flex-col justify-between text-center items-center">
              <div className="w-full space-y-2.5 pt-2">
                <div className={`w-20 h-20 mx-auto rounded-3xl border-4 flex items-center justify-center text-4xl shadow-inner animate-bounce ${theme.badgeBg}`}>{config.icon}</div>
                <h2 className="text-2xl font-black text-indigo-950 tracking-wide">{config.title}</h2>
                <div className="text-xs font-black text-indigo-700 bg-indigo-50 border border-indigo-200 rounded-full px-3 py-1 inline-block">① 未知邊 ➔ ② 比值</div>
              </div>
              <CompactStarPills starsThreshold={starsThreshold} maxTime={maxTime} />
              <div className="w-full space-y-2">
                <FractionOrderButtons onStartWithOrder={startGame} />
                <button onClick={onBackToMap} className="w-full py-2 text-xs font-bold text-slate-400 hover:text-slate-600">返回聖域地圖</button>
              </div>
            </div>
          )}

          {gameState === 'playing' && question && (
            <div className={`flex-1 min-h-0 flex flex-col justify-between gap-2 overflow-hidden pb-0.5 ${feedbackAnim}`}>
              <GameHUD
                score={score}
                combo={combo}
                timeLeft={timeLeft}
                maxTime={maxTime}
                starsThreshold={starsThreshold}
                timeStatusLabel={isLockedSuccess ? <span className="text-amber-500 font-black animate-pulse">(定格確認)</span> : null}
              />

              <div className={`flex-1 min-h-0 bg-white rounded-3xl border-3 border-indigo-950 shadow-xl flex flex-col overflow-hidden transition-all duration-150 ${isLockedSuccess ? 'ring-4 ring-emerald-400/75' : ''}`}>
                {stage === 'side' ? (
                  <div className={`bg-gradient-to-r ${theme.headerGrad} h-[76px] px-3 flex items-center justify-between gap-2 text-white border-b-2 shrink-0`}>
                    <div className="flex items-center gap-2">
                      <span className="text-xs font-black bg-white/20 px-2 py-0.5 rounded-lg">① 求出未知邊</span>
                      <span className="text-lg font-serif font-black tracking-wide">? =</span>
                      <span className={`px-2.5 py-0.5 rounded-lg font-serif font-black text-base border-2 transition-all ${sideUnlocked ? 'bg-emerald-400 border-emerald-200 text-emerald-950 scale-110' : 'bg-rose-500/30 border-rose-200 text-white animate-pulse'}`}>
                        {sideUnlocked ? question.correctSideVal : '?'}
                      </span>
                    </div>
                    <span className="text-xs font-black bg-slate-900/35 border border-white/25 px-2.5 py-1 rounded-xl font-serif whitespace-nowrap">
                      目標：{question.questionTitle}
                    </span>
                  </div>
                ) : (
                  <div className="bg-slate-800 h-[76px] px-3 flex items-center justify-center gap-3 text-white border-b-2 border-slate-700 shrink-0">
                    <span className="text-xs font-black bg-emerald-500/20 text-emerald-300 border border-emerald-400/40 px-2 py-0.5 rounded-lg">② 比值</span>
                    <span className="text-lg font-serif font-black">{question.questionTitle} =</span>
                    <div className="flex flex-col items-center">
                      <div
                        onClick={() => { if (selectedNumEdge && !isLockedSuccess && !inputLockedRef.current) { audio.sfxClick(); setSelectedNumEdge(null); } }}
                        className={`w-20 h-6 rounded-lg border-2 flex items-center justify-center font-bold text-xs transition-all ${
                          selectedNumEdge
                            ? 'bg-emerald-500 border-emerald-300 text-white cursor-pointer active:scale-95 shadow-[0_0_12px_rgba(16,185,129,0.7)]'
                            : isRatioNumTurn
                            ? 'border-amber-300 bg-amber-400/20 text-amber-200 animate-pulse shadow-[0_0_12px_rgba(251,191,36,0.5)]'
                            : 'border-dashed border-slate-500 text-slate-500'
                        }`}
                      >
                        <span>{selectedNumEdge ? (showEdgeNumbersInRatio ? selectedNumEdge.displayText : selectedNumEdge.color.name) : '分子'}</span>
                      </div>
                      <div className="w-20 h-0.5 bg-slate-400 my-1"></div>
                      <div
                        onClick={() => { if (selectedDenEdge && !isLockedSuccess && !inputLockedRef.current) { audio.sfxClick(); setSelectedDenEdge(null); } }}
                        className={`w-20 h-6 rounded-lg border-2 flex items-center justify-center font-bold text-xs transition-all ${
                          selectedDenEdge
                            ? 'bg-cyan-500 border-cyan-300 text-white cursor-pointer active:scale-95 shadow-[0_0_12px_rgba(6,182,212,0.7)]'
                            : isRatioDenTurn
                            ? 'border-amber-300 bg-amber-400/20 text-amber-200 animate-pulse shadow-[0_0_12px_rgba(251,191,36,0.5)]'
                            : 'border-dashed border-slate-500 text-slate-500'
                        }`}
                      >
                        <span>{selectedDenEdge ? (showEdgeNumbersInRatio ? selectedDenEdge.displayText : selectedDenEdge.color.name) : '分母'}</span>
                      </div>
                    </div>
                    <SuccessBadge show={isLockedSuccess} />
                  </div>
                )}

                <div className="relative w-full flex-1 min-h-0 bg-white flex items-center justify-center overflow-hidden">
                  <HintBanner tip={conceptTip} />
                  <svg viewBox="0 0 500 500" className="w-full h-full object-contain drop-shadow-md">
                    {config.showDots && (
                      <defs>
                        <pattern id="gridDotsSpecial" width="25" height="25" patternUnits="userSpaceOnUse">
                          <circle cx="2.5" cy="2.5" r="1.5" fill="#fef3c7" />
                        </pattern>
                      </defs>
                    )}
                    {config.showDots && <rect width="100%" height="100%" fill="url(#gridDotsSpecial)" />}
                    <polygon points={`${question.pts.P1.x},${question.pts.P1.y} ${question.pts.P2.x},${question.pts.P2.y} ${question.pts.P3.x},${question.pts.P3.y}`} fill={theme.polyFill} stroke="none" />
                    <polygon points={question.rightAngleSquare} fill={theme.rightFill} stroke={theme.rightStroke} strokeWidth="2.5" />
                    {(question.showArc === undefined || question.showArc) && (
                      <path
                        d={question.arcPath}
                        fill={theme.arcFill}
                        stroke={theme.arcStroke}
                        strokeWidth="2.5"
                        strokeDasharray={question.arcDashed ? "6 4" : "none"}
                        opacity={question.arcDashed ? 0.55 : 1}
                      />
                    )}

                    {question.edges.map((edge, idx) => {
                      if (stage === 'side') {
                        const isTargetMissing = edge.isHidden;
                        const strokeCol = isTargetMissing ? (sideUnlocked ? '#10b981' : '#ef4444') : '#475569';
                        const circleFill = isTargetMissing ? (sideUnlocked ? '#ecfdf5' : '#fef2f2') : '#ffffff';
                        const textCol = isTargetMissing ? (sideUnlocked ? '#047857' : '#dc2626') : '#1e293b';
                        const labelText = isTargetMissing ? (sideUnlocked ? edge.displayText : '?') : edge.displayText;
                        return (
                          <g key={idx}>
                            <line
                              x1={edge.p1.x} y1={edge.p1.y} x2={edge.p2.x} y2={edge.p2.y}
                              stroke={strokeCol}
                              strokeWidth={isTargetMissing && sideUnlocked ? "14" : "12"}
                              strokeLinecap="round"
                              strokeDasharray={isTargetMissing && !sideUnlocked ? "8 6" : "none"}
                            />
                            <g className={isTargetMissing && !sideUnlocked ? 'animate-pulse' : ''}>
                              <circle cx={edge.midPt.x} cy={edge.midPt.y} r="21" fill={circleFill} stroke={strokeCol} strokeWidth="3.5" />
                              <text x={edge.midPt.x} y={edge.midPt.y + 1} fill={textCol} fontSize="18" fontWeight="900" textAnchor="middle" dominantBaseline="middle" className="font-serif pointer-events-none">{labelText}</text>
                            </g>
                          </g>
                        );
                      }

                      const isDenSelected = selectedDenEdge?.colorId === edge.colorId;
                      const isNumSelected = selectedNumEdge?.colorId === edge.colorId;
                      const isHighlighted = isDenSelected || isNumSelected;
                      const isDimmed = isLockedSuccess && !isHighlighted;
                      return (
                        <g key={idx} className="cursor-pointer group" opacity={isDimmed ? 0.22 : 1} onClick={() => handleSelectRatioEdge(edge)}>
                          {isLockedSuccess && isHighlighted && (
                            <line x1={edge.p1.x} y1={edge.p1.y} x2={edge.p2.x} y2={edge.p2.y} stroke="#facc15" strokeWidth="28" strokeLinecap="round" opacity="0.85" />
                          )}
                          {!isLockedSuccess && isHighlighted && (
                            <line x1={edge.p1.x} y1={edge.p1.y} x2={edge.p2.x} y2={edge.p2.y} stroke="#22d3ee" strokeWidth="24" strokeLinecap="round" opacity="0.7" />
                          )}
                          <line x1={edge.p1.x} y1={edge.p1.y} x2={edge.p2.x} y2={edge.p2.y} stroke={edge.color.bg} strokeWidth="14" strokeLinecap="round" className="transition-opacity group-hover:opacity-85" />
                          <line x1={edge.p1.x} y1={edge.p1.y} x2={edge.p2.x} y2={edge.p2.y} stroke="transparent" strokeWidth="44" strokeLinecap="round" />

                              <text x={edge.midPt.x} y={edge.midPt.y + 1} fill={edge.color.border} fontSize="18" fontWeight="900" textAnchor="middle" dominantBaseline="middle" className="font-serif pointer-events-none">{edge.displayText}</text>
                            </>
                          )}
                        </g>
                      );
                    })}

                    {question.labels.map((lbl, idx) => (
                      <g key={idx} className="pointer-events-none">
                        {lbl.isTargetVertex && (
                          <circle cx={lbl.x} cy={lbl.y - 3} r="20" fill="#fef3c7" stroke="#f59e0b" strokeWidth="2.5" opacity="0.95" />

                      </g>

                <div className="bg-slate-50 border-t-2 border-slate-200 p-2 h-[120px] shrink-0">
                  {stage === 'side' ? (
                    <div className="h-full grid grid-cols-2 grid-rows-2 gap-2">

                          >
                            <span>{showEdgeNumbersInRatio ? `${edge.displayText} (${edge.color.name})` : edge.color.name}</span>
                          </button>
                        );
                      })}
                    </div>
                  )}
                </div>
              </div>
            </div>

          {gameState === 'ended' && (
            <LevelResultScreen
              score={score}

              earnedStars={earnedStars}
              maxCombo={maxCombo}
              correctCount={correctCount}

    };

    // ==================== 第 3 關組件：未知邊獵人 ====================
    const Level3MissingSideMaster = (props) => (

    // ==================== 第 4 關組件：黃金神殿 ====================
    const Level4SpecialAnglesMaster = (props) => (
      <TwoStageTriangleMaster
        {...props}
        config={{
          title: '黃金三角神殿',
          icon: '☀️',

            <>
              ① 先補齊 <span className="text-amber-600 font-black">30° / 45° / 60°</span> 特殊角未知邊，② 再依序點選<span className="text-cyan-600 font-black">「分母邊」</span>與<span className="text-emerald-600 font-black">「分子邊」</span>建構黃金比值！（答錯重置連擊並扣 3% 時間）

            startBtn: 'btn-3d-yellow text-amber-950',

    // ==================== 第 6 關組件：廣義角舵手 ====================
    const Level5AngleSteeringMaster = ({ currentStars, onUpdateStars, onCompleteLevel, onBackToMap }) => {
      const [gameState, setGameState] = useState('idle');
      const [timeLeft, setTimeLeft] = useState(60);
      const [score, setScore] = useState(0);
      const [baseScore, setBaseScore] = useState(0);
      const [combo, setCombo] = useState(0);
      const [maxCombo, setMaxCombo] = useState(0);
      const [correctCount, setCorrectCount] = useState(0);
      const [wrongCount, setWrongCount] = useState(0);
      const [currentAngle, setCurrentAngle] = useState(0);
      const [targetAngle, setTargetAngle] = useState(90);
      const [isDragging, setIsDragging] = useState(false);
      const [feedbackAnim, setFeedbackAnim] = useState('');
      const [floatingText, setFloatingText] = useState(null);
      const [isLockedSuccess, setIsLockedSuccess] = useState(false);

      const dialSvgRef = useRef(null);
      const lastTickAngleRef = useRef(0);
      const lastAtanRef = useRef(0);
      const exactAngleRef = useRef(0);
      const isDraggingRef = useRef(false);
      const dwellTimerRef = useRef(null);
      const isLockedRef = useRef(false);
      const timerRef = useRef(null);
      const angleBagsRef = useRef({ 0: [], 1: [], 2: [] });
      const lastAngleRef = useRef(null);
      const maxTime = 60;
      const starsThreshold = [600, 1200, 1800];

      const width = 540, height = 540, origin = { x: 270, y: 270 }, R = 200;

      useEffect(() => { isDraggingRef.current = isDragging; }, [isDragging]);
      useEffect(() => {
        const preventTouchScroll = (e) => { if (isDraggingRef.current) e.preventDefault(); };
        document.addEventListener('touchmove', preventTouchScroll, { passive: false });
        return () => document.removeEventListener('touchmove', preventTouchScroll);
      }, []);

      const triggerFloat = (text, color) => {
        const id = Date.now();
        setFloatingText({ text, color, id });
        setTimeout(() => setFloatingText(prev => prev?.id === id ? null : prev), 800);
      };

      const triggerSuccessMatch = (curScore, curCombo) => {
        if (isLockedRef.current) return;
        isLockedRef.current = true;
        setIsLockedSuccess(true);
        audio.sfxBonus();
        const mult = curCombo >= 6 ? 1.5 : curCombo >= 3 ? 1.2 : 1.0;
        const earned = Math.floor(120 * mult);
        const newScore = curScore + earned;
        setScore(newScore);
        setBaseScore(b => b + 120);
        setCorrectCount(c => c + 1);
        const newCombo = curCombo + 1;
        setCombo(newCombo);
        if (newCombo > maxCombo) setMaxCombo(newCombo);
        triggerFloat(`+${earned} 能量鎖定!`, "text-amber-400");
        setFeedbackAnim('animate-correct');
        setTimeout(() => {
          setIsLockedSuccess(false); setFeedbackAnim('');
          generateNextTarget(newScore);
          isLockedRef.current = false;
        }, 520);
      };

      const generateNextTarget = (curScore) => {
        const phase = curScore >= starsThreshold[1] ? 2 : curScore >= starsThreshold[0] ? 1 : 0;
        const pools = {
          0: [30, 45, 60, 90, 120, 135, 150, 180],
          1: [15, 75, 105, 165, 210, 225, 240, 270, 300, 315, 330, -30, -45, -60, -90, -120, -135, -150, -180],
          2: [195, 255, 285, 345, -210, -225, -270, -300, -315, 390, 420, 450, 750, -390]
        };
        if (!angleBagsRef.current[phase] || angleBagsRef.current[phase].length === 0) {
          const fresh = shuffle(pools[phase]);
          if (fresh.length > 1 && fresh[0] === lastAngleRef.current) {
            [fresh[0], fresh[fresh.length - 1]] = [fresh[fresh.length - 1], fresh[0]];
          }
          angleBagsRef.current[phase] = fresh;
        }
        const next = angleBagsRef.current[phase].shift();
        lastAngleRef.current = next;
        setTargetAngle(next);
        setCurrentAngle(0);
        exactAngleRef.current = 0;
        lastTickAngleRef.current = 0;
        if (dwellTimerRef.current) clearTimeout(dwellTimerRef.current);
      };

      const checkDwellHover = (angleVal) => {
        if (dwellTimerRef.current) clearTimeout(dwellTimerRef.current);
        if (isLockedRef.current) return;
        if (angleVal === targetAngle) {
          dwellTimerRef.current = setTimeout(() => {
            if (!isLockedRef.current) triggerSuccessMatch(score, combo);
          }, 300);
        }
      };

      const startGame = () => {
        angleBagsRef.current = { 0: [], 1: [], 2: [] };
        lastAngleRef.current = null;
        setScore(0); setBaseScore(0); setCombo(0); setMaxCombo(0);
        setCorrectCount(0); setWrongCount(0);
        setTimeLeft(maxTime); setFeedbackAnim('');
        setIsLockedSuccess(false); isLockedRef.current = false;
        setGameState('playing');
        generateNextTarget(0);
        audio.init();
      };

      useEffect(() => {
        if (gameState === 'playing' && !isLockedSuccess) {
          timerRef.current = setInterval(() => {
            setTimeLeft(prev => {
              if (prev <= 0.1) {
                clearInterval(timerRef.current);
                if (dwellTimerRef.current) clearTimeout(dwellTimerRef.current);
                audio.sfxTimeUp();
                setGameState('ended');
                return 0;
              }
              return +(prev - 0.1).toFixed(1);
            });
          }, 100);
        } else {
          clearInterval(timerRef.current);
          if (dwellTimerRef.current) clearTimeout(dwellTimerRef.current);
        }
        return () => {
          clearInterval(timerRef.current);
          if (dwellTimerRef.current) clearTimeout(dwellTimerRef.current);
        };
      }, [gameState, isLockedSuccess]);

      const earnedStars = useMemo(() => {
        if (score >= starsThreshold[2]) return 3;
        if (score >= starsThreshold[1]) return 2;
        if (score >= starsThreshold[0]) return 1;
        return 0;
      }, [score]);

      useEffect(() => {
        if (gameState === 'ended' && earnedStars > currentStars) onUpdateStars(earnedStars, score);
      }, [gameState, earnedStars]);

      const handlePointerDown = (e) => {
        if (isLockedRef.current || !dialSvgRef.current) return;
        setIsDragging(true);
        e.target.setPointerCapture(e.pointerId);
        const ctm = dialSvgRef.current.getScreenCTM();
        if (!ctm) return;
        const inv = ctm.inverse();
        const svgX = inv.a * e.clientX + inv.c * e.clientY + inv.e;
        const svgY = inv.b * e.clientX + inv.d * e.clientY + inv.f;
        lastAtanRef.current = Math.atan2(origin.y - svgY, svgX - origin.x) * (180 / Math.PI);
        exactAngleRef.current = currentAngle;
      };

      const handlePointerMove = (e) => {
        if (!isDragging || isLockedRef.current || !dialSvgRef.current) return;
        const ctm = dialSvgRef.current.getScreenCTM();
        if (!ctm) return;
        const inv = ctm.inverse();
        const svgX = inv.a * e.clientX + inv.c * e.clientY + inv.e;
        const svgY = inv.b * e.clientX + inv.d * e.clientY + inv.f;
        const currentAtan = Math.atan2(origin.y - svgY, svgX - origin.x) * (180 / Math.PI);
        let diff = currentAtan - lastAtanRef.current;
        if (diff > 180) diff -= 360;
        if (diff < -180) diff += 360;
        exactAngleRef.current += diff;
        lastAtanRef.current = currentAtan;
        const snapped = Math.round(exactAngleRef.current / 5) * 5;
        if (snapped !== lastTickAngleRef.current) { audio.sfxTick(); lastTickAngleRef.current = snapped; }
        setCurrentAngle(snapped);
        checkDwellHover(snapped);
      };

      const handlePointerUp = (e) => {
        if (!isDragging) return;
        setIsDragging(false);
        if (e?.target?.hasPointerCapture?.(e.pointerId)) e.target.releasePointerCapture(e.pointerId);
        if (currentAngle === targetAngle && !isLockedRef.current) {
          if (dwellTimerRef.current) clearTimeout(dwellTimerRef.current);
          triggerSuccessMatch(score, combo);
        }
      };

      const stepAngle = (delta) => {
        if (isLockedRef.current) return;
        const next = currentAngle + delta;
        audio.sfxTick();
        exactAngleRef.current = next;
        lastTickAngleRef.current = next;
        setCurrentAngle(next);
        checkDwellHover(next);
        if (next === targetAngle) {
          if (dwellTimerRef.current) clearTimeout(dwellTimerRef.current);
          triggerSuccessMatch(score, combo);
        }
      };

      const generateSpiral = () => {
        if (currentAngle === 0) return "";
        const points = [];
        const steps = Math.max(20, Math.floor(Math.abs(currentAngle) / 3));
        const baseR = 25, maxGrowth = 120;
        const totalRotations = Math.abs(currentAngle) / 360;
        const growthPerRotation = Math.min(15, maxGrowth / Math.max(1, totalRotations));
        for (let i = 0; i <= steps; i++) {
          const angleAtStep = (i / steps) * currentAngle;
          const radAtStep = (angleAtStep * Math.PI) / 180;
          const currentR = baseR + (Math.abs(angleAtStep) / 360) * growthPerRotation;
          points.push(`${origin.x + currentR * Math.cos(radAtStep)},${origin.y - currentR * Math.sin(radAtStep)}`);
        }
        return `M ${origin.x + baseR},${origin.y} L ${points.join(' ')}`;
      };

      const rayAngles = Array.from({ length: 24 }, (_, i) => i * 15);
      const currentRad = (currentAngle * Math.PI) / 180;
      const ptTerminal = { x: origin.x + R * Math.cos(currentRad), y: origin.y - R * Math.sin(currentRad) };
      let principal = ((currentAngle % 360) + 360) % 360;
      let quadrantText = principal === 0 ? "正向 X 軸" : principal < 90 ? "第 I 象限" : principal === 90 ? "正向 Y 軸" : principal < 180 ? "第 II 象限" : principal === 180 ? "負向 X 軸" : principal < 270 ? "第 III 象限" : principal === 270 ? "負向 Y 軸" : "第 IV 象限";

      return (
        <div className="w-full h-full flex-1 flex flex-col justify-between pt-0.5 pb-1 relative animate-jelly min-h-0">

          {gameState === 'idle' && (
            <div className="flex-1 my-3 bg-white/95 rounded-3xl border-4 border-indigo-950 p-5 shadow-2xl flex flex-col justify-between text-center items-center">
              <div className="w-full space-y-3 pt-2">
                <div className="w-20 h-20 mx-auto rounded-3xl bg-sky-100 border-4 border-sky-500 flex items-center justify-center text-4xl shadow-inner animate-bounce">🧭</div>
                <h2 className="text-2xl font-black text-indigo-950 tracking-wide">廣義角舵手</h2>
                <p className="text-xs text-slate-500 font-bold leading-relaxed max-w-xs mx-auto">
                  撥動終邊到達指定角度！<br/>
                  <span className="text-sky-600 font-black">放開手指</span> 或 <span className="text-amber-600 font-black">停駐 0.3 秒</span> 即觸發能量鎖定自動通關！
                </p>
              </div>
              <div className="w-full bg-sky-50/80 border-2 border-sky-200 rounded-2xl p-3 space-y-2 text-left text-xs font-bold text-indigo-950">
                <div className="text-[11px] font-black text-sky-800 uppercase tracking-wider text-center">🎯 60秒通關標準</div>
                <div className="flex items-center justify-between bg-white p-2 rounded-xl border border-sky-100"><span>⭐ 1 星 (通關解鎖)</span><span className="font-mono text-emerald-600 font-black">{starsThreshold[0]} 分</span></div>
                <div className="flex items-center justify-between bg-white p-2 rounded-xl border border-sky-100"><span>⭐⭐ 2 星 (聖域舵手)</span><span className="font-mono text-blue-600 font-black">{starsThreshold[1]} 分</span></div>
                <div className="flex items-center justify-between bg-white p-2 rounded-xl border border-sky-100"><span>⭐⭐⭐ 3 星 (全境傳奇)</span><span className="font-mono text-purple-600 font-black">{starsThreshold[2]} 分</span></div>
              </div>
              <div className="w-full space-y-2">
                <button onClick={startGame} className="w-full py-4 btn-3d-blue text-white font-black text-lg rounded-2xl shadow-xl tracking-wider active:scale-95">🚀 開始 60 秒挑戰！</button>
                <button onClick={onBackToMap} className="w-full py-2 text-xs font-bold text-slate-400 hover:text-slate-600">返回聖域地圖</button>
              </div>
            </div>
          )}

          {gameState === 'playing' && (
            <div className={`flex-1 min-h-0 flex flex-col justify-between gap-2 overflow-hidden pb-0.5 ${feedbackAnim}`}>
              <GameHUD score={score} combo={combo} timeLeft={timeLeft} maxTime={maxTime} starsThreshold={starsThreshold} />

              <div className={`flex-1 min-h-0 bg-white rounded-3xl border-3 border-indigo-950 shadow-xl flex flex-col overflow-hidden transition-all duration-150 ${isLockedSuccess ? 'ring-4 ring-emerald-400/75' : ''}`}>
                <div className="bg-gradient-to-r from-sky-500 to-indigo-600 py-2 px-3.5 flex justify-between items-center text-white border-b-2 border-indigo-800 shrink-0">
                  <div className="flex items-center gap-2">
                    <span className="text-xs text-sky-100 font-bold uppercase">目標角度</span>
                    <span className="text-2xl sm:text-3xl font-mono font-black text-white tracking-wider drop-shadow">{targetAngle}°</span>
                  </div>
                  <div className="text-right flex items-center gap-2">
                    <div>
                      <span className="text-[10px] text-sky-200 block font-bold leading-none">當前位置</span>
                      <span className={`text-xl font-mono font-black leading-none ${currentAngle === targetAngle ? 'text-amber-300' : 'text-white'}`}>{currentAngle}°</span>
                    </div>
                    <span className="text-xs font-bold text-indigo-950 bg-white/90 px-2 py-1 rounded-lg border border-indigo-200 shadow-sm">{quadrantText}</span>
                  </div>
                </div>

                <div className="relative w-full flex-1 min-h-0 bg-white flex items-center justify-center overflow-hidden">
                  {isLockedSuccess && <div className="absolute inset-0 bg-amber-400/25 z-30 pointer-events-none animate-ping"></div>}
                  <svg ref={dialSvgRef} viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="xMidYMid meet" className="w-full h-full object-contain cursor-grab active:cursor-grabbing select-none" onPointerDown={handlePointerDown} onPointerMove={handlePointerMove} onPointerUp={handlePointerUp} onPointerCancel={handlePointerUp}>
                    <defs>
                      <pattern id="gridLv5" width="100" height="100" patternUnits="userSpaceOnUse" x="270" y="270">
                        <rect width="100" height="100" fill="#ffffff" />
                        <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#e2e8f0" strokeWidth="2.5" />
                      </pattern>
                      <marker id="arrowHeadLv5" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                        <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b" />
                      </marker>
                    </defs>
                    <rect width="100%" height="100%" fill="url(#gridLv5)" />
                    <line x1={30} y1={270} x2={510} y2={270} stroke="#94a3b8" strokeWidth="2.5" />
                    <line x1={270} y1={30} x2={270} y2={510} stroke="#94a3b8" strokeWidth="2.5" />
                    <text x="500" y="255" fill="#94a3b8" fontSize="24" fontWeight="bold">x</text>
                    <text x="285" y="50" fill="#94a3b8" fontSize="24" fontWeight="bold">y</text>
                    <text x="440" y="100" fill="#e2e8f0" fontSize="64" fontWeight="bold" opacity="0.6">I</text>
                    <text x="80" y="100" fill="#e2e8f0" fontSize="64" fontWeight="bold" opacity="0.6">II</text>
                    <text x="80" y="460" fill="#e2e8f0" fontSize="64" fontWeight="bold" opacity="0.6">III</text>
                    <text x="440" y="460" fill="#e2e8f0" fontSize="64" fontWeight="bold" opacity="0.6">IV</text>
                    {rayAngles.map(deg => {
                      const rRad = (deg * Math.PI) / 180;
                      const isAxis = deg % 90 === 0;
                      return <line key={deg} x1={270} y1={270} x2={270 + 200 * Math.cos(rRad)} y2={270 - 200 * Math.sin(rRad)} stroke="#94a3b8" strokeWidth={isAxis ? 3 : 2} strokeDasharray={isAxis ? "none" : "5 5"} />;
                    })}
                    <path d={generateSpiral()} fill="none" stroke={isLockedSuccess ? "#fbbf24" : "#f59e0b"} strokeWidth={isLockedSuccess ? "6" : "4.5"} strokeLinecap="round" strokeLinejoin="round" markerEnd="url(#arrowHeadLv5)" />
                    <line x1={270} y1={270} x2={490} y2={270} stroke="#ef4444" strokeWidth="8" strokeLinecap="round" />
                    <rect x="435" y="282" width="56" height="26" fill="white" stroke="#ef4444" strokeWidth="1.5" rx="6" />
                    <text x="463" y="300" fill="#b91c1c" fontSize="16" fontWeight="900" textAnchor="middle">始邊</text>
                    <line x1={270} y1={270} x2={ptTerminal.x} y2={ptTerminal.y} stroke={isLockedSuccess ? "#f59e0b" : "#3b82f6"} strokeWidth={isLockedSuccess ? "11" : "8"} strokeLinecap="round" />
                    <g transform={`translate(${ptTerminal.x}, ${ptTerminal.y})`}>
                      {(isDragging || isLockedSuccess) && <circle cx="0" cy="0" r={isLockedSuccess ? 50 : 44} fill={isLockedSuccess ? "#fde047" : "#60a5fa"} opacity="0.4" className="animate-pulse" />}
                      <circle cx="0" cy="0" r={isDragging ? 22 : 18} fill={isLockedSuccess ? "#f59e0b" : "#2563eb"} stroke="#ffffff" strokeWidth="4" />
                      <circle cx="0" cy="0" r="6" fill="#ffffff" />
                    </g>
                    <circle cx={270} cy={270} r={height} fill="transparent" style={{ touchAction: 'none' }} className="cursor-grab active:cursor-grabbing" />
                  </svg>
                </div>

                <div className="bg-slate-50 border-t-2 border-slate-200 p-2 grid grid-cols-2 gap-2 shrink-0">
                  <button onClick={() => stepAngle(-5)} className="py-3 btn-3d-blue text-white font-mono font-black rounded-2xl shadow-md active:scale-95 text-sm flex items-center justify-center gap-1"><span>↺</span> -5° 微調</button>
                  <button onClick={() => stepAngle(5)} className="py-3 btn-3d-blue text-white font-mono font-black rounded-2xl shadow-md active:scale-95 text-sm flex items-center justify-center gap-1"><span>↻</span> +5° 微調</button>
                </div>
              </div>
            </div>
          )}

          {gameState === 'ended' && (
            <LevelResultScreen
              score={score}
              baseScore={baseScore}
              earnedStars={earnedStars}
              maxCombo={maxCombo}
              correctCount={correctCount}
              wrongCount={wrongCount}
              maxTime={maxTime}
              accentClass="text-sky-600"
              onCompleteLevel={onCompleteLevel}
              onRestart={startGame}
              onBackToMap={onBackToMap}
            />
          )}
        </div>
      );
    };

    // ==================== 第 7 關組件：同界角星爆（Target Pop） ====================
    const isCoterminalAngle = (a, b) => (((a - b) % 360) + 360) % 360 === 0;

    const generateCoterminalWave = (phase, prevBase = null) => {
      const basePools = {
        0: [20, 30, 40, 45, 50, 60, 75, 110, 120, 135, 150],
        1: [-120, -45, -60, -150, -30, -135, 210, 225, 240, 300, 315],
        2: [410, -300, 495, -225, 390, -315, 420, -240, 510, -405]
      };
      const pool = basePools[phase] || basePools[0];
      let baseAngle = pool[Math.floor(Math.random() * pool.length)];
      while (baseAngle === prevBase && pool.length > 1) {
        baseAngle = pool[Math.floor(Math.random() * pool.length)];
      }

      const correctOffsets = phase === 0
        ? [360, -360, 720]
        : phase === 1
        ? shuffle([360, -360, 720, -720]).slice(0, 3)
        : shuffle([-360, 360, -720, 720]).slice(0, 3);

      const correctAngles = correctOffsets.map(d => baseAngle + d);
      const usedSet = new Set([baseAngle, ...correctAngles]);

      const principal = ((baseAngle % 360) + 360) % 360;
      const trapCandidates = [
        -baseAngle,
        180 - baseAngle,
        baseAngle + 180,
        baseAngle - 180,
        -principal,
        180 - principal,
        baseAngle < 0 ? baseAngle - 120 : -baseAngle - 180,
        360 - baseAngle,
        baseAngle + 90,
        baseAngle - 90,
        -baseAngle + 360,
        -baseAngle - 360
      ];

      const trapAngles = [];
      for (const cand of trapCandidates) {
        if (trapAngles.length >= 3) break;
        if (!usedSet.has(cand) && !isCoterminalAngle(cand, baseAngle)) {
          usedSet.add(cand);
          trapAngles.push(cand);
        }
      }
      while (trapAngles.length < 3) {
        const fallback = baseAngle + (trapAngles.length + 1) * 70;
        if (!usedSet.has(fallback) && !isCoterminalAngle(fallback, baseAngle)) {
          usedSet.add(fallback);
          trapAngles.push(fallback);
        }
      }

      const lanes = shuffle([12, 27, 42, 58, 73, 88]);
      const startYs = [92, 104, 116, 98, 110, 122];
      const items = shuffle([
        ...correctAngles.map(ang => ({ angle: ang, isCorrect: true })),
        ...trapAngles.map(ang => ({ angle: ang, isCorrect: false }))
      ]).map((item, idx) => ({
        uid: `B_${Date.now()}_${idx}_${Math.random()}`,
        angle: item.angle,
        isCorrect: item.isCorrect,
        x: lanes[idx],
        y: startYs[idx],
        swayPhase: Math.random() * Math.PI * 2,
        status: 'active'
      }));

      return { baseAngle, phase, bubbles: items };
    };

    const LevelCoterminalPopMaster = ({ currentStars, onUpdateStars, onCompleteLevel, onBackToMap }) => {
      const [gameState, setGameState] = useState('idle');
      const [timeLeft, setTimeLeft] = useState(75);
      const [score, setScore] = useState(0);
      const [baseScore, setBaseScore] = useState(0);
      const [combo, setCombo] = useState(0);
      const [maxCombo, setMaxCombo] = useState(0);
      const [correctCount, setCorrectCount] = useState(0);
      const [wrongCount, setWrongCount] = useState(0);
      const [waveNum, setWaveNum] = useState(1);
      const [baseAngle, setBaseAngle] = useState(50);
      const [bubbles, setBubbles] = useState([]);
      const [waveCleared, setWaveCleared] = useState(false);
      const [feedbackAnim, setFeedbackAnim] = useState('');
      const [conceptTip, setConceptTip] = useState(null);
      const [bursts, setBursts] = useState([]);
      const [wrongFlash, setWrongFlash] = useState(false);

      const starsBg = useMemo(() => (
        Array.from({ length: 22 }, (_, i) => ({
          id: i,
          left: `${(i * 37 + 11) % 94 + 3}%`,
          top: `${(i * 53 + 7) % 88 + 6}%`,
          size: i % 4 === 0 ? 3 : 2,
          delay: `${((i * 0.43) % 2.8).toFixed(2)}s`,
          dur: `${(2.2 + (i % 5) * 0.55).toFixed(2)}s`
        }))
      ), []);

      const bubblesRef = useRef([]);
      const baseAngleRef = useRef(null);
      const waveErrorsRef = useRef(0);
      const waveLockedRef = useRef(false);
      const scoreRef = useRef(0);
      const timerRef = useRef(null);
      const rafRef = useRef(null);
      const waveTimeoutRef = useRef(null);

      const maxTime = 75;
      const starsThreshold = [1000, 2000, 3000];

      useEffect(() => { scoreRef.current = score; }, [score]);

      const spawnNextWave = useCallback((curScore) => {
        const phase = curScore >= starsThreshold[1] ? 2 : curScore >= starsThreshold[0] ? 1 : 0;
        const w = generateCoterminalWave(phase, baseAngleRef.current);
        baseAngleRef.current = w.baseAngle;
        waveErrorsRef.current = 0;
        waveLockedRef.current = false;
        setWaveCleared(false);
        setBaseAngle(w.baseAngle);
        bubblesRef.current = w.bubbles;
        setBubbles(w.bubbles);
      }, []);

      const startGame = () => {
        clearTimeout(waveTimeoutRef.current);
        baseAngleRef.current = null;
        setScore(0); setBaseScore(0); setCombo(0); setMaxCombo(0);
        setCorrectCount(0); setWrongCount(0);
        setWaveNum(1);
        setTimeLeft(maxTime); setFeedbackAnim('');
        setConceptTip(null);
        setBursts([]);
        setWrongFlash(false);
        setGameState('playing');
        spawnNextWave(0);
        audio.init();
      };

      useEffect(() => {
        if (gameState === 'playing' && !waveCleared) {
          timerRef.current = setInterval(() => {
            setTimeLeft(prev => {
              if (prev <= 0.1) {
                clearInterval(timerRef.current);
                audio.sfxTimeUp();
                setGameState('ended');
                return 0;
              }
              return +(prev - 0.1).toFixed(1);
            });
          }, 100);
        } else clearInterval(timerRef.current);
        return () => clearInterval(timerRef.current);
      }, [gameState, waveCleared]);

      useEffect(() => {
        if (gameState !== 'playing') {
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
          return;
        }
        let lastTime = performance.now();
        const step = (now) => {
          const dt = Math.min(0.05, (now - lastTime) / 1000);
          lastTime = now;

          if (!waveLockedRef.current && bubblesRef.current.length > 0) {
            const curScore = scoreRef.current;
            const speed = curScore >= starsThreshold[1] ? 11.0 : curScore >= starsThreshold[0] ? 9.5 : 8.0;
            let missedCorrect = false;
            const tSec = now / 1000;

            const updated = bubblesRef.current.map(b => {
              if (b.status !== 'active') return b;
              const nextY = b.y - speed * dt;
              const sway = Math.sin(tSec * 2.2 + b.swayPhase) * 1.8;
              if (nextY < -8 && b.isCorrect) missedCorrect = true;
              return { ...b, y: nextY, renderX: Math.max(10, Math.min(90, b.x + sway)) };
            });

            bubblesRef.current = updated;
            setBubbles(updated);

            if (missedCorrect) {
              waveLockedRef.current = true;
              setCombo(0);
              setConceptTip({ text: `漏掉同界角！與 ${baseAngleRef.current}° 相差 360° 整數倍才是正解`, id: Date.now() });
              bubblesRef.current = updated.map(b => b.status === 'active' ? { ...b, status: 'fade' } : b);
              setBubbles(bubblesRef.current);
              waveTimeoutRef.current = setTimeout(() => {
                setWaveNum(w => w + 1);
                spawnNextWave(scoreRef.current);
              }, 450);
            }
          }
          rafRef.current = requestAnimationFrame(step);
        };
        rafRef.current = requestAnimationFrame(step);
        return () => {
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
          clearTimeout(waveTimeoutRef.current);
        };
      }, [gameState, spawnNextWave]);

      const earnedStars = useMemo(() => {
        if (score >= starsThreshold[2]) return 3;
        if (score >= starsThreshold[1]) return 2;
        if (score >= starsThreshold[0]) return 1;
        return 0;
      }, [score]);

      useEffect(() => {
        if (gameState === 'ended' && earnedStars > currentStars) onUpdateStars(earnedStars, score);
      }, [gameState, earnedStars]);

      const handleBubbleTap = (bubble) => {
        if (gameState !== 'playing' || waveLockedRef.current || bubble.status !== 'active') return;
        if (bubble.isCorrect) {
          const mult = combo >= 6 ? 1.5 : combo >= 3 ? 1.2 : 1.0;
          const earned = Math.floor(100 * mult);
          const nextBubbles = bubblesRef.current.map(b => b.uid === bubble.uid ? { ...b, status: 'popped' } : b);
          const remainingCorrect = nextBubbles.filter(b => b.isCorrect && b.status === 'active').length;
          const stepIdx = 2 - remainingCorrect;
          audio.sfxBubblePop(stepIdx);

          const burstId = `${bubble.uid}-${Date.now()}`;
          const bx = bubble.renderX ?? bubble.x;
          const by = bubble.y;
          setBursts(prev => [...prev, { id: burstId, x: bx, y: by, isWaveEnd: remainingCorrect === 0 }]);
          setTimeout(() => {
            setBursts(prev => prev.filter(item => item.id !== burstId));
          }, 500);

          const newCombo = combo + 1;
          setCombo(newCombo);
          if (newCombo > maxCombo) setMaxCombo(newCombo);
          setBaseScore(b => b + 100);
          setCorrectCount(c => c + 1);
          setConceptTip(null);

          if (remainingCorrect === 0) {
            waveLockedRef.current = true;
            setWaveCleared(true);
            const clearBonus = waveErrorsRef.current === 0 ? 100 : 0;
            const newScore = score + earned + clearBonus;
            setScore(newScore);
            audio.sfxWaveClear();
            setFeedbackAnim('animate-correct');
            bubblesRef.current = nextBubbles.map(b => b.status === 'active' ? { ...b, status: 'fade' } : b);
            setBubbles(bubblesRef.current);
            waveTimeoutRef.current = setTimeout(() => {
              setFeedbackAnim('');
              setWaveNum(w => w + 1);
              spawnNextWave(newScore);
            }, 500);
          } else {
            setScore(s => s + earned);
            bubblesRef.current = nextBubbles;
            setBubbles(nextBubbles);
          }
        } else {
          audio.sfxError();
          waveErrorsRef.current += 1;
          setCombo(0);
          setWrongCount(w => w + 1);
          setScore(s => Math.max(0, s - 100));
          const timePenalty = +(maxTime * 0.03).toFixed(2);
          setTimeLeft(prev => {
            const nextT = Math.max(0, +(prev - timePenalty).toFixed(2));
            if (nextT <= 0) {
              clearInterval(timerRef.current);
              audio.sfxTimeUp();
              setGameState('ended');
            }
            return nextT;
          });
          bubblesRef.current = bubblesRef.current.map(b => b.uid === bubble.uid ? { ...b, status: 'wrong' } : b);
          setBubbles(bubblesRef.current);
          setConceptTip({
            text: `${bubble.angle}° 與 ${baseAngle}° 相差 ${Math.abs(bubble.angle - baseAngle)}°，非 360° 整數倍`,
            id: Date.now()
          });
          setFeedbackAnim('animate-shake');
          setWrongFlash(true);
          setTimeout(() => {
            setFeedbackAnim('');
            setWrongFlash(false);
          }, 350);
        }
      };

      const poppedCorrectCount = bubbles.filter(b => b.isCorrect && b.status === 'popped').length;
      const waveExtra = (
        <div className="flex flex-col items-center bg-fuchsia-50 border border-fuchsia-200 px-2 py-0.5 rounded-xl shrink-0">
          <span className="text-[8px] font-black text-fuchsia-500 uppercase leading-none">WAVE {waveNum}</span>
          <span className="text-xs font-black font-mono text-fuchsia-950 leading-tight">{poppedCorrectCount}/3</span>
        </div>
      );

      return (
        <div className="w-full h-full flex-1 flex flex-col justify-between pt-0.5 pb-1 relative animate-jelly min-h-0">
          {gameState === 'idle' && (
            <div className="flex-1 my-3 bg-white/95 rounded-3xl border-4 border-indigo-950 p-5 shadow-2xl flex flex-col justify-between text-center items-center">
              <div className="w-full space-y-2.5 pt-2">
                <div className="w-20 h-20 mx-auto rounded-3xl bg-fuchsia-100 border-4 border-fuchsia-500 flex items-center justify-center text-4xl shadow-inner animate-bounce">🫧</div>
                <h2 className="text-2xl font-black text-indigo-950 tracking-wide">同界角星爆</h2>
                <p className="text-xs text-slate-500 font-bold leading-relaxed max-w-xs mx-auto">
                  點破與上方基準角<span className="text-fuchsia-600 font-black">同界（相差 360° 整數倍）</span>的星光泡泡，放過陷阱泡泡！
                </p>
              </div>
              <CompactStarPills starsThreshold={starsThreshold} maxTime={maxTime} />
              <div className="w-full space-y-2">
                <button onClick={startGame} className="w-full py-4 btn-3d-purple text-white font-black text-lg rounded-2xl shadow-xl tracking-wider active:scale-95">🚀 開始 75 秒挑戰！</button>
                <button onClick={onBackToMap} className="w-full py-2 text-xs font-bold text-slate-400 hover:text-slate-600">返回聖域地圖</button>
              </div>
            </div>
          )}

          {gameState === 'playing' && (
            <div className={`flex-1 min-h-0 flex flex-col justify-between gap-2 overflow-hidden pb-0.5 ${feedbackAnim}`}>
              <GameHUD score={score} combo={combo} timeLeft={timeLeft} maxTime={maxTime} starsThreshold={starsThreshold} extraRight={waveExtra} />

              <div className={`flex-1 min-h-0 bg-gradient-to-b from-slate-950 via-indigo-950 to-purple-950 rounded-3xl border-3 border-indigo-950 shadow-xl flex flex-col overflow-hidden transition-all duration-150 ${wrongFlash ? 'ring-4 ring-red-500/75' : waveCleared ? 'ring-4 ring-emerald-400/75' : ''}`}>
                <div className="bg-slate-900/90 py-2 px-3.5 flex justify-between items-center text-white border-b-2 border-indigo-800/80 shrink-0">
                  <div className="flex items-center gap-2">
                    <span className="text-[11px] font-black text-fuchsia-300 bg-fuchsia-500/20 border border-fuchsia-400/40 px-2 py-0.5 rounded-lg">基準角</span>
                    <span className="text-2xl font-mono font-black text-amber-300 drop-shadow">{baseAngle}°</span>
                    <SuccessBadge show={waveCleared} />
                  </div>
                  <div className="flex items-center gap-1.5">
                    {[0, 1, 2].map(i => (
                      <span
                        key={i}
                        className={`w-3.5 h-3.5 rounded-full border-2 transition-all duration-200 ${
                          i < poppedCorrectCount
                            ? 'bg-emerald-400 border-white scale-110 shadow-[0_0_8px_rgba(52,211,153,0.9)]'
                            : 'bg-slate-800 border-slate-500'
                        }`}
                      />
                    ))}
                  </div>
                </div>

                <div className="relative w-full flex-1 min-h-0 overflow-hidden select-none">
                  {/* 夜空星塵 */}
                  {starsBg.map(s => (
                    <span
                      key={s.id}
                      style={{ left: s.left, top: s.top, width: `${s.size}px`, height: `${s.size}px`, '--tw-delay': s.delay, '--tw-dur': s.dur }}
                      className="pointer-events-none absolute rounded-full bg-indigo-100/75 animate-twinkle"
                    />
                  ))}
                  {/* 頂部警戒微光線 */}
                  <div className="pointer-events-none absolute inset-x-0 top-0 h-8 bg-gradient-to-b from-amber-400/12 to-transparent">
                    <div className="w-full h-[2px] bg-gradient-to-r from-transparent via-amber-400/65 to-transparent" />
                  </div>
                  {/* 清波極光閃爍 */}
                  {waveCleared && (
                    <div className="pointer-events-none absolute inset-0 bg-gradient-to-t from-emerald-400/15 via-amber-300/10 to-transparent animate-pulse" />
                  )}

                  <HintBanner tip={conceptTip} />

                  {/* 點破星芒爆開與擴散光環 */}
                  {bursts.map(burst => (
                    <div key={burst.id} style={{ left: `${burst.x}%`, top: `${burst.y}%` }} className="pointer-events-none absolute z-20">
                      <span
                        className={`absolute w-16 h-16 rounded-full border-2 animate-star-ring ${
                          burst.isWaveEnd
                            ? 'border-amber-300 shadow-[0_0_18px_rgba(252,211,77,0.85)]'
                            : 'border-emerald-300 shadow-[0_0_14px_rgba(110,231,183,0.8)]'
                        }`}
                      />
                      {[0, 60, 120, 180, 240, 300].map(deg => {
                        const rad = deg * Math.PI / 180;
                        const dist = burst.isWaveEnd ? 46 : 36;
                        return (
                          <span
                            key={deg}
                            style={{ '--tx': `${Math.cos(rad) * dist}px`, '--ty': `${Math.sin(rad) * dist}px` }}
                            className={`absolute w-2 h-2 rounded-full animate-star-spark ${
                              burst.isWaveEnd
                                ? 'bg-amber-300 shadow-[0_0_8px_rgba(252,211,77,0.95)]'
                                : 'bg-emerald-300 shadow-[0_0_8px_rgba(110,231,183,0.9)]'
                            }`}
                          />
                        );
                      })}
                    </div>
                  ))}

                  {bubbles.map((b) => {
                    const posX = b.renderX ?? b.x;
                    const isPopped = b.status === 'popped';
                    const isWrong = b.status === 'wrong';
                    const isFade = b.status === 'fade';
                    return (
                      <button
                        key={b.uid}
                        onClick={() => handleBubbleTap(b)}
                        style={{ left: `${posX}%`, top: `${b.y}%` }}
                        className={`absolute -translate-x-1/2 -translate-y-1/2 w-[66px] h-[66px] sm:w-[72px] sm:h-[72px] rounded-full flex items-center justify-center font-mono font-black text-sm sm:text-base border-2 transition-transform active:scale-90 ${
                          isPopped
                            ? 'bg-emerald-400 border-white text-emerald-950 scale-125 opacity-0 duration-200 pointer-events-none'
                            : isWrong
                            ? 'bg-red-500 border-red-200 text-white scale-90 opacity-0 duration-300 pointer-events-none'
                            : isFade
                            ? 'bg-indigo-800/40 border-indigo-400/30 text-indigo-200/40 scale-75 opacity-0 duration-300 pointer-events-none'
                            : 'backdrop-blur-md bg-gradient-to-br from-indigo-400/55 via-purple-600/60 to-fuchsia-600/65 border-fuchsia-200/80 text-white shadow-[inset_0_2px_6px_rgba(255,255,255,0.5),0_0_18px_rgba(167,139,250,0.55)] hover:scale-105 cursor-pointer'
                        }`}
                      >
                        {b.status === 'active' && (
                          <span className="pointer-events-none absolute top-1.5 left-2.5 w-3.5 h-2 rounded-full bg-white/55 rotate-[-28deg] blur-[0.5px]" />
                        )}
                        <span className="relative z-10 drop-shadow-[0_1px_2px_rgba(0,0,0,0.55)]">{b.angle}°</span>
                      </button>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          {gameState === 'ended' && (
            <LevelResultScreen
              score={score}
              baseScore={baseScore}
              earnedStars={earnedStars}
              maxCombo={maxCombo}
              correctCount={correctCount}
              wrongCount={wrongCount}
              maxTime={maxTime}
              accentClass="text-fuchsia-600"
              onCompleteLevel={onCompleteLevel}
              onRestart={startGame}
              onBackToMap={onBackToMap}
            />
          )}
        </div>
      );
    };

    // ==================== 第 8 關組件：動徑星標 ====================
    const Level6VectorCompassMaster = ({ currentStars, onUpdateStars, onCompleteLevel, onBackToMap }) => {
      const [gameState, setGameState] = useState('idle');
      const [pickOrder, setPickOrder] = useState('num');
      const [timeLeft, setTimeLeft] = useState(60);
      const [score, setScore] = useState(0);
      const [baseScore, setBaseScore] = useState(0);
      const [combo, setCombo] = useState(0);
      const [maxCombo, setMaxCombo] = useState(0);
      const [correctCount, setCorrectCount] = useState(0);
      const [wrongCount, setWrongCount] = useState(0);
      const [question, setQuestion] = useState(null);
      const [selectedNumerator, setSelectedNumerator] = useState(null);
      const [selectedDenominator, setSelectedDenominator] = useState(null);
      const [feedbackAnim, setFeedbackAnim] = useState('');
      const [floatingText, setFloatingText] = useState(null);
      const [isLockedSuccess, setIsLockedSuccess] = useState(false);
      const [wrongBtnKey, setWrongBtnKey] = useState(null);
      const [conceptTip, setConceptTip] = useState(null);

      const timerRef = useRef(null);
      const maxTime = 60;
      const starsThreshold = [600, 1200, 1800];

      const triggerFloat = (text, color) => {
        const id = Date.now();
        setFloatingText({ text, color, id });
        setTimeout(() => setFloatingText(prev => prev?.id === id ? null : prev), 800);
      };

      const nextQuestion = (curScore) => {
        const phase = curScore >= starsThreshold[1] ? 2 : curScore >= starsThreshold[0] ? 1 : 0;
        setQuestion(generateLevel6Question(phase));
        setSelectedNumerator(null);
        setSelectedDenominator(null);
        setConceptTip(null);
      };

      const startGame = (order = pickOrder) => {
        setPickOrder(order);
        setScore(0); setBaseScore(0); setCombo(0); setMaxCombo(0);
        setCorrectCount(0); setWrongCount(0);
        setTimeLeft(maxTime); setFeedbackAnim('');
        setSelectedNumerator(null); setSelectedDenominator(null);
        setIsLockedSuccess(false); setWrongBtnKey(null); setConceptTip(null);
        setGameState('playing');
        nextQuestion(0);
        audio.init();
      };

      useEffect(() => {
        if (gameState === 'playing') {
          timerRef.current = setInterval(() => {
            if (isLockedSuccess) return;
            setTimeLeft(prev => {
              if (prev <= 0.1) {
                clearInterval(timerRef.current);
                audio.sfxTimeUp();
                setGameState('ended');
                return 0;
              }
              return +(prev - 0.1).toFixed(1);
            });
          }, 100);
        } else clearInterval(timerRef.current);
        return () => clearInterval(timerRef.current);
      }, [gameState, isLockedSuccess]);

      const earnedStars = useMemo(() => {
        if (score >= starsThreshold[2]) return 3;
        if (score >= starsThreshold[1]) return 2;
        if (score >= starsThreshold[0]) return 1;
        return 0;
      }, [score]);

      useEffect(() => {
        if (gameState === 'ended' && earnedStars > currentStars) onUpdateStars(earnedStars, score);
      }, [gameState, earnedStars]);

      const handleInputKey = (key) => {
        if (gameState !== 'playing' || !question || isLockedSuccess) return;
        const firstKey = pickOrder === 'num' ? selectedNumerator : selectedDenominator;
        if (!firstKey) {
          audio.sfxSelect();
          if (pickOrder === 'num') setSelectedNumerator(key);
          else setSelectedDenominator(key);
        } else if (firstKey === key) {
          audio.sfxClick();
          setSelectedNumerator(null);
          setSelectedDenominator(null);
        } else {
          const numKey = pickOrder === 'num' ? firstKey : key;
          const denKey = pickOrder === 'num' ? key : firstKey;
          setSelectedNumerator(numKey);
          setSelectedDenominator(denKey);
          if (numKey === question.correctNumeratorKey && denKey === question.correctDenominatorKey) {
            audio.sfxBonus();
            setIsLockedSuccess(true);
            setConceptTip(null);
            const mult = combo >= 6 ? 1.5 : combo >= 3 ? 1.2 : 1.0;
            const earned = Math.floor(120 * mult);
            const newScore = score + earned;
            setScore(newScore);
            setBaseScore(b => b + 120);
            setCorrectCount(c => c + 1);
            const newCombo = combo + 1;
            setCombo(newCombo);
            if (newCombo > maxCombo) setMaxCombo(newCombo);
            triggerFloat(`+${earned}`, "text-cyan-400");
            setFeedbackAnim('animate-correct');
            setTimeout(() => { setIsLockedSuccess(false); setFeedbackAnim(''); nextQuestion(newScore); }, 1200);
          } else {
            audio.sfxError();
            setCombo(0);
            setWrongCount(w => w + 1);
            const timePenalty = +(maxTime * 0.03).toFixed(2);
            setTimeLeft(prev => {
              const nextT = Math.max(0, +(prev - timePenalty).toFixed(2));
              if (nextT <= 0) {
                clearInterval(timerRef.current);
                audio.sfxTimeUp();
                setGameState('ended');
              }
              return nextT;
            });
            setWrongBtnKey(key);
            setConceptTip({ text: question.conceptTip, id: Date.now() });
            triggerFloat(`-${timePenalty} 秒! 定義錯誤`, "text-red-500");
            setFeedbackAnim('animate-shake');
            setTimeout(() => { setFeedbackAnim(''); setSelectedNumerator(null); setSelectedDenominator(null); setWrongBtnKey(null); }, 400);
          }
        }
      };

      const getDisplayVal = (key) => !question ? '' : key === 'x' ? question.xVal : key === 'y' ? question.yVal : question.rVal;
      const isLv7NumTurn = (pickOrder === 'num' && !selectedNumerator) || (pickOrder === 'den' && selectedDenominator && !selectedNumerator);
      const isLv7DenTurn = (pickOrder === 'den' && !selectedDenominator) || (pickOrder === 'num' && selectedNumerator && !selectedDenominator);

      return (
        <div className="w-full h-full flex-1 flex flex-col justify-between pt-0.5 pb-1 relative animate-jelly min-h-0">

          {gameState === 'idle' && (
            <div className="flex-1 my-3 bg-white/95 rounded-3xl border-4 border-indigo-950 p-5 shadow-2xl flex flex-col justify-between text-center items-center">
              <div className="w-full space-y-2.5 pt-2">
                <div className="w-20 h-20 mx-auto rounded-3xl bg-cyan-100 border-4 border-cyan-500 flex items-center justify-center text-4xl shadow-inner animate-bounce">🎯</div>
                <h2 className="text-2xl font-black text-indigo-950 tracking-wide">動徑星標</h2>

              </div>
              <CompactStarPills starsThreshold={starsThreshold} maxTime={maxTime} />
              <div className="w-full space-y-2">
                <FractionOrderButtons onStartWithOrder={startGame} />
                <button onClick={onBackToMap} className="w-full py-2 text-xs font-bold text-slate-400 hover:text-slate-600">返回聖域地圖</button>
              </div>
            </div>

          {gameState === 'playing' && question && (
            <div className={`flex-1 min-h-0 flex flex-col justify-between gap-2 overflow-hidden pb-0.5 ${feedbackAnim}`}>
              <GameHUD score={score} combo={combo} timeLeft={timeLeft} maxTime={maxTime} starsThreshold={starsThreshold} timeStatusLabel={isLockedSuccess ? <span className="text-amber-500 font-black animate-pulse">(觀察中)</span> : null} />

              <div className={`flex-1 min-h-0 bg-white rounded-3xl border-3 border-indigo-950 shadow-xl flex flex-col overflow-hidden transition-all duration-150 ${isLockedSuccess ? 'ring-4 ring-emerald-400/75' : ''}`}>
                <div className="bg-gradient-to-r from-cyan-600 to-indigo-700 py-1.5 px-3.5 flex justify-between items-center text-white border-b-2 border-indigo-900 shrink-0">
                  <div className="flex items-center gap-2">
                    <span className="text-lg sm:text-2xl font-serif font-black shrink-0">{question.targetFunc}(θ) =</span>
                    <div className="flex flex-col items-center shrink-0">
                      <div
                        onClick={() => { if (selectedNumerator && !isLockedSuccess) { audio.sfxClick(); setSelectedNumerator(null); } }}

                      >
                        <span>{selectedNumerator ? `${selectedNumerator} (${getDisplayVal(selectedNumerator)})` : '分子'}</span>
                      </div>
                      <div className="w-full h-0.5 bg-white/70 my-0.5"></div>
                      <div
                        onClick={() => { if (selectedDenominator && !isLockedSuccess) { audio.sfxClick(); setSelectedDenominator(null); } }}
                        className={`min-w-[54px] px-2 h-6 rounded-lg border-2 flex items-center justify-center font-bold text-xs transition-all ${

                      >
