      const { showGuide, guideMode, openGuide, dismissGuide } = useLevelGuide(currentStars, hasSeenGuide, onMarkGuideSeen);

      const containerRef = useRef(null);
      const valBagRef = useRef([]);
      const lastValRef = useRef(null);
      const stepMissedRef = useRef(false);
      const confirmTimerRef = useRef(null);
      const pendingNextRef = useRef(null);
      const handleConfirmSkip = () => {
        if (!pendingNextRef.current) return;
        clearTimeout(confirmTimerRef.current);
        const fn = pendingNextRef.current;
        pendingNextRef.current = null;
        audio.sfxClick();
        fn();
      };
      useEffect(() => () => clearTimeout(confirmTimerRef.current), []);


      const nextQuestion = (curProg) => {
        const phase = curProg >= starsThreshold[1] ? 2 : curProg >= starsThreshold[0] ? 1 : 0;
        if (valBagRef.current.length === 0) {
          const fresh = shuffle([...LV4_VALS]);
          if (fresh.length > 1 && fresh[0] === lastValRef.current) {
            [fresh[0], fresh[fresh.length - 1]] = [fresh[fresh.length - 1], fresh[0]];
          }
          valBagRef.current = fresh;
        }
        const nextVal = valBagRef.current.shift();
        lastValRef.current = nextVal;
        const q = generateLevel4Question(phase, nextVal);
        stepMissedRef.current = false;
        setQuestion(q);
        setSelFunc(q.initFunc);
        setSelDeg(q.initDeg);
        setSolvedKeys([]);
        setIsSolved(false);
        setConceptTip(null);
      };

      const startGame = () => {
        valBagRef.current = [];
        lastValRef.current = null;
        stepMissedRef.current = false;
        setFeedbackAnim('');
        setSolvedKeys([]); setIsSolved(false); setWrongLock(false); setConceptTip(null);
        const initProg = startSession();
        nextQuestion(initProg);
        audio.init();
      };

      useEffect(() => {
        startGame();
      }, []);

      const lv4CoachSteps = useMemo(() => ([
        {
          tap: false,
          desc: '看上方目標等式與特殊角三角形比例',
          targets: [
            { target: 'lv4-eq', anchorX: 0.5, anchorY: 0.5, pad: 6, shape: 'ellipse' },
            { target: 'lv4-tri', anchorX: 0.5, anchorY: 0.5, pad: 38, minW: 240, minH: 210, shape: 'ellipse' }
          ]
        },
        {
          target: 'lv4-wheel',
          anchorX: 0.5,
          anchorY: 0.5,
          pad: 6,
          shape: 'pill',
          tap: true,
          desc: '上下撥動未鎖定的函數或角度轉輪'
        },
        {
          target: 'lv4-unlock',
          anchorX: 0.5,
          anchorY: 0.5,
          pad: 6,
          shape: 'pill',
          tap: true,
          desc: '調好後點擊右側聖印開鎖！'
        }
      ]), []);

      const stepWheel = (slot, dir) => {
        if (gameState !== 'playing' || !question || isSolved || wrongLock || (!isRelaxMode && lives <= 0)) return;
        if (slot === 'func' && question.lockType === 'func') return;
        if (slot === 'deg' && question.lockType === 'deg') return;
        audio.sfxClick();
        if (slot === 'func') {
          setSelFunc(prev => LV4_FUNCS[(LV4_FUNCS.indexOf(prev) + dir + LV4_FUNCS.length) % LV4_FUNCS.length]);
        } else {
          setSelDeg(prev => LV4_DEGS[(LV4_DEGS.indexOf(prev) + dir + LV4_DEGS.length) % LV4_DEGS.length]);
        }
      };

      const handleUnlock = () => {
        if (gameState !== 'playing' || !question || isSolved || wrongLock || (!isRelaxMode && lives <= 0)) return;
        const pairKey = `${selFunc}_${selDeg}`;
        const actualVal = SPECIAL_RATIO_MAP[pairKey];

        if (actualVal === question.lockedVal) {
          if (showGuide) dismissGuide();
          const wasMissed = stepMissedRef.current;
          stepMissedRef.current = false;
          setSolvedKeys([pairKey]);
          audio.sfxBonus();
          setIsSolved(true);
          setFeedbackAnim('animate-correct');
          setConceptTip(null);
          const confirmDur = question.phase >= 1 ? 1350 : 750;
          const { completed, nextProgress } = recordCorrect({ wasMissed, delayEndMs: confirmDur });
          if (!completed) {
            const advanceFn = () => {
              pendingNextRef.current = null;
              setFeedbackAnim('');
              nextQuestion(nextProgress);
            };
            pendingNextRef.current = advanceFn;
            confirmTimerRef.current = setTimeout(advanceFn, confirmDur);
          } else {
            setTimeout(() => setFeedbackAnim(''), confirmDur);
          }
        } else {
          audio.sfxError();
          stepMissedRef.current = true;
          const { gameOver } = recordWrong({ delayEndMs: 520 });
          setWrongLock(true);
          const rawHintMap = { '√2/2': '1/√2', '√3/3': '1/√3' };
          const rawStr = rawHintMap[actualVal];
          setConceptTip({
            node: (
              <span className="inline-flex items-center gap-1.5 font-serif font-black flex-wrap justify-center">
                <span>{selFunc}({selDeg}°) ＝</span>
                {rawStr && (
                  <>
                    <FracText value={rawStr} size="sm" barClass="bg-amber-950" />
                    <span>＝</span>
                  </>
                )}
                <FracText value={actualVal} size="sm" barClass="bg-amber-950" />
                <span>，目標鎖印為</span>
                <FracText value={question.lockedVal} size="sm" barClass="bg-amber-950" />
              </span>
            ),
            id: Date.now()
          });
          setFeedbackAnim('animate-shake');
          if (!gameOver) {
            setTimeout(() => { setFeedbackAnim(''); setWrongLock(false); }, 400);
          }
        }
      };

      const triData = useMemo(() => {
        if (!question) return null;
        return buildGoldTriangleData(selDeg, selFunc, question.flip);
      }, [selDeg, selFunc, question]);

      const phase = question?.phase ?? 0;
      const showDiagram = phase < 2 || isSolved;
      const showEdgeNumbers = phase === 0 || isSolved;
      const unlockedFunc = solvedKeys.length > 0 ? solvedKeys[0].split('_')[0] : null;

      return (
        <div ref={containerRef} className="w-full h-full flex-1 flex flex-col justify-between pt-0.5 pb-1 relative animate-jelly min-h-0">

          {gameState === 'idle' && (
            <div className="flex-1 my-3 bg-white/95 rounded-3xl border-4 border-amber-900 p-5 shadow-2xl flex flex-col justify-between text-center items-center">
              <div className="w-full space-y-2.5 pt-2">
                <div className="w-20 h-20 mx-auto rounded-3xl bg-amber-100 border-4 border-amber-500 flex items-center justify-center text-4xl shadow-inner animate-bounce">☀️</div>
                <h2 className="text-2xl font-black text-amber-950 tracking-wide">黃金神殿密碼輪</h2>
                <p className="text-xs text-slate-500 font-bold leading-relaxed max-w-xs mx-auto">
                  上下撥動左側兩組<span className="text-amber-600 font-black">石柱滾輪</span>對齊目標值，再按下右側<span className="text-slate-900 font-black">黑曜石聖印開鎖</span>！前段提供即時聯動三角投影，高分後進入盲鎖試煉！
                </p>
              </div>
              <CompactStarPills starsThreshold={starsThreshold} livesMode maxLives={maxLives} />
              <div className="w-full space-y-2">
                <button onClick={startGame} className="w-full py-4 btn-3d-yellow text-amber-950 font-black text-lg rounded-2xl shadow-xl tracking-wider active:scale-95">{isRelaxMode ? '🌱 開始休閒練習！' : '🔓 開始試煉！'}</button>
                <button onClick={onBackToMap} className="w-full py-2 text-xs font-bold text-slate-400 hover:text-slate-600">返回聖域地圖</button>
              </div>
            </div>
          )}

          {gameState === 'playing' && question && triData && (
            <div className={`flex-1 min-h-0 flex flex-col justify-between gap-2 overflow-hidden pb-0.5 ${feedbackAnim}`}>
              <GameHUD
                progress={progress}
                starsThreshold={starsThreshold}
                lives={lives}
                maxLives={maxLives}
                healStreak={healStreak}
                healTarget={healTarget}
                onManualEnd={finishNow}
                onOpenGuide={openGuide}
              />

              <div className={`flex-1 min-h-0 bg-white rounded-3xl border-3 border-amber-900 shadow-xl flex flex-col overflow-hidden transition-all duration-150 ${isSolved ? 'ring-4 ring-emerald-400/75' : ''}`}>
                <StagePhaseStrip phase={progress >= starsThreshold[1] ? 2 : progress >= starsThreshold[0] ? 1 : 0} labels={['邊長實景 • 附比例數字', '輪廓心算 • 隱藏邊長數字', '盲鎖熟記 • 隱藏輔助三角形']} />
                <div data-coach="lv4-eq" className="bg-gradient-to-r from-amber-500 to-yellow-600 h-[48px] px-3.5 flex items-center justify-center gap-2 text-amber-950 border-b-2 border-amber-700 shrink-0">
                  <div className="flex items-center gap-2 font-serif font-black text-lg sm:text-xl">
                    <span className={isSolved ? 'text-emerald-950' : 'text-amber-950'}>
                      {selFunc}({selDeg}°) {isSolved ? '=' : '≟'}
                    </span>
                    <span className={`px-2.5 py-0.5 rounded-lg border-2 transition-all inline-flex items-center ${
                      isSolved
                        ? 'bg-emerald-400 border-emerald-200 text-emerald-950 scale-105'
                        : 'bg-white/85 border-amber-700/35 text-amber-950'
                    }`}>
                      <FracText value={question.lockedVal} size="sm" />
                    </span>
                    <SuccessBadge show={isSolved} />
                  </div>
                </div>

                <div onClick={handleConfirmSkip} className="relative w-full flex-1 min-h-0 bg-gradient-to-b from-amber-50/40 to-white flex items-center justify-center overflow-hidden">
                  <HintBanner tip={conceptTip} />
                  {showDiagram ? (
                    <svg viewBox="0 0 500 500" className="w-full h-full object-contain drop-shadow-md">
                        <TriangleBlueprintBg id="triGridLv4" />
                        <polygon data-coach="lv4-tri" points={`${triData.pts.P1.x},${triData.pts.P1.y} ${triData.pts.P2.x},${triData.pts.P2.y} ${triData.pts.P3.x},${triData.pts.P3.y}`} fill="#fffbeb" stroke="none" />
                        <polygon points={triData.rightAngleSquare} fill="#fef08a" stroke="#ca8a04" strokeWidth="2.5" />
                        <TriangleAngleArc d={triData.arcPath} />

                        {triData.edges.map((edge, idx) => {
                          const isNum = edge.role === 'num';
                          const isDen = edge.role === 'den';
                          const strokeCol = isNum ? '#10b981' : isDen ? '#0284c7' : '#94a3b8';
                          const circleFill = isNum ? '#ecfdf5' : isDen ? '#f0f9ff' : '#f8fafc';
                          const textCol = isNum ? '#047857' : isDen ? '#0369a1' : '#64748b';
                          return (
                            <g key={idx}>
                              <line
                                x1={edge.p1.x} y1={edge.p1.y} x2={edge.p2.x} y2={edge.p2.y}
                                stroke={strokeCol}
                                strokeWidth={isNum || isDen ? '12' : '8'}
                                strokeLinecap="round"
                              />
                              {showEdgeNumbers && (
                                <g>
                                  <circle cx={edge.midPt.x} cy={edge.midPt.y} r="21" fill={circleFill} stroke={strokeCol} strokeWidth="3.5" />
                                  <text x={edge.midPt.x} y={edge.midPt.y + 1} fill={textCol} fontSize="19" fontWeight="900" textAnchor="middle" dominantBaseline="middle" className="font-serif pointer-events-none">
                                    {edge.text}
                                  </text>
                                </g>
                              )}
                            </g>
                          );
                        })}

                        <text x={triData.degLabel.x} y={triData.degLabel.y} fill="#b45309" fontSize="28" fontWeight="900" textAnchor="middle" dominantBaseline="middle" className="font-serif drop-shadow pointer-events-none">
                          {triData.degLabel.text}
                        </text>
                      </svg>
                  ) : (
                    <div className="flex flex-col items-center justify-center text-center px-6 py-4 gap-2">
                      <div className="w-16 h-16 rounded-full bg-amber-100 border-4 border-amber-400 flex items-center justify-center text-3xl shadow-inner animate-pulse">☀️</div>
                      <div className="text-sm font-black text-amber-900">神殿盲鎖試煉</div>
                      <div className="text-xs font-bold text-slate-500">輔助投影已隱藏，請撥動滾輪並點擊右側聖印開鎖！</div>
                    </div>
                  )}
                </div>

                {/* 懸空黃金密碼筒（Cryptex 實體輪廓＋底部落地投影） */}
                <div className="bg-gradient-to-b from-white to-amber-50/80 pt-1.5 pb-3 px-3 shrink-0 flex flex-col items-center">
                  <div className="relative w-full max-w-[332px] flex items-center justify-center">
                    {/* 貫穿金屬圓柱軸心（位於滾筒後方，兩顆滾筒上下微凸出軸心） */}
                    <div
                      className="pointer-events-none absolute inset-x-3 h-[74px] rounded-full border border-amber-900/60 shadow-[0_10px_18px_rgba(69,26,3,0.28),inset_0_1px_0_rgba(255,255,255,0.45)]"
                      style={{ background: 'linear-gradient(180deg, #78350f 0%, #b45309 22%, #fde68a 42%, #b45309 68%, #451a03 100%)' }}
                    />

                    {/* 左端圓弧銅蓋（帶上下鉚釘） */}
                    <div
                      className="relative z-10 w-5 h-[78px] rounded-l-full border-y border-l border-amber-800/80 flex flex-col items-center justify-between py-3 shadow-[inset_2px_0_4px_rgba(255,255,255,0.4)] shrink-0"
                      style={{ background: 'linear-gradient(180deg, #78350f 0%, #d97706 32%, #fef3c7 46%, #b45309 72%, #451a03 100%)' }}
                    >
                      <span className="w-1.5 h-1.5 rounded-full bg-amber-950/70 shadow-[0_1px_0_rgba(255,255,255,0.5)]" />
                      <span className="w-1.5 h-1.5 rounded-full bg-amber-950/70 shadow-[0_1px_0_rgba(255,255,255,0.5)]" />
                    </div>

                    {/* 中央雙滾筒（上下微凸出金屬軸心） */}
                    <div data-coach="lv4-wheel" className="relative z-20 flex-1 grid grid-cols-2 gap-1.5 px-1 touch-none">
                      <TempleDrumWheel
                        label="函數"
                        options={LV4_FUNCS}
                        value={selFunc}
                        locked={question.lockType === 'func'}
                        disabled={isSolved || wrongLock || question.lockType === 'func'}
                        onStep={(dir) => stepWheel('func', dir)}
                      />
                      <TempleDrumWheel
                        label="角度"
                        options={LV4_DEGS}
                        value={selDeg}
                        formatOption={(d) => `${d}°`}
                        locked={question.lockType === 'deg'}
                        disabled={isSolved || wrongLock || question.lockType === 'deg'}
                        onStep={(dir) => stepWheel('deg', dir)}
                      />
                    </div>

                    {/* 右端可彈開黑曜石鎖栓（開鎖向右彈開一段距離） */}
                    <button
                      type="button"
                      data-coach="lv4-unlock"
                      onClick={handleUnlock}
                      disabled={isSolved || wrongLock}
                      className={`relative z-10 w-[86px] h-[82px] rounded-r-[24px] rounded-l-lg border-2 px-2 py-1.5 flex flex-col items-center justify-between transition-all duration-300 select-none cursor-pointer shrink-0 ${
                        isSolved
                          ? 'translate-x-2.5 bg-gradient-to-b from-emerald-600 via-emerald-800 to-emerald-950 border-emerald-300 shadow-[0_0_18px_rgba(52,211,153,0.75)]'
                          : wrongLock
                          ? 'bg-gradient-to-b from-rose-700 to-rose-950 border-rose-400 btn-wrong-flash'
                          : 'bg-gradient-to-b from-slate-700 via-slate-900 to-stone-950 border-amber-400 shadow-[0_6px_12px_rgba(0,0,0,0.45),inset_0_1px_0_rgba(253,230,138,0.45)] hover:brightness-110 active:translate-x-1'
                      }`}
                    >
                      <span className="text-[9px] font-black text-amber-300/85 tracking-wider">
                        {isSolved ? '✨ 已彈開' : '🔓 開鎖'}
                      </span>
                      <div className="font-serif font-black text-xl text-amber-200 drop-shadow flex items-center justify-center">
                        <FracText value={question.lockedVal} size="md" barClass="bg-amber-200" />
                      </div>
                      <span className="w-6 h-1 rounded-full bg-amber-400/60" />
                    </button>
                  </div>

                  {/* 懸空落地投影 */}
                  <div className="w-[74%] max-w-[248px] h-3 rounded-full bg-amber-950/25 blur-sm mt-2 pointer-events-none" />
                </div>
              </div>
              <CoachOverlay
                containerRef={containerRef}
                active={guideMode === 'manual' || (gameState === 'playing' && showGuide && !isSolved)}
            mode={guideMode || 'spotlight'}
                steps={lv4CoachSteps}
                onDismiss={dismissGuide}
              />
            </div>
          )}

          {gameState === 'ended' && (
            <LevelResultScreen
              score={finalScore}
              baseScore={baseScore}
              earnedStars={earnedStars}
              correctCount={correctCount}
              wrongCount={wrongCount}
              lives={lives}
              progress={progress}
              targetTotal={starsThreshold[2]}
              elapsedSec={elapsedSec}
              lifeBonus={lifeBonus}
              accuracyBonus={accuracyBonus}
              speedBonus={speedBonus}
              accentClass="text-amber-600"
              onCompleteLevel={onCompleteLevel}
              onRestart={startGame}
              onBackToMap={onBackToMap}
            />
          )}
        </div>
      );
    };


    // ==================== 第 5 關組件：三大關係試煉（雙欄等式速配｜直式化＋反例提示） ====================
    const renderLv5CardLabel = (label, fracParts = null) => {
      if (fracParts) {
        return (
          <span className="inline-flex flex-col items-center leading-none">
            <span className="px-1.5 pb-0.5 border-b-2 border-current">{fracParts[0]}</span>
            <span className="px-1.5 pt-0.5">{fracParts[1]}</span>
          </span>
        );
      }
      return <span>{label}</span>;
    };

    const buildLv5RelationsWave = (phase, bagRef = null) => {
      const ref1 = [15, 20, 25, 34, 40, 50, 65, 72][Math.floor(Math.random() * 8)];
      const ref2 = [18, 22, 28, 35, 55, 62, 70, 75][Math.floor(Math.random() * 8)];
      const comp1 = 90 - ref1;
      const comp2 = 90 - ref2;

      const pools = {
        0: [
          { id: 'p0_comp_s', left: `sin ${ref1}°`, right: `cos ${comp1}°`, valKey: `cos_${comp1}`, traps: [{ valKey: `sin_${comp1}`, label: `sin ${comp1}°` }, { valKey: `cos_${ref1}`, label: `cos ${ref1}°` }], tip: `餘角互換：sin(${ref1}°) = cos(90° - ${ref1}°) = cos ${comp1}°` },
          { id: 'p0_comp_c', left: `cos ${ref2}°`, right: `sin ${comp2}°`, valKey: `sin_${comp2}`, traps: [{ valKey: `cos_${comp2}`, label: `cos ${comp2}°` }, { valKey: `sin_${ref2}`, label: `sin ${ref2}°` }], tip: `餘角互換：cos(${ref2}°) = sin(90° - ${ref2}°) = sin ${comp2}°` },
          { id: 'p0_sq_num', left: `sin²${ref1}° + cos²${ref1}°`, right: '1', valKey: 'const_1_num', traps: [{ valKey: 'sin_plus_cos', label: 'sin θ + cos θ' }, { valKey: 'const_2', label: '2' }], tip: '平方關係：代入 3-4-5 得 (3/5)² + (4/5)² = 9/25 + 16/25 = 1' },
          { id: 'p0_sq_th', left: 'sin²θ + cos²θ', right: '1', valKey: 'const_1_th', traps: [{ valKey: 'sin_plus_cos', label: 'sin θ + cos θ' }, { valKey: 'const_0', label: '0' }], tip: '平方關係：sin²θ + cos²θ = 1（若沒平方：3/5 + 4/5 = 7/5 ≠ 1）' },
          { id: 'p0_quo_num', left: `sin ${ref2}° / cos ${ref2}°`, frac: [`sin ${ref2}°`, `cos ${ref2}°`], right: `tan ${ref2}°`, valKey: `tan_${ref2}`, traps: [{ valKey: `tan_${comp2}`, label: `tan ${comp2}°` }, { valKey: `sin_${ref2}`, label: `sin ${ref2}°` }], tip: `商數關係：代入 3-4-5 為 (3/5)÷(4/5) = 3/4 = tan ${ref2}°` },
          { id: 'p0_quo_th', left: 'sin θ / cos θ', frac: ['sin θ', 'cos θ'], right: 'tan θ', valKey: 'tan_th', traps: [{ valKey: 'sin_th', label: 'sin θ' }, { valKey: 'cos_th', label: 'cos θ' }], tip: '商數關係：tan θ = sin θ / cos θ（斜邊約分消去）' }
        ],
        1: [
          { id: 'p1_sq_c', left: '1 - sin²θ', right: 'cos²θ', valKey: 'cos2_th', traps: [{ valKey: 'cos_th', label: 'cos θ' }, { valKey: 'one_minus_sin', label: '1 - sin θ' }], tip: '平方移項：代入 3-4-5 為 1 - (3/5)² = 16/25 = cos²θ' },
          { id: 'p1_sq_s', left: `1 - cos²${ref1}°`, right: `sin²${ref1}°`, valKey: `sin2_${ref1}`, traps: [{ valKey: `sin_${ref1}`, label: `sin ${ref1}°` }, { valKey: `cos2_${ref1}`, label: `cos²${ref1}°` }], tip: `平方移項：代入 3-4-5 為 1 - (4/5)² = 9/25 = sin²${ref1}°` },
          { id: 'p1_sq_comp', left: `1 - sin²${ref2}°`, right: `sin²${comp2}°`, valKey: `sin2_${comp2}`, traps: [{ valKey: `sin_${comp2}`, label: `sin ${comp2}°` }, { valKey: `cos_${ref2}`, label: `cos ${ref2}°` }], tip: `平方＋餘角：1 - sin²${ref2}° = cos²${ref2}° = sin²${comp2}°` },
          { id: 'p1_mul', left: 'tan θ · cos θ', right: 'sin θ', valKey: 'sin_th', traps: [{ valKey: 'cos_th', label: 'cos θ' }, { valKey: 'tan2_th', label: 'tan²θ' }], tip: '商數移項：代入 3-4-5 為 (3/4)×(4/5) = 3/5 = sin θ' },
          { id: 'p1_quo_sq', left: 'sin²θ / cos²θ', frac: ['sin²θ', 'cos²θ'], right: 'tan²θ', valKey: 'tan2_th', traps: [{ valKey: 'tan_th', label: 'tan θ' }, { valKey: 'const_1_q', label: '1' }], tip: '商數平方：代入 3-4-5 為 (9/25)÷(16/25) = 9/16 = (3/4)² = tan²θ' },
          { id: 'p1_div', left: `sin ${ref1}° / tan ${ref1}°`, frac: [`sin ${ref1}°`, `tan ${ref1}°`], right: `cos ${ref1}°`, valKey: `cos_${ref1}`, traps: [{ valKey: `sin_${ref1}`, label: `sin ${ref1}°` }, { valKey: `tan_${ref1}`, label: `tan ${ref1}°` }], tip: `商數移項：代入 3-4-5 為 (3/5)÷(3/4) = 4/5 = cos ${ref1}°` },
          { id: 'p1_comp_sq1', left: `sin²${ref1}° + sin²${comp1}°`, right: '1', valKey: 'const_1_a', traps: [{ valKey: 'const_2', label: '2' }, { valKey: 'const_0', label: '0' }], tip: `餘角＋平方：sin ${comp1}° = cos ${ref1}°，故平方和 = 1` },
          { id: 'p1_comp_sq2', left: `cos²${ref2}° + cos²${comp2}°`, right: '1', valKey: 'const_1_b', traps: [{ valKey: 'const_2', label: '2' }, { valKey: 'sin_plus_cos', label: 'sin θ + cos θ' }], tip: `餘角＋平方：cos ${comp2}° = sin ${ref2}°，故平方和 = 1` },
          { id: 'p1_sq_zero', left: '(1 - sin²θ) - cos²θ', right: '0', valKey: 'const_0_z', traps: [{ valKey: 'const_1_z', label: '1' }, { valKey: 'neg_1', label: '-1' }], tip: '代入 3-4-5：(1 - 9/25) - 16/25 = 0' }
        ],
        2: [
          { id: 'p2_exp', left: '(sin θ + cos θ)² - 2sin θ cos θ', right: '1', valKey: 'const_1_a', traps: [{ valKey: 'const_0', label: '0' }, { valKey: 'two_sc', label: '2sin θ cos θ' }], tip: '代入 3-4-5：(3/5+4/5)² - 2(3/5)(4/5) = 49/25 - 24/25 = 1' },
          { id: 'p2_comp_tan1', left: `sin ${ref1}° / sin ${comp1}°`, frac: [`sin ${ref1}°`, `sin ${comp1}°`], right: `tan ${ref1}°`, valKey: `tan_${ref1}`, traps: [{ valKey: `tan_${comp1}`, label: `tan ${comp1}°` }, { valKey: `cos_${ref1}`, label: `cos ${ref1}°` }], tip: `餘角＋商數：分母 sin ${comp1}° = cos ${ref1}°，比值即 tan ${ref1}°` },
          { id: 'p2_comp_tan2', left: `cos ${ref2}° / cos ${comp2}°`, frac: [`cos ${ref2}°`, `cos ${comp2}°`], right: `tan ${comp2}°`, valKey: `tan_${comp2}`, traps: [{ valKey: `tan_${ref2}`, label: `tan ${ref2}°` }, { valKey: `sin_${comp2}`, label: `sin ${comp2}°` }], tip: `餘角＋商數：分子 cos ${ref2}° = sin ${comp2}°，比值即 tan ${comp2}°` },
          { id: 'p2_red_s', left: '(1 - cos²θ) / sin θ', frac: ['1 - cos²θ', 'sin θ'], right: 'sin θ', valKey: 'sin_th', traps: [{ valKey: 'sin2_th', label: 'sin²θ' }, { valKey: 'cos_th', label: 'cos θ' }], tip: '分子 1 - cos²θ = sin²θ，約分後得 sin θ' },
          { id: 'p2_red_c', left: '(1 - sin²θ) / cos θ', frac: ['1 - sin²θ', 'cos θ'], right: 'cos θ', valKey: 'cos_th', traps: [{ valKey: 'cos2_th', label: 'cos²θ' }, { valKey: 'sin_th', label: 'sin θ' }], tip: '分子 1 - sin²θ = cos²θ，約分後得 cos θ' },
          { id: 'p2_sq_diff', left: 'cos²θ - (1 - sin²θ)', right: '0', valKey: 'const_0', traps: [{ valKey: 'const_1', label: '1' }, { valKey: 'neg_1', label: '-1' }], tip: '代入 3-4-5：16/25 - (1 - 9/25) = 0' },
          { id: 'p2_tan_sq', left: 'tan²θ · cos²θ', right: 'sin²θ', valKey: 'sin2_th', traps: [{ valKey: 'cos2_th', label: 'cos²θ' }, { valKey: 'sin_th', label: 'sin θ' }], tip: '代入 3-4-5：(3/4)² × (4/5)² = 9/25 = sin²θ' },
          { id: 'p2_sq_sub', left: '(sin θ - cos θ)² + 2sin θ cos θ', right: '1', valKey: 'const_1_b', traps: [{ valKey: 'const_0', label: '0' }, { valKey: 'neg_1', label: '-1' }], tip: '展開為 sin²θ - 2sinθcosθ + cos²θ + 2sinθcosθ = 1' },
          { id: 'p2_comp_mul', left: `sin ${ref1}° · tan ${comp1}°`, right: `cos ${ref1}°`, valKey: `cos_${ref1}`, traps: [{ valKey: `sin_${ref1}`, label: `sin ${ref1}°` }, { valKey: `tan_${ref1}`, label: `tan ${ref1}°` }], tip: `餘角＋商數：tan ${comp1}° = sin ${comp1}°/cos ${comp1}° = cos ${ref1}°/sin ${ref1}°，約去 sin ${ref1}° 得 cos ${ref1}°` },
          { id: 'p2_sq_sum2', left: '(sin θ + cos θ)² + (sin θ - cos θ)²', right: '2', valKey: 'const_2', traps: [{ valKey: 'const_1_s2', label: '1' }, { valKey: 'const_4', label: '4' }], tip: '展開交叉項消去：2(sin²θ + cos²θ) = 2（代入 3-4-5：49/25 + 1/25 = 50/25 = 2）' }
        ]
      };

      const distractorPool = [
        { valKey: 'const_0', label: '0' },
        { valKey: 'const_2', label: '2' },
        { valKey: 'tan2_th', label: 'tan²θ' },
        { valKey: 'sin_plus_cos', label: 'sin θ + cos θ' },
        { valKey: 'neg_1', label: '-1' },
        { valKey: `sin_${ref1}`, label: `sin ${ref1}°` },
        { valKey: `cos_${ref2}`, label: `cos ${ref2}°` }
      ];

      const pool = pools[phase] || pools[0];
      const byId = Object.fromEntries(pool.map(p => [p.id, p]));
      const targetPairs = 3;
      const extraDistractors = 3;

      if (bagRef) {
        if (!bagRef[phase] || bagRef[phase].length === 0) {
          bagRef[phase] = shuffle(pool.map(p => p.id));
        }
      }

      const chosen = [];
      const usedValKeys = new Set();
      const usedLabels = new Set();

      if (phase === 0 && bagRef && bagRef[0].length >= 3) {
        // Phase 0 保底每波各含 1 餘角 + 1 平方 + 1 商數，避免兩題答案為 1 同波衝突
        const groups = [['p0_comp_s', 'p0_comp_c'], ['p0_sq_num', 'p0_sq_th'], ['p0_quo_num', 'p0_quo_th']];
        const pickedIds = [];
        for (const grp of groups) {
          const idxInBag = bagRef[0].findIndex(id => grp.includes(id));
          const chosenId = idxInBag >= 0 ? bagRef[0].splice(idxInBag, 1)[0] : grp[0];
          const item = byId[chosenId];
          if (item) {
            pickedIds.push(chosenId);
            usedValKeys.add(item.valKey);
            usedLabels.add(item.right);
            chosen.push(item);
          }
        }
      } else {
        const skipped = [];
        const maxChecks = bagRef ? bagRef[phase].length : pool.length;

        for (let step = 0; step < maxChecks && chosen.length < targetPairs; step++) {
          const nextId = bagRef ? bagRef[phase].shift() : pool[step].id;
          const item = byId[nextId];
          if (!item) continue;
          if (!usedValKeys.has(item.valKey) && !usedLabels.has(item.right)) {
            usedValKeys.add(item.valKey);
            usedLabels.add(item.right);
            chosen.push(item);
          } else {
            skipped.push(nextId);
          }
        }
        if (bagRef && skipped.length > 0) {
          bagRef[phase].push(...skipped);
        }
        while (chosen.length < targetPairs) {
          const refill = shuffle(pool);
          const fallback = refill.find(it => !usedValKeys.has(it.valKey) && !usedLabels.has(it.right));
          if (!fallback) break;
          usedValKeys.add(fallback.valKey);
          usedLabels.add(fallback.right);
          chosen.push(fallback);
        }
      }

      const trapCandidates = shuffle(chosen.flatMap(item => item.traps || []));
      const chosenTraps = [];
      for (const t of [...trapCandidates, ...shuffle(distractorPool)]) {
        if (chosenTraps.length >= extraDistractors) break;
        if (!usedValKeys.has(t.valKey) && !usedLabels.has(t.label)) {
          usedValKeys.add(t.valKey);
          usedLabels.add(t.label);
          chosenTraps.push({ valKey: t.valKey, label: t.label, isDistractor: true });
        }
      }

      const now = Date.now();
      const leftCards = shuffle(chosen).map((item, idx) => ({
        uid: `L5_${now}_${idx}`,
        id: item.id,
        valKey: item.valKey,
        label: item.left,
        frac: item.frac || null,
        tip: item.tip
      }));
      const rightCards = shuffle([
        ...chosen.map(item => ({ valKey: item.valKey, label: item.right, isDistractor: false })),
        ...chosenTraps
      ]).map((item, idx) => ({
        uid: `R5_${now}_${idx}`,
        valKey: item.valKey,
        label: item.label,
        isDistractor: item.isDistractor
      }));

      return { leftCards, rightCards };
    };

    const Level5TrigRelationsMaster = ({ currentStars, hasSeenGuide = false, onMarkGuideSeen, onUpdateStars, onCompleteLevel, onBackToMap }) => {
      const { isRelaxMode } = React.useContext(GameModeContext);
      const starsThreshold = [2, 4, 6];
      const maxLives = 3;
      const healTarget = 2;
      const {
        gameState, progress, lives, healStreak, correctCount, wrongCount, elapsedSec,
        earnedStars, baseScore, lifeBonus, accuracyBonus, speedBonus, finalScore,
        startSession, recordCorrect, recordWrong, finishNow
      } = useLivesLevelSession({ starThresholds: starsThreshold, maxLives, healTarget, unitLabel: '波', currentStars, onUpdateStars });

      const [waveNumber, setWaveNumber] = useState(1);
      const [leftCards, setLeftCards] = useState([]);
      const [rightCards, setRightCards] = useState([]);
      const [matchedUids, setMatchedUids] = useState(new Set());
      const [matchedPairsMap, setMatchedPairsMap] = useState({});
      const [animatingOut, setAnimatingOut] = useState([]);
      const [selLeft, setSelLeft] = useState(null);
      const [selRight, setSelRight] = useState(null);
      const [justMatched, setJustMatched] = useState(false);
      const [wrongCardUids, setWrongCardUids] = useState([]);
      const [isProcessing, setIsProcessing] = useState(false);
      const [conceptTip, setConceptTip] = useState(null);
      const [feedbackAnim, setFeedbackAnim] = useState('');
      const { showGuide, guideMode, openGuide, dismissGuide } = useLevelGuide(currentStars, hasSeenGuide, onMarkGuideSeen);

      const containerRef = useRef(null);
      const bagRef = useRef({ 0: [], 1: [], 2: [] });
      const waveErrorsRef = useRef(0);
      const waveClearTimerRef = useRef(null);
      const pendingWaveNextRef = useRef(null);
      const handleWaveSkip = () => {
        if (!pendingWaveNextRef.current) return;
        clearTimeout(waveClearTimerRef.current);
        const fn = pendingWaveNextRef.current;
        pendingWaveNextRef.current = null;
        audio.sfxClick();
        fn();
      };
      useEffect(() => () => clearTimeout(waveClearTimerRef.current), []);


      const spawnNextWave = (curProg) => {
        const phase = curProg >= starsThreshold[1] ? 2 : curProg >= starsThreshold[0] ? 1 : 0;
        const w = buildLv5RelationsWave(phase, bagRef.current);
        waveErrorsRef.current = 0;
        setLeftCards(w.leftCards);
        setRightCards(w.rightCards);
        setMatchedUids(new Set());
        setMatchedPairsMap({});
        setAnimatingOut([]);
        setSelLeft(null);
        setSelRight(null);
        setJustMatched(false);
        setWrongCardUids([]);
        setIsProcessing(false);
        setConceptTip(null);
      };

      const startGame = () => {
        clearTimeout(waveClearTimerRef.current);
        pendingWaveNextRef.current = null;
        bagRef.current = { 0: [], 1: [], 2: [] };
        setWaveNumber(1);
        setFeedbackAnim('');
        const initProg = startSession();
        spawnNextWave(initProg);
        audio.init();
      };

      useEffect(() => {
        startGame();
      }, []);

      const lv5CoachSteps = useMemo(() => ([
        {
          target: 'lv5-left',
          anchorX: 0.5,
          anchorY: 0.5,
          pad: 6,
          shape: 'pill',
          tap: true,
          desc: '先點選左側一張三角比關係式'
        },
        {
          target: 'lv5-right',
          anchorX: 0.5,
          anchorY: 0.5,
          pad: 6,
          shape: 'pill',
          tap: true,
          desc: '再點右側等價結果完成配對！'
        }
      ]), []);

      const checkPair = (lCard, rCard) => {
        if (!isRelaxMode && lives <= 0) return;
        setIsProcessing(true);
        if (lCard.valKey === rCard.valKey) {
          audio.sfxMatch();
          if (showGuide) dismissGuide();
          setConceptTip(null);
          const nextMatched = new Set(matchedUids);
          nextMatched.add(lCard.uid);
          nextMatched.add(rCard.uid);
          const isWaveDone = nextMatched.size / 2 >= leftCards.length;
          setAnimatingOut([lCard.uid, rCard.uid]);
          setJustMatched(true);
          setFeedbackAnim('animate-correct');

          const holdDur = isWaveDone ? 360 : 420;
          setTimeout(() => {
            setFeedbackAnim('');
            setMatchedUids(nextMatched);
            setMatchedPairsMap(prev => ({ ...prev, [lCard.uid]: rCard.label }));
            setAnimatingOut([]);
            setSelLeft(null);
            setSelRight(null);
            if (isWaveDone) {
              audio.sfxBonus();
              const clearPause = 900;
              const { completed, nextProgress } = recordCorrect({ wasMissed: waveErrorsRef.current > 0, delayEndMs: clearPause });
              if (!completed) {
                const advanceFn = () => {
                  pendingWaveNextRef.current = null;
                  setJustMatched(false);
                  setWaveNumber(w => w + 1);
                  spawnNextWave(nextProgress);
                };
                pendingWaveNextRef.current = advanceFn;
                waveClearTimerRef.current = setTimeout(advanceFn, clearPause);
              } else {
                setJustMatched(false);
                setIsProcessing(false);
              }
            } else {
              setJustMatched(false);
              setIsProcessing(false);
            }
          }, holdDur);
        } else {
          audio.sfxError();
          waveErrorsRef.current += 1;
          const { gameOver } = recordWrong({ delayEndMs: 420 });
          setWrongCardUids([lCard.uid, rCard.uid]);
          setConceptTip({ text: lCard.tip, id: Date.now() });
          setFeedbackAnim('animate-shake');
          setTimeout(() => {
            setFeedbackAnim('');
            setWrongCardUids([]);
            setSelLeft(null);
            setSelRight(null);
            if (!gameOver) setIsProcessing(false);
          }, 360);
        }
      };

      const handlePickLeft = (card) => {
        if (gameState !== 'playing' || isProcessing || matchedUids.has(card.uid)) return;
        if (selLeft?.uid === card.uid) { audio.sfxClick(); setSelLeft(null); return; }
        audio.sfxSelect();
        setSelLeft(card);
        if (selRight) checkPair(card, selRight);
      };

      const handlePickRight = (card) => {
        if (gameState !== 'playing' || isProcessing || matchedUids.has(card.uid)) return;
        if (selRight?.uid === card.uid) { audio.sfxClick(); setSelRight(null); return; }
        audio.sfxSelect();
        setSelRight(card);
        if (selLeft) checkPair(selLeft, card);
      };

      const phaseLabel = progress >= starsThreshold[1] ? '綜合化簡' : progress >= starsThreshold[0] ? '移項變形' : '基本關係';

      return (
        <div ref={containerRef} className="w-full h-full flex-1 flex flex-col justify-between pt-0.5 pb-1 relative animate-jelly min-h-0">
          {gameState === 'idle' && (
            <div className="flex-1 my-3 bg-white/95 rounded-3xl border-4 border-sky-900 p-5 shadow-2xl flex flex-col justify-between text-center items-center">
              <div className="w-full space-y-2.5 pt-2">
                <div className="w-20 h-20 mx-auto rounded-3xl bg-sky-100 border-4 border-sky-500 flex items-center justify-center text-4xl shadow-inner animate-bounce">🌅</div>
                <h2 className="text-2xl font-black text-sky-950 tracking-wide">三大關係試煉</h2>
                <p className="text-xs text-slate-500 font-bold leading-relaxed max-w-xs mx-auto">
                  配對左右等價的銳角三角比關係式！涵蓋<span className="text-sky-600 font-black">餘角互換</span>、<span className="text-emerald-600 font-black">平方關係</span>與<span className="text-indigo-600 font-black">商數關係</span>！
                </p>
              </div>
              <CompactStarPills starsThreshold={starsThreshold} livesMode maxLives={maxLives} unitLabel="波" />
              <div className="w-full space-y-2">
                <button onClick={startGame} className="w-full py-4 btn-3d-blue text-white font-black text-lg rounded-2xl shadow-xl tracking-wider active:scale-95">{isRelaxMode ? '🌱 開始休閒練習！' : '🚀 開始試煉！'}</button>
                <button onClick={onBackToMap} className="w-full py-2 text-xs font-bold text-slate-400 hover:text-slate-600">返回聖域地圖</button>
              </div>
            </div>
          )}

          {gameState === 'playing' && (
            <div className={`flex-1 min-h-0 flex flex-col justify-between gap-2 overflow-hidden pb-0.5 ${feedbackAnim}`}>
              <GameHUD
                progress={progress}
                starsThreshold={starsThreshold}
                lives={lives}
                maxLives={maxLives}
                healStreak={healStreak}
                healTarget={healTarget}
                unitLabel="波"
                onManualEnd={finishNow}
                onOpenGuide={openGuide}
              />

              <div className={`flex-1 min-h-0 bg-white rounded-3xl border-3 border-sky-950 shadow-xl flex flex-col overflow-hidden transition-all duration-150 ${justMatched ? 'ring-4 ring-emerald-400/75' : ''}`}>
                <StagePhaseStrip phase={progress >= starsThreshold[1] ? 2 : progress >= starsThreshold[0] ? 1 : 0} labels={['基本三大關係（餘角・平方・商數）', '等式移項與餘角平方變形', '綜合三角恆等式化簡']} />
                <div className={`h-[50px] px-3 flex justify-center items-center gap-2 text-sm sm:text-base font-serif text-white border-b-2 shrink-0 transition-colors ${justMatched ? 'bg-emerald-700 border-emerald-900' : 'bg-slate-800 border-slate-700'}`}>
                  <div className={`px-3 h-[36px] inline-flex items-center justify-center rounded-lg border-b-2 font-black truncate max-w-[46%] ${justMatched ? 'bg-emerald-500 border-emerald-300 text-emerald-950' : selLeft ? 'text-sky-300 border-sky-400 bg-slate-700' : 'text-slate-400 border-dashed border-slate-600 bg-slate-900/70 text-xs min-w-[48px]'}`}>
                    {selLeft ? renderLv5CardLabel(selLeft.label, selLeft.frac) : '?'}
                  </div>
                  <span className={justMatched ? 'text-emerald-200 font-black' : 'text-slate-400 font-black'}>=</span>
                  <div className={`px-3 h-[36px] inline-flex items-center justify-center rounded-lg border-b-2 font-black truncate max-w-[46%] ${justMatched ? 'bg-emerald-500 border-emerald-300 text-emerald-950' : selRight ? 'text-amber-300 border-amber-400 bg-slate-700' : 'text-slate-400 border-dashed border-slate-600 bg-slate-900/70 text-xs min-w-[48px]'}`}>
                    {selRight ? selRight.label : '?'}
                  </div>
                  <SuccessBadge show={justMatched} />
                </div>

                <div className="bg-slate-100 border-b border-slate-200 flex justify-between items-center py-1 px-3 shrink-0">
                  <span className="text-[11px] font-black text-slate-600">第 <span className="text-sky-700">{waveNumber}</span> 波 • {phaseLabel}</span>
                  <span className="text-[11px] font-mono font-black text-sky-700">{matchedUids.size / 2} / {leftCards.length}</span>
                </div>

                <div onClick={handleWaveSkip} className="relative grid grid-cols-2 gap-2.5 flex-1 min-h-0 overflow-hidden p-2.5 bg-slate-50">
                  <HintBanner tip={conceptTip} />
                  <div className="bg-white p-1.5 rounded-2xl border-2 border-sky-100 shadow-inner flex flex-col overflow-hidden">
                    <div className="text-[10px] font-black text-sky-500 text-center pb-1 shrink-0">算式</div>
                    <div className="flex flex-col justify-center gap-1.5 flex-1 min-h-0 overflow-y-auto no-scrollbar">
                      {leftCards.map((card) => {
                        const isMatched = matchedUids.has(card.uid);
                        const isOut = animatingOut.includes(card.uid);
                        const isWrong = wrongCardUids.includes(card.uid);
                        const isSelected = selLeft?.uid === card.uid;
                        if (isMatched) {
                          return (
                            <div key={card.uid} className="h-[54px] shrink-0 rounded-xl border-2 border-emerald-200 bg-emerald-50/80 flex items-center justify-center px-1.5 text-emerald-800 font-serif font-black text-xs gap-1 overflow-hidden">
                              <span className="text-emerald-600 shrink-0">✓</span>
                              <span className="truncate">{renderLv5CardLabel(card.label, card.frac)}</span>
                              <span className="shrink-0">=</span>
                              <span className="shrink-0">{matchedPairsMap[card.uid]}</span>
                            </div>
                          );
                        }
                        const firstUnmatchedLeft = leftCards.find(c => !matchedUids.has(c.uid));
                        const isCoachLeft = showGuide && firstUnmatchedLeft?.uid === card.uid;
                        return (
                          <button
                            key={card.uid}
                            data-coach={isCoachLeft ? 'lv5-left' : undefined}
                            onClick={() => handlePickLeft(card)}
                            className={`h-[54px] shrink-0 rounded-xl font-serif font-black px-2 transition-all flex items-center justify-center text-center leading-tight ${
                              card.frac ? 'text-xs sm:text-sm' : card.label.length > 18 ? 'text-xs' : card.label.length > 12 ? 'text-sm' : 'text-base'
                            } ${
                              isOut ? 'animate-pop-out' :
                              isSelected ? 'bg-gradient-to-b from-sky-400 to-sky-600 border-2 border-sky-800 text-white ring-2 ring-sky-300' :
                              'bg-gradient-to-b from-sky-50 to-white border-2 border-sky-200 border-b-[4px] border-b-sky-300 text-sky-950 shadow-sm'
                            } ${isWrong ? 'btn-wrong-flash' : ''}`}
                          >
                            {renderLv5CardLabel(card.label, card.frac)}
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  <div className="bg-white p-1.5 rounded-2xl border-2 border-amber-100 shadow-inner flex flex-col overflow-hidden">
                    <div className="text-[10px] font-black text-amber-500 text-center pb-1 shrink-0">等價結果</div>
                    <div className="flex flex-col justify-center gap-1.5 flex-1 min-h-0 overflow-y-auto no-scrollbar">
                      {rightCards.map(card => {
                        const isMatched = matchedUids.has(card.uid);
                        const isOut = animatingOut.includes(card.uid);
                        const isWrong = wrongCardUids.includes(card.uid);
                        const isSelected = selRight?.uid === card.uid;
                        const cardH = rightCards.length >= 6 ? 'h-[40px]' : 'h-[44px]';
                        if (isMatched) return <div key={card.uid} className={`${cardH} shrink-0 rounded-xl border-2 border-dashed border-emerald-200 bg-emerald-50/50 flex items-center justify-center text-emerald-600 font-black text-xs`}>✓ 已配對</div>;
                        const targetLeft = selLeft || leftCards.find(c => !matchedUids.has(c.uid));
                        const isCoachRight = showGuide && targetLeft && card.valKey === targetLeft.valKey;
                        return (
                          <button
                            key={card.uid}
                            data-coach={isCoachRight ? 'lv5-right' : undefined}
                            onClick={() => handlePickRight(card)}
                            className={`${cardH} shrink-0 rounded-xl font-serif font-black text-sm sm:text-base px-2 transition-all flex items-center justify-center ${
                              isOut ? 'animate-pop-out' :
                              isSelected ? 'bg-gradient-to-b from-amber-300 to-amber-500 border-2 border-amber-700 text-amber-950 ring-2 ring-amber-300' :
                              'bg-gradient-to-b from-amber-50 to-white border-2 border-amber-200 border-b-[4px] border-b-amber-300 text-amber-950 shadow-sm'
                            } ${isWrong ? 'btn-wrong-flash' : ''}`}
                          >
                            {card.label}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                </div>
              </div>
              <CoachOverlay
                containerRef={containerRef}
                active={guideMode === 'manual' || (gameState === 'playing' && showGuide)}
            mode={guideMode || 'spotlight'}
                steps={lv5CoachSteps}
                onDismiss={dismissGuide}
              />
            </div>
          )}

          {gameState === 'ended' && (
            <LevelResultScreen
              score={finalScore}
              baseScore={baseScore}
              earnedStars={earnedStars}
              correctCount={correctCount}
              wrongCount={wrongCount}
              lives={lives}
              progress={progress}
              targetTotal={starsThreshold[2]}
              unitLabel="波"
              elapsedSec={elapsedSec}
              lifeBonus={lifeBonus}
              accuracyBonus={accuracyBonus}
              speedBonus={speedBonus}
              accentClass="text-sky-600"
              onCompleteLevel={onCompleteLevel}
              onRestart={startGame}
              onBackToMap={onBackToMap}
            />
          )}
        </div>
      );
    };
    const generateLevel6TripleQuestion = (phase, prevKey = '') => {
      const triplePool = phase === 0 ? [
        { opp: 3, adj: 4, hyp: 5 },
        { opp: 4, adj: 3, hyp: 5 },
        { opp: 5, adj: 12, hyp: 13 },
        { opp: 12, adj: 5, hyp: 13 }
      ] : [
        { opp: 3, adj: 4, hyp: 5 },
        { opp: 4, adj: 3, hyp: 5 },
        { opp: 5, adj: 12, hyp: 13 },
        { opp: 12, adj: 5, hyp: 13 },
        { opp: 8, adj: 15, hyp: 17 },
        { opp: 15, adj: 8, hyp: 17 },
        { opp: 7, adj: 24, hyp: 25 },
        { opp: 24, adj: 7, hyp: 25 }
      ];
      const funcs = phase <= 1 ? ['sin', 'cos'] : ['sin', 'cos', 'tan'];

      let t, givenFunc, targetFunc, key;
      for (let guard = 0; guard < 12; guard++) {
        t = triplePool[Math.floor(Math.random() * triplePool.length)];
        givenFunc = funcs[Math.floor(Math.random() * funcs.length)];
        const rem = ['sin', 'cos', 'tan'].filter(f => f !== givenFunc);
        targetFunc = rem[Math.floor(Math.random() * rem.length)];
        key = `${t.opp}_${t.adj}_${t.hyp}_${givenFunc}_${targetFunc}`;
        if (key !== prevKey) break;
      }

      const ratioStr = (f) =>
        f === 'sin' ? `${t.opp}/${t.hyp}` :
        f === 'cos' ? `${t.adj}/${t.hyp}` :
        `${t.opp}/${t.adj}`;

      const givenVal = ratioStr(givenFunc);
      const ansVal = ratioStr(targetFunc);
      const distractors = shuffle([
        ratioStr(funcs.find(f => f !== givenFunc && f !== targetFunc) || 'tan'),
        `${t.hyp}/${t.opp}`,
        `${t.hyp}/${t.adj}`,
        `${t.adj}/${t.opp}`,
        givenVal
      ].filter(v => v !== ansVal));
      const uniqueDist = Array.from(new Set(distractors)).slice(0, 3);
      const options = shuffle([ansVal, ...uniqueDist]);

      const scale = 300 / t.hyp;
      const w = t.adj * scale;
      const h = t.opp * scale;
      const flip = phase < 2 ? 1 : (Math.random() > 0.5 ? 1 : -1);
      const { P1, P2, P3 } = centerTriangleBoundingBox(
        { x: 0, y: 0 },
        { x: w * flip, y: 0 },
        { x: w * flip, y: -h }
      );
      const centroid = { x: (P1.x + P2.x + P3.x) / 3, y: (P1.y + P2.y + P3.y) / 3 };
      const missingRole = givenFunc === 'sin' ? 'adj' : givenFunc === 'cos' ? 'opp' : 'hyp';

      const knownTokens = givenFunc === 'sin'
        ? [
            { key: 'num', val: t.opp, targetRole: 'opp', label: '分子' },
            { key: 'den', val: t.hyp, targetRole: 'hyp', label: '分母' }
          ]
        : givenFunc === 'cos'
        ? [
            { key: 'num', val: t.adj, targetRole: 'adj', label: '分子' },
            { key: 'den', val: t.hyp, targetRole: 'hyp', label: '分母' }
          ]
        : [
            { key: 'num', val: t.opp, targetRole: 'opp', label: '分子' },
            { key: 'den', val: t.adj, targetRole: 'adj', label: '分母' }
          ];

      const pythHint = missingRole === 'hyp'
        ? `√(${t.opp}²+${t.adj}²)`
        : missingRole === 'opp'
        ? `√(${t.hyp}²-${t.adj}²)`
        : `√(${t.hyp}²-${t.opp}²)`;

      const v21 = { x: P1.x - P2.x, y: P1.y - P2.y };
      const l21 = Math.hypot(v21.x, v21.y) || 1;
      const u21 = { x: v21.x / l21, y: v21.y / l21 };
      const v23 = { x: P3.x - P2.x, y: P3.y - P2.y };
      const l23 = Math.hypot(v23.x, v23.y) || 1;
      const u23 = { x: v23.x / l23, y: v23.y / l23 };
      const sqSize = 22;
      const pC1 = { x: P2.x + u21.x * sqSize, y: P2.y + u21.y * sqSize };
      const pC2 = { x: pC1.x + u23.x * sqSize, y: pC1.y + u23.y * sqSize };
      const pC3 = { x: P2.x + u23.x * sqSize, y: P2.y + u23.y * sqSize };
      const rightAngleSquare = `${P2.x},${P2.y} ${pC1.x},${pC1.y} ${pC2.x},${pC2.y} ${pC3.x},${pC3.y}`;

      const arcRad = Math.max(32, Math.min(50, Math.min(w, h) * 0.42));
      const v13 = { x: P3.x - P1.x, y: P3.y - P1.y };
      const l13 = Math.hypot(v13.x, v13.y) || 1;
      const u13 = { x: v13.x / l13, y: v13.y / l13 };
      const v12 = { x: P2.x - P1.x, y: P2.y - P1.y };
      const l12 = Math.hypot(v12.x, v12.y) || 1;
      const u12 = { x: v12.x / l12, y: v12.y / l12 };
      const arcP1 = { x: P1.x + u12.x * arcRad, y: P1.y + u12.y * arcRad };
      const arcP2 = { x: P1.x + u13.x * arcRad, y: P1.y + u13.y * arcRad };
      const cross = u12.x * u13.y - u12.y * u13.x;
      const sweep = cross > 0 ? 1 : 0;
      const arcPath = `M ${P1.x} ${P1.y} L ${arcP1.x} ${arcP1.y} A ${arcRad} ${arcRad} 0 0 ${sweep} ${arcP2.x} ${arcP2.y} Z`;
      const bis = { x: u12.x + u13.x, y: u12.y + u13.y };
      const bisLen = Math.hypot(bis.x, bis.y) || 1;
      const thetaPt = { x: P1.x + (bis.x / bisLen) * (arcRad + 22), y: P1.y + (bis.y / bisLen) * (arcRad + 22) };

      const edges = [
        { role: 'hyp', p1: P1, p2: P3, val: t.hyp, pt: computeOutwardMidPt(P1, P3, centroid, 24) },
        { role: 'opp', p1: P2, p2: P3, val: t.opp, pt: computeOutwardMidPt(P2, P3, centroid, 24) },
        { role: 'adj', p1: P1, p2: P2, val: t.adj, pt: computeOutwardMidPt(P1, P2, centroid, 24) }
      ].map(e => ({ ...e, isMissing: e.role === missingRole }));

      const tip = `三邊為 (對=${t.opp}, 鄰=${t.adj}, 斜=${t.hyp})，故 ${targetFunc} θ = ${ansVal}`;
      return { key, phase, givenFunc, givenVal, targetFunc, ansVal, options, pts: { P1, P2, P3 }, rightAngleSquare, arcPath, thetaPt, edges, knownTokens, missingRole, pythHint, flip, tip };
    };

    const Level6PythagoreanTripleMaster = ({ currentStars, hasSeenGuide = false, onMarkGuideSeen, onUpdateStars, onCompleteLevel, onBackToMap }) => {
      const { isRelaxMode } = React.useContext(GameModeContext);
      const starsThreshold = [3, 6, 9];
      const maxLives = 3;
      const healTarget = 3;
      const {
        gameState, progress, lives, healStreak, correctCount, wrongCount, elapsedSec,
        earnedStars, baseScore, lifeBonus, accuracyBonus, speedBonus, finalScore,
        startSession, recordCorrect, recordWrong, finishNow
      } = useLivesLevelSession({ starThresholds: starsThreshold, maxLives, healTarget, currentStars, onUpdateStars });

      const [question, setQuestion] = useState(null);
      const [placedTokens, setPlacedTokens] = useState({ num: false, den: false });
      const edgesReady = placedTokens.num && placedTokens.den;
      const [selectedTokenKey, setSelectedTokenKey] = useState(null);
      const [dragState, setDragState] = useState(null);
      const [solvedOpt, setSolvedOpt] = useState(null);
      const [wrongOpt, setWrongOpt] = useState(null);
      const [wrongEdgeRole, setWrongEdgeRole] = useState(null);
      const [conceptTip, setConceptTip] = useState(null);
      const [feedbackAnim, setFeedbackAnim] = useState('');
      const { showGuide, guideMode, openGuide, dismissGuide } = useStagedLevelGuide({
        currentStars,
        hasSeenGuide,
        onMarkGuideSeen,
        activeStageKey: question ? (edgesReady ? 'select' : 'place') : null,
        phase: question ? question.phase : 0,
        enabled: gameState === 'playing',
        finalStageKey: 'select'
      });

      const containerRef = useRef(null);
      const cardBoxRef = useRef(null);
      const svgRef = useRef(null);
      const dragStartRef = useRef(null);
      const prevKeyRef = useRef('');
      const questionMissedRef = useRef(false);
      const confirmTimerRef = useRef(null);
      const pendingNextRef = useRef(null);

      const handleConfirmSkip = () => {
        if (!pendingNextRef.current) return;
        clearTimeout(confirmTimerRef.current);
        const fn = pendingNextRef.current;
        pendingNextRef.current = null;
        audio.sfxClick();
        fn();
      };
      useEffect(() => () => clearTimeout(confirmTimerRef.current), []);


      const nextQuestion = (curProg) => {
        const phase = curProg >= starsThreshold[1] ? 2 : curProg >= starsThreshold[0] ? 1 : 0;
        const q = generateLevel6TripleQuestion(phase, prevKeyRef.current);
        prevKeyRef.current = q.key;
        questionMissedRef.current = false;
        setQuestion(q);
        setPlacedTokens({ num: false, den: false });
        setSelectedTokenKey(null);
        setDragState(null);
        setSolvedOpt(null);
        setWrongOpt(null);
        setWrongEdgeRole(null);
        setConceptTip(null);
      };

      const startGame = () => {
        clearTimeout(confirmTimerRef.current);
        pendingNextRef.current = null;
        prevKeyRef.current = '';
        questionMissedRef.current = false;
        setFeedbackAnim('');
        const initProg = startSession();
        nextQuestion(initProg);
        audio.init();
      };

      useEffect(() => {
        startGame();
      }, []);

      const lv6CoachSteps = useMemo(() => (
        guideMode === 'manual' ? [
          { desc: '直接從上方分數拖曳分子、分母圓幣到三角形對應邊（也可點選放置）。' },
          { desc: '兩邊就緒後，依畢氏三元數從下方選出目標三角比值！' }
        ] : !edgesReady ? [
          {
            tap: true,
            drag: true,
            desc: '直接從上方分數拖曳分子、分母圓幣到三角形對應邊（也可點選放置）！',
            targets: [
              { target: 'lv6-coin', anchorX: 0.5, anchorY: 0.5, pad: 10, shape: 'circle' },
              { target: 'lv6-tri', anchorX: 0.5, anchorY: 0.5, pad: 36, minW: 230, minH: 200, shape: 'ellipse' }
            ]
          }
        ] : [
          {
            target: 'lv6-opts',
            anchorX: 0.5,
            anchorY: 0.5,
            pad: 8,
            shape: 'rect',
            tap: false,
            desc: '兩邊已定位！從下方選出目標三角比值'
          }
        ]
      ), [edgesReady, guideMode]);

      const clientToSvgPt = (clientX, clientY) => {
        const el = svgRef.current;
        if (!el) return null;
        const rect = el.getBoundingClientRect();
        if (!rect.width || !rect.height) return null;
        const size = Math.min(rect.width, rect.height);
        const left = rect.left + (rect.width - size) / 2;
        const top = rect.top + (rect.height - size) / 2;
        return {
          x: ((clientX - left) / size) * 500,
          y: ((clientY - top) / size) * 500
        };
      };

      const findHoverRole = (svgPt) => {
        if (!svgPt || !question) return null;
        let bestRole = null;
        let bestDist = Infinity;
        for (const e of question.edges) {
          const d = Math.hypot(svgPt.x - e.pt.x, svgPt.y - e.pt.y);
          if (d <= 64 && d < bestDist) {
            bestRole = e.role;
            bestDist = d;
          }
        }
        return bestRole;
      };

      const attemptPlaceToken = (tokenKey, targetRole) => {
        if (!question || !tokenKey || !targetRole || (!isRelaxMode && lives <= 0)) return;
        const token = question.knownTokens.find(tk => tk.key === tokenKey);
        if (!token || placedTokens[tokenKey]) return;
        if (targetRole === token.targetRole) {
          audio.sfxSelect();
          if (showGuide) dismissGuide();
          setPlacedTokens(prev => ({ ...prev, [tokenKey]: true }));
          setSelectedTokenKey(null);
          setWrongEdgeRole(null);
          setConceptTip(null);
        } else {
          audio.sfxError();
          const alreadyMissed = questionMissedRef.current;
          questionMissedRef.current = true;
          const gameOver = alreadyMissed ? false : recordWrong({ delayEndMs: 480 }).gameOver;
          const roleNames = { opp: '對邊', adj: '鄰邊', hyp: '斜邊' };
          setWrongEdgeRole(targetRole);
          setConceptTip({
            text: `${question.givenFunc} θ 的${token.label}（${token.val}）應放在「${roleNames[token.targetRole]}」！`,
            id: Date.now()
          });
          setFeedbackAnim('animate-shake');
          if (!gameOver) {
            setTimeout(() => { setFeedbackAnim(''); setWrongEdgeRole(null); }, 380);
          }
        }
      };

      const handleTokenPointerDown = (e, tokenKey) => {
        if (gameState !== 'playing' || !question || placedTokens[tokenKey] || solvedOpt || (!isRelaxMode && lives <= 0)) return;
        if (e.currentTarget.setPointerCapture) {
          try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
        }
        dragStartRef.current = { x: e.clientX, y: e.clientY, tokenKey };
        const box = cardBoxRef.current?.getBoundingClientRect();
        if (box) {
          const svgPt = clientToSvgPt(e.clientX, e.clientY);
          setDragState({
            tokenKey,
            px: e.clientX - box.left,
            py: e.clientY - box.top,
            hoverRole: findHoverRole(svgPt)
          });
        }
      };

      const handleTokenPointerMove = (e) => {
        if (!dragStartRef.current || !dragState) return;
        const box = cardBoxRef.current?.getBoundingClientRect();
        if (!box) return;
        const svgPt = clientToSvgPt(e.clientX, e.clientY);
        setDragState(prev => prev ? {
          ...prev,
          px: e.clientX - box.left,
          py: e.clientY - box.top,
          hoverRole: findHoverRole(svgPt)
        } : null);
      };

      const handleTokenPointerUp = (e) => {
        if (e.currentTarget.releasePointerCapture) {
          try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (_) {}
        }
        const start = dragStartRef.current;
        dragStartRef.current = null;
        if (!start) { setDragState(null); return; }
        const movedDist = Math.hypot(e.clientX - start.x, e.clientY - start.y);
        const svgPt = clientToSvgPt(e.clientX, e.clientY);
        const dropRole = findHoverRole(svgPt);
        setDragState(null);

        if (movedDist >= 10 && dropRole) {
          attemptPlaceToken(start.tokenKey, dropRole);
        } else if (movedDist < 10) {
          audio.sfxClick();
          setSelectedTokenKey(prev => prev === start.tokenKey ? null : start.tokenKey);
        }
      };

      const handleEdgeTap = (role) => {
        if (edgesReady || !selectedTokenKey) return;
        attemptPlaceToken(selectedTokenKey, role);
      };

      const handleSelect = (opt) => {
        if (gameState !== 'playing' || !question || !edgesReady || solvedOpt || wrongOpt || (!isRelaxMode && lives <= 0)) return;
        if (opt === question.ansVal) {
          audio.sfxBonus();
          if (showGuide) dismissGuide();
          setSolvedOpt(opt);
          setFeedbackAnim('animate-correct');
          const confirmDur = 1100;
          const { completed, nextProgress } = recordCorrect({ wasMissed: questionMissedRef.current, delayEndMs: confirmDur });
          setConceptTip({
            node: <SqrtText text={question.tip} className="font-serif font-black" />,
            tone: 'success',
            canSkip: !completed,
            id: Date.now()
          });
          if (!completed) {
            const advanceFn = () => {
              pendingNextRef.current = null;
              setFeedbackAnim('');
              nextQuestion(nextProgress);
            };
            pendingNextRef.current = advanceFn;
            confirmTimerRef.current = setTimeout(advanceFn, confirmDur);
          } else {
            setTimeout(() => setFeedbackAnim(''), confirmDur);
          }
        } else {
          audio.sfxError();
          const alreadyMissed = questionMissedRef.current;
          questionMissedRef.current = true;
          const gameOver = alreadyMissed ? false : recordWrong({ delayEndMs: 520 }).gameOver;
          setWrongOpt(opt);
          setConceptTip({ text: question.tip, id: Date.now() });
          setFeedbackAnim('animate-shake');
          if (!gameOver) {
            setTimeout(() => { setFeedbackAnim(''); setWrongOpt(null); }, 350);
          }
        }
      };

      const phase = question?.phase ?? 0;

      return (
        <div ref={containerRef} className="w-full h-full flex-1 flex flex-col justify-between pt-0.5 pb-1 relative animate-jelly min-h-0">
          {gameState === 'idle' && (
            <div className="flex-1 my-3 bg-white/95 rounded-3xl border-4 border-teal-900 p-5 shadow-2xl flex flex-col justify-between text-center items-center">
              <div className="w-full space-y-2.5 pt-2">
                <div className="w-20 h-20 mx-auto rounded-3xl bg-teal-100 border-4 border-teal-500 flex items-center justify-center text-4xl shadow-inner animate-bounce">📐</div>
                <h2 className="text-2xl font-black text-teal-950 tracking-wide">知一求一聖殿</h2>
                <p className="text-xs text-slate-500 font-bold leading-relaxed max-w-xs mx-auto">
                  先將已知三角比的兩邊數字拖回空白三角形，再用<span className="text-teal-600 font-black">畢氏三元數</span>求出另一個三角比！
                </p>
              </div>
              <CompactStarPills starsThreshold={starsThreshold} livesMode maxLives={maxLives} />
              <div className="w-full space-y-2">
                <button onClick={startGame} className="w-full py-4 btn-3d-green text-white font-black text-lg rounded-2xl shadow-xl tracking-wider active:scale-95">{isRelaxMode ? '🌱 開始休閒練習！' : '🚀 開始試煉！'}</button>

    const Level5AngleSteeringMaster = ({ currentStars, hasSeenGuide = false, onMarkGuideSeen, onUpdateStars, onCompleteLevel, onBackToMap }) => {
      const { isRelaxMode } = React.useContext(GameModeContext);
      const starsThreshold = [2, 5, 9];
      const maxLives = 3;
      const healTarget = 3;
      const {
        gameState, progress, lives, healStreak, correctCount, wrongCount, elapsedSec,
        earnedStars, baseScore, lifeBonus, accuracyBonus, speedBonus, finalScore,
        startSession, recordCorrect, recordWrong, finishNow
      } = useLivesLevelSession({ starThresholds: starsThreshold, maxLives, healTarget, currentStars, onUpdateStars });

      const [currentAngle, setCurrentAngle] = useState(0);
      const [targetAngle, setTargetAngle] = useState(90);
      const [isDragging, setIsDragging] = useState(false);
      const [feedbackAnim, setFeedbackAnim] = useState('');
      const [floatingText, setFloatingText] = useState(null);
      const [isLockedSuccess, setIsLockedSuccess] = useState(false);
      const [conceptTip, setConceptTip] = useState(null);
      const { showGuide, guideMode, openGuide, dismissGuide } = useLevelGuide(currentStars, hasSeenGuide, onMarkGuideSeen);

      const containerRef = useRef(null);

      const dialSvgRef = useRef(null);
      const lastTickAngleRef = useRef(0);
      const lastAtanRef = useRef(0);
      const exactAngleRef = useRef(0);
      const downPtRef = useRef(null);
      const isDraggingRef = useRef(false);
      const isLockedRef = useRef(false);
      const angleBagsRef = useRef({ 0: [], 1: [], 2: [] });
      const lastAngleRef = useRef(null);

      const width = 540, height = 540, origin = { x: 270, y: 270 }, R = 200;

      useEffect(() => { isDraggingRef.current = isDragging; }, [isDragging]);
      useEffect(() => {
        const preventTouchScroll = (e) => { if (isDraggingRef.current) e.preventDefault(); };
        document.addEventListener('touchmove', preventTouchScroll, { passive: false });
        return () => document.removeEventListener('touchmove', preventTouchScroll);
      }, []);

      const triggerFloat = (text, color) => {
        const id = Date.now();
        setFloatingText({ text, color, id });
        setTimeout(() => setFloatingText(prev => prev?.id === id ? null : prev), 800);
      };

      const triggerSuccessMatch = () => {
        if (isLockedRef.current) return;
        isLockedRef.current = true;
        if (showGuide) dismissGuide();
        setIsLockedSuccess(true);
        audio.sfxBonus();
        triggerFloat('能量鎖定!', "text-amber-400");
        setFeedbackAnim('animate-correct');
        const { completed, nextProgress } = recordCorrect({ delayEndMs: 520 });
        setTimeout(() => {
          setIsLockedSuccess(false); setFeedbackAnim('');
          if (!completed) {
            generateNextTarget(nextProgress);
            isLockedRef.current = false;
          }
        }, 520);
      };

      const generateNextTarget = (curProg) => {
        const phase = curProg >= starsThreshold[1] ? 2 : curProg >= starsThreshold[0] ? 1 : 0;
        const pools = {
          0: [30, 45, 60, 120, 135, 150, 210, 240, 300, -30, -45, -60, -120, -150, -210, -240, -300],
          1: [390, 405, 420, 450, 495, 510, 570, 600, -390, -405, -420, -480, -510, -540],
          2: [390, 420, 495, 540, 600, 675, 750, -390, -450, -510, -600, -690]
        };
        if (!angleBagsRef.current[phase] || angleBagsRef.current[phase].length === 0) {
          const fresh = shuffle(pools[phase]);
          if (fresh.length > 1 && fresh[0] === lastAngleRef.current) {
            [fresh[0], fresh[fresh.length - 1]] = [fresh[fresh.length - 1], fresh[0]];
          }
          angleBagsRef.current[phase] = fresh;
        }
        const next = angleBagsRef.current[phase].shift();
        lastAngleRef.current = next;
        setTargetAngle(next);
        setCurrentAngle(0);
        setConceptTip(null);
        exactAngleRef.current = 0;
        lastTickAngleRef.current = 0;
      };

      const startGame = () => {
        angleBagsRef.current = { 0: [], 1: [], 2: [] };
        lastAngleRef.current = null;
        setFeedbackAnim('');
        setConceptTip(null);
        setIsLockedSuccess(false); isLockedRef.current = false;
        const initProg = startSession();
        generateNextTarget(initProg);
        audio.init();
      };

      useEffect(() => {
        startGame();
      }, []);

      const lv7CoachSteps = useMemo(() => ([
        {
          target: 'lv7-target',
          anchorX: 0.5,
          anchorY: 0.5,
          pad: 8,
          shape: 'ellipse',
          tap: false,
          desc: '看上方目標角度（正逆時針、負順時針）'
        },
        {
          target: 'lv7-dial',
          anchorX: 0.5,
          anchorY: 0.5,
          minW: 84,
          minH: 84,
          shape: 'circle',
          tap: true,
          desc: '拖曳藍點旋轉終邊到目標位置（5° 微調）'
        },
        {
          target: 'lv7-confirm-tip',
          anchorX: 0.5,
          anchorY: 0.5,
          pad: 8,
          shape: 'pill',
          tap: true,
          desc: '調好後，輕點畫板空白處即可鎖定判定！'
        }
      ]), []);

      const handlePointerDown = (e) => {
        if (isLockedRef.current || !dialSvgRef.current || (!isRelaxMode && lives <= 0)) return;
        setIsDragging(true);
        downPtRef.current = { x: e.clientX, y: e.clientY };
        try { e.target.setPointerCapture(e.pointerId); } catch (_) {}
        const ctm = dialSvgRef.current.getScreenCTM();
        if (!ctm) return;
        const inv = ctm.inverse();
        const svgX = inv.a * e.clientX + inv.c * e.clientY + inv.e;
        const svgY = inv.b * e.clientX + inv.d * e.clientY + inv.f;
        lastAtanRef.current = Math.atan2(origin.y - svgY, svgX - origin.x) * (180 / Math.PI);
        exactAngleRef.current = currentAngle;
      };

      const handlePointerMove = (e) => {
        if (!isDragging || isLockedRef.current || !dialSvgRef.current) return;
        const ctm = dialSvgRef.current.getScreenCTM();
        if (!ctm) return;
        const inv = ctm.inverse();
        const svgX = inv.a * e.clientX + inv.c * e.clientY + inv.e;
        const svgY = inv.b * e.clientX + inv.d * e.clientY + inv.f;
        const currentAtan = Math.atan2(origin.y - svgY, svgX - origin.x) * (180 / Math.PI);
        let diff = currentAtan - lastAtanRef.current;
        if (diff > 180) diff -= 360;
        if (diff < -180) diff += 360;
        exactAngleRef.current += diff;
        lastAtanRef.current = currentAtan;
        const snapped = Math.round(exactAngleRef.current / 5) * 5;
        if (snapped !== lastTickAngleRef.current) {
          audio.sfxTick();
          lastTickAngleRef.current = snapped;
          setConceptTip(null);
        }
        setCurrentAngle(snapped);
      };

      const handlePointerUp = (e) => {
        if (!isDragging) return;
        setIsDragging(false);
        if (e?.target?.hasPointerCapture?.(e.pointerId)) {
          try { e.target.releasePointerCapture(e.pointerId); } catch (_) {}
        }
        const downPt = downPtRef.current;
        downPtRef.current = null;
        if (!downPt || isLockedRef.current) return;
        const movedDist = Math.hypot(e.clientX - downPt.x, e.clientY - downPt.y);
        if (movedDist < 8) {
          const snapped = Math.round(exactAngleRef.current / 5) * 5;
          if (snapped === 0) return;
          if (snapped === targetAngle) {
            setConceptTip(null);
            triggerSuccessMatch();
          } else {
            audio.sfxError();
            const { gameOver } = recordWrong({ delayEndMs: 480 });
            const sameRay = (((snapped - targetAngle) % 360) + 360) % 360 === 0;
            const oppSign = (snapped > 0 && targetAngle < 0) || (snapped < 0 && targetAngle > 0);
            const tipMsg = oppSign
              ? (targetAngle < 0 ? '負角要順時針旋轉！' : '正角要逆時針旋轉！')
              : sameRay
              ? `終邊相同，但圈數還差 ${Math.abs(targetAngle - snapped) / 360} 圈（目標 ${targetAngle}°）`
              : `目前停在 ${snapped}°，目標為 ${targetAngle}°`;
            setConceptTip({ text: tipMsg, id: Date.now() });
            setFeedbackAnim('animate-shake');
            if (!gameOver) {
              setTimeout(() => setFeedbackAnim(''), 360);
            }
          }
        }
      };

      const generateSpiral = () => {
        if (currentAngle === 0) return "";
        const points = [];
        const steps = Math.max(20, Math.floor(Math.abs(currentAngle) / 3));
        const baseR = 25, maxGrowth = 120;
        const totalRotations = Math.abs(currentAngle) / 360;
        const growthPerRotation = Math.min(15, maxGrowth / Math.max(1, totalRotations));
        for (let i = 0; i <= steps; i++) {
          const angleAtStep = (i / steps) * currentAngle;
          const radAtStep = (angleAtStep * Math.PI) / 180;
          const currentR = baseR + (Math.abs(angleAtStep) / 360) * growthPerRotation;
          points.push(`${origin.x + currentR * Math.cos(radAtStep)},${origin.y - currentR * Math.sin(radAtStep)}`);
        }
        return `M ${origin.x + baseR},${origin.y} L ${points.join(' ')}`;
      };

      const rayAngles = Array.from({ length: 24 }, (_, i) => i * 15);
      const currentRad = (currentAngle * Math.PI) / 180;
      const ptTerminal = { x: origin.x + R * Math.cos(currentRad), y: origin.y - R * Math.sin(currentRad) };
      let principal = ((currentAngle % 360) + 360) % 360;
      let quadrantText = principal === 0 ? "正向 X 軸" : principal < 90 ? "第 I 象限" : principal === 90 ? "正向 Y 軸" : principal < 180 ? "第 II 象限" : principal === 180 ? "負向 X 軸" : principal < 270 ? "第 III 象限" : principal === 270 ? "負向 Y 軸" : "第 IV 象限";

        <div ref={containerRef} className="w-full h-full flex-1 flex flex-col justify-between pt-0.5 pb-1 relative animate-jelly min-h-0">

              <div className="w-full space-y-3 pt-2">
                <div className="w-20 h-20 mx-auto rounded-3xl bg-sky-100 border-4 border-sky-500 flex items-center justify-center text-4xl shadow-inner animate-bounce">🧭</div>
                <h2 className="text-2xl font-black text-indigo-950 tracking-wide">廣義角舵手</h2>
                <p className="text-xs text-slate-500 font-bold leading-relaxed max-w-xs mx-auto">
                  撥動終邊到達指定角度（5° 刻度），<br/>
                  放開手指後<span className="text-sky-600 font-black">輕點空白處鎖定判定</span>！
                </p>
              </div>
              <CompactStarPills starsThreshold={starsThreshold} livesMode maxLives={maxLives} />
              <div className="w-full space-y-2">
                <button onClick={startGame} className="w-full py-4 btn-3d-blue text-white font-black text-lg rounded-2xl shadow-xl tracking-wider active:scale-95">{isRelaxMode ? '🌱 開始休閒練習！' : '🚀 開始試煉！'}</button>
                <button onClick={onBackToMap} className="w-full py-2 text-xs font-bold text-slate-400 hover:text-slate-600">返回聖域地圖</button>
              </div>
            </div>
          )}

          {gameState === 'playing' && (
            <div className={`flex-1 min-h-0 flex flex-col justify-between gap-2 overflow-hidden pb-0.5 ${feedbackAnim}`}>
              <GameHUD
                progress={progress}
                starsThreshold={starsThreshold}
                lives={lives}
                maxLives={maxLives}
                healStreak={healStreak}
                healTarget={healTarget}
                onManualEnd={finishNow}
                onOpenGuide={openGuide}
              />

              {(() => {
                const lv7Phase = progress >= starsThreshold[1] ? 2 : progress >= starsThreshold[0] ? 1 : 0;
                return (
              <div className={`flex-1 min-h-0 bg-white rounded-3xl border-3 border-indigo-950 shadow-xl flex flex-col overflow-hidden transition-all duration-150 ${isLockedSuccess ? 'ring-4 ring-emerald-400/75' : ''}`}>
                <StagePhaseStrip phase={lv7Phase} labels={['單圈任意正負 • 完整 15° 刻度', '多圈旋轉入門 • 僅留軸線刻度', '多圈盲轉驗收 • 隱藏刻度與讀數']} />
                <div data-coach="lv7-target" className="bg-gradient-to-r from-sky-500 to-indigo-600 py-2 px-3.5 flex justify-between items-center text-white border-b-2 border-indigo-800 shrink-0">
                  <div className="flex items-center gap-2">
                    <span className="text-xs text-sky-100 font-bold uppercase">目標角度</span>
                    <span className="text-2xl sm:text-3xl font-mono font-black text-white tracking-wider drop-shadow">{targetAngle}°</span>
                  </div>
                  <div className="text-right flex items-center gap-2">
                    <div>
                      <span className="text-[10px] text-sky-200 block font-bold leading-none">當前位置</span>
                      <span className={`text-xl font-mono font-black leading-none ${
                        lv7Phase === 2 && !isLockedSuccess ? 'text-sky-200/80' : currentAngle === targetAngle ? 'text-amber-300' : 'text-white'

                        {lv7Phase === 2 && !isLockedSuccess ? '?°' : `${currentAngle}°`}
                      </span>

                    <span className="text-xs font-bold text-indigo-950 bg-white/90 px-2 py-1 rounded-lg border border-indigo-200 shadow-sm">{quadrantText}</span>
