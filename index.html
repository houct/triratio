                  </div>
                  <span className="text-xs font-black bg-white/20 px-2.5 py-1 rounded-xl border border-white/40 whitespace-nowrap">第 {['I', 'II', 'III', 'IV'][question.quad - 1]} 象限</span>
                </div>

                <div className="relative w-full flex-1 min-h-0 bg-white flex items-center justify-center overflow-hidden">
                  <HintBanner tip={conceptTip} />
                  {isLockedSuccess && <div className="absolute inset-0 bg-amber-400/25 z-30 pointer-events-none animate-ping"></div>}
                  <svg viewBox="0 0 540 540" preserveAspectRatio="xMidYMid meet" className="w-full h-full object-contain select-none">
                    <line x1={30} y1={270} x2={510} y2={270} stroke="#94a3b8" strokeWidth="2.5" />
                    <line x1={270} y1={30} x2={270} y2={510} stroke="#94a3b8" strokeWidth="2.5" />
                    <text x="500" y="255" fill="#94a3b8" fontSize="24" fontWeight="bold">x</text>
                    <text x="285" y="50" fill="#94a3b8" fontSize="24" fontWeight="bold">y</text>
                    <line x1={question.ptP.x} y1={question.ptP.y} x2={question.ptFootX.x} y2={question.ptFootX.y} stroke="#94a3b8" strokeWidth="2.5" strokeDasharray="5 5" />
                    <line x1={question.ptP.x} y1={question.ptP.y} x2={question.ptFootY.x} y2={question.ptFootY.y} stroke="#94a3b8" strokeWidth="2.5" strokeDasharray="5 5" />
                    <path d={question.angleSectorPath} fill="rgba(251, 191, 36, 0.16)" stroke="none" />
                    <path d={question.angleArcPath} fill="none" stroke="#f59e0b" strokeWidth="3.5" strokeLinecap="round" />
                    <circle cx={question.arcEnd.x} cy={question.arcEnd.y} r="4.5" fill="#f59e0b" />
                    <text x={question.thetaLabelPt.x} y={question.thetaLabelPt.y} fill="#b45309" fontSize="22" fontWeight="900" textAnchor="middle" dominantBaseline="middle" className="font-serif pointer-events-none">θ</text>
                    <line x1={270} y1={270} x2={480} y2={270} stroke="#ef4444" strokeWidth="8" strokeLinecap="round" />

                    <g transform={`translate(${270 + (question.xVal >= 0 ? -42 : 42)}, ${question.ptFootY.y})`} className="cursor-pointer" onClick={() => handleInputKey('y')}>
                      <rect x="-40" y="-17" width="80" height="34" fill="white" stroke="#ef4444" strokeWidth="2.5" rx="10" />
                      <text x="0" y="2" fill="#b91c1c" fontSize="18" fontWeight="900" textAnchor="middle" dominantBaseline="middle">y={question.yVal}</text>
                    </g>
                    <g transform={`translate(${question.ptP.x}, ${question.ptP.y})`}>
                      <circle cx="0" cy="0" r="18" fill="#3b82f6" stroke="#ffffff" strokeWidth="3.5" />
                      <g transform={`translate(${question.xVal >= 0 ? 75 : -75}, ${question.yVal >= 0 ? -36 : 38})`}>
                        <rect x="-56" y="-18" width="112" height="36" fill="#0f172a" rx="12" stroke="#38bdf8" strokeWidth="2" />
                        <text x="0" y="2" fill="#ffffff" fontSize="16" fontWeight="900" textAnchor="middle" dominantBaseline="middle">P({question.xVal}, {question.yVal})</text>
                      </g>
                    </g>
                  </svg>
                </div>

                <div className="bg-slate-50 border-t-2 border-slate-200 p-2 grid grid-cols-3 gap-2 shrink-0">
                  <button onClick={() => handleInputKey('x')} className={`py-3 btn-3d-blue text-white font-mono font-black rounded-2xl shadow-md active:scale-95 text-lg flex items-center justify-center gap-2 transition-all ${(selectedNumerator === 'x' || selectedDenominator === 'x') ? 'ring-4 ring-amber-300 scale-[1.03]' : ''} ${wrongBtnKey === 'x' ? 'btn-wrong-flash' : ''}`}>
                    <span className="text-xl">x</span><span className="text-sm font-bold opacity-90 bg-white/20 px-2 py-0.5 rounded-lg">{question.xVal}</span>
                  </button>
                  <button onClick={() => handleInputKey('y')} className={`py-3 bg-gradient-to-b from-rose-400 to-red-600 border-b-[5px] border-red-800 text-white font-mono font-black rounded-2xl shadow-md active:scale-95 text-lg flex items-center justify-center gap-2 transition-all ${(selectedNumerator === 'y' || selectedDenominator === 'y') ? 'ring-4 ring-amber-300 scale-[1.03]' : ''} ${wrongBtnKey === 'y' ? 'btn-wrong-flash' : ''}`}>
                    <span className="text-xl">y</span><span className="text-sm font-bold opacity-90 bg-white/20 px-2 py-0.5 rounded-lg">{question.yVal}</span>
                  </button>
                  <button onClick={() => handleInputKey('r')} className={`py-3 btn-3d-yellow text-amber-950 font-mono font-black rounded-2xl shadow-md active:scale-95 text-lg flex items-center justify-center gap-2 transition-all ${(selectedNumerator === 'r' || selectedDenominator === 'r') ? 'ring-4 ring-white scale-[1.03]' : ''} ${wrongBtnKey === 'r' ? 'btn-wrong-flash' : ''}`}>
                    <span className="text-xl">r</span><span className="text-sm font-bold opacity-90 bg-amber-950/20 px-2 py-0.5 rounded-lg">{question.rVal}</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {gameState === 'ended' && (
            <LevelResultScreen
              score={score}
              baseScore={baseScore}
              earnedStars={earnedStars}
              maxCombo={maxCombo}
              correctCount={correctCount}
              wrongCount={wrongCount}
              maxTime={maxTime}
              accentClass="text-cyan-600"
              onCompleteLevel={onCompleteLevel}
              onRestart={() => startGame(pickOrder)}
              onBackToMap={onBackToMap}
            />
          )}
        </div>
      );
    };

    // ==================== 第 8 關組件：星象羅盤師 ====================
    const Level7AstroCompassMaster = ({ currentStars, onUpdateStars, onCompleteLevel, onBackToMap }) => {
      const [gameState, setGameState] = useState('idle');
      const [pickOrder, setPickOrder] = useState('num');
      const [timeLeft, setTimeLeft] = useState(75);
      const [score, setScore] = useState(0);
      const [baseScore, setBaseScore] = useState(0);
      const [combo, setCombo] = useState(0);
      const [maxCombo, setMaxCombo] = useState(0);
      const [correctCount, setCorrectCount] = useState(0);
      const [wrongCount, setWrongCount] = useState(0);
      const [question, setQuestion] = useState(null);
      const [stage, setStage] = useState('rotate');
      const [currentAngle, setCurrentAngle] = useState(0);
      const [isDragging, setIsDragging] = useState(false);
      const [selectedNumerator, setSelectedNumerator] = useState(null);
      const [selectedDenominator, setSelectedDenominator] = useState(null);
      const [isLockedSuccess, setIsLockedSuccess] = useState(false);
      const [feedbackAnim, setFeedbackAnim] = useState('');
      const [floatingText, setFloatingText] = useState(null);
      const [wrongBtnKey, setWrongBtnKey] = useState(null);
      const [conceptTip, setConceptTip] = useState(null);

      const dialSvgRef = useRef(null);
      const lastTickAngleRef = useRef(0);
      const lastAtanRef = useRef(0);
      const exactAngleRef = useRef(0);
      const isDraggingRef = useRef(false);
      const dwellTimerRef = useRef(null);
      const stageLockedRef = useRef(false);
      const timerRef = useRef(null);

      const maxTime = 75;
      const starsThreshold = [600, 1200, 1800];
      const width = 540, height = 540, origin = { x: 270, y: 270 }, R = 195;

      useEffect(() => { isDraggingRef.current = isDragging; }, [isDragging]);
      useEffect(() => {
        const preventTouchScroll = (e) => { if (isDraggingRef.current) e.preventDefault(); };
        document.addEventListener('touchmove', preventTouchScroll, { passive: false });
        return () => document.removeEventListener('touchmove', preventTouchScroll);
      }, []);

      const triggerFloat = (text, color) => {
        const id = Date.now();
        setFloatingText({ text, color, id });
        setTimeout(() => setFloatingText(prev => prev?.id === id ? null : prev), 850);
      };

      const nextQuestion = (curScore, prevAng = null) => {
        const phase = curScore >= starsThreshold[1] ? 2 : curScore >= starsThreshold[0] ? 1 : 0;
        const q = generateLevel7Question(phase, prevAng);
        setQuestion(q); setStage('rotate'); setCurrentAngle(0);
        exactAngleRef.current = 0; lastTickAngleRef.current = 0;
        setSelectedNumerator(null); setSelectedDenominator(null);
        setIsLockedSuccess(false); stageLockedRef.current = false; setConceptTip(null);
        if (dwellTimerRef.current) clearTimeout(dwellTimerRef.current);
      };

      const startGame = (order = pickOrder) => {
        setPickOrder(order);
        setScore(0); setBaseScore(0); setCombo(0); setMaxCombo(0);
        setCorrectCount(0); setWrongCount(0);
        setTimeLeft(maxTime); setFeedbackAnim('');
        setSelectedNumerator(null); setSelectedDenominator(null);
        setWrongBtnKey(null); setConceptTip(null);
        setGameState('playing');
        nextQuestion(0, null);
        audio.init();
      };

      useEffect(() => {
        if (gameState === 'playing') {
          timerRef.current = setInterval(() => {
            if (isLockedSuccess) return;
            setTimeLeft(prev => {
              if (prev <= 0.1) {
                clearInterval(timerRef.current);
                if (dwellTimerRef.current) clearTimeout(dwellTimerRef.current);
                audio.sfxTimeUp();
                setGameState('ended');
                return 0;
              }
              return +(prev - 0.1).toFixed(1);
            });
          }, 100);
        } else {
          clearInterval(timerRef.current);
          if (dwellTimerRef.current) clearTimeout(dwellTimerRef.current);
        }
        return () => {
          clearInterval(timerRef.current);
          if (dwellTimerRef.current) clearTimeout(dwellTimerRef.current);
        };
      }, [gameState, isLockedSuccess]);

      const earnedStars = useMemo(() => {
        if (score >= starsThreshold[2]) return 3;
        if (score >= starsThreshold[1]) return 2;
        if (score >= starsThreshold[0]) return 1;
        return 0;
      }, [score]);

      useEffect(() => {
        if (gameState === 'ended' && earnedStars > currentStars) onUpdateStars(earnedStars, score);
      }, [gameState, earnedStars]);

      const lockRotationStage = () => {
        if (stageLockedRef.current) return;
        stageLockedRef.current = true;
        if (dwellTimerRef.current) clearTimeout(dwellTimerRef.current);
        setIsDragging(false);
        audio.sfxBonus();
        triggerFloat("角度鎖定！請選分子與分母", "text-amber-300");
        setFeedbackAnim('animate-correct');
        setStage('define');
        setTimeout(() => setFeedbackAnim(''), 300);
      };

      const checkDwellHover = (angleVal) => {
        if (dwellTimerRef.current) clearTimeout(dwellTimerRef.current);
        if (stage !== 'rotate' || stageLockedRef.current || !question) return;
        if (angleVal === question.targetAngle) {
          dwellTimerRef.current = setTimeout(() => { if (!stageLockedRef.current) lockRotationStage(); }, 300);
        }
      };

      const handlePointerDown = (e) => {
        if (stage !== 'rotate' || stageLockedRef.current || !dialSvgRef.current) return;
        setIsDragging(true);
        e.target.setPointerCapture(e.pointerId);
        const ctm = dialSvgRef.current.getScreenCTM();
        if (!ctm) return;
        const inv = ctm.inverse();
        const svgX = inv.a * e.clientX + inv.c * e.clientY + inv.e;
        const svgY = inv.b * e.clientX + inv.d * e.clientY + inv.f;
        lastAtanRef.current = Math.atan2(origin.y - svgY, svgX - origin.x) * (180 / Math.PI);
        exactAngleRef.current = currentAngle;
      };

      const handlePointerMove = (e) => {
        if (!isDragging || stage !== 'rotate' || stageLockedRef.current || !dialSvgRef.current) return;
        const ctm = dialSvgRef.current.getScreenCTM();
        if (!ctm) return;
        const inv = ctm.inverse();
        const svgX = inv.a * e.clientX + inv.c * e.clientY + inv.e;
        const svgY = inv.b * e.clientX + inv.d * e.clientY + inv.f;
        const currentAtan = Math.atan2(origin.y - svgY, svgX - origin.x) * (180 / Math.PI);
        let diff = currentAtan - lastAtanRef.current;
        if (diff > 180) diff -= 360;
        if (diff < -180) diff += 360;
        exactAngleRef.current += diff;
        lastAtanRef.current = currentAtan;
        const snapped = Math.round(exactAngleRef.current / 5) * 5;
        if (snapped !== lastTickAngleRef.current) { audio.sfxTick(); lastTickAngleRef.current = snapped; }
        setCurrentAngle(snapped);
        checkDwellHover(snapped);
      };

      const handlePointerUp = (e) => {
        if (!isDragging) return;
        setIsDragging(false);
        if (e?.target?.hasPointerCapture?.(e.pointerId)) e.target.releasePointerCapture(e.pointerId);
        if (stage === 'rotate' && question && !stageLockedRef.current && currentAngle === question.targetAngle) lockRotationStage();
      };

      const stepAngle = (delta) => {
        if (stage !== 'rotate' || stageLockedRef.current || !question) return;
        const next = currentAngle + delta;
        audio.sfxTick();
        exactAngleRef.current = next; lastTickAngleRef.current = next;
        setCurrentAngle(next); checkDwellHover(next);
        if (next === question.targetAngle) lockRotationStage();
      };

      const handleInputKey = (key) => {
        if (gameState !== 'playing' || stage !== 'define' || !question || isLockedSuccess) return;
        const firstKey = pickOrder === 'num' ? selectedNumerator : selectedDenominator;
        if (!firstKey) {
          audio.sfxSelect();
          if (pickOrder === 'num') setSelectedNumerator(key);
          else setSelectedDenominator(key);
        } else if (firstKey === key) {
          audio.sfxClick();
          setSelectedNumerator(null);
          setSelectedDenominator(null);
        } else {
          const numKey = pickOrder === 'num' ? firstKey : key;
          const denKey = pickOrder === 'num' ? key : firstKey;
          setSelectedNumerator(numKey);
          setSelectedDenominator(denKey);
          if (numKey === question.correctNumeratorKey && denKey === question.correctDenominatorKey) {
            audio.sfxMatch();
            setIsLockedSuccess(true);
            setConceptTip(null);
            const mult = combo >= 6 ? 1.5 : combo >= 3 ? 1.2 : 1.0;
            const earned = Math.floor(150 * mult);
            const newScore = score + earned;
            setScore(newScore);
            setBaseScore(b => b + 150);
            setCorrectCount(c => c + 1);
            const newCombo = combo + 1;
            setCombo(newCombo);
            if (newCombo > maxCombo) setMaxCombo(newCombo);
            triggerFloat(`+${earned} 完美解算！`, "text-amber-300");
            setFeedbackAnim('animate-correct');
            setTimeout(() => { setFeedbackAnim(''); nextQuestion(newScore, question.targetAngle); }, 1100);
          } else {
            audio.sfxError();
            setCombo(0);
            setWrongCount(w => w + 1);
            const timePenalty = +(maxTime * 0.03).toFixed(2);
            setTimeLeft(prev => {
              const nextT = Math.max(0, +(prev - timePenalty).toFixed(2));
              if (nextT <= 0) {
                clearInterval(timerRef.current);
                if (dwellTimerRef.current) clearTimeout(dwellTimerRef.current);
                audio.sfxTimeUp();
                setGameState('ended');
              }
              return nextT;
            });
            setWrongBtnKey(key);
            setConceptTip({ text: question.conceptTip, id: Date.now() });
            triggerFloat(`-${timePenalty} 秒! 定義錯誤`, "text-red-500");
            setFeedbackAnim('animate-shake');
            setTimeout(() => { setFeedbackAnim(''); setSelectedNumerator(null); setSelectedDenominator(null); setWrongBtnKey(null); }, 400);
          }
        }
      };

      const getDisplayVal = (key) => !question ? '' : key === 'x' ? question.xStr : key === 'y' ? question.yStr : question.rStr;
      const rayAngles = Array.from({ length: 24 }, (_, i) => i * 15);
      const currentRad = (currentAngle * Math.PI) / 180;
      const ptTerminal = { x: origin.x + R * Math.cos(currentRad), y: origin.y - R * Math.sin(currentRad) };
      const isLv8NumTurn = (pickOrder === 'num' && !selectedNumerator) || (pickOrder === 'den' && selectedDenominator && !selectedNumerator);
      const isLv8DenTurn = (pickOrder === 'den' && !selectedDenominator) || (pickOrder === 'num' && selectedNumerator && !selectedDenominator);

      return (
        <div className="w-full h-full flex-1 flex flex-col justify-between pt-0.5 pb-1 relative animate-jelly min-h-0">

          {gameState === 'idle' && (
            <div className="flex-1 my-3 bg-white/95 rounded-3xl border-4 border-indigo-950 p-5 shadow-2xl flex flex-col justify-between text-center items-center">
              <div className="w-full space-y-2.5 pt-2">
                <div className="w-20 h-20 mx-auto rounded-3xl bg-violet-100 border-4 border-violet-500 flex items-center justify-center text-4xl shadow-inner animate-bounce">🔭</div>
                <h2 className="text-2xl font-black text-indigo-950 tracking-wide">星象羅盤師</h2>
                <div className="text-xs font-black text-violet-700 bg-violet-50 border border-violet-200 rounded-full px-3 py-1 inline-block">① 轉角 ➔ ② x · y · r</div>
              </div>
              <CompactStarPills starsThreshold={starsThreshold} maxTime={maxTime} />
              <div className="w-full space-y-2">
                <FractionOrderButtons onStartWithOrder={startGame} />
                <button onClick={onBackToMap} className="w-full py-2 text-xs font-bold text-slate-400 hover:text-slate-600">返回聖域地圖</button>
              </div>
            </div>
          )}

          {gameState === 'playing' && question && (
            <div className={`flex-1 min-h-0 flex flex-col justify-between gap-2 overflow-hidden pb-0.5 ${feedbackAnim}`}>
              <GameHUD score={score} combo={combo} timeLeft={timeLeft} maxTime={maxTime} starsThreshold={starsThreshold} />

              <div className={`flex-1 min-h-0 bg-white rounded-3xl border-3 border-indigo-950 shadow-xl flex flex-col overflow-hidden transition-all duration-150 ${isLockedSuccess ? 'ring-4 ring-emerald-400/75' : ''}`}>
                <div className="bg-gradient-to-r from-violet-600 to-indigo-700 py-1.5 px-3.5 flex justify-between items-center text-white min-h-[52px] border-b-2 border-indigo-950 shrink-0">
                  <div className="flex items-center gap-2 overflow-x-auto no-scrollbar">
                    <span className="text-lg sm:text-2xl font-serif font-black shrink-0">{question.targetFunc}({question.targetAngle}°) =</span>
                    {stage === 'rotate' ? (
                      <span className="text-xs font-black bg-amber-400/20 text-amber-200 border border-amber-300/50 px-2.5 py-1 rounded-xl animate-pulse whitespace-nowrap">① 請先轉至 {question.targetAngle}°</span>
                    ) : (
                      <div className="flex items-center gap-2 shrink-0">
                        <div className="flex flex-col items-center">
                          <div
                            onClick={() => { if (selectedNumerator && !isLockedSuccess) { audio.sfxClick(); setSelectedNumerator(null); } }}
                            className={`min-w-[50px] px-2 h-6 rounded-md border-2 flex items-center justify-center font-bold text-xs transition-all ${
                              selectedNumerator
                                ? 'bg-emerald-400 border-emerald-200 text-emerald-950 font-black cursor-pointer active:scale-95'
                                : isLv8NumTurn
                                ? 'border-amber-300 bg-amber-400/30 text-amber-100 animate-pulse shadow-[0_0_10px_rgba(251,191,36,0.6)]'
                                : 'border-dashed border-white/40 text-violet-200/70 bg-white/5'
                            }`}
                          >
                            {selectedNumerator ? `${selectedNumerator}(${getDisplayVal(selectedNumerator)})` : '分子'}
                          </div>
                          <div className="w-full h-0.5 bg-white/70 my-0.5"></div>
                          <div
                            onClick={() => { if (selectedDenominator && !isLockedSuccess) { audio.sfxClick(); setSelectedDenominator(null); } }}
                            className={`min-w-[50px] px-2 h-6 rounded-md border-2 flex items-center justify-center font-bold text-xs transition-all ${
                              selectedDenominator
                                ? 'bg-amber-400 border-amber-200 text-amber-950 font-black cursor-pointer active:scale-95'
                                : isLv8DenTurn
                                ? 'border-amber-300 bg-amber-400/30 text-amber-100 animate-pulse shadow-[0_0_10px_rgba(251,191,36,0.6)]'
                                : 'border-dashed border-white/40 text-violet-200/70 bg-white/5'
                            }`}
                          >
                            {selectedDenominator ? `${selectedDenominator}(${getDisplayVal(selectedDenominator)})` : '分母'}
                          </div>
                        </div>
                        {isLockedSuccess && (
                          <span className="text-amber-300 font-serif font-black text-base bg-indigo-950/70 px-2 py-1 rounded-xl border border-amber-300">= {question.exactValText}</span>
                        )}
                        <SuccessBadge show={isLockedSuccess} />
                      </div>
                    )}
                  </div>
                  <span className="text-xs font-black bg-white/20 px-2 py-1 rounded-xl border border-white/40 whitespace-nowrap">
                    {stage === 'rotate' ? `${currentAngle}°` : question.locationLabel}
                  </span>
                </div>

                <div className="relative w-full flex-1 min-h-0 bg-white flex items-center justify-center overflow-hidden">
                  <HintBanner tip={conceptTip} />
                  <svg ref={dialSvgRef} viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="xMidYMid meet" className={`w-full h-full object-contain select-none ${stage === 'rotate' ? 'cursor-grab active:cursor-grabbing' : ''}`} onPointerDown={handlePointerDown} onPointerMove={handlePointerMove} onPointerUp={handlePointerUp} onPointerCancel={handlePointerUp}>
                    <line x1={30} y1={270} x2={510} y2={270} stroke="#94a3b8" strokeWidth="2.5" />
                    <line x1={270} y1={30} x2={270} y2={510} stroke="#94a3b8" strokeWidth="2.5" />
                    {rayAngles.map(deg => {
                      const rRad = (deg * Math.PI) / 180;
                      const isAxis = deg % 90 === 0;
                      return <line key={deg} x1={270} y1={270} x2={270 + 200 * Math.cos(rRad)} y2={270 - 200 * Math.sin(rRad)} stroke="#94a3b8" strokeWidth={isAxis ? 3 : 2} strokeDasharray={isAxis ? "none" : "5 5"} />;
                    })}
                    <line x1={270} y1={270} x2={490} y2={270} stroke="#ef4444" strokeWidth="8" strokeLinecap="round" />
                    {stage === 'rotate' ? (
                      <g>
                        <line x1={270} y1={270} x2={ptTerminal.x} y2={ptTerminal.y} stroke="#7c3aed" strokeWidth="8" strokeLinecap="round" />
                        <g transform={`translate(${ptTerminal.x}, ${ptTerminal.y})`}>
                          <circle cx="0" cy="0" r={isDragging ? 22 : 18} fill="#7c3aed" stroke="#ffffff" strokeWidth="4" />
                          <circle cx="0" cy="0" r="6" fill="#ffffff" />
                        </g>
                        <circle cx={270} cy={270} r={height} fill="transparent" style={{ touchAction: 'none' }} />
                      </g>
                    ) : (
                      <g className="animate-jelly">
                        <line x1={270} y1={270} x2={question.ptP.x} y2={question.ptP.y} stroke="#f59e0b" strokeWidth="9" strokeLinecap="round" onClick={() => handleInputKey('r')} />
                        <g transform={`translate(${(270 + question.ptP.x) / 2 - 24}, ${(270 + question.ptP.y) / 2})`} onClick={() => handleInputKey('r')}>
                          <rect x="-34" y="-16" width="68" height="32" fill="white" stroke="#f59e0b" strokeWidth="2.5" rx="10" />
                          <text x="0" y="2" fill="#b45309" fontSize="17" fontWeight="900" textAnchor="middle" dominantBaseline="middle">r={question.rStr}</text>
                        </g>
                        <g transform={`translate(${question.xNum === 0 ? 316 : question.ptFootX.x}, ${270 + (question.yNum >= 0 ? 28 : -28)})`} onClick={() => handleInputKey('x')}>
                          <rect x="-38" y="-16" width="76" height="32" fill="white" stroke="#2563eb" strokeWidth="2.5" rx="10" />
                          <text x="0" y="2" fill="#1d4ed8" fontSize="17" fontWeight="900" textAnchor="middle" dominantBaseline="middle">x={question.xStr}</text>
                        </g>
                        <g transform={`translate(${270 + (question.xNum >= 0 ? -46 : 46)}, ${question.yNum === 0 ? 232 : question.ptFootY.y})`} onClick={() => handleInputKey('y')}>
                          <rect x="-38" y="-16" width="76" height="32" fill="white" stroke="#ef4444" strokeWidth="2.5" rx="10" />
                          <text x="0" y="2" fill="#b91c1c" fontSize="17" fontWeight="900" textAnchor="middle" dominantBaseline="middle">y={question.yStr}</text>
                        </g>
                        <g transform={`translate(${question.ptP.x}, ${question.ptP.y})`}>
                          <circle cx="0" cy="0" r="17" fill="#7c3aed" stroke="#ffffff" strokeWidth="3.5" />
                        </g>
                      </g>
                    )}
                  </svg>
                </div>

                {stage === 'rotate' ? (
                  <div className="bg-slate-50 border-t-2 border-slate-200 p-2 grid grid-cols-2 gap-2 shrink-0">
                    <button onClick={() => stepAngle(-5)} className="py-3 btn-3d-purple text-white font-mono font-black rounded-2xl shadow-md active:scale-95 text-sm flex items-center justify-center gap-1"><span>↺</span> -5° 微調</button>
                    <button onClick={() => stepAngle(5)} className="py-3 btn-3d-purple text-white font-mono font-black rounded-2xl shadow-md active:scale-95 text-sm flex items-center justify-center gap-1"><span>↻</span> +5° 微調</button>
                  </div>
                ) : (
                  <div className="bg-slate-50 border-t-2 border-slate-200 p-2 grid grid-cols-3 gap-2 shrink-0 animate-jelly">
                    <button onClick={() => handleInputKey('x')} className={`py-3 btn-3d-blue text-white font-mono font-black rounded-2xl shadow-md active:scale-95 text-lg flex items-center justify-center gap-2 ${(selectedNumerator === 'x' || selectedDenominator === 'x') ? 'ring-4 ring-amber-300 scale-[1.03]' : ''} ${wrongBtnKey === 'x' ? 'btn-wrong-flash' : ''}`}><span className="text-xl">x</span><span className="text-sm bg-white/20 px-2 py-0.5 rounded-lg">{question.xStr}</span></button>
                    <button onClick={() => handleInputKey('y')} className={`py-3 bg-gradient-to-b from-rose-400 to-red-600 border-b-[5px] border-red-800 text-white font-mono font-black rounded-2xl shadow-md active:scale-95 text-lg flex items-center justify-center gap-2 ${(selectedNumerator === 'y' || selectedDenominator === 'y') ? 'ring-4 ring-amber-300 scale-[1.03]' : ''} ${wrongBtnKey === 'y' ? 'btn-wrong-flash' : ''}`}><span className="text-xl">y</span><span className="text-sm bg-white/20 px-2 py-0.5 rounded-lg">{question.yStr}</span></button>
                    <button onClick={() => handleInputKey('r')} className={`py-3 btn-3d-yellow text-amber-950 font-mono font-black rounded-2xl shadow-md active:scale-95 text-lg flex items-center justify-center gap-2 ${(selectedNumerator === 'r' || selectedDenominator === 'r') ? 'ring-4 ring-white scale-[1.03]' : ''} ${wrongBtnKey === 'r' ? 'btn-wrong-flash' : ''}`}><span className="text-xl">r</span><span className="text-sm bg-amber-950/20 px-2 py-0.5 rounded-lg">{question.rStr}</span></button>
                  </div>
                )}
              </div>
            </div>
          )}

          {gameState === 'ended' && (
            <LevelResultScreen
              score={score}
              baseScore={baseScore}
              earnedStars={earnedStars}
              maxCombo={maxCombo}
              correctCount={correctCount}
              wrongCount={wrongCount}
              maxTime={maxTime}
              accentClass="text-violet-600"
              onCompleteLevel={onCompleteLevel}
              onRestart={() => startGame(pickOrder)}
              onBackToMap={onBackToMap}
            />
          )}
        </div>
      );
    };

    // ==================== 第 10 關組件：正負傳送帶（分類滑卡） ====================
    const LV10_PHASE0_POOL = [
      { id: 'p0_sin40', expr: 'sin 40°', ans: 'pos', tip: '40° 在第 I 象限，所有函數皆正 (> 0)' },
      { id: 'p0_cos55', expr: 'cos 55°', ans: 'pos', tip: '55° 在第 I 象限，cos > 0' },
      { id: 'p0_tan70', expr: 'tan 70°', ans: 'pos', tip: '70° 在第 I 象限，tan > 0' },
      { id: 'p0_sin140', expr: 'sin 140°', ans: 'pos', tip: '140° 在第 II 象限，sin 看 y 坐標為正 (> 0)' },
      { id: 'p0_cos125', expr: 'cos 125°', ans: 'neg', tip: '125° 在第 II 象限，cos 看 x 坐標為負 (< 0)' },
      { id: 'p0_tan150', expr: 'tan 150°', ans: 'neg', tip: '150° 在第 II 象限，x, y 異號故 tan < 0' },
      { id: 'p0_sin220', expr: 'sin 220°', ans: 'neg', tip: '220° 在第 III 象限，sin < 0' },
      { id: 'p0_cos210', expr: 'cos 210°', ans: 'neg', tip: '210° 在第 III 象限，cos < 0' },
      { id: 'p0_tan235', expr: 'tan 235°', ans: 'pos', tip: '235° 在第 III 象限，x, y 皆負故 tan > 0' },
      { id: 'p0_sin310', expr: 'sin 310°', ans: 'neg', tip: '310° 在第 IV 象限，sin < 0' },
      { id: 'p0_cos320', expr: 'cos 320°', ans: 'pos', tip: '320° 在第 IV 象限，cos > 0' },
      { id: 'p0_tan315', expr: 'tan 315°', ans: 'neg', tip: '315° 在第 IV 象限，x, y 異號故 tan < 0' }
    ];

    const LV10_PHASE1_POOL = [
      { id: 'p1_sin_n45', expr: 'sin(-45°)', ans: 'neg', tip: '-45° 在第 IV 象限，sin < 0' },
      { id: 'p1_cos_n40', expr: 'cos(-40°)', ans: 'pos', tip: '-40° 在第 IV 象限，cos > 0' },
      { id: 'p1_tan_n50', expr: 'tan(-50°)', ans: 'neg', tip: '-50° 在第 IV 象限，tan < 0' },
      { id: 'p1_sin_n120', expr: 'sin(-120°)', ans: 'neg', tip: '-120° 同界 240°（第 III 象限），sin < 0' },
      { id: 'p1_cos_n210', expr: 'cos(-210°)', ans: 'neg', tip: '-210° 同界 150°（第 II 象限），cos < 0' },
      { id: 'p1_tan_n135', expr: 'tan(-135°)', ans: 'pos', tip: '-135° 同界 225°（第 III 象限），tan > 0' },
      { id: 'p1_sin_n300', expr: 'sin(-300°)', ans: 'pos', tip: '-300° 同界 60°（第 I 象限），sin > 0' },
      { id: 'p1_cos_n310', expr: 'cos(-310°)', ans: 'pos', tip: '-310° 同界 50°（第 I 象限），cos > 0' },
      { id: 'p1_sin400', expr: 'sin 400°', ans: 'pos', tip: '400° = 360° + 40°（第 I 象限），sin > 0' },
      { id: 'p1_cos500', expr: 'cos 500°', ans: 'neg', tip: '500° = 360° + 140°（第 II 象限），cos < 0' },
      { id: 'p1_tan495', expr: 'tan 495°', ans: 'neg', tip: '495° = 360° + 135°（第 II 象限），tan < 0' },
      { id: 'p1_tan580', expr: 'tan 580°', ans: 'pos', tip: '580° = 360° + 220°（第 III 象限），tan > 0' }
    ];

    const LV10_PHASE2_POOL = [
      { id: 'p2_q1_sc', lines: ['sin θ > 0', 'cos θ > 0'], ans: '1', tip: 'y > 0 且 x > 0 → 第 I 象限' },
      { id: 'p2_q1_ct', lines: ['cos θ > 0', 'tan θ > 0'], ans: '1', tip: 'cos>0 (I,IV) 與 tan>0 (I,III) → 第 I 象限' },
      { id: 'p2_q1_st', lines: ['sin θ > 0', 'tan θ > 0'], ans: '1', tip: 'sin>0 (I,II) 與 tan>0 (I,III) → 第 I 象限' },
      { id: 'p2_q2_sc', lines: ['sin θ > 0', 'cos θ < 0'], ans: '2', tip: 'y > 0 且 x < 0 → 第 II 象限' },
      { id: 'p2_q2_st', lines: ['sin θ > 0', 'tan θ < 0'], ans: '2', tip: 'sin>0 (I,II) 與 tan<0 (II,IV) → 第 II 象限' },
      { id: 'p2_q2_ct', lines: ['cos θ < 0', 'tan θ < 0'], ans: '2', tip: 'cos<0 (II,III) 與 tan<0 (II,IV) → 第 II 象限' },
      { id: 'p2_q3_sc', lines: ['sin θ < 0', 'cos θ < 0'], ans: '3', tip: 'y < 0 且 x < 0 → 第 III 象限' },
      { id: 'p2_q3_st', lines: ['sin θ < 0', 'tan θ > 0'], ans: '3', tip: 'sin<0 (III,IV) 與 tan>0 (I,III) → 第 III 象限' },
      { id: 'p2_q3_ct', lines: ['cos θ < 0', 'tan θ > 0'], ans: '3', tip: 'cos<0 (II,III) 與 tan>0 (I,III) → 第 III 象限' },
      { id: 'p2_q4_cs', lines: ['cos θ > 0', 'sin θ < 0'], ans: '4', tip: 'x > 0 且 y < 0 → 第 IV 象限' },
      { id: 'p2_q4_ct', lines: ['cos θ > 0', 'tan θ < 0'], ans: '4', tip: 'cos>0 (I,IV) 與 tan<0 (II,IV) → 第 IV 象限' },
      { id: 'p2_q4_st', lines: ['sin θ < 0', 'tan θ < 0'], ans: '4', tip: 'sin<0 (III,IV) 與 tan<0 (II,IV) → 第 IV 象限' }
    ];

    const Level8QuadrantSignMaster = ({ currentStars, onUpdateStars, onCompleteLevel, onBackToMap }) => {
      const [gameState, setGameState] = useState('idle');
      const [timeLeft, setTimeLeft] = useState(60);
      const [score, setScore] = useState(0);
      const [baseScore, setBaseScore] = useState(0);
      const [combo, setCombo] = useState(0);
      const [maxCombo, setMaxCombo] = useState(0);
      const [correctCount, setCorrectCount] = useState(0);
      const [wrongCount, setWrongCount] = useState(0);
      const [question, setQuestion] = useState(null);
      const [nextPreview, setNextPreview] = useState(null);
      const [isTransitioning, setIsTransitioning] = useState(false);
      const [dragOffset, setDragOffset] = useState({ x: 0, y: 0 });
      const [isDragging, setIsDragging] = useState(false);
      const [flyOutTarget, setFlyOutTarget] = useState(null);
      const [feedbackAnim, setFeedbackAnim] = useState('');
      const [wrongTargetKey, setWrongTargetKey] = useState(null);
      const [conceptTip, setConceptTip] = useState(null);
      const [feverBanner, setFeverBanner] = useState(false);

      const bag0Ref = useRef([]);
      const bag1Ref = useRef([]);
      const bag2Ref = useRef([]);
      const lastIdRef = useRef(null);
      const timerRef = useRef(null);
      const dragStartRef = useRef(null);
      const nextPreviewRef = useRef(null);
      const questionErrorsRef = useRef(0);

      const maxTime = 60;
      const starsThreshold = [700, 1400, 2100];

      const drawFromBag = (bagRef, sourcePool) => {
        if (bagRef.current.length === 0) {
          let fresh = shuffle(sourcePool);
          if (fresh.length > 1 && fresh[0].id === lastIdRef.current) {
            [fresh[0], fresh[fresh.length - 1]] = [fresh[fresh.length - 1], fresh[0]];
          }
          bagRef.current = fresh;
        }
        const item = bagRef.current.shift();
        lastIdRef.current = item.id;
        return item;
      };

      const pickQuestionForScore = (curScore) => {
        const phase = curScore >= starsThreshold[1] ? 2 : curScore >= starsThreshold[0] ? 1 : 0;
        const pool = phase === 0 ? LV10_PHASE0_POOL : phase === 1 ? LV10_PHASE1_POOL : LV10_PHASE2_POOL;
        const bag = phase === 0 ? bag0Ref : phase === 1 ? bag1Ref : bag2Ref;
        return { phase, ...drawFromBag(bag, pool) };
      };

      const advanceCard = (curScore) => {
        const curPhase = curScore >= starsThreshold[1] ? 2 : curScore >= starsThreshold[0] ? 1 : 0;
        const currentCard = nextPreviewRef.current && nextPreviewRef.current.phase === curPhase
          ? nextPreviewRef.current
          : pickQuestionForScore(curScore);
        const upcoming = pickQuestionForScore(curScore);
        nextPreviewRef.current = upcoming;
        questionErrorsRef.current = 0;
        setQuestion(currentCard);
        setNextPreview(upcoming);
        setDragOffset({ x: 0, y: 0 });
        setFlyOutTarget(null);
        setIsTransitioning(false);
        setConceptTip(null);
      };

      const startGame = () => {
        bag0Ref.current = []; bag1Ref.current = []; bag2Ref.current = []; lastIdRef.current = null;
        nextPreviewRef.current = null;
        setScore(0); setBaseScore(0); setCombo(0); setMaxCombo(0);
        setCorrectCount(0); setWrongCount(0);
        setTimeLeft(maxTime); setFeedbackAnim('');
        setWrongTargetKey(null); setConceptTip(null);
        setDragOffset({ x: 0, y: 0 }); setFlyOutTarget(null);
        setIsTransitioning(false); setFeverBanner(false);
        setGameState('playing');
        advanceCard(0);
        audio.init();
      };

      useEffect(() => {
        if (gameState === 'playing') {
          timerRef.current = setInterval(() => {
            setTimeLeft(prev => {
              if (prev <= 0.1) {
                clearInterval(timerRef.current);
                audio.sfxTimeUp();
                setGameState('ended');
                return 0;
              }
              return +(prev - 0.1).toFixed(1);
            });
          }, 100);
        } else clearInterval(timerRef.current);
        return () => clearInterval(timerRef.current);
      }, [gameState]);

      const earnedStars = useMemo(() => {
        if (score >= starsThreshold[2]) return 3;
        if (score >= starsThreshold[1]) return 2;
        if (score >= starsThreshold[0]) return 1;
        return 0;
      }, [score]);

      useEffect(() => {
        if (gameState === 'ended' && earnedStars > currentStars) onUpdateStars(earnedStars, score);
      }, [gameState, earnedStars]);

      const getFlyVector = (choice) => {
        if (choice === 'neg') return { x: -240, y: -10 };
        if (choice === 'pos') return { x: 240, y: -10 };
        if (choice === '1') return { x: 180, y: -150 };
        if (choice === '2') return { x: -180, y: -150 };
        if (choice === '3') return { x: -180, y: 150 };
        if (choice === '4') return { x: 180, y: 150 };
        return { x: 0, y: 200 };
      };

      const submitSort = (choice) => {
        if (gameState !== 'playing' || !question || isTransitioning) return;
        if (choice === question.ans) {
          setIsTransitioning(true);
          setConceptTip(null);
          const errs = questionErrorsRef.current;
          const basePts = question.phase < 2
            ? (errs === 0 ? 100 : 0)
            : (errs === 0 ? 150 : errs === 1 ? 75 : 0);
          const newCombo = errs === 0 ? combo + 1 : 0;
          const mult = errs === 0 ? (combo >= 6 ? 1.5 : combo >= 3 ? 1.2 : 1.0) : 1.0;
          const earned = Math.floor(basePts * mult);
          const newScore = score + earned;
          setScore(newScore);
          if (basePts > 0) setBaseScore(b => b + basePts);
          setCorrectCount(c => c + 1);
          setCombo(newCombo);
          if (newCombo > maxCombo) setMaxCombo(newCombo);

          if (newCombo === 6) {
            audio.sfxFeverStart();
            setFeverBanner(true);
            setTimeout(() => setFeverBanner(false), 1100);
          } else {
            audio.sfxSwipeSort(newCombo >= 6, newCombo);
          }

          setFlyOutTarget(getFlyVector(choice));
          setFeedbackAnim('animate-correct');
          const delayMs = newCombo >= 6 ? 180 : 240;
          setTimeout(() => {
            setFeedbackAnim('');
            advanceCard(newScore);
          }, delayMs);
        } else {
          audio.sfxError();
          questionErrorsRef.current += 1;
          setCombo(0);
          setWrongCount(w => w + 1);
          setScore(s => Math.max(0, s - 80));
          const timePenalty = +(maxTime * 0.03).toFixed(2);
          setTimeLeft(prev => {
            const nextT = Math.max(0, +(prev - timePenalty).toFixed(2));
            if (nextT <= 0) {
              clearInterval(timerRef.current);
              audio.sfxTimeUp();
              setGameState('ended');
            }
            return nextT;
          });
          setWrongTargetKey(choice);
          setDragOffset({ x: 0, y: 0 });
          if (question?.tip) setConceptTip({ text: question.tip, id: Date.now() });
          setFeedbackAnim('animate-shake');
          setTimeout(() => {
            setFeedbackAnim('');
            setWrongTargetKey(null);
          }, 350);
        }
      };

      const getHoverTarget = (dx, dy) => {
        if (!question) return null;
        if (question.phase < 2) {
          if (dx < -45) return 'neg';
          if (dx > 45) return 'pos';
          return null;
        }
        if (Math.hypot(dx, dy) < 48) return null;
        if (dx >= 0 && dy < 0) return '1';
        if (dx < 0 && dy < 0) return '2';
        if (dx < 0 && dy >= 0) return '3';
        return '4';
      };

      const handleCardPointerDown = (e) => {
        if (gameState !== 'playing' || isTransitioning) return;
        e.currentTarget.setPointerCapture(e.pointerId);
        dragStartRef.current = { x: e.clientX, y: e.clientY };
        setIsDragging(true);
      };

      const handleCardPointerMove = (e) => {
        if (!isDragging || !dragStartRef.current) return;
        const dx = e.clientX - dragStartRef.current.x;
        const dy = question?.phase < 2
          ? (e.clientY - dragStartRef.current.y) * 0.22
          : (e.clientY - dragStartRef.current.y);
        setDragOffset({ x: dx, y: dy });
      };

      const handleCardPointerUp = () => {
        if (!isDragging) return;
        setIsDragging(false);
        dragStartRef.current = null;
        const target = getHoverTarget(dragOffset.x, dragOffset.y);
        if (target) {
          submitSort(target);
        } else {
          setDragOffset({ x: 0, y: 0 });
        }
      };

      const isFever = combo >= 6;
      const isWarm = combo >= 3 && combo < 6;
      const hoverTarget = isDragging ? getHoverTarget(dragOffset.x, dragOffset.y) : null;
      const cardTransform = flyOutTarget
        ? `translate(${flyOutTarget.x}px, ${flyOutTarget.y}px) rotate(${flyOutTarget.x * 0.08}deg) scale(0.82)`
        : `translate(${dragOffset.x}px, ${dragOffset.y}px) rotate(${dragOffset.x * 0.055}deg)`;

      return (
        <div className="w-full h-full flex-1 flex flex-col justify-between pt-0.5 pb-1 relative animate-jelly min-h-0">
          {gameState === 'idle' && (
            <div className="flex-1 my-3 bg-white/95 rounded-3xl border-4 border-indigo-950 p-5 shadow-2xl flex flex-col justify-between text-center items-center">
              <div className="w-full space-y-2.5 pt-2">
                <div className="w-20 h-20 mx-auto rounded-3xl bg-rose-100 border-4 border-rose-500 flex items-center justify-center text-4xl shadow-inner animate-bounce">⚡</div>
                <h2 className="text-2xl font-black text-indigo-950 tracking-wide">正負傳送帶</h2>
                <p className="text-xs text-slate-500 font-bold leading-relaxed max-w-xs mx-auto">
                  滑動或點擊分類中央題卡！前段分流 <span className="text-rose-600 font-black">左 &lt; 0</span> / <span className="text-emerald-600 font-black">右 &gt; 0</span>，高階切換為<span className="text-indigo-600 font-black">四角象限盤</span>！連對 6 題啟動 FEVER！
                </p>
              </div>
              <CompactStarPills starsThreshold={starsThreshold} maxTime={maxTime} />
              <div className="w-full space-y-2">
                <button onClick={startGame} className="w-full py-4 btn-3d-purple text-white font-black text-lg rounded-2xl shadow-xl tracking-wider active:scale-95">🚀 開始 60 秒挑戰！</button>
                <button onClick={onBackToMap} className="w-full py-2 text-xs font-bold text-slate-400 hover:text-slate-600">返回聖域地圖</button>
              </div>
            </div>
          )}

          {gameState === 'playing' && question && (
            <div className={`flex-1 min-h-0 flex flex-col justify-between gap-2 overflow-hidden pb-0.5 ${feedbackAnim}`}>
              <GameHUD score={score} combo={combo} timeLeft={timeLeft} maxTime={maxTime} starsThreshold={starsThreshold} />

              <div className={`flex-1 min-h-0 rounded-3xl border-3 shadow-xl flex flex-col overflow-hidden transition-all duration-200 relative ${
                isFever
                  ? 'bg-gradient-to-b from-amber-950 via-purple-950 to-slate-950 border-amber-400 ring-4 ring-amber-400/75'
                  : isWarm
                  ? 'bg-gradient-to-b from-indigo-950 via-purple-950 to-slate-950 border-sky-400 ring-2 ring-sky-400/50'
                  : 'bg-gradient-to-b from-slate-900 via-indigo-950 to-slate-950 border-indigo-950'
              }`}>
                <div className={`py-2 px-3.5 flex justify-between items-center text-white border-b-2 shrink-0 ${
                  isFever ? 'bg-amber-500/20 border-amber-400/50' : 'bg-slate-900/85 border-indigo-800/70'
                }`}>
                  <span className="text-xs font-black tracking-wide text-indigo-100">
                    {question.phase < 2 ? '⬅️ 往左滑 (<0) ／ 往右滑 (>0) ➡️' : '↗️ 撥向四個角落象限'}
                  </span>
                  {isFever ? (
                    <span className="text-[11px] font-black bg-amber-400 text-amber-950 px-2.5 py-0.5 rounded-full animate-pulse shadow">🔥 FEVER ×1.5</span>
                  ) : isWarm ? (
                    <span className="text-[11px] font-black bg-sky-500 text-white px-2 py-0.5 rounded-full">⚡ 加速 ×1.2</span>
                  ) : (
                    <span className="text-[11px] font-black bg-white/15 text-indigo-200 px-2 py-0.5 rounded-full">
                      {question.phase === 0 ? '階段 1/3' : question.phase === 1 ? '階段 2/3' : '階段 3/3'}
                    </span>
                  )}
                </div>

                {feverBanner && (
                  <div className="pointer-events-none absolute top-14 left-1/2 -translate-x-1/2 z-30 bg-gradient-to-r from-amber-300 via-yellow-300 to-amber-400 text-amber-950 font-black text-sm px-4 py-1 rounded-full border-2 border-white shadow-xl animate-bounce">
                    🔥 FEVER 狂熱模式啟動！
                  </div>
                )}

                <div className="relative flex-1 min-h-0 p-2.5 flex flex-col justify-between overflow-hidden select-none">
                  <HintBanner tip={conceptTip} />

                  {question.phase < 2 ? (
                    <div className="flex-1 min-h-0 grid grid-cols-[78px_1fr_78px] sm:grid-cols-[96px_1fr_96px] items-center gap-2">
                      <button
                        onClick={() => submitSort('neg')}
                        className={`h-full max-h-[260px] rounded-2xl border-2 flex flex-col items-center justify-center gap-1 transition-all active:scale-95 ${
                          wrongTargetKey === 'neg'
                            ? 'bg-red-500/80 border-red-200 text-white btn-wrong-flash'
                            : hoverTarget === 'neg'
                            ? 'bg-rose-500 border-white text-white scale-105 shadow-[0_0_24px_rgba(244,63,94,0.8)]'
                            : 'bg-rose-500/20 border-rose-400/60 text-rose-200 hover:bg-rose-500/35'
                        }`}
                      >
                        <span className="text-2xl sm:text-3xl font-mono font-black">&lt; 0</span>
                        <span className="text-xs font-black">負值聖壇</span>
                        <span className="text-[10px] opacity-80">⬅ 左滑</span>
                      </button>

                      <div className="relative h-full flex items-center justify-center">
                        {nextPreview && nextPreview.phase === question.phase && (
                          <div className="absolute w-full max-w-[220px] h-[136px] rounded-3xl bg-white/10 border border-white/20 scale-90 translate-y-4 opacity-50 flex items-center justify-center pointer-events-none px-2">
                            <span className="font-serif font-bold text-white/60 text-xs sm:text-sm whitespace-nowrap">{nextPreview.expr}</span>
                          </div>
                        )}
                        <div
                          onPointerDown={handleCardPointerDown}
                          onPointerMove={handleCardPointerMove}
                          onPointerUp={handleCardPointerUp}
                          onPointerCancel={handleCardPointerUp}
                          style={{
                            transform: cardTransform,
                            transition: isDragging ? 'none' : flyOutTarget ? 'transform 0.2s ease-out, opacity 0.2s ease-out' : 'transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1)',
                            opacity: flyOutTarget ? 0 : 1
                          }}
                          className={`relative z-10 w-full max-w-[240px] min-h-[148px] rounded-3xl bg-white border-4 px-3 py-4 shadow-2xl flex items-center justify-center text-center cursor-grab active:cursor-grabbing touch-none ${
                            isFever ? 'border-amber-400 shadow-[0_0_28px_rgba(251,191,36,0.55)]' : 'border-indigo-300'
                          }`}
                        >
                          <div className={`font-serif font-black text-indigo-950 whitespace-nowrap ${
                            question.expr.length > 12 ? 'text-lg sm:text-xl' : 'text-2xl sm:text-3xl'
                          }`}>{question.expr}</div>
                        </div>
                      </div>

                      <button
                        onClick={() => submitSort('pos')}
                        className={`h-full max-h-[260px] rounded-2xl border-2 flex flex-col items-center justify-center gap-1 transition-all active:scale-95 ${
                          wrongTargetKey === 'pos'
                            ? 'bg-red-500/80 border-red-200 text-white btn-wrong-flash'
                            : hoverTarget === 'pos'
                            ? 'bg-emerald-500 border-white text-white scale-105 shadow-[0_0_24px_rgba(52,211,153,0.8)]'
                            : 'bg-emerald-500/20 border-emerald-400/60 text-emerald-200 hover:bg-emerald-500/35'
                        }`}
                      >
                        <span className="text-2xl sm:text-3xl font-mono font-black">&gt; 0</span>
                        <span className="text-xs font-black">正值聖壇</span>
                        <span className="text-[10px] opacity-80">右滑 ➡</span>
                      </button>
                    </div>
                  ) : (
                    <div className="flex-1 min-h-0 flex flex-col justify-between gap-2 relative">
                      <div className="grid grid-cols-2 gap-2 flex-1 min-h-0">
                        {[
                          { key: '2', label: '第 II 象限', sub: '↖ 左上' },
                          { key: '1', label: '第 I 象限', sub: '↗ 右上' },
                          { key: '3', label: '第 III 象限', sub: '↙ 左下' },
                          { key: '4', label: '第 IV 象限', sub: '↘ 右下' }
                        ].map(item => (
                          <button
                            key={item.key}
                            onClick={() => submitSort(item.key)}
                            className={`rounded-2xl border-2 flex flex-col items-center justify-center p-2 transition-all active:scale-95 ${
                              wrongTargetKey === item.key
                                ? 'bg-red-500/80 border-red-200 text-white btn-wrong-flash'
                                : hoverTarget === item.key
                                ? 'bg-amber-400 border-white text-amber-950 scale-[1.03] shadow-[0_0_20px_rgba(251,191,36,0.8)]'
                                : 'bg-indigo-900/55 border-indigo-400/50 text-indigo-100 hover:bg-indigo-800/70'
                            }`}
                          >
                            <span className="text-lg sm:text-xl font-serif font-black">{item.label}</span>
                            <span className="text-[10px] font-bold opacity-75">{item.sub}</span>
                          </button>
                        ))}
                      </div>

                      <div className="pointer-events-none absolute inset-0 flex items-center justify-center">
                        <div
                          onPointerDown={handleCardPointerDown}
                          onPointerMove={handleCardPointerMove}
                          onPointerUp={handleCardPointerUp}
                          onPointerCancel={handleCardPointerUp}
                          style={{
                            transform: cardTransform,
                            transition: isDragging ? 'none' : flyOutTarget ? 'transform 0.2s ease-out, opacity 0.2s ease-out' : 'transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1)',
                            opacity: flyOutTarget ? 0 : 1
                          }}
                          className={`pointer-events-auto z-20 min-w-[170px] max-w-[240px] rounded-2xl bg-white border-4 px-4 py-3 shadow-2xl flex flex-col items-center justify-center gap-0.5 text-center cursor-grab active:cursor-grabbing touch-none ${
                            isFever ? 'border-amber-400 shadow-[0_0_26px_rgba(251,191,36,0.65)]' : 'border-indigo-400'
                          }`}
                        >
                          {(question.lines || [question.expr]).map((line, idx) => (
                            <div key={idx} className="text-base sm:text-lg font-serif font-black text-indigo-950 leading-snug whitespace-nowrap">{line}</div>
                          ))}
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {gameState === 'ended' && (
            <LevelResultScreen
              score={score}
              baseScore={baseScore}
              earnedStars={earnedStars}
              maxCombo={maxCombo}
              correctCount={correctCount}
              wrongCount={wrongCount}
              maxTime={maxTime}
              accentClass="text-rose-600"
              onCompleteLevel={onCompleteLevel}
              onRestart={startGame}
              onBackToMap={onBackToMap}
            />
          )}
        </div>
      );
    };

    // ==================== 雙欄波次配對引擎 (第 5, 12~15 關 & 修行幻境共用) ====================
    const LevelLightingCardGame = ({ levelData, isDojo, currentStars, onUpdateStars, onCompleteLevel, onBackToMap }) => {
      const levelConfig = levelData?.config || { maxTime: 60, stars: [750, 1600, 2500], quadrants: ['q1'], funcs: ['sin', 'cos', 'tan'] };
      const [gameState, setGameState] = useState(isDojo ? 'settings' : 'idle');
      const [timeLeft, setTimeLeft] = useState(levelConfig.maxTime || 60);
      const [score, setScore] = useState(0);
      const [baseScore, setBaseScore] = useState(0);
      const [combo, setCombo] = useState(0);
      const [maxCombo, setMaxCombo] = useState(0);
      const [wrongCount, setWrongCount] = useState(0);
      const [wrongCardUids, setWrongCardUids] = useState([]);
      const [conceptTip, setConceptTip] = useState(null);

      // 波次與動態難度狀態（左欄 3→4→5 張、右欄永遠多 1 張干擾卡 4→5→6 張）
      const [waveNumber, setWaveNumber] = useState(1);
      const [pairCount, setPairCount] = useState(3);
      const [leftCards, setLeftCards] = useState([]);
      const [rightCards, setRightCards] = useState([]);
      const [matchedUids, setMatchedUids] = useState(new Set());
      const [animatingOut, setAnimatingOut] = useState([]);
      const [selLeft, setSelLeft] = useState(null);
      const [selRight, setSelRight] = useState(null);
      const [isProcessing, setIsProcessing] = useState(false);
      const [totalSolved, setTotalSolved] = useState(0);
      const [floatingText, setFloatingText] = useState(null);

      const waveStartTimeRef = useRef(Date.now());
      const waveErrorsRef = useRef(0);
      const recentPairsRef = useRef([]);
      const timerRef = useRef(null);

      const [dojoConfig, setDojoConfig] = useState({
        time: 90,
        funcs: { sin: true, cos: true, tan: true },
        quads: { q1: true, q2: true, q3: true, q4: true, axis: true },
        angleMode: 'degree'
      });

      const activeMaxTime = isDojo ? dojoConfig.time : levelConfig.maxTime;

      const triggerFloat = (text, color) => {
        const id = Date.now() + Math.random();
        setFloatingText({ text, color, id });
        setTimeout(() => setFloatingText(prev => prev?.id === id ? null : prev), 850);
      };

      const formatQuestionLabel = (funcId, angleId) => {
        const mode = isDojo ? dojoConfig.angleMode : 'degree';
        if (mode === 'radian') {
          return `${TEXT_MAP['func'][funcId]}(${TEXT_MAP['angle_rad'][angleId]})`;
        }
        return `${TEXT_MAP['func'][funcId]} ${TEXT_MAP['angle_deg'][angleId]}`;
      };

      // 依波次漸進解鎖象限（Lv.12~15：第 1 波 I~II 象限、第 2 波 I~IV 象限、第 3 波起納入象限角）
      const getWaveQuadrants = useCallback((waveIdx) => {
        if (isDojo) {
          return Object.keys(dojoConfig.quads).filter(k => dojoConfig.quads[k]);
        }
        if (levelData && levelData.id >= 12 && levelData.id <= 15) {
          if (waveIdx === 1) return ['q1', 'q2'];
          if (waveIdx === 2) return ['q1', 'q2', 'q3', 'q4'];
          return ['q1', 'q2', 'q3', 'q4', 'axis'];
        }
        return levelConfig.quadrants || ['q1'];
      }, [isDojo, dojoConfig.quads, levelData, levelConfig.quadrants]);

      const getWaveScopeLabel = (waveIdx) => {
        if (isDojo) return '自訂幻境題庫';
        if (levelData?.id === 5) return '第一象限銳角';
        if (levelData && levelData.id >= 12 && levelData.id <= 15) {
          if (waveIdx === 1) return '第 I~II 象限';
          if (waveIdx === 2) return '第 I~IV 象限';
          return '全象限＋象限角';
        }
        return levelData?.subtitle || '題庫範圍';
      };

      // 象限分桶平均抽樣 ＋ 跨波防重複 ＋ 右欄多 1 張相反數干擾項發牌器
      const spawnWave = useCallback((targetPairs, waveIdx) => {
        const quads = getWaveQuadrants(waveIdx);
        const funcs = isDojo
          ? FUNC_TYPES.filter(f => dojoConfig.funcs[f])
          : (levelConfig.funcs || FUNC_TYPES);

        const recentSet = new Set(recentPairsRef.current);
        const buckets = {};
        const allPairs = [];

        quads.forEach(q => {
          const qAngles = ANGLE_GROUPS[q] || [];
          const qItems = [];
          funcs.forEach(f => {
            qAngles.forEach(a => {
              const item = {
                key: `${f}_${a}`,
                quad: q,
                funcId: f,
                angleId: a,
                valId: EVAL_MAP[f][a]
              };
              qItems.push(item);
              allPairs.push(item);
            });
          });
          buckets[q] = [
            ...shuffle(qItems.filter(p => !recentSet.has(p.key))),
            ...shuffle(qItems.filter(p => recentSet.has(p.key)))
          ];
        });

        const stageQuads = isDojo
          ? Object.keys(dojoConfig.quads).filter(k => dojoConfig.quads[k])
          : levelConfig.quadrants;
        const stageValSet = new Set();
        stageQuads.forEach(q => {
          (ANGLE_GROUPS[q] || []).forEach(a => {
            funcs.forEach(f => stageValSet.add(EVAL_MAP[f][a]));
          });
        });

        const waveUniqueValCount = new Set(allPairs.map(p => p.valId)).size;
        const maxLeftByPool = Math.min(waveUniqueValCount, Math.max(2, stageValSet.size - 1));
        const actualPairs = Math.max(2, Math.min(5, targetPairs, maxLeftByPool));

        const isGradualBroadLevel = !isDojo && levelData && levelData.id >= 12 && levelData.id <= 15;
        let bucketOrder = shuffle([...quads]);
        if (isGradualBroadLevel && waveIdx === 1 && quads.includes('q2') && quads.includes('q1')) {
          bucketOrder = ['q2', 'q1'];
        }

        const chosen = [];
        const usedVals = new Set();
        const usedKeys = new Set();

        let roundGuard = 0;
        while (chosen.length < actualPairs && roundGuard < 12) {
          let pickedInRound = false;
          for (const q of bucketOrder) {
            if (chosen.length >= actualPairs) break;
            const list = buckets[q] || [];
            const pickIdx = list.findIndex(item => !usedVals.has(item.valId) && !usedKeys.has(item.key));
            if (pickIdx >= 0) {
              const picked = list[pickIdx];
              usedVals.add(picked.valId);
              usedKeys.add(picked.key);
              chosen.push(picked);
              pickedInRound = true;
            }
          }
          if (!pickedInRound) break;
          roundGuard += 1;
        }

        if (chosen.length < actualPairs) {
          const fallbackPool = [
            ...shuffle(allPairs.filter(p => !recentSet.has(p.key))),
            ...shuffle(allPairs.filter(p => recentSet.has(p.key)))
          ];
          for (const item of fallbackPool) {
            if (chosen.length >= actualPairs) break;
            if (!usedVals.has(item.valId) && !usedKeys.has(item.key)) {
              usedVals.add(item.valId);
              usedKeys.add(item.key);
              chosen.push(item);
            }
          }
        }

        let distractorValId = null;
        for (const item of shuffle([...chosen])) {
          const oppVal = OPPOSITE_VAL_MAP[item.valId];
          if (oppVal && stageValSet.has(oppVal) && !usedVals.has(oppVal)) {
            distractorValId = oppVal;
            break;
          }
        }
        if (!distractorValId) {
          const unusedStageVals = shuffle(Array.from(stageValSet).filter(v => !usedVals.has(v)));
          if (unusedStageVals.length > 0) {
            distractorValId = unusedStageVals[0];
          } else {
            const fallbackGlobalVals = shuffle(Object.keys(TEXT_MAP['val']).filter(v => !usedVals.has(v)));
            distractorValId = fallbackGlobalVals[0] || '0';
          }
        }

        recentPairsRef.current = chosen.map(c => c.key);

        const now = Date.now();
        const lCards = shuffle(chosen).map((item, idx) => ({
          uid: `L_${waveIdx}_${now}_${idx}`,
          pairKey: item.key,
          funcId: item.funcId,
          angleId: item.angleId,
          valId: item.valId,
          label: formatQuestionLabel(item.funcId, item.angleId)
        }));

        const rightPool = [
          ...chosen.map(item => ({ pairKey: item.key, valId: item.valId, isDistractor: false })),
          { pairKey: 'distractor', valId: distractorValId, isDistractor: true }
        ];

        const rCards = shuffle(rightPool).map((item, idx) => ({
          uid: `R_${waveIdx}_${now}_${idx}`,
          pairKey: item.pairKey,
          valId: item.valId,
          isDistractor: item.isDistractor,
          label: TEXT_MAP['val'][item.valId]
        }));

        setPairCount(actualPairs);
        setLeftCards(lCards);
        setRightCards(rCards);
        setMatchedUids(new Set());
        setAnimatingOut([]);
        setSelLeft(null);
        setSelRight(null);
        setWrongCardUids([]);
        setConceptTip(null);
        setIsProcessing(false);
        waveStartTimeRef.current = Date.now();
        waveErrorsRef.current = 0;
      }, [getWaveQuadrants, isDojo, dojoConfig.funcs, dojoConfig.quads, levelConfig.funcs, levelConfig.quadrants, levelData]);

      useEffect(() => {
        if (gameState === 'playing') {
          recentPairsRef.current = [];
          setScore(0);
          setBaseScore(0);
          setCombo(0);
          setMaxCombo(0);
          setTotalSolved(0);
          setWrongCount(0);
          setWaveNumber(1);
          setTimeLeft(activeMaxTime);
          spawnWave(3, 1);
        }
      }, [gameState]);

      useEffect(() => {
        if (gameState === 'playing') {
          timerRef.current = setInterval(() => {
            setTimeLeft(prev => {
              if (prev <= 0.1) {
                clearInterval(timerRef.current);
                audio.sfxTimeUp();
                setGameState('ended');
                return 0;
              }
              return +(prev - 0.1).toFixed(1);
            });
          }, 100);
        } else clearInterval(timerRef.current);
        return () => clearInterval(timerRef.current);
      }, [gameState]);

      // 依回答速度與正確率動態評估下一波張數（左欄 3 起跳，下限 3 張、上限 5 張；右欄恆多 1 張為 4→5→6 張）
      const evaluateNextPairCount = (currentCount, elapsedSec, errors) => {
        const speedThreshold = 3.1 + currentCount * 0.15;
        const avgSecPerPair = elapsedSec / Math.max(1, currentCount);

        if (errors === 0 && avgSecPerPair <= speedThreshold) {
          const next = Math.min(5, currentCount + 1);
          return {
            nextCount: next,
            msg: next > currentCount
              ? `⚡ 疾風全對 (${avgSecPerPair.toFixed(1)}s/題) → 左 ${next} / 右 ${next + 1} 張`
              : `👑 滿階左 5 / 右 6 張制霸 (${avgSecPerPair.toFixed(1)}s/題)！`,
            tone: 'up'
          };
        }

        if (errors >= 2 || avgSecPerPair > 6.2) {
          const next = Math.max(3, currentCount - 1);
          return {
            nextCount: next,
            msg: next < currentCount
              ? `🌿 調整節奏 → 左 ${next} / 右 ${next + 1} 張`
              : `🌿 穩住節奏 → 左 ${next} / 右 ${next + 1} 張`,
            tone: 'down'
          };
        }

        return {
          nextCount: currentCount,
          msg: `🛡️ 穩健過關 (${avgSecPerPair.toFixed(1)}s/題) → 左 ${currentCount} / 右 ${currentCount + 1} 張`,
          tone: 'stay'
        };
      };

      const checkPairMatch = (lCard, rCard) => {
        setIsProcessing(true);
        if (lCard.valId === rCard.valId) {
          audio.sfxMatch();
          setConceptTip(null);

          const mult = combo >= 6 ? 1.5 : combo >= 3 ? 1.2 : 1.0;
          const earned = Math.floor(100 * mult);
          const nextMatched = new Set(matchedUids);
          nextMatched.add(lCard.uid);
          nextMatched.add(rCard.uid);

          const solvedInWave = nextMatched.size / 2;
          const isWaveCleared = solvedInWave >= leftCards.length;

          const nextCombo = combo + 1;
          setCombo(nextCombo);
          if (nextCombo > maxCombo) setMaxCombo(nextCombo);
          setBaseScore(b => b + 100);
          setTotalSolved(t => t + 1);
          setAnimatingOut([lCard.uid, rCard.uid]);

          if (isWaveCleared) {
            const elapsedSec = Math.max(0.5, (Date.now() - waveStartTimeRef.current) / 1000);
            const errors = waveErrorsRef.current;
            const waveBonus = errors === 0 ? 120 : 60;
            const evalRes = evaluateNextPairCount(pairCount, elapsedSec, errors);

            setScore(s => s + earned + waveBonus);
            audio.sfxBonus();
            triggerFloat(
              errors === 0 ? `+${earned}！完美清波 +${waveBonus}` : `+${earned}！清波 +${waveBonus}`,
              evalRes.tone === 'up' ? 'text-amber-500' : evalRes.tone === 'down' ? 'text-emerald-500' : 'text-sky-500'
            );

            setTimeout(() => {
              setMatchedUids(nextMatched);
              setAnimatingOut([]);
              setSelLeft(null);
              setSelRight(null);
              const nextWave = waveNumber + 1;
              setWaveNumber(nextWave);
              setConceptTip({ text: evalRes.msg, id: Date.now() });
              spawnWave(evalRes.nextCount, nextWave);
            }, 300);
          } else {
            setScore(s => s + earned);
            triggerFloat(`+${earned} 分!`, "text-amber-500");
            setTimeout(() => {
              setMatchedUids(nextMatched);
              setAnimatingOut([]);
              setSelLeft(null);
              setSelRight(null);
              setIsProcessing(false);
            }, 260);
          }
        } else {
          audio.sfxError();
          setCombo(0);
          setWrongCount(w => w + 1);
          waveErrorsRef.current += 1;
          const timePenalty = +(activeMaxTime * 0.03).toFixed(2);
          setTimeLeft(prev => {
            const nextT = Math.max(0, +(prev - timePenalty).toFixed(2));
            if (nextT <= 0) {
              clearInterval(timerRef.current);
              audio.sfxTimeUp();
              setGameState('ended');
            }
            return nextT;
          });
          setWrongCardUids([lCard.uid, rCard.uid]);
          const degNum = parseInt(lCard.angleId, 10);
          const quadHint = degNum === 0 || degNum === 90 || degNum === 180 || degNum === 270
            ? '象限角看單位圓端點 (x, y)'
            : degNum < 90 ? '第 I 象限全正'
            : degNum < 180 ? '第 II 象限僅 sin > 0'
            : degNum < 270 ? '第 III 象限僅 tan > 0'
            : '第 IV 象限僅 cos > 0';
          setConceptTip({
            text: `提示：${lCard.label} = ${TEXT_MAP.val[lCard.valId]}（${quadHint}）`,
            id: Date.now()
          });
          triggerFloat(`-${timePenalty} 秒! 配對錯誤`, "text-red-500");
          setTimeout(() => {
            setSelLeft(null);
            setSelRight(null);
            setWrongCardUids([]);
            setIsProcessing(false);
          }, 360);
        }
      };

      const handleLeftClick = (card) => {
        if (isProcessing || matchedUids.has(card.uid)) return;
        audio.sfxClick();
        setSelLeft(prev => prev?.uid === card.uid ? null : card);
      };

      const handleRightClick = (card) => {
        if (isProcessing || matchedUids.has(card.uid)) return;
        audio.sfxClick();
        setSelRight(prev => prev?.uid === card.uid ? null : card);
      };

      useEffect(() => {
        if (selLeft && selRight && !isProcessing) {
          checkPairMatch(selLeft, selRight);
        }
      }, [selLeft, selRight]);

      const handleManualReshuffle = () => {
        if (isProcessing) return;
        audio.play(420, 'sine', 0.25, 0.06);
        setIsProcessing(true);
        const activeUids = [...leftCards, ...rightCards]
          .filter(c => !matchedUids.has(c.uid))
          .map(c => c.uid);
        setAnimatingOut(activeUids);
        setTimeout(() => {
          spawnWave(pairCount, waveNumber);
          triggerFloat("已重新發牌!", "text-indigo-500");
        }, 280);
      };

      const earnedStars = useMemo(() => {
        if (isDojo) return 0;
        const [s1, s2, s3] = levelConfig.stars;
        if (score >= s3) return 3;
        if (score >= s2) return 2;
        if (score >= s1) return 1;
        return 0;
      }, [score, isDojo, levelConfig.stars]);

      useEffect(() => {
        if (gameState === 'ended' && !isDojo && earnedStars > (currentStars || 0) && onUpdateStars) {
          onUpdateStars(earnedStars, score);
        }
      }, [gameState, earnedStars]);

      const waveStatusExtra = (
        <div className="flex flex-col items-center bg-indigo-50 border border-indigo-200 px-2 py-0.5 rounded-xl shrink-0">
          <span className="text-[8px] font-black text-indigo-400 uppercase leading-none">WAVE {waveNumber}</span>
          <span className="text-xs font-black font-mono text-indigo-900 leading-tight">{pairCount} vs {pairCount + 1}</span>
        </div>
      );

      const solvedInCurrentWave = matchedUids.size / 2;

      return (
        <div className="w-full h-full flex flex-col pt-0.5 pb-1 relative animate-jelly min-h-0">

          {gameState === 'settings' && (
            <div className="flex-1 bg-white/95 rounded-3xl border-4 border-indigo-950 p-4 shadow-2xl flex flex-col gap-3 overflow-y-auto">
              <div className="flex items-center justify-center gap-2 border-b-2 border-slate-100 pb-2 shrink-0">
                <span className="text-2xl animate-bounce">⚙️</span>
                <h2 className="text-2xl font-black text-indigo-950">修行幻境</h2>
              </div>
              <div className="space-y-3 flex-1 overflow-y-auto pr-1 no-scrollbar pb-2">
                <div className="bg-indigo-50 border-2 border-indigo-100 p-3 rounded-2xl shadow-sm">
                  <div className="flex justify-between items-center mb-2">
                    <label className="text-xs font-black text-indigo-900 uppercase tracking-wider">⏱️ 挑戰時間</label>
                    <span className="bg-indigo-600 text-white px-2 py-0.5 rounded-lg text-xs font-black shadow">{dojoConfig.time} 秒</span>
                  </div>
                  <input type="range" min="60" max="180" step="30" value={dojoConfig.time} onChange={e => { audio.sfxClick(); setDojoConfig({ ...dojoConfig, time: parseInt(e.target.value) }); }} className="w-full h-2 bg-indigo-200 rounded-lg appearance-none cursor-pointer accent-indigo-600" />
                </div>
                <div className="bg-sky-50 border-2 border-sky-100 p-3 rounded-2xl shadow-sm">
                  <label className="text-xs font-black text-sky-900 uppercase tracking-wider mb-2 block">📐 角度單位</label>
                  <div className="grid grid-cols-2 gap-2">
                    <button onClick={() => { audio.sfxClick(); setDojoConfig({ ...dojoConfig, angleMode: 'degree' }); }} className={`py-2.5 rounded-xl font-black text-sm border-b-4 transition-all ${dojoConfig.angleMode === 'degree' ? 'bg-sky-500 border-sky-700 text-white shadow-md' : 'bg-white border-slate-300 text-slate-400'}`}>度數 (150°)</button>
                    <button onClick={() => { audio.sfxClick(); setDojoConfig({ ...dojoConfig, angleMode: 'radian' }); }} className={`py-2.5 rounded-xl font-black text-sm border-b-4 transition-all ${dojoConfig.angleMode === 'radian' ? 'bg-sky-500 border-sky-700 text-white shadow-md' : 'bg-white border-slate-300 text-slate-400'}`}>弧度 (5π/6)</button>
                  </div>
                </div>
                <div className="bg-pink-50 border-2 border-pink-100 p-3 rounded-2xl shadow-sm">
                  <label className="text-xs font-black text-pink-900 uppercase tracking-wider mb-2 block">🧮 出題函數</label>
                  <div className="grid grid-cols-3 gap-2">
                    {FUNC_TYPES.map(f => {
                      const isActive = dojoConfig.funcs[f];
                      return (
                        <button key={f} onClick={() => {
                          const next = { ...dojoConfig.funcs, [f]: !isActive };
                          if (!Object.values(next).some(Boolean)) { audio.sfxError(); return; }
                          setDojoConfig({ ...dojoConfig, funcs: next }); audio.sfxClick();
                        }} className={`py-2.5 rounded-xl font-black text-sm border-b-4 transition-all ${isActive ? 'bg-pink-500 border-pink-700 text-white shadow-md' : 'bg-white border-slate-300 text-slate-400'}`}>{f}</button>
                      );
                    })}
                  </div>
                </div>
                <div className="bg-emerald-50 border-2 border-emerald-100 p-3 rounded-2xl shadow-sm">
                  <label className="text-xs font-black text-emerald-900 uppercase tracking-wider mb-2 block">🧭 挑戰象限區間</label>
                  <div className="flex flex-wrap gap-2">
                    {[{ id: 'q1', l: 'I' }, { id: 'q2', l: 'II' }, { id: 'q3', l: 'III' }, { id: 'q4', l: 'IV' }, { id: 'axis', l: '象限角' }].map(q => {
                      const isActive = dojoConfig.quads[q.id];
                      return (
                        <button key={q.id} onClick={() => {
                          const next = { ...dojoConfig.quads, [q.id]: !isActive };
                          if (!Object.values(next).some(Boolean)) { audio.sfxError(); return; }
                          setDojoConfig({ ...dojoConfig, quads: next }); audio.sfxClick();
                        }} className={`flex-1 min-w-[30%] py-2 rounded-xl font-black text-xs border-b-4 transition-all ${isActive ? 'bg-emerald-500 border-emerald-700 text-white shadow-md' : 'bg-white border-slate-300 text-slate-400'}`}>{q.l}</button>
                      );
                    })}
                  </div>
                </div>
              </div>
              <div className="mt-1 space-y-2 shrink-0">
                <button onClick={() => { audio.init(); audio.sfxBonus(); setGameState('playing'); }} className="w-full py-3.5 btn-3d-yellow text-amber-950 font-black text-base rounded-2xl shadow-xl tracking-wide flex items-center justify-center gap-2">🚀 創建幻境，開始修行！</button>
                <button onClick={onBackToMap} className="w-full py-2 text-xs font-bold text-slate-500 bg-slate-100 rounded-xl">返回聖域地圖</button>
              </div>
            </div>
          )}

          {gameState === 'idle' && !isDojo && (
            <div className="flex-1 my-3 bg-white/95 rounded-3xl border-4 border-indigo-950 p-5 shadow-2xl flex flex-col justify-between text-center items-center animate-jelly">
              <div className="w-full space-y-3 pt-2">
                <div className="w-20 h-20 mx-auto rounded-3xl bg-blue-100 border-4 border-blue-500 flex items-center justify-center text-4xl shadow-inner animate-bounce">{levelData?.icon || '🌟'}</div>
                <h2 className="text-2xl font-black text-indigo-950 tracking-wide">{levelData?.title || '關卡挑戰'}</h2>
                <p className="text-xs text-slate-500 font-bold leading-relaxed max-w-xs mx-auto">
                  點選左側<span className="text-indigo-600 font-black">三角比題目</span>與右側<span className="text-amber-600 font-black">對應數值</span>完成配對（右側恆多 <span className="text-rose-600 font-black">1 張干擾卡</span>）！<br/>
                  從 <span className="text-indigo-700 font-black">左 3 / 右 4</span> 起跳，依速度與正確率升至 <span className="text-emerald-600 font-black">左 5 / 右 6</span>，連續答對享 <span className="text-amber-600 font-black">1.5x</span> 倍率！
                </p>
              </div>
              <div className="w-full bg-indigo-50/80 border-2 border-indigo-200 rounded-2xl p-3 space-y-2 text-left text-xs font-bold text-indigo-950">
                <div className="text-[11px] font-black text-indigo-800 uppercase tracking-wider text-center">🎯 {levelConfig.maxTime}秒通關標準</div>
                <div className="flex items-center justify-between bg-white p-2 rounded-xl border border-indigo-100"><span>⭐ 1 星 (通關解鎖)</span><span className="font-mono text-emerald-600 font-black">{levelConfig.stars[0]} 分</span></div>
                <div className="flex items-center justify-between bg-white p-2 rounded-xl border border-indigo-100"><span>⭐⭐ 2 星 (熟練大師)</span><span className="font-mono text-blue-600 font-black">{levelConfig.stars[1]} 分</span></div>
                <div className="flex items-center justify-between bg-white p-2 rounded-xl border border-indigo-100"><span>⭐⭐⭐ 3 星 (神速極限)</span><span className="font-mono text-purple-600 font-black">{levelConfig.stars[2]} 分</span></div>
              </div>
              <div className="w-full space-y-2">
                <button onClick={() => { audio.init(); setGameState('playing'); }} className="w-full py-4 btn-3d-blue text-white font-black text-lg rounded-2xl shadow-xl tracking-wider active:scale-95">🚀 開始挑戰！</button>
                <button onClick={onBackToMap} className="w-full py-2 text-xs font-bold text-slate-400 hover:text-slate-600">返回聖域地圖</button>
              </div>
            </div>
          )}

          {gameState === 'playing' && (
            <div className="flex-1 min-h-0 flex flex-col justify-between gap-2 overflow-hidden pb-0.5">
              <GameHUD score={score} combo={combo} timeLeft={timeLeft} maxTime={activeMaxTime} starsThreshold={levelConfig.stars} isDojo={isDojo} extraRight={waveStatusExtra} />

              <div className={`flex-1 min-h-0 bg-white rounded-3xl border-3 border-indigo-950 shadow-xl flex flex-col overflow-hidden transition-all duration-150 ${isLockedSuccess ? 'ring-4 ring-emerald-400/75' : ''}`}>
                <div className="bg-slate-800 py-1.5 px-3 flex justify-center items-center gap-2 text-base sm:text-xl font-serif text-white border-b-2 border-slate-700 min-h-[42px] shrink-0">
                  <div className={`px-3 py-0.5 rounded-lg border-b-2 transition-colors shadow-sm font-black ${selLeft ? 'text-sky-300 border-sky-400 bg-slate-700' : 'text-slate-400 border-slate-600 bg-slate-900 text-xs sm:text-sm'}`}>
                    {selLeft ? selLeft.label : '點選左側題目'}
                  </div>
